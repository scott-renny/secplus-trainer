<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Security Concepts Trainer -- Security+</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080c;--panel:#0e1018;--panel2:#141720;--panel3:#1a1e29;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.18);
  --text:#e4e8f5;--text2:#6b7494;--text3:#3a4060;
  --accent:#00e5ff;--green:#00ff88;--red:#ff3d5a;--amber:#ffcc00;--purple:#bf87ff;--teal:#4fd1c5;
  --mono:'Courier New',monospace;
}
*{font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 0%,rgba(191,135,255,0.04) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(0,229,255,0.03) 0%,transparent 60%);pointer-events:none}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(191,135,255,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(191,135,255,0.012) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 20px 80px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--purple);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--purple)}
h1{font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:8px}
h1 em{font-style:normal;color:var(--purple)}
.subtitle{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.tabs{display:flex;gap:5px;margin-bottom:20px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px}
.tab{flex:1;padding:10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:8px;transition:all .2s}
.tab.active{background:var(--panel3);color:var(--purple);border:1px solid rgba(191,135,255,0.2)}
.tab:not(.active):hover{color:var(--text2)}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.sb{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sb.s-prog::before{background:var(--purple)}
.sb.s-correct::before{background:var(--green)}
.sb.s-wrong::before{background:var(--red)}
.sb.s-acc::before{background:var(--amber)}
.sb-val{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1}
.sb.s-correct .sb-val{color:var(--green)}
.sb.s-wrong .sb-val{color:var(--red)}
.sb.s-acc .sb-val{color:var(--amber)}
.sb-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-top:4px}
.prog-wrap{height:3px;background:rgba(255,255,255,0.06);border-radius:99px;margin-bottom:20px;overflow:hidden}
.prog-fill{height:100%;background:var(--purple);border-radius:99px;transition:width .4s ease}
.q-card{background:var(--panel);border:1px solid var(--border2);border-radius:20px;padding:28px;margin-bottom:14px;position:relative;overflow:hidden}
.q-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(191,135,255,0.3),transparent)}
.q-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.q-badge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:5px}
.badge-cia{background:rgba(191,135,255,0.1);color:var(--purple);border:1px solid rgba(191,135,255,0.2)}
.badge-controls{background:rgba(0,229,255,0.1);color:var(--accent);border:1px solid rgba(0,229,255,0.2)}
.badge-auth{background:rgba(0,255,136,0.1);color:var(--green);border:1px solid rgba(0,255,136,0.2)}
.badge-crypto{background:rgba(79,209,197,0.1);color:var(--teal);border:1px solid rgba(79,209,197,0.2)}
.badge-principles{background:rgba(255,204,0,0.1);color:var(--amber);border:1px solid rgba(255,204,0,0.2)}
.badge-scenario{background:rgba(255,204,0,0.1);color:var(--amber);border:1px solid rgba(255,204,0,0.2)}
.q-num{font-family:var(--mono);font-size:10px;color:var(--text3)}
.scenario-box{background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--amber);border-radius:10px;padding:13px 16px;margin-bottom:16px}
.scenario-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.scenario-text{font-size:13px;color:var(--text2);line-height:1.7;font-family:var(--mono)}
.q-text{font-size:15px;font-weight:500;line-height:1.65;color:var(--text);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--panel2);cursor:pointer;text-align:left;width:100%;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--border3);background:var(--panel3)}
.opt-letter{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2);min-width:18px;margin-top:1px;flex-shrink:0}
.opt-text{font-size:14px;color:var(--text);line-height:1.5}
.opt.correct{border-color:var(--green)!important;background:rgba(0,255,136,0.07)!important}
.opt.correct .opt-letter,.opt.correct .opt-text{color:var(--green)!important}
.opt.wrong{border-color:var(--red)!important;background:rgba(255,61,90,0.07)!important}
.opt.wrong .opt-letter,.opt.wrong .opt-text{color:var(--red)!important}
.opt.reveal{border-color:rgba(0,255,136,0.3)!important;background:rgba(0,255,136,0.04)!important}
.opt.reveal .opt-letter,.opt.reveal .opt-text{color:var(--green)!important;opacity:.6}
.opt:disabled{cursor:default}
.explanation{display:none;background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--purple);border-radius:10px;padding:13px 16px;margin-bottom:12px}
.explanation.show{display:block}
.exp-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--purple);margin-bottom:7px}
.exp-text{font-size:13px;color:var(--text2);line-height:1.7}
.exp-text strong{color:var(--text);font-weight:600}
.btn-next{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:none;transition:all .15s}
.btn-next:hover{border-color:var(--purple);color:var(--purple)}
.results-wrap{text-align:center;padding:32px 0 20px}
.results-ring{width:140px;height:140px;margin:0 auto 20px;position:relative}
.results-ring svg{transform:rotate(-90deg)}
.ring-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-pct{font-family:var(--mono);font-size:32px;font-weight:600;color:var(--text)}
.ring-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.results-verdict{font-size:22px;font-weight:700;margin-bottom:6px}
.results-sub{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px;text-align:left}
.bd-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.bd-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.bd-bar-bg{height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bd-bar-fill{height:100%;border-radius:99px;transition:width 1s ease}
.bd-score{font-family:var(--mono);font-size:22px;font-weight:600}
.bd-detail{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px}
.btn-retake{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:12px 36px;background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:10px;cursor:pointer;transition:all .2s;margin-right:10px}
.btn-retake:hover{border-color:var(--purple);color:var(--purple)}
.ref-section-title{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ref-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;transition:border-color .15s}
.ref-card:hover{border-color:var(--border3)}
.ref-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.ref-def{font-size:12px;color:var(--text2);line-height:1.6}
.ref-tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;margin-top:8px}
.tag-purple{background:rgba(191,135,255,0.1);color:var(--purple)}
.tag-accent{background:rgba(0,229,255,0.1);color:var(--accent)}
.tag-green{background:rgba(0,255,136,0.1);color:var(--green)}
.tag-teal{background:rgba(79,209,197,0.1);color:var(--teal)}
.tag-amber{background:rgba(255,204,0,0.1);color:var(--amber)}
.ref-key{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:8px;border-top:1px solid var(--border);padding-top:6px}
.acc-row{display:grid;grid-template-columns:185px 1fr 42px;gap:10px;align-items:center;margin-bottom:10px}
.acc-lbl{font-size:13px;color:var(--text2);text-align:right}
.acc-bg{height:18px;background:var(--panel2);border-radius:8px;overflow:hidden}
.acc-fill{height:100%;border-radius:8px;transition:width .8s ease}
.acc-pct{font-family:var(--mono);font-size:11px;color:var(--text2);font-weight:500}
@media(max-width:500px){.stats-bar{grid-template-columns:repeat(2,1fr)}.breakdown{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">CompTIA Security+ &middot; SY0-701 &middot; Domain 1</div>
  <h1>General Security <em>Concepts</em></h1>
  <p class="subtitle">80 questions &middot; CIA triad &middot; security controls &middot; authentication &middot; cryptography &middot; security principles &middot; scenarios</p>
  <div class="tabs">
    <button class="tab active" onclick="setTab('quiz')" id="tab-quiz">Quiz</button>
    <button class="tab" onclick="setTab('ref')" id="tab-ref">Reference</button>
  </div>
  <div id="view-quiz">
    <div class="stats-bar">
      <div class="sb s-prog"><div class="sb-val" id="s-prog">0/80</div><div class="sb-lbl">Progress</div></div>
      <div class="sb s-correct"><div class="sb-val" id="s-correct">0</div><div class="sb-lbl">Correct</div></div>
      <div class="sb s-wrong"><div class="sb-val" id="s-wrong">0</div><div class="sb-lbl">Wrong</div></div>
      <div class="sb s-acc"><div class="sb-val" id="s-acc">--</div><div class="sb-lbl">Accuracy</div></div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div id="q-area"></div>
    <div id="results-area" style="display:none"></div>
  </div>
  <div id="view-ref" style="display:none">
    <div style="margin-bottom:24px">
      <div class="ref-section-title" style="margin-bottom:12px">Accuracy by Category</div>
      <div id="acc-chart"></div>
    </div>
    <div class="ref-section-title">Key Terms and Concepts</div>
    <div class="ref-grid" id="ref-cards"></div>
  </div>
</div>
<script>
function logToDashboard(domain,type,score){
  try{
    const s=JSON.parse(localStorage.getItem('sp_sessions')||'[]');
    const now=new Date();
    s.push({domain,type,score,date:now.toLocaleDateString('en-CA',{month:'short',day:'numeric'}),ts:now.getTime()});
    localStorage.setItem('sp_sessions',JSON.stringify(s));
  }catch(e){}
}

const TERMS=[
  {name:'CIA Triad',def:'The three core security objectives: Confidentiality (only authorised parties read data), Integrity (data is not altered), Availability (systems are accessible when needed).',tag:'tag-purple',tagLabel:'Core Model',key:'All security controls map to one or more of these three properties'},
  {name:'Confidentiality',def:'Ensuring data is accessible only to those authorised to view it. Achieved through encryption, access controls, and classification.',tag:'tag-purple',tagLabel:'CIA Triad',key:'Encryption, access controls, data classification, need-to-know'},
  {name:'Integrity',def:'Ensuring data has not been altered by unauthorised parties. Achieved through hashing, digital signatures, and checksums.',tag:'tag-purple',tagLabel:'CIA Triad',key:'Hashing, digital signatures, checksums, version control'},
  {name:'Availability',def:'Ensuring systems and data are accessible when needed. Achieved through redundancy, failover, backups, and DDoS mitigation.',tag:'tag-purple',tagLabel:'CIA Triad',key:'Redundancy, failover, backups, load balancing, DDoS mitigation'},
  {name:'Authentication',def:'Verifying that a claimed identity is genuine. The three factors: something you know, something you have, something you are.',tag:'tag-green',tagLabel:'AAA',key:'What you know (password), have (token), are (biometric)'},
  {name:'Authorisation',def:'Determining what an authenticated identity is permitted to do. Implemented through access control models (RBAC, ABAC, DAC, MAC).',tag:'tag-green',tagLabel:'AAA',key:'Happens AFTER authentication -- what can you access?'},
  {name:'Non-repudiation',def:'Ensuring a party cannot deny having performed an action. Implemented through digital signatures using the sender\'s private key.',tag:'tag-green',tagLabel:'Security Property',key:'Digital signatures provide non-repudiation -- only you have your private key'},
  {name:'Least Privilege',def:'Users and systems should have only the minimum access required to perform their function -- nothing more.',tag:'tag-accent',tagLabel:'Security Principle',key:'Limits blast radius if credentials are compromised'},
  {name:'Separation of Duties',def:'Dividing critical tasks so no single person controls an entire sensitive process. Prevents fraud and error.',tag:'tag-accent',tagLabel:'Security Principle',key:'Requires collusion to commit fraud -- essential for financial controls'},
  {name:'Defence in Depth',def:'Layering multiple overlapping security controls so that failure of one does not compromise the entire system.',tag:'tag-accent',tagLabel:'Security Principle',key:'No single control is relied upon exclusively'},
  {name:'Zero Trust',def:'No user, device, or network is inherently trusted -- every access request is continuously verified regardless of location.',tag:'tag-accent',tagLabel:'Security Model',key:'Never trust, always verify -- identity is the new perimeter'},
  {name:'Security Control Types',def:'Administrative (policies, training), Technical/Logical (software, hardware), Physical (locks, cameras). Each can be preventive, detective, corrective, deterrent, or compensating.',tag:'tag-accent',tagLabel:'Controls',key:'Functional type (preventive/detective) x implementation type (admin/tech/physical)'},
  {name:'Preventive Control',def:'Stops an incident before it occurs. Examples: firewall, antivirus blocking, access control, encryption.',tag:'tag-accent',tagLabel:'Control Type',key:'Stops the threat -- acts before the incident'},
  {name:'Detective Control',def:'Identifies and records incidents after or during occurrence. Examples: IDS, audit logs, CCTV, SIEM alerts.',tag:'tag-accent',tagLabel:'Control Type',key:'Finds the threat -- acts during or after the incident'},
  {name:'Corrective Control',def:'Restores systems to normal operation after an incident. Examples: backups, system reimaging, patch remediation.',tag:'tag-accent',tagLabel:'Control Type',key:'Fixes the damage -- acts after the incident'},
  {name:'Deterrent Control',def:'Discourages attackers from attempting an attack. Examples: warning banners, visible security cameras, security guards.',tag:'tag-accent',tagLabel:'Control Type',key:'Reduces likelihood -- does not physically prevent'},
  {name:'Compensating Control',def:'An alternative control used when the primary control cannot be implemented. Must provide equivalent protection.',tag:'tag-accent',tagLabel:'Control Type',key:'Alternative when primary control is not feasible'},
  {name:'Identification',def:'Claiming an identity -- entering a username. Precedes authentication which verifies the claim.',tag:'tag-green',tagLabel:'AAA',key:'Claiming identity (username) -- not yet proven'},
  {name:'Accounting',def:'Tracking and recording what authenticated users do -- creating an audit trail for investigation and compliance.',tag:'tag-green',tagLabel:'AAA',key:'Who did what, when, from where -- audit trail'},
  {name:'Need to Know',def:'Information should only be accessible to those who require it specifically for their role -- even if clearance level permits broader access.',tag:'tag-accent',tagLabel:'Security Principle',key:'Clearance + need-to-know both required -- clearance alone is not enough'},
  {name:'Job Rotation',def:'Periodically moving employees between roles to prevent fraud, limit privilege accumulation, and cross-train staff.',tag:'tag-accent',tagLabel:'Security Principle',key:'Prevents long-term fraud -- also cross-trains staff'},
  {name:'Mandatory Vacation',def:'Requiring employees to take leave during which their access is suspended, exposing ongoing fraud that required their continuous presence.',tag:'tag-accent',tagLabel:'Security Principle',key:'Exposes fraud requiring continuous presence to conceal'},
  {name:'Dual Control',def:'Requiring two or more people to be present to perform a sensitive operation -- no single person can act alone.',tag:'tag-accent',tagLabel:'Security Principle',key:'Missile launch protocol -- two keys, two people, same time'},
  {name:'Hashing',def:'A one-way function producing a fixed-length digest from any input. Used for integrity verification and password storage.',tag:'tag-teal',tagLabel:'Cryptography',key:'One-way -- cannot reverse. Same input always same output'},
];

const CATS=['CIA Triad','Security Controls','Authentication and Access','Security Principles','Cryptography Fundamentals','Scenario'];
const CAT_COLORS={
  'CIA Triad':'var(--purple)',
  'Security Controls':'var(--accent)',
  'Authentication and Access':'var(--green)',
  'Security Principles':'var(--amber)',
  'Cryptography Fundamentals':'var(--teal)',
  'Scenario':'var(--amber)'
};
const BADGE_MAP={
  'CIA Triad':'badge-cia',
  'Security Controls':'badge-controls',
  'Authentication and Access':'badge-auth',
  'Security Principles':'badge-principles',
  'Cryptography Fundamentals':'badge-crypto',
  'Scenario':'badge-scenario'
};

const Q_BANK=[
// -- CIA TRIAD --
{type:'identify',cat:'CIA Triad',q:"Which pillar of the CIA triad ensures data is accessible only to authorised parties?",o:["Availability","Integrity","Confidentiality","Accountability"],a:2,e:"<strong>Confidentiality</strong>  --  protects data from unauthorised disclosure. Implemented through encryption, access controls, classification, and need-to-know restrictions."},
{type:'identify',cat:'CIA Triad',q:"Which pillar of the CIA triad ensures data has not been tampered with by unauthorised parties?",o:["Confidentiality","Availability","Non-repudiation","Integrity"],a:3,e:"<strong>Integrity</strong>  --  ensures data is accurate and unaltered. Implemented through hashing (SHA-256), digital signatures, checksums, and file integrity monitoring."},
{type:'identify',cat:'CIA Triad',q:"Which pillar of the CIA triad ensures systems and data are accessible when legitimate users need them?",o:["Integrity","Confidentiality","Availability","Authentication"],a:2,e:"<strong>Availability</strong>  --  systems must be up and accessible when needed. Implemented through redundancy, failover, load balancing, backups, and DDoS mitigation."},
{type:'identify',cat:'CIA Triad',q:"A ransomware attack that encrypts files and makes them inaccessible PRIMARILY impacts which CIA property?",o:["Confidentiality","Integrity","Availability","Non-repudiation"],a:2,e:"<strong>Availability</strong>  --  ransomware denies access to data, directly attacking availability. It may also impact integrity (files are altered/encrypted) but the PRIMARY impact is denying availability to the victim."},
{type:'identify',cat:'CIA Triad',q:"An attacker intercepts and reads sensitive emails without altering them. Which CIA property is violated?",o:["Availability","Integrity","Confidentiality","Accountability"],a:2,e:"<strong>Confidentiality</strong>  --  the attacker reads data they are not authorised to view. Integrity is preserved (data was not changed) and availability is unaffected. Only confidentiality is violated."},
{type:'identify',cat:'CIA Triad',q:"An attacker modifies a financial transaction record without being detected. Which CIA property is PRIMARILY violated?",o:["Confidentiality","Availability","Integrity","Authentication"],a:2,e:"<strong>Integrity</strong>  --  the data has been modified without authorisation. Hashing and digital signatures would detect this alteration. Confidentiality and availability are not impacted by the modification itself."},
{type:'identify',cat:'CIA Triad',q:"A DDoS attack overwhelms a web server making it unavailable to customers. Which CIA property is violated?",o:["Confidentiality","Integrity","Non-repudiation","Availability"],a:3,e:"<strong>Availability</strong>  --  the DDoS attack prevents legitimate users from accessing the service. No data is read or altered  --  availability is the sole property violated."},
{type:'identify',cat:'CIA Triad',q:"Which security property ensures a sender cannot deny having sent a message?",o:["Confidentiality","Integrity","Availability","Non-repudiation"],a:3,e:"<strong>Non-repudiation</strong>  --  implemented through digital signatures. Only the sender possesses their private key, so a signature can only have come from them. Prevents denial of authorship or action."},
{type:'identify',cat:'CIA Triad',q:"Which of the following BEST describes the relationship between the CIA triad properties?",o:["They are independent  --  achieving one does not affect the others","They are mutually exclusive  --  you can only achieve two at a time","They work together and sometimes conflict  --  increasing one may reduce another","They are all achieved through encryption alone"],a:2,e:"The CIA properties <strong>work together but can conflict</strong>. Stronger encryption improves confidentiality but may reduce availability (performance). Air-gapping maximises confidentiality but harms availability. Security architects balance all three."},

// -- SECURITY CONTROLS --
{type:'identify',cat:'Security Controls',q:"Which type of security control STOPS an attack before it occurs?",o:["Detective","Corrective","Deterrent","Preventive"],a:3,e:"<strong>Preventive controls</strong>  --  act before the incident. Examples: firewall, antivirus blocking, encryption, access control, input validation. They stop the threat from succeeding."},
{type:'identify',cat:'Security Controls',q:"Which type of security control IDENTIFIES and records an incident after or during it?",o:["Preventive","Corrective","Detective","Compensating"],a:2,e:"<strong>Detective controls</strong>  --  identify incidents. Examples: IDS alerts, audit logs, SIEM correlation, CCTV, file integrity monitoring. They do not stop the incident but reveal it occurred."},
{type:'identify',cat:'Security Controls',q:"Which type of security control RESTORES systems after an incident?",o:["Preventive","Detective","Deterrent","Corrective"],a:3,e:"<strong>Corrective controls</strong>  --  restore normal operations after an incident. Examples: restoring from backup, reimaging a system, applying a patch after exploitation. They fix the damage."},
{type:'identify',cat:'Security Controls',q:"A warning banner on a login page that says 'Unauthorised access is prohibited and will be prosecuted' is BEST described as which type of control?",o:["Preventive","Detective","Corrective","Deterrent"],a:3,e:"<strong>Deterrent control</strong>  --  warning banners discourage attackers by signalling that activity is monitored and will have consequences. They do not technically prevent access but reduce the likelihood of an attempt."},
{type:'identify',cat:'Security Controls',q:"A company cannot patch a legacy system immediately. They deploy enhanced monitoring around it as a temporary measure. This is BEST described as which control type?",o:["Preventive","Corrective","Detective","Compensating"],a:3,e:"<strong>Compensating control</strong>  --  an alternative measure used when the primary control (patching) cannot be implemented. It must provide equivalent or close protection. Enhanced monitoring compensates for the missing patch."},
{type:'identify',cat:'Security Controls',q:"Which implementation type describes security controls delivered through policies, procedures, and training?",o:["Technical","Physical","Administrative","Logical"],a:2,e:"<strong>Administrative controls</strong>  --  also called managerial controls. Examples: security policies, acceptable use policies, background checks, security awareness training, separation of duties policies. They guide human behaviour."},
{type:'identify',cat:'Security Controls',q:"Which implementation type describes security controls delivered through software and hardware mechanisms?",o:["Administrative","Physical","Compensating","Technical"],a:3,e:"<strong>Technical controls</strong>  --  also called logical controls. Examples: firewalls, encryption, IPS, antivirus, access control lists, MFA systems. They are automated and enforced by technology."},
{type:'identify',cat:'Security Controls',q:"Which implementation type describes security controls such as locks, fences, and security guards?",o:["Administrative","Technical","Logical","Physical"],a:3,e:"<strong>Physical controls</strong>  --  protect physical access to facilities, hardware, and resources. Examples: badge readers, mantraps, security cameras, biometric door locks, security guards, cable locks."},
{type:'identify',cat:'Security Controls',q:"A security camera is BEST described as which combination of control types?",o:["Preventive and administrative","Detective and physical","Corrective and technical","Deterrent only"],a:1,e:"A security camera is <strong>detective</strong> (records events for review and investigation) and <strong>physical</strong> (the camera itself is physical hardware). It is also a deterrent  --  but primarily it detects and records."},
{type:'identify',cat:'Security Controls',q:"Encryption of data at rest is BEST classified as which type of control?",o:["Detective and administrative","Preventive and technical","Corrective and physical","Deterrent and logical"],a:1,e:"Encryption is <strong>preventive</strong> (stops unauthorised parties reading the data) and <strong>technical</strong> (implemented through software and hardware). It prevents confidentiality breaches even if physical media is stolen."},
{type:'identify',cat:'Security Controls',q:"Which of the following is an example of a corrective control?",o:["Firewall blocking malicious traffic","IDS generating an alert","Restoring data from a backup after ransomware","Security awareness training"],a:2,e:"<strong>Restoring from backup</strong> is corrective  --  it fixes the damage after an incident. Firewall = preventive. IDS alert = detective. Awareness training = administrative/preventive."},
{type:'identify',cat:'Security Controls',q:"Which of the following is an example of a physical preventive control?",o:["Audit log reviewing access attempts","Antivirus blocking malware","A mantrap preventing tailgating","A SIEM alert for anomalous logins"],a:2,e:"A <strong>mantrap</strong> (double-door air lock) physically prevents unauthorised people from entering a secure facility  --  it is both physical and preventive. It stops tailgating before it occurs."},

// -- AUTHENTICATION AND ACCESS --
{type:'identify',cat:'Authentication and Access',q:"Which authentication factor type is a fingerprint scan?",o:["Something you know","Something you have","Something you are","Somewhere you are"],a:2,e:"<strong>Something you are</strong>  --  inherence factors are biometrics: fingerprint, retina scan, facial recognition, voice pattern. They are hardest to steal but cannot be changed if compromised."},
{type:'identify',cat:'Authentication and Access',q:"Which authentication factor type is a hardware OTP token?",o:["Something you know","Something you have","Something you are","Something you do"],a:1,e:"<strong>Something you have</strong>  --  possession factors include hardware tokens, smart cards, mobile authenticator apps, and PIV/CAC cards. They can be lost or stolen unlike biometrics."},
{type:'identify',cat:'Authentication and Access',q:"Which authentication factor type is a PIN?",o:["Something you know","Something you have","Something you are","Somewhere you are"],a:0,e:"<strong>Something you know</strong>  --  knowledge factors include passwords, PINs, security questions, and passphrases. They are the most common but weakest factor  --  they can be guessed, stolen, or forgotten."},
{type:'identify',cat:'Authentication and Access',q:"Which of the following is a valid multi-factor authentication combination?",o:["Password and PIN","Fingerprint and retina scan","Password and a hardware token","Two different passwords"],a:2,e:"<strong>Password (know) + hardware token (have)</strong>  --  valid MFA because it uses two DIFFERENT factor types. Password + PIN are both 'something you know'  --  same factor, not MFA. Fingerprint + retina are both 'something you are'  --  same factor."},
{type:'identify',cat:'Authentication and Access',q:"What does AAA stand for in security?",o:["Authentication, Administration, Accounting","Authentication, Authorisation, Accounting","Access, Authorisation, Auditing","Authentication, Authorisation, Auditing"],a:1,e:"<strong>AAA  --  Authentication, Authorisation, Accounting</strong>. Authentication verifies identity. Authorisation determines what the identity can do. Accounting records what was done. RADIUS and TACACS+ are AAA protocols."},
{type:'identify',cat:'Authentication and Access',q:"What is the correct sequence in the identity verification process?",o:["Authorisation, Authentication, Identification","Authentication, Identification, Authorisation","Identification, Authentication, Authorisation","Authorisation, Identification, Authentication"],a:2,e:"<strong>Identification then Authentication then Authorisation</strong>  --  first you claim who you are (username), then you prove it (password/MFA), then the system determines what you are allowed to do."},
{type:'identify',cat:'Authentication and Access',q:"Which of the following BEST describes single-factor authentication?",o:["Using one factor from two different categories","Using only one factor type to verify identity","Requiring a username and a password","Using biometrics alone with no password"],a:1,e:"<strong>Single-factor authentication</strong> uses only one type of factor. A username + password is still single-factor because both are 'something you know.' MFA requires two or more DIFFERENT factor types."},
{type:'identify',cat:'Authentication and Access',q:"What is the purpose of an access control list (ACL)?",o:["Authenticate users before granting access","Define which subjects (users, systems) can perform which actions on which objects","Monitor and log all access attempts","Encrypt data during transmission"],a:1,e:"<strong>ACL</strong>  --  a list associated with an object (file, network interface, firewall) specifying which subjects have which permissions. The security kernel enforces ACL rules on every access attempt."},
{type:'identify',cat:'Authentication and Access',q:"Which of the following BEST describes authorisation in the AAA model?",o:["Verifying that a claimed identity is genuine","Recording what authenticated users do for audit purposes","Determining what resources and actions an authenticated identity is permitted","Claiming an identity before proving it"],a:2,e:"<strong>Authorisation</strong>  --  determines what an authenticated user is allowed to do. Implemented through access control models (RBAC, ABAC, DAC, MAC) and enforced by the reference monitor. It occurs after authentication is successful."},
{type:'identify',cat:'Authentication and Access',q:"What does it mean when authentication is described as 'context-aware'?",o:["The system checks the user's job title before granting access","Access decisions consider additional context such as time, location, device state, and behaviour patterns","Authentication requires a physical security key in all contexts","The system adapts the password strength requirement to the sensitivity of the resource"],a:1,e:"<strong>Context-aware authentication</strong> evaluates factors beyond credentials: is this login at an unusual time? From an unfamiliar location? From a non-compliant device? Risk-based authentication uses context to step up MFA when risk is elevated."},
{type:'identify',cat:'Authentication and Access',q:"What is the purpose of a time-based one-time password (TOTP)?",o:["A password that expires after the user logs out","A password generated from a shared secret and the current time, valid for only 30-60 seconds","A password automatically rotated every 90 days","A one-time password sent via SMS"],a:1,e:"<strong>TOTP</strong>  --  apps like Google Authenticator and Microsoft Authenticator generate a 6-digit code from a shared secret and the current timestamp. It is only valid for 30-60 seconds, making replay attacks ineffective."},

// -- SECURITY PRINCIPLES --
{type:'identify',cat:'Security Principles',q:"Which security principle grants users only the access they need to perform their specific job function?",o:["Separation of duties","Defence in depth","Least privilege","Need to know"],a:2,e:"<strong>Least privilege</strong>  --  users, applications, and systems receive only the minimum permissions required. Limits the blast radius if credentials are compromised. Applies to accounts, services, applications, and network access."},
{type:'identify',cat:'Security Principles',q:"What is the PRIMARY security benefit of separation of duties?",o:["Improving employee productivity","Ensuring no single person can complete a high-risk process alone, preventing fraud","Reducing the number of admin accounts","Ensuring all changes are logged"],a:1,e:"<strong>Separation of duties</strong>  --  divides sensitive tasks between multiple people so no one individual can commit fraud or make a critical error alone. Classic example: the person who requests a payment cannot also approve it."},
{type:'identify',cat:'Security Principles',q:"Which principle requires two authorised individuals to be present to perform a sensitive operation?",o:["Separation of duties","Least privilege","Dual control","Job rotation"],a:2,e:"<strong>Dual control</strong> (two-person integrity)  --  both individuals must be present and active simultaneously. Classic example: nuclear launch requires two officers turning keys at the same time. Different from separation of duties where tasks are split across time."},
{type:'identify',cat:'Security Principles',q:"What is the security purpose of mandatory vacation policies?",o:["Improving employee wellbeing and reducing burnout","Exposing ongoing fraud that requires the employee's continuous presence to conceal","Reducing IT infrastructure costs","Complying with labour law requirements"],a:1,e:"<strong>Mandatory vacation</strong>  --  requires employees to take continuous leave with access suspended. Fraud that relies on the fraudster being present to cover their tracks (e.g., falsifying records daily) will be exposed when they are absent."},
{type:'identify',cat:'Security Principles',q:"What is the PRIMARY security benefit of job rotation?",o:["Cross-training employees in multiple roles","Preventing long-term accumulation of excessive privileges and reducing insider fraud risk","Reducing employee boredom","Ensuring knowledge is not concentrated in one person"],a:1,e:"<strong>Job rotation</strong>  --  moving employees between roles prevents accumulation of excessive privileges over time and makes long-term fraud harder to sustain. It also cross-trains staff and ensures no critical process depends on one person."},
{type:'identify',cat:'Security Principles',q:"Which security principle requires that sensitive tasks be divided so no single person controls the entire process?",o:["Least privilege","Need to know","Job rotation","Separation of duties"],a:3,e:"<strong>Separation of duties</strong>  --  divides critical processes between multiple people. Creating a vendor in the system and approving payments to that vendor must be done by different people. Requires collusion to commit fraud."},
{type:'identify',cat:'Security Principles',q:"What is the difference between need-to-know and least privilege?",o:["They are identical concepts","Least privilege controls permissions; need-to-know applies to information access even when clearance permits broader access","Need-to-know is for technical systems; least privilege is for information","Least privilege applies only to admin accounts"],a:1,e:"<strong>Least privilege</strong> limits system permissions. <strong>Need-to-know</strong> limits information access  --  even if someone has the clearance level, they still should not access information irrelevant to their current task. Both principles work together."},
{type:'identify',cat:'Security Principles',q:"Which of the following BEST describes the concept of implicit deny?",o:["All access is denied until explicitly granted by an administrator","Denying access to users who have been explicitly blacklisted","Blocking traffic that matches a known malicious signature","Automatically locking accounts after failed login attempts"],a:0,e:"<strong>Implicit deny</strong>  --  in a properly designed access control system, anything not explicitly permitted is denied by default. Firewall default-deny rules implement this: if no rule permits traffic, it is dropped."},
{type:'identify',cat:'Security Principles',q:"Which of the following BEST describes the open design principle in security?",o:["Security systems should never be made public","Security should not depend on secrecy of the design  --  only secrecy of keys and passwords","All security implementations must be open source","Security designs should be shared with all employees"],a:1,e:"<strong>Open design</strong> (Kerckhoffs's principle)  --  the security of a system should depend on the secrecy of the key, not the secrecy of the algorithm. Publicly reviewed algorithms (AES, RSA) are stronger than obscure proprietary ones."},
{type:'identify',cat:'Security Principles',q:"Which security principle states that systems should fail in a secure manner when they malfunction?",o:["Defence in depth","Least privilege","Fail secure / fail safe","Implicit deny"],a:2,e:"<strong>Fail secure</strong>  --  when a security system fails, it should default to the more secure state. A firewall that crashes should block all traffic (fail secure), not pass all traffic (fail open). Contrast with fail-safe where safety (not security) is the priority."},
{type:'identify',cat:'Security Principles',q:"What is the purpose of security through obscurity as a concept?",o:["A valid primary security mechanism that hides system details from attackers","Relying on secrecy of implementation as the SOLE security mechanism  --  considered insufficient as a standalone defence","Encrypting all data so attackers cannot understand it","Hiding network topology from external scanners"],a:1,e:"<strong>Security through obscurity</strong> as a SOLE defence is considered insufficient  --  once the secret is discovered, all protection is lost. It can be a supplementary layer (hiding admin portals) but must never be the primary mechanism."},

// -- CRYPTOGRAPHY FUNDAMENTALS --
{type:'identify',cat:'Cryptography Fundamentals',q:"Which property of a cryptographic hash function ensures that even a tiny change to the input produces a completely different hash output?",o:["Collision resistance","Pre-image resistance","The avalanche effect","Key stretching"],a:2,e:"<strong>Avalanche effect</strong>  --  changing even one bit of input produces a completely different hash output. This makes it impossible to predict how changes to the input will affect the output, and reveals any alteration to the data."},
{type:'identify',cat:'Cryptography Fundamentals',q:"What is a collision in the context of cryptographic hashing?",o:["When two encryption keys produce the same ciphertext","When two different inputs produce the same hash output","When a hash function fails to produce output","When the same input produces different hashes"],a:1,e:"<strong>Collision</strong>  --  when two different inputs produce the same hash. MD5 and SHA-1 are broken because collisions can be deliberately generated. SHA-256 is considered collision-resistant for current computing capabilities."},
{type:'identify',cat:'Cryptography Fundamentals',q:"What is the purpose of adding a salt to a password before hashing?",o:["Making the hash longer and more secure","Adding a unique random value so identical passwords produce different hashes, defeating rainbow table attacks","Encrypting the password before storing it","Stretching the password to make brute force harder"],a:1,e:"<strong>Salt</strong>  --  a unique random value added to each password before hashing. Even if two users have the same password, their stored hashes are different. Defeats precomputed rainbow table attacks entirely."},
{type:'identify',cat:'Cryptography Fundamentals',q:"Which of the following BEST describes symmetric encryption?",o:["Uses a public key to encrypt and a private key to decrypt","Uses one shared key for both encryption and decryption","Uses a different key for each session automatically","Provides authentication in addition to encryption"],a:1,e:"<strong>Symmetric encryption</strong> (AES, 3DES, ChaCha20)  --  one shared key encrypts and decrypts. Fast and efficient for bulk data. The challenge is securely distributing the shared key. Asymmetric encryption is often used to exchange symmetric keys."},
{type:'identify',cat:'Cryptography Fundamentals',q:"What is the purpose of a message authentication code (MAC)?",o:["Authenticate the physical device sending a message","Verify both the integrity and authenticity of a message using a shared secret key","Encrypt a message so only the recipient can read it","Provide non-repudiation for sent messages"],a:1,e:"<strong>MAC</strong>  --  a fixed-length value computed from a message and a shared secret key. The recipient recomputes the MAC and compares. Verifies the message was not altered (integrity) and came from someone with the shared key (authenticity). HMAC is the most common construction."},
{type:'identify',cat:'Cryptography Fundamentals',q:"What is the difference between a MAC and a digital signature?",o:["They are identical in function","A MAC uses a shared symmetric key; a digital signature uses asymmetric keys and additionally provides non-repudiation","A digital signature uses a shared key; a MAC uses asymmetric keys","MACs are for files; digital signatures are for emails only"],a:1,e:"<strong>MAC</strong>  --  symmetric, shared key, provides integrity and authenticity but NOT non-repudiation (both parties have the key). <strong>Digital signature</strong>  --  asymmetric, private key, provides integrity, authenticity, AND non-repudiation."},
{type:'identify',cat:'Cryptography Fundamentals',q:"Which of the following BEST describes the purpose of key exchange in cryptography?",o:["Exchanging public keys between two parties","Establishing a shared symmetric key securely over an insecure channel without transmitting the key itself","Generating a new key pair for asymmetric encryption","Replacing expired encryption keys with new ones"],a:1,e:"<strong>Key exchange</strong> (Diffie-Hellman)  --  allows two parties to derive a shared secret over a public channel without the secret ever being transmitted. The derived secret is then used as a symmetric key for fast bulk encryption."},
{type:'identify',cat:'Cryptography Fundamentals',q:"What is the purpose of a nonce in cryptography?",o:["A secondary encryption key for added security","A number used only once to ensure uniqueness and prevent replay attacks","The initialisation vector for a symmetric cipher","A hash of the encryption key"],a:1,e:"<strong>Nonce</strong> (number used once)  --  a random value used in protocols and encryption to prevent replay attacks and ensure uniqueness. TLS uses nonces in handshakes. Challenge-response authentication uses nonces to prevent credential replay."},
{type:'identify',cat:'Cryptography Fundamentals',q:"Which type of cipher operates on fixed-size chunks of data?",o:["Stream cipher","Block cipher","Hash cipher","Asymmetric cipher"],a:1,e:"<strong>Block cipher</strong> (AES, 3DES)  --  encrypts fixed-size blocks (AES uses 128-bit blocks). Requires padding if data is not a multiple of the block size. <strong>Stream cipher</strong> (ChaCha20, RC4) encrypts one bit or byte at a time."},
{type:'identify',cat:'Cryptography Fundamentals',q:"What does cipher suite selection determine in a TLS connection?",o:["The certificate authority used to issue the server certificate","The specific combination of key exchange, authentication, bulk encryption, and MAC algorithms used for the session","The maximum session duration before re-authentication is required","The version of TLS protocol negotiated"],a:1,e:"<strong>Cipher suite</strong>  --  specifies the algorithm combination for the entire TLS session. Example: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 specifies ECDHE key exchange, RSA authentication, AES-256-GCM encryption, and SHA-384 for integrity. Weak cipher suites must be disabled."},

// -- SCENARIOS --
{type:'scenario',cat:'Scenario',scenario:"A financial institution requires that the employee who creates a new vendor in the payment system and the employee who approves payments to that vendor must be different people.",q:"Which security principle does this implement?",o:["Least privilege","Need to know","Separation of duties","Defence in depth"],a:2,e:"<strong>Separation of duties</strong>  --  dividing the create and approve functions between different employees prevents any single person from both creating a fraudulent vendor and approving payments to themselves. Requires collusion to commit fraud."},
{type:'scenario',cat:'Scenario',scenario:"A user logs into a system using their username, then enters their password, and finally approves a push notification on their phone.",q:"How many authentication factors are being used, and which types?",o:["One factor  --  something you know","Two factors  --  something you know and something you have","Three factors  --  know, have, and are","Two factors  --  something you know and something you are"],a:1,e:"<strong>Two factors: something you know (password) + something you have (phone)</strong>. The username is identification (not a factor). The password is knowledge. The phone notification is possession. This is 2FA  --  a valid MFA implementation."},
{type:'scenario',cat:'Scenario',scenario:"An audit discovers that a database administrator has read and write access to all financial records, HR records, patient records, and source code repositories  --  far beyond what their role requires.",q:"Which security principle has been violated?",o:["Separation of duties","Least privilege","Defence in depth","Dual control"],a:1,e:"<strong>Least privilege violation</strong>  --  the DBA only needs access to the databases they administer for their specific role. Excessive permissions increase the blast radius if the account is compromised and increase insider threat risk."},
{type:'scenario',cat:'Scenario',scenario:"A company's firewall goes offline unexpectedly. During the outage, all traffic  --  including traffic from known malicious IPs  --  is allowed through to the internal network.",q:"Which design principle has been violated?",o:["Defence in depth","Separation of duties","Fail secure","Least privilege"],a:2,e:"<strong>Fail secure violation</strong>  --  a firewall should fail secure (block all traffic) not fail open (allow all traffic). The firewall should default to denying all connections when it cannot enforce its rule set. This is a critical design flaw."},
{type:'scenario',cat:'Scenario',scenario:"A company stores passwords as plain SHA-256 hashes without any additional values. An attacker who breaches the database uses precomputed tables to instantly crack 80% of the passwords.",q:"Which cryptographic protection was missing?",o:["Key stretching using bcrypt","Password salting to ensure unique hashes per user","Asymmetric encryption of the passwords","Encrypting the hash database at rest"],a:1,e:"<strong>Salting</strong>  --  without salts, identical passwords produce identical hashes, allowing precomputed rainbow table attacks. A unique random salt per password means the attacker cannot use precomputed tables and must crack each hash individually."},
{type:'scenario',cat:'Scenario',scenario:"A security team discovers that a terminated employee's account was used to access the HR system and download employee records two weeks after their departure. The account was never disabled.",q:"Which combination of controls would MOST effectively have prevented this?",o:["Stronger password requirements for all accounts","Automated deprovisioning tied to HR offboarding and periodic access reviews to catch accounts that slip through","Requiring MFA on all accounts","Logging all access to HR systems in the SIEM"],a:1,e:"<strong>Automated deprovisioning</strong> disables accounts immediately on termination, triggered by the HR system. <strong>Periodic access reviews</strong> catch dormant accounts that slipped through. MFA helps but a disabled account is more effective than a locked account with MFA."},
{type:'scenario',cat:'Scenario',scenario:"A developer uses a proprietary encryption algorithm they designed themselves, arguing that attackers cannot break what they do not understand.",q:"Which security principle does this approach violate?",o:["Least privilege","Defence in depth","Separation of duties","Open design (Kerckhoffs's principle)"],a:3,e:"<strong>Kerckhoffs's principle / Open design</strong>  --  security should depend on the secrecy of the key, not the algorithm. Unreviewed proprietary algorithms have not been subjected to public cryptanalysis and almost always contain flaws. Use publicly vetted algorithms (AES, RSA, ECC)."},
{type:'scenario',cat:'Scenario',scenario:"An employee receives an email with a link. The link leads to a page that looks identical to their company's VPN login portal and captures their credentials. Their username and password alone allowed the attacker to authenticate.",q:"Which control would MOST effectively have prevented account compromise even after credential theft?",o:["A stronger password policy requiring 16 characters","Multi-factor authentication requiring a second factor the attacker does not possess","Email filtering to block the phishing link","Security awareness training"],a:1,e:"<strong>MFA</strong>  --  even with the correct password, the attacker cannot satisfy the second factor (hardware token, authenticator app, biometric). This is precisely the scenario MFA was designed for: credential theft via phishing. Email filtering reduces attempts; MFA stops the compromise even when phishing succeeds."},
{type:'scenario',cat:'Scenario',scenario:"A security architect is designing controls for a critical financial system. She implements encryption (technical/preventive), audit logging (technical/detective), security guards (physical/deterrent), and an incident response plan (administrative/corrective).",q:"Which security principle is this implementation demonstrating?",o:["Least privilege","Separation of duties","Defence in depth","Dual control"],a:2,e:"<strong>Defence in depth</strong>  --  multiple overlapping controls from different categories and types mean no single failure compromises the system. If encryption is bypassed, logging detects it. If technical controls fail, physical and administrative controls remain."},
{type:'scenario',cat:'Scenario',scenario:"A bank requires two officers to simultaneously insert their keys into separate locks to open the vault. Neither key alone can open the vault.",q:"Which security principle does this implement?",o:["Separation of duties","Least privilege","Need to know","Dual control"],a:3,e:"<strong>Dual control</strong> (two-person integrity)  --  both individuals must act simultaneously. This is distinct from separation of duties (where tasks are split across time or steps). Dual control ensures no single person can perform the act alone even if they wanted to."},
];

let questions=[],qi=0,correct=0,wrong=0;
let catStats={};
CATS.forEach(c=>catStats[c]={c:0,t:0});

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function buildQuestions(){
  const pool=shuffle([...Q_BANK]).slice(0,80);
  return pool.map(q=>{
    const idxs=q.o.map((_,i)=>i);
    const shuf=shuffle(idxs);
    return{...q,o:shuf.map(i=>q.o[i]),a:shuf.indexOf(q.a)};
  });
}

function updateStats(){
  const total=correct+wrong;
  document.getElementById('s-prog').textContent=qi+'/80';
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-acc').textContent=total?Math.round(correct/total*100)+'%':' -- ';
  document.getElementById('prog-fill').style.width=Math.round(qi/80*100)+'%';
}

function renderQ(){
  if(qi>=80){showResults();return;}
  const q=questions[qi];
  const letters=['A','B','C','D'];
  const catBadge=BADGE_MAP[q.cat]||'badge-cia';
  const scenHTML=q.type==='scenario'&&q.scenario
    ?'<div class="scenario-box"><div class="scenario-lbl">Scenario</div><div class="scenario-text">'+q.scenario+'</div></div>'
    :'';
  document.getElementById('q-area').innerHTML=
    '<div class="q-card">'+
      '<div class="q-meta">'+
        '<span class="q-badge '+catBadge+'">'+q.cat+'</span>'+
        '<span class="q-num">Q'+(qi+1)+' of 80</span>'+
      '</div>'+
      scenHTML+
      '<div class="q-text">'+q.q+'</div>'+
      '<div class="opts" id="opts">'+
        q.o.map((o,i)=>'<button class="opt" id="opt-'+i+'" onclick="answer('+i+')"><span class="opt-letter">'+letters[i]+'</span><span class="opt-text">'+o+'</span></button>').join('')+
      '</div>'+
      '<div class="explanation" id="explanation"><div class="exp-lbl">Explanation</div><div class="exp-text" id="exp-text"></div></div>'+
      '<button class="btn-next" id="btn-next" onclick="nextQ()">'+(qi===79?'See results &rarr;':'Next &rarr;')+'</button>'+
    '</div>';
}

function answer(idx){
  const q=questions[qi];
  const isCorrect=idx===q.a;
  if(isCorrect){correct++;catStats[q.cat].c++;}else wrong++;
  catStats[q.cat].t++;qi++;updateStats();
  q.o.forEach((_,i)=>document.getElementById('opt-'+i).disabled=true);
  const cb=document.getElementById('opt-'+idx);
  const rb=document.getElementById('opt-'+q.a);
  if(isCorrect){cb.classList.add('correct');}else{cb.classList.add('wrong');if(rb)rb.classList.add('reveal');}
  document.getElementById('exp-text').innerHTML=q.e;
  document.getElementById('explanation').classList.add('show');
  var nb=document.getElementById('btn-next');
  nb.style.display='block';
  nb.onclick=function(){nextQ();};
  if(qi>0&&qi%20===0) logToDashboard(1,'General Security Concepts Trainer',Math.round(correct/qi*100));
}

function nextQ(){renderQ();}

function showResults(){
  document.getElementById('q-area').style.display='none';
  const res=document.getElementById('results-area');
  res.style.display='block';
  const pct=Math.round(correct/80*100);
  logToDashboard(1,'General Security Concepts Trainer',pct);
  const passed=pct>=80;
  const msg=pct>=90?'Outstanding &mdash; exam-ready!':pct>=80?'Solid &mdash; above pass threshold.':pct>=65?'Getting there &mdash; keep reviewing.':'More study needed.';
  const ringColor=passed?'#00ff88':'#ff3d5a';
  const circ=339.3,offset=circ-(pct/100)*circ;
  const topCats=CATS.filter(c=>catStats[c].t>0).sort((a,b)=>(catStats[b].c/catStats[b].t)-(catStats[a].c/catStats[a].t));
  const bdHTML=topCats.slice(0,6).map(c=>{
    const s=catStats[c];const p=s.t?Math.round(s.c/s.t*100):0;
    const col=CAT_COLORS[c]||'var(--purple)';
    return '<div class="bd-card"><div class="bd-title" style="color:'+col+'">'+c+'</div><div class="bd-bar-bg"><div class="bd-bar-fill" style="width:0%;background:'+col+'" data-pct="'+p+'"></div></div><div class="bd-score" style="color:'+col+'">'+p+'%</div><div class="bd-detail">'+s.c+'/'+s.t+' correct</div></div>';
  }).join('');
  res.innerHTML=
    '<div class="results-wrap">'+
      '<div class="results-ring"><svg width="140" height="140" viewBox="0 0 140 140">'+
        '<circle cx="70" cy="70" r="54" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>'+
        '<circle cx="70" cy="70" r="54" fill="none" stroke="'+ringColor+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" id="ring-anim"/>'+
      '</svg><div class="ring-score"><div class="ring-pct">'+pct+'%</div><div class="ring-lbl">score</div></div></div>'+
      '<div class="results-verdict" style="color:'+ringColor+'">'+(passed?'Passed &#10003;':'Keep Studying')+'</div>'+
      '<div class="results-sub">'+correct+'/80 correct &mdash; '+msg+'</div>'+
      '<div class="breakdown">'+bdHTML+'</div>'+
      '<button class="btn-retake" onclick="retake()">Retake Quiz</button>'+
      '<button class="btn-retake" onclick="showRef()" style="border-color:var(--purple);color:var(--purple)">View Reference</button>'+
    '</div>';
  setTimeout(()=>{
    const ring=document.getElementById('ring-anim');
    if(ring){ring.style.transition='stroke-dashoffset 1.5s ease';ring.style.strokeDashoffset=offset;}
    document.querySelectorAll('.bd-bar-fill').forEach(el=>{el.style.transition='width 1s ease';el.style.width=el.dataset.pct+'%';});
  },100);
}

function retake(){
  document.getElementById('q-area').style.display='block';
  document.getElementById('results-area').style.display='none';
  questions=buildQuestions();
  qi=0;correct=0;wrong=0;
  CATS.forEach(c=>catStats[c]={c:0,t:0});
  updateStats();renderQ();
}

function showRef(){
  document.getElementById('view-quiz').style.display='none';
  document.getElementById('view-ref').style.display='block';
  document.getElementById('tab-quiz').classList.remove('active');
  document.getElementById('tab-ref').classList.add('active');
  buildRef();
}

function setTab(t){
  if(t==='ref'){
    document.getElementById('view-quiz').style.display='none';
    document.getElementById('view-ref').style.display='block';
    document.getElementById('tab-quiz').classList.remove('active');
    document.getElementById('tab-ref').classList.add('active');
    buildRef();
  } else {
    document.getElementById('view-ref').style.display='none';
    document.getElementById('view-quiz').style.display='block';
    document.getElementById('tab-quiz').classList.add('active');
    document.getElementById('tab-ref').classList.remove('active');
  }
}

function buildRef(){
  const chart=document.getElementById('acc-chart');chart.innerHTML='';
  CATS.forEach(c=>{
    const s=catStats[c];const pct=s.t?Math.round(s.c/s.t*100):0;
    const col=CAT_COLORS[c]||'var(--purple)';
    chart.innerHTML+='<div class="acc-row"><div class="acc-lbl">'+c+'</div><div class="acc-bg"><div class="acc-fill" style="width:'+(s.t?pct:0)+'%;background:'+col+'"></div></div><div class="acc-pct">'+(s.t?pct+'%':' -- ')+'</div></div>';
  });
  const cards=document.getElementById('ref-cards');cards.innerHTML='';
  TERMS.forEach(t=>{
    cards.innerHTML+='<div class="ref-card"><div class="ref-name">'+t.name+'</div><div class="ref-def">'+t.def+'</div><span class="ref-tag '+t.tag+'">'+t.tagLabel+'</span><div class="ref-key">'+t.key+'</div></div>';
  });
}

questions=buildQuestions();
updateStats();
renderQ();
</script>
</body>
</html>
