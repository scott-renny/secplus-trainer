<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptography & Wireless Security Trainer -- Security+</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080c;--panel:#0e1018;--panel2:#141720;--panel3:#1a1e29;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.18);
  --text:#e4e8f5;--text2:#6b7494;--text3:#3a4060;
  --accent:#00e5ff;--green:#00ff88;--red:#ff3d5a;--amber:#ffcc00;--purple:#bf87ff;--teal:#4fd1c5;
  --gold:#f59e0b;--mono:'Courier New',monospace;
}
*{font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 0%,rgba(245,158,11,0.04) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(0,229,255,0.03) 0%,transparent 60%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(245,158,11,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,0.012) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 20px 80px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--gold)}
h1{font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:8px}
h1 em{font-style:normal;color:var(--gold)}
.subtitle{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.tabs{display:flex;gap:5px;margin-bottom:20px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px}
.tab{flex:1;padding:10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:8px;transition:all .2s;touch-action:manipulation}
.tab.active{background:var(--panel3);color:var(--gold);border:1px solid rgba(245,158,11,0.25)}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.sb{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sb.s-prog::before{background:var(--gold)}.sb.s-correct::before{background:var(--green)}.sb.s-wrong::before{background:var(--red)}.sb.s-acc::before{background:var(--amber)}
.sb-val{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1}
.sb.s-correct .sb-val{color:var(--green)}.sb.s-wrong .sb-val{color:var(--red)}.sb.s-acc .sb-val{color:var(--amber)}
.sb-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-top:4px}
.prog-wrap{height:3px;background:rgba(255,255,255,0.06);border-radius:99px;margin-bottom:20px;overflow:hidden}
.prog-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease}
.q-card{background:var(--panel);border:1px solid var(--border2);border-radius:20px;padding:28px;margin-bottom:14px;position:relative;overflow:hidden}
.q-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(245,158,11,0.35),transparent)}
.q-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.q-badge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:5px}
.badge-keymgmt{background:rgba(245,158,11,0.12);color:var(--gold);border:1px solid rgba(245,158,11,0.25)}
.badge-attacks{background:rgba(255,61,90,0.1);color:var(--red);border:1px solid rgba(255,61,90,0.2)}
.badge-wireless{background:rgba(0,229,255,0.1);color:var(--accent);border:1px solid rgba(0,229,255,0.2)}
.badge-authproto{background:rgba(79,209,197,0.1);color:var(--teal);border:1px solid rgba(79,209,197,0.2)}
.badge-scenario{background:rgba(191,135,255,0.1);color:var(--purple);border:1px solid rgba(191,135,255,0.2)}
.q-num{font-family:var(--mono);font-size:10px;color:var(--text3)}
.scenario-box{background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--gold);border-radius:10px;padding:13px 16px;margin-bottom:16px}
.scenario-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.scenario-text{font-size:13px;color:var(--text2);line-height:1.7;font-family:var(--mono)}
.q-text{font-size:15px;font-weight:500;line-height:1.65;color:var(--text);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--panel2);cursor:pointer;text-align:left;width:100%;transition:all .15s;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--border3);background:var(--panel3)}
.opt-letter{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2);min-width:18px;margin-top:1px;flex-shrink:0}
.opt-text{font-size:14px;color:var(--text);line-height:1.5}
.opt.correct{border-color:var(--green)!important;background:rgba(0,255,136,0.07)!important}
.opt.correct .opt-letter,.opt.correct .opt-text{color:var(--green)!important}
.opt.wrong{border-color:var(--red)!important;background:rgba(255,61,90,0.07)!important}
.opt.wrong .opt-letter,.opt.wrong .opt-text{color:var(--red)!important}
.opt.reveal{border-color:rgba(0,255,136,0.3)!important;background:rgba(0,255,136,0.04)!important}
.opt.reveal .opt-letter,.opt.reveal .opt-text{color:var(--green)!important;opacity:.6}
.opt:disabled{cursor:default}
.explanation{display:none;background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--gold);border-radius:10px;padding:13px 16px;margin-bottom:12px}
.explanation.show{display:block}
.exp-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.exp-text{font-size:13px;color:var(--text2);line-height:1.7}
.exp-text strong{color:var(--text);font-weight:600}
.btn-next{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:none;transition:all .15s;touch-action:manipulation}
.btn-next:hover{border-color:var(--gold);color:var(--gold)}
.results-wrap{text-align:center;padding:32px 0 20px}
.results-ring{width:140px;height:140px;margin:0 auto 20px;position:relative}
.results-ring svg{transform:rotate(-90deg)}
.ring-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-pct{font-family:var(--mono);font-size:32px;font-weight:600}
.ring-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.results-verdict{font-size:22px;font-weight:700;margin-bottom:6px}
.results-sub{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px;text-align:left}
.bd-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.bd-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.bd-bar-bg{height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bd-bar-fill{height:100%;border-radius:99px;transition:width 1s ease}
.bd-score{font-family:var(--mono);font-size:22px;font-weight:600}
.bd-detail{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px}
.btn-retake{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:12px 36px;background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:10px;cursor:pointer;transition:all .2s;touch-action:manipulation}
.btn-retake:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:500px){.stats-bar{grid-template-columns:repeat(2,1fr)}.breakdown{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">CompTIA Security+ &middot; SY0-701 &middot; Domain 1</div>
  <h1>Cryptography &amp; <em>Wireless Security</em></h1>
  <p class="subtitle">36 questions &middot; key management &middot; cryptographic attacks &middot; wireless protocols &middot; EAP types &middot; authentication protocols</p>
  <div class="tabs">
    <button class="tab active" id="tab-quiz" onclick="setTab('quiz')">Quiz</button>
    <button class="tab" id="tab-ref" onclick="setTab('ref')">Reference</button>
  </div>
  <div id="view-quiz">
    <div class="stats-bar">
      <div class="sb s-prog"><div class="sb-val" id="s-prog">0/36</div><div class="sb-lbl">Progress</div></div>
      <div class="sb s-correct"><div class="sb-val" id="s-correct">0</div><div class="sb-lbl">Correct</div></div>
      <div class="sb s-wrong"><div class="sb-val" id="s-wrong">0</div><div class="sb-lbl">Wrong</div></div>
      <div class="sb s-acc"><div class="sb-val" id="s-acc">--</div><div class="sb-lbl">Accuracy</div></div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div id="q-area"></div>
    <div id="results-area" style="display:none"></div>
  </div>
  <div id="view-ref" style="display:none">
    <div style="font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)">Accuracy by Category</div>
    <div id="acc-chart" style="margin-bottom:24px"></div>
    <div style="font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)">Key Concepts</div>
    <div id="ref-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px"></div>
  </div>
</div>
<script>
function logToDashboard(domain,type,score){
  try{
    var s=JSON.parse(localStorage.getItem('sp_sessions')||'[]');
    var now=new Date();
    s.push({domain:domain,type:type,score:score,date:now.toLocaleDateString('en-CA',{month:'short',day:'numeric'}),ts:now.getTime()});
    localStorage.setItem('sp_sessions',JSON.stringify(s));
  }catch(e){}
}

var CATS=['Key Management','Cryptographic Attacks','Wireless Security','Authentication Protocols','Scenario'];
var CAT_COLORS={'Key Management':'var(--gold)','Cryptographic Attacks':'var(--red)','Wireless Security':'var(--accent)','Authentication Protocols':'var(--teal)','Scenario':'var(--purple)'};
var BADGE_MAP={'Key Management':'badge-keymgmt','Cryptographic Attacks':'badge-attacks','Wireless Security':'badge-wireless','Authentication Protocols':'badge-authproto','Scenario':'badge-scenario'};

var TERMS=[
  {name:'HSM',def:'Hardware Security Module -- a physical device that generates, stores, and manages cryptographic keys in tamper-resistant hardware. Keys never leave the HSM in plaintext.',key:'FIPS 140-2/3 validated. Used for CA root keys, payment systems, code signing. Key operations happen inside the device.'},
  {name:'TPM',def:'Trusted Platform Module -- a chip embedded in a motherboard that stores cryptographic keys and measurements of system state. Enables disk encryption key storage and platform attestation.',key:'Stores BitLocker keys, boot measurements, device identity certificates. Cannot be easily removed.'},
  {name:'Key Escrow',def:'A system where encryption keys are held in trust by a third party (escrow agent), enabling recovery by authorised parties such as law enforcement or an employer.',key:'Dual-use: enables recovery (good) but creates a single point of compromise (risk). Government key escrow proposals are controversial.'},
  {name:'Key Stretching',def:'Techniques (PBKDF2, bcrypt, scrypt, Argon2) that make brute-force attacks more expensive by applying a hashing function thousands of times to a password.',key:'Increases attacker cost. Work factor tunable. Used for storing passwords and deriving encryption keys from passwords.'},
  {name:'Perfect Forward Secrecy',def:'A property where session keys are generated fresh for each session using ephemeral Diffie-Hellman, so compromise of the long-term key does not expose past sessions.',key:'ECDHE and DHE provide PFS. RSA key exchange does NOT. TLS 1.3 mandates PFS.'},
  {name:'Birthday Attack',def:'An attack exploiting the birthday paradox -- finding two inputs that hash to the same value (collision) is much easier than expected due to probability mathematics.',key:'Forces use of longer hashes. SHA-1 (160-bit) vulnerable. SHA-256+ resists birthday attacks. Relevant to digital signatures.'},
  {name:'Downgrade Attack',def:'An attack that forces a protocol to use an older, weaker version or cipher suite. POODLE (SSLv3), FREAK, DROWN, BEAST are examples.',key:'Prevent by: disabling old protocol versions (SSLv3, TLS 1.0/1.1), enforcing strong cipher suites, HSTS.'},
  {name:'WPA3',def:'Wi-Fi Protected Access 3 -- the current Wi-Fi security standard. Uses SAE (Simultaneous Authentication of Equals) replacing PSK, provides forward secrecy, and protects against offline dictionary attacks.',key:'SAE replaces PSK. No offline dictionary attacks. WPA3-Enterprise uses 192-bit security. Mandatory for Wi-Fi 6 devices.'},
  {name:'EAP-TLS',def:'Extensible Authentication Protocol -- Transport Layer Security. The strongest EAP method: requires client certificates AND server certificates for mutual authentication.',key:'Strongest EAP. Requires PKI for both client and server. No password used. Most expensive to deploy.'},
  {name:'PEAP',def:'Protected EAP -- wraps the inner EAP method in a TLS tunnel. Only the server needs a certificate. The client authenticates with a username/password inside the tunnel.',key:'Server cert only. Inner method (MSCHAPv2) protected inside TLS tunnel. Common in enterprise Wi-Fi.'},
  {name:'RADIUS',def:'Remote Authentication Dial-In User Service -- centralised AAA protocol using UDP. Authenticates users attempting to access network resources via NAS (VPN, Wi-Fi, dial-up).',key:'UDP/1812 (auth) UDP/1813 (accounting). Client is the NAS (switch, AP, VPN). Encrypts only the password field.'},
  {name:'TACACS+',def:'Terminal Access Controller Access-Control System Plus -- Cisco proprietary AAA protocol using TCP/49. Encrypts the entire payload unlike RADIUS. Separates A, A, and A into distinct services.',key:'TCP/49. Full payload encryption. Separates authentication, authorisation, and accounting. Preferred for device admin.'},
  {name:'Kerberos',def:'Ticket-based network authentication protocol. KDC issues TGT after initial login; client uses TGT to request service tickets without re-entering credentials.',key:'Port 88. KDC = AS + TGS. TGT -> service ticket -> access. Vulnerable to Kerberoasting, Golden/Silver Ticket attacks.'},
  {name:'802.1X',def:'IEEE standard for port-based Network Access Control (NAC). Requires supplicant authentication to an authentication server before granting network access via a switch or AP.',key:'Three parties: supplicant (client), authenticator (switch/AP), authentication server (RADIUS). Wired and wireless NAC.'},
];

var Q_BANK=[
// ── KEY MANAGEMENT ────────────────────────────────────────────────────────
{type:'identify',cat:'Key Management',q:'What is the PRIMARY security advantage of using a Hardware Security Module (HSM) to store private keys?',o:['HSMs are cheaper than software key storage','HSMs generate stronger keys than software','Private keys are generated and used inside tamper-resistant hardware and never exposed in plaintext -- even the administrator cannot extract them','HSMs automatically rotate keys on a defined schedule'],a:2,e:'<strong>HSM: keys never leave in plaintext</strong>. All cryptographic operations (signing, decryption) happen inside the HSM. Even if the server is fully compromised, the attacker cannot extract the private key. Used for: CA root keys, payment HSMs (PCI HSM), code-signing keys, TLS private keys on high-value servers. FIPS 140-2 Level 3+ HSMs also resist physical tampering.'},
{type:'identify',cat:'Key Management',q:'What is a TPM chip and how does it support disk encryption like BitLocker?',o:['A cloud-based key storage service','A software vault for storing application passwords','A tamper-resistant chip on the motherboard that stores encryption keys and platform measurements -- BitLocker stores its volume master key in the TPM and will only release it if boot measurements match expected values','An external USB device that stores encryption keys'],a:2,e:'<strong>TPM stores BitLocker key + validates boot integrity</strong>. On startup, the TPM measures the boot process (BIOS, bootloader, OS). If measurements match (system unmodified), the TPM releases the VMK (Volume Master Key) and the disk unlocks automatically. If measurements don\'t match (tampered BIOS, different boot device), the TPM withholds the key and access is denied. Protects against offline attacks on stolen laptops.'},
{type:'identify',cat:'Key Management',q:'What is Perfect Forward Secrecy (PFS) and which key exchange mechanisms provide it?',o:['A method of storing private keys that prevents them from being discovered','A property where each session uses a unique ephemeral key pair -- compromise of the long-term private key does not expose previously recorded sessions. Provided by ECDHE and DHE, not RSA key exchange','A technique for rotating certificates automatically','A property ensuring encrypted messages cannot be altered in transit'],a:1,e:'<strong>PFS via ephemeral Diffie-Hellman</strong>. Without PFS: if an attacker records encrypted TLS traffic and later steals the server private key, they can decrypt all recorded sessions. With PFS (ECDHE/DHE): each session generates a new temporary key pair. Stealing the server key cannot decrypt past sessions because each session\'s key was ephemeral and discarded. TLS 1.3 mandates PFS -- RSA key exchange (no PFS) is removed.'},
{type:'identify',cat:'Key Management',q:'What is key escrow and what are its competing risks?',o:['A system for generating new encryption keys when old ones expire','A backup copy of an encryption key held by a trusted third party for authorised recovery -- benefit: enables recovery of encrypted data; risk: the escrow itself becomes a high-value target','A process for distributing public keys to all users in an organisation','A technique for splitting a private key across multiple servers'],a:1,e:'<strong>Key escrow: recovery vs risk</strong>. Enterprise use: if an employee encrypts files then leaves, the company needs key recovery. Government use: law enforcement may need to decrypt communications. Risk: the escrow agent becomes a single point of failure and a prime target. Hardware-protected escrow (HSM) reduces risk. Secret sharing (Shamir\'s Secret Sharing) distributes escrow across multiple custodians requiring M-of-N agreement to recover.'},
{type:'identify',cat:'Key Management',q:'What is key stretching and which algorithms are designed for it?',o:['Extending the length of an encryption key by appending random bytes','Applying a password hashing function iteratively (thousands of times) to make brute-force attacks computationally expensive -- PBKDF2, bcrypt, scrypt, and Argon2 are designed for this','Splitting a master key into multiple sub-keys for different purposes','Compressing a key to reduce storage requirements'],a:1,e:'<strong>Key stretching slows attackers</strong>. MD5/SHA-256 are fast by design -- attackers can test billions of passwords per second with a GPU. bcrypt, scrypt, Argon2 are deliberately slow (0.3 seconds is ideal). bcrypt: work factor (rounds). scrypt: memory-hard (resists GPU/ASIC). Argon2: winner of Password Hashing Competition (2015). The work factor can be increased as hardware improves.'},
{type:'identify',cat:'Key Management',q:'What is the purpose of a Key Derivation Function (KDF)?',o:['To generate public/private key pairs for asymmetric encryption','To derive one or more cryptographic keys from a master secret (password, shared secret, or master key) using a defined algorithm -- used in TLS to derive session keys from the master secret','To store keys securely in hardware','To revoke compromised keys in a PKI'],a:1,e:'<strong>KDF: derive keys from secrets</strong>. TLS uses a KDF (PRF/HKDF) to derive multiple session keys (client write key, server write key, IVs) from the shared secret established during the handshake. Password-based KDFs (PBKDF2) derive encryption keys from passwords -- critical because passwords have low entropy and raw use would be weak. HKDF is the modern KDF standard.'},
{type:'identify',cat:'Key Management',q:'What is Shamir\'s Secret Sharing and where is it used in security?',o:['A method for generating strong random passwords','A scheme that splits a secret into N shares where any M shares (M-of-N threshold) can reconstruct the original -- used for key escrow, CA root key ceremonies, and cryptocurrency wallet recovery','A public key algorithm for key exchange','A technique for generating pseudo-random numbers'],a:1,e:'<strong>M-of-N threshold secret sharing</strong>. Example: CA root key split into 7 shares held by 7 officers; any 4 can reconstruct the key. No single person holds the complete key. Used in: CA root key ceremonies (CA/Browser Forum), cryptocurrency cold wallet recovery, HSM administrator key ceremonies. Protects against both loss (any M shares suffice) and compromise (M-1 shares reveal nothing).'},
{type:'identify',cat:'Key Management',q:'What is the difference between symmetric key distribution and asymmetric key distribution challenges?',o:['Symmetric is always more secure; asymmetric is only for small data','Symmetric key distribution requires a secure channel to share the secret key before communication (key distribution problem) -- asymmetric avoids this since the public key can be shared openly, but asymmetric is much slower, so hybrid cryptography combines both','Asymmetric keys must be pre-shared; symmetric keys can be public','There is no difference -- both require the same pre-shared key approach'],a:1,e:'<strong>Hybrid crypto solves both problems</strong>. Symmetric problem: how do you securely share the key before communication? Asymmetric solves this: encrypt a random symmetric key with the recipient\'s public key. Asymmetric problem: too slow for bulk data. Symmetric solves this: use AES for the actual data. Result: TLS uses asymmetric/DH to establish a shared secret, then derives symmetric keys for the session data. Best of both.'},

// ── CRYPTOGRAPHIC ATTACKS ─────────────────────────────────────────────────
{type:'identify',cat:'Cryptographic Attacks',q:'What is a birthday attack against a hash function?',o:['An attack that targets systems on their first deployment day','An attack exploiting the birthday paradox: finding ANY two inputs that produce the same hash (collision) requires far fewer attempts than finding a specific collision -- roughly 2^(n/2) attempts for an n-bit hash','An attack that targets outdated cryptographic algorithms','A timing attack exploiting the time taken to compute hash values'],a:1,e:'<strong>Birthday attack: collision probability</strong>. If a hash has n bits, finding a specific collision requires ~2^n attempts. But finding ANY two inputs that collide takes only ~2^(n/2) -- the birthday paradox. SHA-1 (160 bits) needs ~2^80 for brute force but only ~2^80/2 = ~2^40 for birthday. SHA-256 requires ~2^128 for birthday. This is why hash lengths matter: MD5 (128-bit) is broken, SHA-1 deprecated, SHA-256 current minimum.'},
{type:'identify',cat:'Cryptographic Attacks',q:'What is a padding oracle attack and which encryption mode is vulnerable to it?',o:['An attack against RSA key generation using padding weaknesses','An attack against CBC (Cipher Block Chaining) mode encryption where an attacker can determine whether decrypted ciphertext has valid padding -- allowing them to decrypt ciphertext byte by byte without the key','An attack against AES-GCM authenticated encryption','An attack that exploits the random padding in OAEP encryption'],a:1,e:'<strong>Padding oracle attacks CBC mode</strong>. In CBC, each ciphertext block is XORed with the previous block during decryption. If an attacker can submit modified ciphertexts and observe whether padding is valid or not (even via timing), they can recover plaintext. POODLE attacked SSLv3 using this. Fix: use AES-GCM (authenticated encryption) which detects tampering. TLS 1.3 removes CBC cipher suites and mandates AEAD.'},
{type:'identify',cat:'Cryptographic Attacks',q:'What is a downgrade attack in the context of TLS and how is POODLE an example?',o:['An attack that downgrades a user\'s account privileges','An attack that forces a connection to use an older, weaker protocol version or cipher suite -- POODLE forced TLS connections to fall back to SSLv3, then exploited SSLv3\'s CBC padding vulnerability','An attack that forces a user to downgrade their browser version','A social engineering attack impersonating a software update'],a:1,e:'<strong>POODLE = downgrade + padding oracle</strong>. POODLE (Padding Oracle On Downgraded Legacy Encryption): attacker causes connection errors, forcing TLS to fall back to SSLv3. Then exploits SSLv3\'s padding oracle. Fix: disable SSLv3 entirely on servers and clients. Other downgrade attacks: FREAK (export-grade RSA), DROWN (SSLv2), LOGJAM (DHE 512-bit export). Prevention: use TLS_FALLBACK_SCSV, disable old protocol versions.'},
{type:'identify',cat:'Cryptographic Attacks',q:'What is a replay attack and how does a challenge-response mechanism prevent it?',o:['An attack where an attacker replays a video of a legitimate user to bypass facial recognition','An attacker captures a valid authentication credential or message and resubmits it later to gain access -- challenge-response prevents this by including a unique nonce (number used once) in each authentication exchange','An attack that replays old encrypted data to confuse a decryption system','A DoS attack that replays the same packet thousands of times to overwhelm a server'],a:1,e:'<strong>Replay: replay captured credential; nonce prevents it</strong>. Without replay protection: capturing a valid authentication token and resubmitting it grants access. Challenge-response: server sends a random nonce; client must sign the nonce with their key. Each authentication uses a unique nonce -- replaying an old response fails because the nonce won\'t match. Kerberos timestamps also prevent replay (5-minute window). Session tokens with expiry also limit replay window.'},
{type:'identify',cat:'Cryptographic Attacks',q:'What is a pass-the-hash (PtH) attack and why is it effective against NTLM authentication?',o:['An attack that cracks the hash of a password using rainbow tables','An attacker uses a captured NTLM hash directly to authenticate without knowing the plaintext password -- NTLM is vulnerable because the hash itself is the authentication credential, not a proof of knowing the password','An attack that generates a hash collision to forge a digital signature','An attack that passes a hash function over plaintext to exfiltrate data'],a:1,e:'<strong>NTLM hash = the credential</strong>. In NTLM authentication, the client proves identity by responding to a challenge using the NTLM hash of the password. An attacker who obtains the hash (via Mimikatz from LSASS) can authenticate as that user without knowing the password. Fix: use Kerberos (not NTLM), enforce Credential Guard, restrict NTLM, apply Protected Users security group. PtH is why NTLM is a legacy risk in Active Directory environments.'},
{type:'identify',cat:'Cryptographic Attacks',q:'What is a timing attack and how does it expose cryptographic implementations?',o:['An attack that waits for a maintenance window to attack systems','An attack that measures the time taken to perform cryptographic operations -- subtle differences in execution time can leak information about secret keys (e.g. a comparison that returns early when a mismatch is found leaks which byte differs)','An attack against network time synchronisation to disrupt authentication','An attack that exploits time zones in distributed authentication systems'],a:1,e:'<strong>Timing attacks: time leaks information</strong>. A classic example: a MAC comparison that short-circuits on the first mismatch byte takes less time than one that matches all bytes. By measuring response time, an attacker can determine one correct byte at a time. Fix: constant-time comparison functions for cryptographic values. Applies to: HMAC verification, RSA decryption, AES-CBC padding checks. Side-channel attacks (timing, power analysis, electromagnetic) exploit physical implementation, not mathematical weaknesses.'},
{type:'identify',cat:'Cryptographic Attacks',q:'What does "cryptographic agility" mean and why is it important?',o:['The ability to quickly rotate all user passwords','Designing systems to swap out cryptographic algorithms without major redesign -- important because algorithms become deprecated (MD5, SHA-1, DES, RC4) and systems must migrate to stronger alternatives without rebuilding from scratch','The speed at which a system can perform cryptographic operations','The ability of a cryptographic key to work with multiple cipher suites simultaneously'],a:1,e:'<strong>Crypto agility: plan for algorithm obsolescence</strong>. No algorithm lasts forever -- MD5 broken 2004, SHA-1 deprecated 2017, DES long broken. Systems without crypto agility are "hardcoded" to specific algorithms. Post-quantum threat: RSA and ECC will be broken by quantum computers. NIST is standardising post-quantum algorithms (CRYSTALS-Kyber, CRYSTALS-Dilithium). Organisations must be able to migrate. TLS is crypto-agile by design (negotiates cipher suite per session).'},

// ── WIRELESS SECURITY ─────────────────────────────────────────────────────
{type:'identify',cat:'Wireless Security',q:'What is the key security improvement WPA3 provides over WPA2?',o:['WPA3 uses AES-256 while WPA2 uses AES-128','WPA3 replaces PSK (Pre-Shared Key) with SAE (Simultaneous Authentication of Equals), eliminating offline dictionary attacks against captured handshakes','WPA3 uses a longer SSID for identification','WPA3 requires a RADIUS server while WPA2 works with pre-shared keys'],a:1,e:'<strong>SAE eliminates offline dictionary attacks</strong>. WPA2-PSK weakness: an attacker captures the 4-way handshake and can run offline dictionary attacks against it (hashcat, aircrack-ng). WPA3-SAE: a Diffie-Hellman-based handshake where both sides prove knowledge of the password without revealing it. Even if the handshake is captured, it cannot be brute-forced offline. WPA3 also provides forward secrecy -- each session is unique.'},
{type:'identify',cat:'Wireless Security',q:'What is an evil twin attack and how does it work?',o:['A malware variant that clones itself across network shares','An attacker sets up a rogue access point with the same SSID as a legitimate network -- devices connect automatically, and the attacker performs a man-in-the-middle attack on all traffic','A social engineering attack where an attacker impersonates a colleague','An attack that creates a duplicate user account with administrator privileges'],a:1,e:'<strong>Evil twin: rogue AP with same SSID</strong>. Attacker creates an AP with identical SSID (and often MAC address spoofed to match) to a legitimate network. Devices that auto-connect will join the attacker\'s AP instead. The attacker then: intercepts all traffic, captures credentials, serves phishing pages, or downgrades HTTPS to HTTP. Countermeasures: 802.1X authentication (client validates server certificate), certificate pinning in apps, VPN on untrusted networks, 802.11w management frame protection.'},
{type:'identify',cat:'Wireless Security',q:'What is a deauthentication (deauth) attack and what does 802.11w protect against?',o:['An attack that logs out all users from a web application simultaneously','An attacker sends spoofed deauthentication frames to disconnect legitimate clients from a Wi-Fi network -- used as a first step in evil twin attacks or for DoS. 802.11w (Management Frame Protection) cryptographically signs management frames to prevent forgery','A firewall bypass technique using deauthentication packets','An attack that exhausts DHCP leases by generating fake clients'],a:1,e:'<strong>Deauth frames are unauthenticated in 802.11 -- 802.11w fixes this</strong>. In 802.11 (without 802.11w), management frames (deauth, disassociate) are unauthenticated -- anyone can forge them. Attacker sends spoofed deauth frames from AP to client, disconnecting them. Often used before an evil twin attack. 802.11w (MFP -- Management Frame Protection) signs management frames with a MIC, preventing forgery. Required for WPA3, optional in WPA2.'},
{type:'identify',cat:'Wireless Security',q:'What is KRACK (Key Reinstallation Attack) and which Wi-Fi protocol does it affect?',o:['An attack that cracks WEP keys using captured IV packets','A 2017 attack against the WPA2 4-way handshake that forces nonce reuse by replaying handshake message 3 -- enabling decryption of traffic on vulnerable clients. Affects WPA2 across all platforms.','An attack that brute-forces WPA2 pre-shared keys','An attack specific to WPA3 SAE handshake implementation'],a:1,e:'<strong>KRACK forces nonce reuse in WPA2</strong>. The 4-way handshake installs the PTK (Pairwise Transient Key). By replaying handshake message 3, the attacker forces the client to reinstall the key with a reset nonce and replay counter. This breaks AES-CCMP\'s nonce uniqueness requirement, enabling packet decryption and replay. Patched via firmware/OS updates. Full mitigation: upgrade to WPA3 (SAE handshake not vulnerable). Highlights the importance of patching client devices, not just APs.'},
{type:'identify',cat:'Wireless Security',q:'What are the EAP authentication methods in order from strongest to weakest?',o:['PEAP > EAP-TTLS > EAP-TLS > LEAP','EAP-TLS > PEAP/EAP-TTLS > EAP-FAST > LEAP (deprecated/broken)','LEAP > PEAP > EAP-TTLS > EAP-TLS','They are all equivalent in security strength'],a:1,e:'<strong>EAP-TLS is strongest; LEAP is broken</strong>. EAP-TLS: mutual certificate authentication -- strongest but requires client PKI. PEAP/EAP-TTLS: server certificate only, password inside TLS tunnel -- common enterprise choice. EAP-FAST: Cisco proprietary, uses PAC instead of certificates. LEAP (Lightweight EAP): Cisco legacy, cracked by asleap tool -- never use. For Security+: EAP-TLS = most secure, requires mutual certificates. PEAP = server cert + credentials. LEAP = broken.'},
{type:'identify',cat:'Wireless Security',q:'What is the difference between WPA2-Personal and WPA2-Enterprise?',o:['WPA2-Personal uses stronger encryption than WPA2-Enterprise','WPA2-Personal uses a pre-shared key (PSK) shared by all users; WPA2-Enterprise uses 802.1X with a RADIUS server to authenticate each user individually with unique credentials','WPA2-Enterprise is only for large organisations and uses the same PSK as WPA2-Personal','WPA2-Personal provides more security because the key is longer'],a:1,e:'<strong>Personal = shared PSK; Enterprise = individual 802.1X credentials</strong>. WPA2-Personal: all users share one passphrase. Problems: anyone with the passphrase can connect, no per-user accountability, passphrase shared with contractors is hard to revoke. WPA2-Enterprise: each user authenticates individually (username/password or certificate via RADIUS). Per-user credentials can be revoked individually. Full audit trail. Required for compliance in regulated environments.'},
{type:'identify',cat:'Wireless Security',q:'What is the purpose of a wireless site survey and what security information does it reveal?',o:['A customer satisfaction survey about Wi-Fi quality','A systematic assessment of wireless signal coverage, interference sources, rogue access points, and channel overlap -- reveals unauthorised APs, weak signal areas requiring more APs, and optimal channel configuration','A scan for malware on wireless devices','A compliance audit of Wi-Fi password strength'],a:1,e:'<strong>Site survey finds rogue APs and coverage gaps</strong>. Active survey: walk the site with a laptop recording signal strength and AP details. Passive survey: capture all wireless frames. Security findings: rogue APs (employee-connected personal hotspots or attacker-planted APs), WEP/WPA-TKIP APs that should be upgraded, APs broadcasting SSIDs of neighbouring organisations (evil twin candidates), and signal leaking outside the building. Wireless IDS systems (WIDS) automate continuous rogue AP detection.'},
{type:'identify',cat:'Wireless Security',q:'What is WEP and why is it considered completely broken?',o:['WEP is secure -- it uses AES encryption','WEP (Wired Equivalent Privacy) uses RC4 with static 24-bit IVs that repeat quickly on busy networks -- captured IVs enable statistical attacks to recover the key in minutes. WEP should never be used.','WEP has a known vulnerability but is still acceptable for home networks','WEP was broken in 2020 and has not been patched since'],a:1,e:'<strong>WEP broken since 2001 -- never use</strong>. WEP flaws: RC4 stream cipher (weak), 24-bit IV too short (repeats after ~5000 packets on busy networks), IVs sent in plaintext, no integrity protection (CRC-32 is not cryptographic). Attacks: FMS attack, PTW attack -- capture ~40,000 packets and crack the key in seconds with aircrack-ng. WPA (TKIP) was the temporary fix; WPA2 (AES-CCMP) is the proper replacement; WPA3 is current standard.'},

// ── AUTHENTICATION PROTOCOLS ──────────────────────────────────────────────
{type:'identify',cat:'Authentication Protocols',q:'Describe the Kerberos authentication flow from initial login to service access.',o:['Client -> Service -> KDC -> Client -> Service','Client presents credentials to KDC AS -> receives TGT -> presents TGT to KDC TGS -> receives service ticket -> presents service ticket to target service','Client -> RADIUS server -> Active Directory -> Client -> Service','Client sends username/password directly to each service for authentication'],a:1,e:'<strong>Kerberos 3-step: AS -> TGS -> Service</strong>. (1) Client sends username to KDC Authentication Service (AS); AS validates and returns TGT encrypted with KDC key. (2) Client presents TGT to KDC Ticket Granting Service (TGS) and requests a service ticket for a specific service. (3) Client presents service ticket to the target service. Passwords never traverse the network. Service tickets are time-limited (default 10 hours). All parties have pre-shared keys with the KDC.'},
{type:'identify',cat:'Authentication Protocols',q:'What is Kerberoasting and why is it a significant Active Directory threat?',o:['A physical attack involving high temperatures near server hardware','An attack where any authenticated domain user requests service tickets for service accounts with SPNs, then cracks the ticket offline to recover the service account password','An attack that exploits Kerberos timestamp validation to bypass authentication','A denial of service attack against the Key Distribution Centre'],a:1,e:'<strong>Kerberoasting: any user can request service tickets</strong>. Any domain user can request a TGS ticket for any SPN (Service Principal Name). The TGS is encrypted with the service account\'s NTLM hash. The attacker takes the ticket offline and cracks it (hashcat). Service accounts often have: non-expiring passwords, weak passwords, high privileges. Mitigation: use long random passwords for service accounts (25+ chars), use Managed Service Accounts (MSAs) or Group Managed Service Accounts (gMSAs) which auto-rotate passwords.'},
{type:'identify',cat:'Authentication Protocols',q:'What is the key difference between RADIUS and TACACS+ for AAA?',o:['RADIUS uses TCP; TACACS+ uses UDP','RADIUS encrypts only the password field and uses UDP; TACACS+ encrypts the entire payload and uses TCP/49, making it better suited for device administration where full audit trails are needed','TACACS+ is an open standard; RADIUS is Cisco proprietary','They are functionally identical -- just different vendor implementations'],a:1,e:'<strong>RADIUS: UDP + password-only encryption. TACACS+: TCP + full encryption</strong>. RADIUS: UDP/1812-1813, encrypts only the password in the Access-Request. Good for: network access (VPN, Wi-Fi, dial-up). TACACS+: TCP/49, encrypts the entire payload, separates authentication/authorisation/accounting into distinct exchanges. Good for: router/switch/firewall administration where full command authorisation and detailed accounting is required. Cisco-proprietary but widely supported.'},
{type:'identify',cat:'Authentication Protocols',q:'What is 802.1X and what three components does it require?',o:['A wireless encryption standard requiring only an AP and a client','A port-based Network Access Control standard requiring: a supplicant (client device), an authenticator (switch or AP that enforces access), and an authentication server (RADIUS) -- the authenticator blocks all traffic until the supplicant authenticates successfully','A RADIUS protocol extension for wireless authentication only','A VPN standard for remote access authentication'],a:1,e:'<strong>802.1X: supplicant + authenticator + auth server</strong>. Supplicant: client device running 802.1X software (built into Windows, macOS, mobile OS). Authenticator: the switch port or AP -- passes EAP frames between supplicant and auth server, blocks non-EAP traffic until authentication succeeds. Authentication server: RADIUS server validates credentials and tells the authenticator to open or block the port. Used for: wired NAC (switches), wireless enterprise (Wi-Fi), VPN gateway access.'},
{type:'identify',cat:'Authentication Protocols',q:'What is CHAP (Challenge Handshake Authentication Protocol) and what security advantage does it have over PAP?',o:['CHAP and PAP are identical -- different names for the same protocol','PAP sends the password in plaintext; CHAP uses a challenge-response mechanism where the server sends a random challenge, the client responds with a hash of the challenge + password, so the password is never transmitted','CHAP is less secure than PAP because it requires more round trips','PAP uses encryption; CHAP uses plaintext'],a:1,e:'<strong>CHAP never sends the password</strong>. PAP: client sends username + plaintext password -- trivially intercepted. CHAP: (1) server sends random challenge. (2) Client computes MD5(challenge + password + ID). (3) Server computes the same and compares. Password never crosses the network. MS-CHAPv2 is the Microsoft version used inside PEAP tunnels. CHAP is still vulnerable to offline dictionary attacks if the hash is captured -- the protection is that it\'s inside an encrypted tunnel (PEAP/TTLS).'},
{type:'identify',cat:'Authentication Protocols',q:'What is the purpose of LDAP and LDAPS in authentication systems?',o:['LDAP is an authentication protocol that replaces Kerberos','LDAP (Lightweight Directory Access Protocol) is used to query directory services like Active Directory for user attributes and group membership. LDAPS is LDAP over TLS (port 636) -- applications should always use LDAPS to prevent credential interception','LDAP is only used for password resets, not authentication','LDAPS is deprecated -- standard LDAP on port 389 is the current standard'],a:1,e:'<strong>LDAP queries the directory; LDAPS encrypts it</strong>. Applications use LDAP to: verify username/password (LDAP bind), look up group membership for authorisation, retrieve user attributes (email, department, phone). Without LDAPS: LDAP bind sends credentials in plaintext -- easily captured with Wireshark. LDAPS (port 636) or LDAP with STARTTLS (port 389) encrypts the connection. Microsoft deprecated non-SSL LDAP binding in 2020 (LDAP Channel Binding). Always configure applications to use LDAPS.'},
{type:'identify',cat:'Authentication Protocols',q:'What is a Silver Ticket attack in Kerberos and how does it differ from a Golden Ticket?',o:['They are the same attack with different names','A Silver Ticket forges a service ticket for a specific service using the service account\'s NTLM hash -- it bypasses the KDC entirely. A Golden Ticket forges a TGT using the krbtgt hash and provides access to all services. Silver Ticket is more targeted; Golden Ticket is domain-wide.','A Silver Ticket requires domain admin; a Golden Ticket does not','A Golden Ticket targets individual services; a Silver Ticket provides domain-wide access'],a:1,e:'<strong>Silver = one service, no KDC contact. Golden = all services.</strong> Silver Ticket: attacker needs the service account NTLM hash (not domain admin required). Forges a valid TGS for that specific service. The service never contacts the KDC to validate -- it just checks the ticket\'s encryption. Harder to detect because KDC logs show nothing. Golden Ticket: requires krbtgt hash (domain admin). Can impersonate any user for any service. Both persist even after password resets (except rotating krbtgt twice for Golden).'},
{type:'identify',cat:'Authentication Protocols',q:'What is the purpose of OCSP stapling in certificate validation?',o:['Stapling digital signatures to email attachments for integrity','The web server fetches and caches a signed OCSP response from the CA, then "staples" it to the TLS handshake -- eliminates client-side OCSP lookups, improving performance and privacy while ensuring certificate revocation status is checked','A method for embedding certificates inside executable files','A technique for compressing certificates to reduce TLS handshake size'],a:1,e:'<strong>OCSP stapling: server pre-fetches revocation status</strong>. Without stapling: every client that connects must query the CA\'s OCSP responder to check if the cert is revoked -- slow, reveals browsing habits to CA. With stapling: the server periodically fetches a signed OCSP response (valid for hours), caches it, and includes it in the TLS handshake. Clients get revocation proof without a separate request. Must-Staple (X.509 extension) makes stapling mandatory for a certificate -- failing to staple causes browsers to reject the cert.'},

// ── SCENARIOS ─────────────────────────────────────────────────────────────
{type:'scenario',cat:'Scenario',scenario:'A security analyst captures Wi-Fi traffic at a coffee shop and notices that a laptop is performing a 4-way handshake with an access point named "CoffeeShop_Free". The analyst knows the real coffee shop AP has the same SSID but a different BSSID.',q:'What attack is most likely occurring and what is the user at risk of?',o:['A KRACK attack against the coffee shop AP','An evil twin attack -- the different BSSID indicates a rogue AP is impersonating the legitimate one. The user\'s traffic will be intercepted by the attacker performing MITM.','A deauthentication DoS attack','A WPS brute force attack against the coffee shop router'],a:1,e:'<strong>Evil twin identified by BSSID mismatch</strong>. The SSID (network name) can be duplicated by anyone. The BSSID (MAC address of the AP) is harder to spoof. A different BSSID with the same SSID is a strong indicator of an evil twin. The user\'s traffic flows through the attacker\'s AP. Mitigation: use a VPN on public Wi-Fi, validate certificate warnings, use WPA3 (harder to impersonate), enable 802.11w (prevents deauth forcing client to rogue AP).'},
{type:'scenario',cat:'Scenario',scenario:'An organisation\'s Wi-Fi uses WPA2-Personal with a passphrase shared with all employees and contractors. A contractor leaves but the passphrase is not changed.',q:'What is the PRIMARY ongoing security risk and what is the BEST long-term solution?',o:['No risk -- the contractor no longer has a device on site','The ex-contractor can still connect to Wi-Fi and access network resources if they are within range. Long-term solution: migrate to WPA2/WPA3-Enterprise with 802.1X so each user has individual credentials that can be revoked.','Change the passphrase after every contractor departure','Block the contractor\'s MAC address in the AP configuration'],a:1,e:'<strong>Shared PSK cannot be selectively revoked</strong>. Changing the passphrase requires reconfiguring every device -- operational burden. MAC blocking is trivially bypassed by spoofing a legitimate MAC. 802.1X Enterprise is the proper fix: each user authenticates with individual credentials (certificate or username/password against RADIUS/Active Directory). When a contractor leaves, their account is disabled in AD -- immediately revoked, no passphrase change required. Also provides a per-user audit trail.'},
{type:'scenario',cat:'Scenario',scenario:'A penetration tester captures the WPA2 4-way handshake of a corporate Wi-Fi network. They run a dictionary attack and crack the PSK in 4 hours because it was an English dictionary word.',q:'What cryptographic property does this failure demonstrate and what is the correct control?',o:['The WPA2 algorithm itself is broken and should be replaced immediately','Insufficient key entropy -- a dictionary word PSK provides low resistance to offline dictionary attack. WPA2-PSK should use a long random passphrase (20+ characters) or the network should migrate to WPA3-SAE (which prevents offline cracking entirely) or 802.1X Enterprise.','This is acceptable risk -- 4 hours is a long time for an attacker','The WPA2 handshake should not be transmittable over the air'],a:1,e:'<strong>Low entropy PSK + offline cracking = failure</strong>. The 4-way handshake can always be captured by a passive observer. The security relies entirely on PSK entropy. A dictionary word PSK is broken in seconds to hours. A 20+ random character passphrase takes centuries to brute-force. But WPA3-SAE is fundamentally better -- even with a weak password, SAE does not allow offline cracking because it requires interaction with the AP for each guess. For enterprises: 802.1X with certificates eliminates passwords entirely.'},
{type:'scenario',cat:'Scenario',scenario:'A network engineer discovers that an application is authenticating users to LDAP on port 389 without STARTTLS. Wireshark confirms that bind credentials are transmitted in plaintext.',q:'What is the risk and the remediation?',o:['No risk -- LDAP port 389 is internal only and cannot be intercepted','Any attacker with access to the network path (including a compromised internal host) can capture service account credentials in plaintext. Remediate by configuring the application to use LDAPS (port 636) or LDAP with STARTTLS, and by enforcing LDAP Channel Binding on Active Directory.','Switch to RADIUS instead of LDAP','Restrict LDAP to the VLAN where the application resides'],a:1,e:'<strong>Plaintext LDAP credentials interceptable by internal attackers</strong>. LDAP bind sends the service account username and password in cleartext. Any host on the same network segment (post-lateral movement by an attacker) can capture it with Wireshark. Service accounts often have privileged access. LDAPS (TLS-wrapped LDAP on port 636) encrypts the entire session. LDAP with STARTTLS upgrades port 389 to TLS mid-session. Microsoft\'s LDAP hardening (March 2020) began requiring Channel Binding -- a MitM protection layer on top of TLS.'},
{type:'scenario',cat:'Scenario',scenario:'During a red team exercise, the attacker compromises a low-privilege workstation and uses Mimikatz to extract Kerberos service tickets from memory. They then take those tickets offline and use hashcat to crack them, recovering the passwords of several service accounts.',q:'What Kerberos attack is described and what are the correct mitigations?',o:['Golden Ticket attack -- mitigated by rotating the krbtgt account password','Kerberoasting -- mitigated by using Managed Service Accounts (MSAs/gMSAs) which have automatically-rotated 120-character random passwords, and monitoring for unusual TGS requests for service accounts','Pass-the-Hash attack -- mitigated by enabling Credential Guard','Silver Ticket attack -- mitigated by disabling Kerberos on service accounts'],a:1,e:'<strong>Kerberoasting mitigated by MSAs and long random passwords</strong>. Kerberoasting: request TGS tickets for SPNs (available to any domain user), extract from memory or network, crack offline. Any domain user can do this without admin rights. Mitigations: (1) gMSAs: 120-character random passwords auto-rotated by AD -- impossible to crack. (2) AES-only service tickets: RC4 tickets crack faster; force AES encryption. (3) Monitoring: alert on LDAP queries for all accounts with SPNs, alert on unusual TGS requests. (4) Short SPN password length review: identify weak service account passwords.'},
];

var questions=[], qi=0, correct=0, wrong=0;
var catStats={};
for(var i=0;i<CATS.length;i++) catStats[CATS[i]]={c:0,t:0};

function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}
function buildQuestions(){
  var pool=shuffle(Q_BANK.slice()); var result=[];
  for(var k=0;k<pool.length;k++){
    var q=pool[k]; var idxs=[]; for(var m=0;m<q.o.length;m++) idxs.push(m);
    var shuf=shuffle(idxs); var nq={}; for(var p in q) nq[p]=q[p];
    nq.o=[]; for(var n=0;n<shuf.length;n++) nq.o.push(q.o[shuf[n]]);
    nq.a=shuf.indexOf(q.a); result.push(nq);
  }
  return result;
}
function updateStats(){
  var total=correct+wrong;
  document.getElementById('s-prog').textContent=qi+'/'+questions.length;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-acc').textContent=total?Math.round(correct/total*100)+'%':'--';
  document.getElementById('prog-fill').style.width=Math.round(qi/questions.length*100)+'%';
}
function renderQ(){
  if(qi>=questions.length){showResults();return;}
  var q=questions[qi]; var letters=['A','B','C','D'];
  var badgeCls=BADGE_MAP[q.cat]||'badge-keymgmt';
  var scenHTML='';
  if(q.type==='scenario'&&q.scenario) scenHTML='<div class="scenario-box"><div class="scenario-lbl">Scenario</div><div class="scenario-text">'+q.scenario+'</div></div>';
  var optsHTML='';
  for(var i=0;i<q.o.length;i++) optsHTML+='<button class="opt" id="opt-'+i+'"><span class="opt-letter">'+letters[i]+'</span><span class="opt-text">'+q.o[i]+'</span></button>';
  document.getElementById('q-area').innerHTML='<div class="q-card"><div class="q-meta"><span class="q-badge '+badgeCls+'">'+q.cat+'</span><span class="q-num">Q'+(qi+1)+' of '+questions.length+'</span></div>'+scenHTML+'<div class="q-text">'+q.q+'</div><div class="opts" id="opts">'+optsHTML+'</div><div class="explanation" id="explanation"><div class="exp-lbl">Explanation</div><div class="exp-text" id="exp-text"></div></div><button class="btn-next" id="btn-next">'+(qi===questions.length-1?'See results':'Next')+'</button></div>';
  for(var _j=0;_j<q.o.length;_j++){(function(_idx){var _b=document.getElementById('opt-'+_idx);if(_b)_b.onclick=function(){answer(_idx);};}(_j));}
  var nb=document.getElementById('btn-next'); if(nb) nb.onclick=function(){nextQ();};
}
function answer(idx){
  var q=questions[qi]; var isCorrect=idx===q.a;
  if(isCorrect){correct++;if(catStats[q.cat])catStats[q.cat].c++;}else{wrong++;}
  if(!catStats[q.cat])catStats[q.cat]={c:0,t:0}; catStats[q.cat].t++;
  qi++; updateStats();
  for(var i=0;i<q.o.length;i++){var b=document.getElementById('opt-'+i);if(b)b.disabled=true;}
  var cb=document.getElementById('opt-'+idx); var rb=document.getElementById('opt-'+q.a);
  if(isCorrect){if(cb)cb.classList.add('correct');}else{if(cb)cb.classList.add('wrong');if(rb)rb.classList.add('reveal');}
  var et=document.getElementById('exp-text'); var eb=document.getElementById('explanation'); var nb=document.getElementById('btn-next');
  if(et)et.innerHTML=q.e; if(eb)eb.classList.add('show');
  if(nb){nb.style.display='block';nb.onclick=function(){nextQ();};}
  if(qi>0&&qi%20===0) logToDashboard(1,'Cryptography & Wireless Security Trainer',Math.round(correct/qi*100));
}
function nextQ(){renderQ();}
function showResults(){
  document.getElementById('q-area').style.display='none';
  var res=document.getElementById('results-area'); res.style.display='block';
  var pct=Math.round(correct/questions.length*100);
  logToDashboard(1,'Cryptography & Wireless Security Trainer',pct);
  var passed=pct>=80; var ringColor=passed?'#00ff88':'#ff3d5a';
  var msg=pct>=90?'Crypto mastered!':pct>=80?'Solid -- above pass threshold.':pct>=65?'Getting there.':'More practice needed.';
  var circ=339.3,offset=circ-(pct/100)*circ;
  var bdHTML='';
  for(var ci=0;ci<CATS.length;ci++){
    var c=CATS[ci];var s=catStats[c];var p=s.t?Math.round(s.c/s.t*100):0;var col=CAT_COLORS[c]||'var(--gold)';
    bdHTML+='<div class="bd-card"><div class="bd-title" style="color:'+col+'">'+c+'</div><div class="bd-bar-bg"><div class="bd-bar-fill" style="width:0%;background:'+col+'" data-pct="'+p+'"></div></div><div class="bd-score" style="color:'+col+'">'+p+'%</div><div class="bd-detail">'+s.c+'/'+s.t+' correct</div></div>';
  }
  res.innerHTML='<div class="results-wrap"><div class="results-ring"><svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="54" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/><circle cx="70" cy="70" r="54" fill="none" stroke="'+ringColor+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" id="ring-anim"/></svg><div class="ring-score"><div class="ring-pct" style="color:'+ringColor+'">'+pct+'%</div><div class="ring-lbl">score</div></div></div><div class="results-verdict" style="color:'+ringColor+'">'+(passed?'Passed':'Keep Studying')+'</div><div class="results-sub">'+correct+'/'+questions.length+' correct -- '+msg+'</div><div class="breakdown">'+bdHTML+'</div><button class="btn-retake" onclick="retake()">Retake Quiz</button></div>';
  setTimeout(function(){
    var ring=document.getElementById('ring-anim');
    if(ring){ring.style.transition='stroke-dashoffset 1.5s ease';ring.style.strokeDashoffset=offset;}
    var fills=document.querySelectorAll('.bd-bar-fill');
    for(var i=0;i<fills.length;i++){fills[i].style.transition='width 1s ease';fills[i].style.width=fills[i].getAttribute('data-pct')+'%';}
  },100);
}
function retake(){
  document.getElementById('q-area').style.display='block';
  document.getElementById('results-area').style.display='none';
  questions=buildQuestions();qi=0;correct=0;wrong=0;
  for(var i=0;i<CATS.length;i++) catStats[CATS[i]]={c:0,t:0};
  updateStats();renderQ();
}
function setTab(t){
  if(t==='ref'){
    document.getElementById('view-quiz').style.display='none';document.getElementById('view-ref').style.display='block';
    document.getElementById('tab-quiz').classList.remove('active');document.getElementById('tab-ref').classList.add('active');buildRef();
  } else {
    document.getElementById('view-ref').style.display='none';document.getElementById('view-quiz').style.display='block';
    document.getElementById('tab-quiz').classList.add('active');document.getElementById('tab-ref').classList.remove('active');
  }
}
function buildRef(){
  var chart=document.getElementById('acc-chart'); chart.innerHTML='';
  for(var ci=0;ci<CATS.length;ci++){
    var c=CATS[ci];var s=catStats[c]||{c:0,t:0};var pct=s.t?Math.round(s.c/s.t*100):0;var col=CAT_COLORS[c]||'var(--gold)';
    chart.innerHTML+='<div style="display:grid;grid-template-columns:200px 1fr 42px;gap:10px;align-items:center;margin-bottom:10px"><div style="font-size:12px;color:var(--text2);text-align:right">'+c+'</div><div style="height:16px;background:var(--panel2);border-radius:8px;overflow:hidden"><div style="height:100%;width:'+(s.t?pct:0)+'%;background:'+col+';border-radius:8px"></div></div><div style="font-family:var(--mono);font-size:11px;color:var(--text2)">'+(s.t?pct+'%':'--')+'</div></div>';
  }
  var cards=document.getElementById('ref-cards'); cards.innerHTML='';
  for(var ti=0;ti<TERMS.length;ti++){
    var t=TERMS[ti];
    cards.innerHTML+='<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px"><div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px">'+t.name+'</div><div style="font-size:12px;color:var(--text2);line-height:1.6">'+t.def+'</div><div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:8px;border-top:1px solid var(--border);padding-top:6px">'+t.key+'</div></div>';
  }
}
questions=buildQuestions();updateStats();renderQ();
</script>
</body>
</html>
