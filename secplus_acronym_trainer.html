<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security+ Acronym Trainer — Full SY0-701</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14; --surface: #161a23; --surface2: #1e2330;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0; --text2: #8a90a2; --text3: #555c70;
    --accent: #4f9eff; --accent-dim: rgba(79,158,255,0.12);
    --green: #3dd68c; --green-dim: rgba(61,214,140,0.12);
    --red: #ff5f6d; --red-dim: rgba(255,95,109,0.12);
    --amber: #ffb547; --amber-dim: rgba(255,181,71,0.12);
    --purple: #a78bfa; --purple-dim: rgba(167,139,250,0.12);
    --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px 48px; }
  .container { max-width: 580px; margin: 0 auto; }
  header { margin-bottom: 28px; padding-top: 8px; }
  .logo { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 600; line-height: 1.2; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 13px; color: var(--text2); margin-top: 5px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 3px; font-family: var(--mono); }
  .stat-value { font-size: 22px; font-weight: 600; font-family: var(--mono); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.amber { color: var(--amber); }
  .stat-value.purple { color: var(--purple); }

  .progress-bar { height: 3px; background: var(--border); border-radius: 99px; margin-bottom: 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; width: 0%; }

  .cat-section { margin-bottom: 16px; }
  .cat-section-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .categories { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-btn { padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-size: 12px; font-family: var(--mono); transition: all 0.15s; }
  .cat-btn:hover { background: var(--surface2); color: var(--text); }
  .cat-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px 22px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(79,158,255,0.25), transparent); }
  .q-domain { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .q-acronym { font-family: var(--mono); font-size: 44px; font-weight: 700; letter-spacing: 0.05em; line-height: 1; margin-bottom: 8px; }
  .q-hint { font-size: 13px; color: var(--text3); }

  .answers { margin-bottom: 14px; }
  .ans-btn { width: 100%; text-align: left; padding: 12px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 13px; font-family: var(--sans); transition: all 0.15s; margin-bottom: 7px; line-height: 1.4; }
  .ans-btn:hover:not(:disabled) { border-color: var(--border2); color: var(--text); background: #252b3a; }
  .ans-btn.correct { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .ans-btn.wrong { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .ans-btn:disabled { cursor: default; }

  .explanation { display: none; background: var(--surface2); border: 1px solid var(--border2); border-left: 3px solid var(--amber); border-radius: 10px; padding: 13px 15px; font-size: 13px; line-height: 1.65; color: var(--text2); margin-bottom: 14px; }
  .exp-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 5px; }

  .actions { display: flex; gap: 8px; }
  .btn-next { flex: 1; padding: 12px; border-radius: 9px; border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; display: none; }
  .btn-next:hover { background: rgba(79,158,255,0.2); }
  .btn-ask { flex: 1; padding: 12px; border-radius: 9px; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; display: none; }
  .btn-ask:hover { background: var(--surface2); color: var(--text); }

  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border2); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-left: 7px; vertical-align: middle; }
  .badge-review { background: var(--amber-dim); color: var(--amber); }
  .badge-new { background: var(--purple-dim); color: var(--purple); }

  .counter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .pool-count { font-family: var(--mono); font-size: 11px; color: var(--text3); }

  footer { margin-top: 36px; text-align: center; font-size: 11px; color: var(--text3); font-family: var(--mono); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">CompTIA Security+ · SY0-701</div>
    <h1>Acronym <span>Trainer</span></h1>
    <p class="subtitle">Full exam acronym bank — 160+ terms across all domains</p>
  </header>

    <div class="stat"><div class="stat-label">Accuracy</div><div class="stat-value purple" id="s-acc">—</div></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="cat-section">
    <div class="cat-section-label">Filter by category</div>
    <div class="categories">
      <button class="cat-btn active" onclick="setCategory('all',this)">All (160+)</button>
      <button class="cat-btn" onclick="setCategory('auth',this)">Auth & Identity</button>
      <button class="cat-btn" onclick="setCategory('crypto',this)">Cryptography</button>
      <button class="cat-btn" onclick="setCategory('network',this)">Network & Protocols</button>
      <button class="cat-btn" onclick="setCategory('attacks',this)">Attacks & Threats</button>
      <button class="cat-btn" onclick="setCategory('tools',this)">Tools & Tech</button>
      <button class="cat-btn" onclick="setCategory('cloud',this)">Cloud & Virt</button>
      <button class="cat-btn" onclick="setCategory('gov',this)">Governance & Risk</button>
      <button class="cat-btn" onclick="setCategory('ops',this)">SecOps & IR</button>
      <button class="cat-btn" onclick="setCategory('weak',this)" id="weak-cat-btn">⚠ My Weak Spots</button>
    </div>
  </div>

  <div class="counter-bar">
    <span class="pool-count" id="pool-count">160 acronyms in pool</span>
    <button id="clear-weak-btn" onclick="clearWeak()" style="display:none;background:transparent;border:1px solid var(--red);border-radius:5px;color:var(--red);font-family:var(--mono);font-size:10px;padding:3px 10px;cursor:pointer">Clear weak list</button>
  </div>

  <div class="card">
    <div class="q-domain" id="q-domain">—</div>
    <div class="q-acronym" id="q-acronym">—</div>
    <div class="q-hint" id="q-hint"></div>
  </div>

  <div class="answers" id="answers"></div>

  <div class="explanation" id="explanation">
    <div class="exp-label">Why it matters</div>
    <div id="exp-text"></div>
  </div>

  <div class="actions">
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next →</button>
    <button class="btn-ask" id="btn-ask" onclick="askClaude()">Ask Claude ↗</button>
  </div>

  <footer>built for your security+ journey · exam june 23</footer>

</div>

  try{
    const s=JSON.parse(localStorage.getItem('sp_sessions')||'[]');
    const now=new Date();
    s.push({domain,type,score,date:now.toLocaleDateString('en-CA',{month:'short',day:'numeric'}),ts:now.getTime()});
    localStorage.setItem('sp_sessions',JSON.stringify(s));
  }catch(e){}
}

let category = 'all';
let current = null;
let answered = false;
let stats = { correct: 0, wrong: 0, streak: 0, total: 0 };
let weakList = [];

// Persist weak list across sessions
function saveWeak() { try { localStorage.setItem('sp_weak_acronyms', JSON.stringify(weakList)); } catch(e) {} }
function loadWeak() { try { const v = localStorage.getItem('sp_weak_acronyms'); return v ? JSON.parse(v) : []; } catch(e) { return []; } }
weakList = loadWeak();

const catNames = {
  auth:'Auth & Identity', crypto:'Cryptography', network:'Network & Protocols',
  attacks:'Attacks & Threats', tools:'Tools & Tech', cloud:'Cloud & Virt',
  gov:'Governance & Risk', ops:'SecOps & IR'
};

function setCategory(cat, btn) {
  category = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePoolCount();
  nextQuestion();
}

function pool() {
  if (category === 'weak') {
    return weakList.length ? ACRONYMS.filter(x => weakList.includes(x.a)) : ACRONYMS;
  }
  const base = category === 'all' ? ACRONYMS : ACRONYMS.filter(x => x.c === category);
  if (weakList.length && Math.random() < 0.4) {
    const weak = base.filter(x => weakList.includes(x.a));
    if (weak.length) return weak;
  }
  return base;
}

function updatePoolCount() {
  const p = category === 'weak'
    ? weakList.length
    : category === 'all' ? ACRONYMS.length : ACRONYMS.filter(x => x.c === category).length;
  const weakCount = weakList.length;
  document.getElementById('pool-count').textContent = p + ' acronym' + (p !== 1 ? 's' : '') + ' in pool';
  const clearBtn = document.getElementById('clear-weak-btn');
  if (clearBtn) clearBtn.style.display = weakCount > 0 ? 'inline-block' : 'none';
  // Update weak category button label
  const weakBtn = document.getElementById('weak-cat-btn');
  if (weakBtn) weakBtn.textContent = '⚠ Weak Spots' + (weakCount > 0 ? ' (' + weakCount + ')' : '');
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function nextQuestion() {
  answered = false;
  document.getElementById('explanation').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-ask').style.display = 'none';

  const p = pool();
  if (!p.length) {
    document.getElementById('q-acronym').textContent = '—';
    document.getElementById('q-hint').textContent = 'No acronyms in this category yet. Try another!';
    document.getElementById('answers').innerHTML = '';
    return;
  }
  current = p[Math.floor(Math.random() * p.length)];

  const isWeak = weakList.includes(current.a);
  document.getElementById('q-domain').innerHTML =
    (catNames[current.c] || current.c) +
    (isWeak ? '<span class="badge badge-review">review</span>' : '');
  document.getElementById('q-acronym').textContent = current.a;
  document.getElementById('q-hint').textContent = current.h;

  const opts = shuffle([current.f, ...current.w.slice(0, 3)]);
  const area = document.getElementById('answers');
  area.innerHTML = '';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = o;
    btn.onclick = () => check(o, btn);
    area.appendChild(btn);
  });
}

function check(selected, btn) {
  if (answered) return;
  answered = true;
  stats.total++;

  const correct = selected === current.f;
  if (correct) {
    btn.classList.add('correct');
    stats.correct++;
    stats.streak++;
    weakList = weakList.filter(a => a !== current.a);
    saveWeak();
  } else {
    btn.classList.add('wrong');
    stats.wrong++;
    stats.streak = 0;
    if (!weakList.includes(current.a)) weakList.push(current.a);
    saveWeak();
    document.querySelectorAll('.ans-btn').forEach(b => { if (b.textContent === current.f) b.classList.add('correct'); });
  }

  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
  document.getElementById('s-correct').textContent = stats.correct;
  document.getElementById('s-wrong').textContent = stats.wrong;
  document.getElementById('s-streak').textContent = stats.streak;
  const acc = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) + '%' : '—';
  document.getElementById('s-acc').textContent = acc;

  const pct = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';
  if(stats.total > 0 && stats.total % 10 === 0) logToDashboard(0,'Acronym Trainer',pct);

  if (!correct) {
    document.getElementById('exp-text').innerHTML = '<span class="spinner"></span> Loading explanation...';
    document.getElementById('explanation').style.display = 'block';
    fetchExplanation();
  }

  document.getElementById('btn-next').style.display = 'block';
  document.getElementById('btn-ask').style.display = 'block';

  updatePoolCount();
}

async function fetchExplanation() {
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: `You are a Security+ SY0-701 exam tutor. In 2 plain-English sentences, explain what "${current.a}" (${current.f}) actually does and why a student should remember it for the exam. Be concrete and memorable. No markdown, no preamble.` }]
      })
    });
    const data = await res.json();
    document.getElementById('exp-text').textContent = data.content.map(i => i.text || '').join('');
  } catch(e) {
    document.getElementById('exp-text').textContent = `${current.a} = ${current.f}. ${current.h}.`;
  }
}

function askClaude() {
  const q = encodeURIComponent(`Can you explain ${current.a} (${current.f}) in more depth and give me a memory trick to remember it for the Security+ exam?`);
  window.open(`https://claude.ai/new?q=${q}`, '_blank');
}

function clearWeak() {
  if (!confirm('Clear your weak spots list? This cannot be undone.')) return;
  weakList = [];
  saveWeak();
  updatePoolCount();
  if (category === 'weak') nextQuestion();
}

updatePoolCount();
nextQuestion();
</script>
