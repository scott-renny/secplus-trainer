<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threats &amp; Vulnerabilities Trainer -- Security+</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080c;--panel:#0e1018;--panel2:#141720;--panel3:#1a1e29;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.18);
  --text:#e4e8f5;--text2:#6b7494;--text3:#3a4060;
  --accent:#00e5ff;--green:#00ff88;--red:#ff3d5a;--amber:#ffcc00;--purple:#bf87ff;
  --mono:'Courier New',monospace;
}
*{font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 0%,rgba(0,229,255,0.03) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(191,135,255,0.03) 0%,transparent 60%);pointer-events:none}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 20px 80px}

/* HEADER */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--accent)}
h1{font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:8px}
h1 em{font-style:normal;color:var(--accent)}
.subtitle{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}

/* TABS */
.tabs{display:flex;gap:5px;margin-bottom:20px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px}
.tab{flex:1;padding:10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:8px;transition:all .2s}
.tab.active{background:var(--panel3);color:var(--accent);border:1px solid rgba(0,229,255,0.2)}
.tab:not(.active):hover{color:var(--text2)}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.sb{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sb.s-prog::before{background:var(--accent)}
.sb.s-correct::before{background:var(--green)}
.sb.s-wrong::before{background:var(--red)}
.sb.s-acc::before{background:var(--amber)}
.sb-val{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1}
.sb.s-correct .sb-val{color:var(--green)}
.sb.s-wrong .sb-val{color:var(--red)}
.sb.s-acc .sb-val{color:var(--amber)}
.sb-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-top:4px}

/* PROGRESS */
.prog-wrap{height:3px;background:rgba(255,255,255,0.06);border-radius:99px;margin-bottom:20px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}

/* QUESTION CARD */
.q-card{background:var(--panel);border:1px solid var(--border2);border-radius:20px;padding:28px 28px;margin-bottom:14px;position:relative;overflow:hidden}
.q-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3}
.q-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.q-badge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:5px}
.badge-vuln{background:rgba(255,61,90,0.1);color:var(--red);border:1px solid rgba(255,61,90,0.2)}
.badge-threat{background:rgba(255,204,0,0.1);color:var(--amber);border:1px solid rgba(255,204,0,0.2)}
.badge-attack{background:rgba(191,135,255,0.1);color:var(--purple);border:1px solid rgba(191,135,255,0.2)}
.badge-ioc{background:rgba(0,229,255,0.1);color:var(--accent);border:1px solid rgba(0,229,255,0.2)}
.badge-mitigation{background:rgba(0,255,136,0.1);color:var(--green);border:1px solid rgba(0,255,136,0.2)}
.badge-scenario{background:rgba(255,204,0,0.1);color:var(--amber);border:1px solid rgba(255,204,0,0.2)}
.q-num{font-family:var(--mono);font-size:10px;color:var(--text3)}
.scenario-box{background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--amber);border-radius:10px;padding:13px 16px;margin-bottom:16px}
.scenario-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.scenario-text{font-size:13px;color:var(--text2);line-height:1.7;font-family:var(--mono)}
.q-text{font-size:15px;font-weight:500;line-height:1.65;color:var(--text);margin-bottom:18px}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--panel2);cursor:pointer;text-align:left;width:100%;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--border3);background:var(--panel3)}
.opt-letter{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2);min-width:18px;margin-top:1px;flex-shrink:0}
.opt-text{font-size:14px;color:var(--text);line-height:1.5}
.opt.correct{border-color:var(--green)!important;background:rgba(0,255,136,0.07)!important}
.opt.correct .opt-letter,.opt.correct .opt-text{color:var(--green)!important}
.opt.wrong{border-color:var(--red)!important;background:rgba(255,61,90,0.07)!important}
.opt.wrong .opt-letter,.opt.wrong .opt-text{color:var(--red)!important}
.opt.reveal{border-color:rgba(0,255,136,0.3)!important;background:rgba(0,255,136,0.04)!important}
.opt.reveal .opt-letter,.opt.reveal .opt-text{color:var(--green)!important;opacity:.6}
.opt:disabled{cursor:default}

/* EXPLANATION */
.explanation{display:none;background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:10px;padding:13px 16px;margin-bottom:12px}
.explanation.show{display:block}
.exp-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.exp-text{font-size:13px;color:var(--text2);line-height:1.7}
.exp-text strong{color:var(--text);font-weight:600}

/* NEXT */
.btn-next{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:none;transition:all .15s}
.btn-next:hover{border-color:var(--accent);color:var(--accent)}

/* RESULTS */
.results-wrap{text-align:center;padding:32px 0 20px}
.results-ring{width:140px;height:140px;margin:0 auto 20px;position:relative}
.results-ring svg{transform:rotate(-90deg)}
.ring-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-pct{font-family:var(--mono);font-size:32px;font-weight:600;color:var(--text)}
.ring-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.results-verdict{font-size:22px;font-weight:700;margin-bottom:6px}
.results-sub{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px;text-align:left}
.bd-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.bd-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.bd-bar-bg{height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bd-bar-fill{height:100%;border-radius:99px;transition:width 1s ease}
.bd-score{font-family:var(--mono);font-size:22px;font-weight:600}
.bd-detail{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px}
.btn-retake{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:12px 36px;background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:10px;cursor:pointer;transition:all .2s;margin-right:10px}
.btn-retake:hover{border-color:var(--accent);color:var(--accent)}

/* REFERENCE */
.ref-section-title{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ref-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;transition:border-color .15s}
.ref-card:hover{border-color:var(--border3)}
.ref-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.ref-def{font-size:12px;color:var(--text2);line-height:1.6}
.ref-tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;margin-top:8px}
.tag-red{background:rgba(255,61,90,0.1);color:var(--red)}
.tag-amber{background:rgba(255,204,0,0.1);color:var(--amber)}
.tag-purple{background:rgba(191,135,255,0.1);color:var(--purple)}
.tag-teal{background:rgba(0,229,255,0.1);color:var(--accent)}
.tag-green{background:rgba(0,255,136,0.1);color:var(--green)}
.ref-key{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:8px;border-top:1px solid var(--border);padding-top:6px}
.acc-row{display:grid;grid-template-columns:185px 1fr 42px;gap:10px;align-items:center;margin-bottom:10px}
.acc-lbl{font-size:13px;color:var(--text2);text-align:right}
.acc-bg{height:18px;background:var(--panel2);border-radius:8px;overflow:hidden}
.acc-fill{height:100%;border-radius:8px;transition:width .8s ease}
.acc-pct{font-family:var(--mono);font-size:11px;color:var(--text2);font-weight:500}

@media(max-width:500px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .breakdown{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">CompTIA Security+ &middot; SY0-701 &middot; Domain 2</div>
  <h1>Threats &amp; <em>Vulnerabilities</em></h1>
  <p class="subtitle">66 questions &middot; injection attacks &middot; network attacks &middot; credential attacks &middot; threat actors &middot; scenarios</p>

  <div class="tabs">
    <button class="tab active" onclick="setTab('quiz')" id="tab-quiz">Quiz</button>
    <button class="tab" onclick="setTab('ref')" id="tab-ref">Reference</button>
  </div>

  <!-- QUIZ VIEW -->
  <div id="view-quiz">

  <!-- REFERENCE VIEW -->

      <div class="ref-section-title" style="margin-bottom:12px">Accuracy by Category</div>
      <div id="acc-chart"></div>
    </div>

    <div class="ref-grid" id="ref-cards"></div>
  </div>
</div>

<script>
function logToDashboard(domain,type,score){
  try{
    var s=JSON.parse(localStorage.getItem('sp_sessions')||'[]');
    var now=new Date();
    s.push({domain,type,score,date:now.toLocaleDateString('en-CA',{month:'short',day:'numeric'}),ts:now.getTime()});
    localStorage.setItem('sp_sessions',JSON.stringify(s));
  }catch(e){}
}

var TERMS=[
  {name:'SQL Injection',def:'Inserting malicious SQL code into an input field to manipulate a database  --  returning, modifying, or deleting data.',tag:'tag-red',tagLabel:'Injection Attack',key:'Use parameterised queries / prepared statements to prevent'},
  {name:'Cross-Site Scripting (XSS)',def:'Injecting malicious scripts into web pages viewed by other users, stealing cookies or redirecting victims.',tag:'tag-red',tagLabel:'Injection Attack',key:'Encode output; use Content Security Policy headers'},
  {name:'Cross-Site Request Forgery',def:'Tricks an authenticated user\'s browser into sending an unwanted request to a site they are logged into.',tag:'tag-red',tagLabel:'Web Attack',key:'Anti-CSRF tokens and SameSite cookie attribute'},
  {name:'Buffer Overflow',def:'Writing more data than a buffer can hold, overwriting adjacent memory  --  potentially hijacking execution flow.',tag:'tag-red',tagLabel:'Memory Attack',key:'ASLR, DEP, input validation prevent exploitation'},
  {name:'Directory Traversal',def:'Using ../ sequences in file path inputs to escape the web root and access files elsewhere on the server.',tag:'tag-red',tagLabel:'Web Attack',key:'Validate and sanitise all file path inputs'},
  {name:'Command Injection',def:'Injecting OS commands through unsanitised user input fields that are passed to a shell.',tag:'tag-red',tagLabel:'Injection Attack',key:'Never pass user input directly to OS commands'},
  {name:'LDAP Injection',def:'Inserting malicious LDAP statements into input fields to manipulate directory service queries.',tag:'tag-red',tagLabel:'Injection Attack',key:'Validate and escape all LDAP query inputs'},
  {name:'XML Injection',def:'Injecting malicious XML data to manipulate XML parsers or application logic.',tag:'tag-red',tagLabel:'Injection Attack',key:'Validate XML input; disable external entity processing'},
  {name:'Race Condition / TOCTOU',def:'Exploiting the gap between when a condition is checked and when it is used  --  an attacker changes state in between.',tag:'tag-purple',tagLabel:'Logic Vulnerability',key:'Use atomic operations and file locking'},
  {name:'Integer Overflow',def:'A numeric value exceeds the maximum size for its data type, wrapping around to an unexpected value.',tag:'tag-purple',tagLabel:'Memory Attack',key:'Input range validation; use safe integer libraries'},
  {name:'Null Pointer Dereference',def:'Attempting to use a null pointer causes a crash or unexpected behaviour that can be exploited.',tag:'tag-purple',tagLabel:'Memory Attack',key:'Validate pointers before use; use memory-safe languages'},
  {name:'DDoS Attack',def:'Distributed Denial of Service  --  overwhelming a target with traffic from many compromised systems to deny legitimate access.',tag:'tag-red',tagLabel:'Network Attack',key:'CDN, rate limiting, scrubbing centres absorb traffic'},
  {name:'SYN Flood',def:'Sending many TCP SYN packets without completing the handshake, exhausting the target\'s connection table.',tag:'tag-red',tagLabel:'Network Attack',key:'SYN cookies prevent connection table exhaustion'},
  {name:'Ping of Death',def:'Sending malformed or oversized ICMP packets to crash or destabilise a target system.',tag:'tag-red',tagLabel:'Network Attack',key:'Modern systems patch this  --  filter oversized ICMP'},
  {name:'Smurf Attack',def:'Spoofing the victim\'s IP in ICMP broadcast requests  --  all subnet hosts reply to the victim, amplifying the attack.',tag:'tag-red',tagLabel:'Network Attack',key:'Disable directed broadcasts; block spoofed source IPs'},
  {name:'ARP Poisoning',def:'Sending fake ARP replies to associate the attacker\'s MAC with a legitimate IP, enabling traffic interception.',tag:'tag-red',tagLabel:'Network Attack',key:'Dynamic ARP Inspection (DAI) on managed switches'},
  {name:'DNS Poisoning',def:'Injecting malicious DNS records into a resolver\'s cache, redirecting users to attacker-controlled sites.',tag:'tag-red',tagLabel:'Network Attack',key:'DNSSEC validates DNS responses cryptographically'},
  {name:'Man-in-the-Middle',def:'Intercepting and potentially altering communication between two parties who believe they are communicating directly.',tag:'tag-red',tagLabel:'Network Attack',key:'TLS with certificate pinning; public key infrastructure'},
  {name:'Replay Attack',def:'Capturing a valid authentication token or message and retransmitting it to gain unauthorised access.',tag:'tag-red',tagLabel:'Network Attack',key:'Timestamps, nonces, and session tokens prevent replay'},
  {name:'Pass-the-Hash',def:'Using a captured NTLM password hash to authenticate without needing to know the plaintext password.',tag:'tag-red',tagLabel:'Credential Attack',key:'Credential Guard; Kerberos; disable NTLM where possible'},
  {name:'Kerberoasting',def:'Requesting service tickets and cracking them offline to recover plaintext service account credentials.',tag:'tag-red',tagLabel:'Credential Attack',key:'Use long complex service account passwords; managed accounts'},
  {name:'Golden Ticket Attack',def:'Forging a Kerberos TGT using the krbtgt account hash  --  granting persistent domain-wide access.',tag:'tag-red',tagLabel:'Credential Attack',key:'Reset krbtgt twice; monitor for anomalous TGTs'},
  {name:'Password Spraying',def:'Trying a small number of common passwords against many accounts to avoid triggering lockout policies.',tag:'tag-amber',tagLabel:'Credential Attack',key:'MFA defeats password spraying even if password is guessed'},
  {name:'Brute Force',def:'Systematically trying every possible password combination until the correct one is found.',tag:'tag-amber',tagLabel:'Credential Attack',key:'Account lockout, MFA, and CAPTCHA mitigate brute force'},
  {name:'Rainbow Table Attack',def:'Using precomputed hash values to rapidly reverse hashed passwords without brute-forcing each one.',tag:'tag-amber',tagLabel:'Credential Attack',key:'Salting passwords defeats rainbow table attacks'},
  {name:'Privilege Escalation',def:'Gaining higher access than originally granted  --  vertical (user to admin) or horizontal (to another user\'s account).',tag:'tag-purple',tagLabel:'Post-Exploitation',key:'Least privilege; patch promptly; monitor privilege use'},
  {name:'Lateral Movement',def:'Moving from one compromised system to other internal systems to expand access and reach target assets.',tag:'tag-purple',tagLabel:'Post-Exploitation',key:'Network segmentation limits lateral movement blast radius'},
  {name:'Living off the Land',def:'Using legitimate built-in tools (PowerShell, WMI, PsExec) to perform malicious actions, evading detection.',tag:'tag-purple',tagLabel:'Post-Exploitation',key:'Application whitelisting; PowerShell constrained mode'},
  {name:'Zero-Day',def:'A vulnerability with no available patch  --  the vendor has zero days to fix it before it is exploited in the wild.',tag:'tag-amber',tagLabel:'Vulnerability',key:'Virtual patching via IPS/WAF while awaiting official patch'},
  {name:'CVE',def:'Common Vulnerabilities and Exposures  --  standardised unique identifiers for publicly known security vulnerabilities.',tag:'tag-teal',tagLabel:'Standard',key:'CVE-YEAR-NUMBER format; critical = CVSS 9.0+'},
  {name:'CVSS',def:'Common Vulnerability Scoring System  --  rates vulnerability severity 0-10 based on exploitability and impact.',tag:'tag-teal',tagLabel:'Standard',key:'Critical 9.0+, High 7.0-8.9, Medium 4.0-6.9, Low 0.1-3.9'},
  {name:'Nation-State Threat Actor',def:'Government-backed attacker conducting espionage, sabotage, or intelligence operations with sophisticated TTPs.',tag:'tag-amber',tagLabel:'Threat Actor',key:'High sophistication, long dwell time, well-resourced'},
  {name:'Hacktivist',def:'Attacker motivated by ideology or politics  --  using hacking to promote a cause or protest an organisation.',tag:'tag-amber',tagLabel:'Threat Actor',key:'DDoS and defacement are common hacktivist tactics'},
  {name:'Script Kiddie',def:'Low-skill attacker using pre-built tools and exploits without deep technical understanding.',tag:'tag-amber',tagLabel:'Threat Actor',key:'Opportunistic  --  targets unpatched, easy vulnerabilities'},
  {name:'APT',def:'Advanced Persistent Threat  --  a stealthy, long-duration campaign typically by nation-states for intelligence gathering.',tag:'tag-red',tagLabel:'Threat Actor',key:'Long dwell time  --  average 200+ days before detection'},
  {name:'Indicators of Compromise',def:'Forensic evidence that a system has been breached  --  unusual logins, unknown processes, unexpected outbound traffic.',tag:'tag-teal',tagLabel:'Detection',key:'IOCs look backward; IOAs detect attacks in progress'},
  {name:'MITRE ATT&CK',def:'A knowledge base of adversary tactics and techniques based on real-world observations, used for threat detection and hunting.',tag:'tag-teal',tagLabel:'Framework',key:'14 tactics from Reconnaissance to Impact'},
  {name:'Threat Intelligence',def:'Analysed information about current threats, TTPs, and IOCs used to improve defensive decisions and prioritisation.',tag:'tag-teal',tagLabel:'Framework',key:'STIX/TAXII are the sharing formats and protocols'},
  {name:'Evil Twin',def:'A rogue wireless access point mimicking a legitimate one to intercept victim traffic.',tag:'tag-red',tagLabel:'Wireless Attack',key:'Certificate warnings and VPN use can detect/prevent'},
  {name:'Deauthentication Attack',def:'Sending forged 802.11 deauth frames to disconnect clients from a legitimate access point.',tag:'tag-red',tagLabel:'Wireless Attack',key:'WPA3 with Protected Management Frames (PMF) prevents this'},
  {name:'IV Attack',def:'Exploiting weaknesses in WEP\'s initialisation vector reuse to recover the encryption key.',tag:'tag-red',tagLabel:'Wireless Attack',key:'WEP is broken  --  always use WPA2/WPA3'},
];

var CATS=['Injection Attacks','Network Attacks','Credential Attacks','Vulnerability Types','Threat Actors','Post-Exploitation','Indicators and Frameworks','Wireless Attacks','Scenario'];

var CAT_COLORS={'Injection Attacks':'var(--red)','Network Attacks':'var(--red)','Credential Attacks':'var(--amber)','Vulnerability Types':'var(--purple)','Threat Actors':'var(--amber)','Post-Exploitation':'var(--purple)','Indicators and Frameworks':'var(--teal)','Wireless Attacks':'var(--blue)','Scenario':'var(--amber)'};

var BADGE_MAP={'Injection Attacks':'badge-attack','Network Attacks':'badge-threat','Credential Attacks':'badge-threat','Vulnerability Types':'badge-vuln','Threat Actors':'badge-threat','Post-Exploitation':'badge-attack','Indicators and Frameworks':'badge-ioc','Wireless Attacks':'badge-vuln','Scenario':'badge-scenario'};

var Q_BANK=[
// VULNERABILITY TYPES ----------------------------------------─
{type:'identify',cat:'Vulnerability Types',q:"Which vulnerability allows an attacker to write past the end of a buffer and overwrite adjacent memory?",o:["Integer overflow","Buffer overflow","Use-after-free","Null pointer dereference"],a:1,e:"<strong>Buffer overflow</strong>  --  writing beyond a buffer's boundary can overwrite return addresses, enabling code execution. ASLR randomises memory layout; DEP marks regions non-executable."},
{type:'identify',cat:'Vulnerability Types',q:"Which vulnerability occurs when a program attempts to use memory after it has already been freed?",o:["Buffer overflow","Use-after-free","Integer overflow","Null pointer dereference"],a:1,e:"<strong>Use-after-free</strong>  --  accessing freed memory can corrupt data or allow arbitrary code execution. Memory-safe languages like Rust prevent this at compile time; ASLR and heap isolation reduce exploitability."},
{type:'identify',cat:'Vulnerability Types',q:"Which term describes a vulnerability with no available patch because the vendor is unaware of it?",o:["Legacy vulnerability","Known exploited vulnerability","Zero-day","Common vulnerability"],a:2,e:"<strong>Zero-day</strong>  --  the vendor has zero days to fix it. Mitigated through virtual patching (WAF/IPS rules), network segmentation, and defence in depth until an official patch is released."},
{type:'identify',cat:'Vulnerability Types',q:"What does a CVSS score of 9.5 indicate?",o:["Medium severity  --  monitor and schedule patching","High severity  --  patch within 30 days","Critical severity  --  immediate action required","Low severity  --  patch in next maintenance window"],a:2,e:"<strong>Critical</strong>  --  CVSS 9.0+ is critical. These require immediate action: virtual patching or network isolation while waiting for a vendor patch. The scale is 0-10: Critical 9+, High 7-8.9, Medium 4-6.9, Low 0.1-3.9."},
{type:'identify',cat:'Vulnerability Types',q:"Which of the following BEST describes a misconfiguration vulnerability?",o:["A flaw in the application source code","Insecure default settings or improper configuration of software or systems","An unpatched software vulnerability","A vulnerability requiring physical access"],a:1,e:"<strong>Misconfiguration</strong> is the most common vulnerability category  --  default credentials, open ports, excessive permissions, debug mode left on, unnecessary services running."},
{type:'identify',cat:'Vulnerability Types',q:"Which type of vulnerability exists in systems that vendors no longer support with patches?",o:["Zero-day vulnerability","Legacy or end-of-life vulnerability","Supply chain vulnerability","Logic vulnerability"],a:1,e:"<strong>Legacy/end-of-life</strong> systems cannot be patched because the vendor no longer provides updates. Compensating controls (network isolation, IPS rules) are essential until replacement."},
{type:'identify',cat:'Vulnerability Types',q:"What is the PRIMARY purpose of the CVE system?",o:["Rate vulnerability severity on a 0-10 scale","Provide standardised unique identifiers for publicly known vulnerabilities","Track the patch status of known vulnerabilities","Automate vulnerability scanning"],a:1,e:"<strong>CVE</strong> (Common Vulnerabilities and Exposures) assigns unique IDs like CVE-2024-1234, creating a shared reference across vendors, researchers, and defenders."},
{type:'identify',cat:'Vulnerability Types',q:"Which tool is used to standardise how vulnerability severity is communicated?",o:["CVE","CVSS","MITRE ATT&CK","STIX"],a:1,e:"<strong>CVSS</strong> (Common Vulnerability Scoring System) rates severity 0-10 based on exploitability, scope, and impact. It provides a common language for prioritising remediation."},

// INJECTION ATTACKS ------------------------------------------
{type:'identify',cat:'Injection Attacks',q:"Which attack injects malicious SQL code through an input field to manipulate a database?",o:["Command injection","LDAP injection","SQL injection","XML injection"],a:2,e:"<strong>SQL injection</strong>  --  parameterised queries (prepared statements) are the primary defence. Input validation and WAFs provide additional protection."},
{type:'identify',cat:'Injection Attacks',q:"Which attack type injects malicious scripts into web pages viewed by other users to steal cookies?",o:["CSRF","SQL injection","Cross-site scripting (XSS)","Directory traversal"],a:2,e:"<strong>XSS</strong>  --  reflected XSS injects via URL parameters; stored XSS persists in the database. Defences: output encoding, Content Security Policy, HttpOnly cookies."},
{type:'identify',cat:'Injection Attacks',q:"Which attack tricks an authenticated user's browser into sending an unwanted request to a trusted site?",o:["XSS","SQL injection","CSRF","Session hijacking"],a:2,e:"<strong>CSRF</strong> (Cross-Site Request Forgery)  --  the attacker uses the victim's existing session. Anti-CSRF tokens and SameSite cookie attribute are the primary defences."},
{type:'identify',cat:'Injection Attacks',q:"Which attack exploits ../ sequences in file path inputs to access files outside the web root?",o:["Command injection","Directory traversal","File inclusion","Buffer overflow"],a:1,e:"<strong>Directory traversal</strong>  --  using ../ to climb directory trees. Validate and sanitise all file path inputs; use allowlists of permitted paths."},
{type:'identify',cat:'Injection Attacks',q:"Which attack passes malicious commands through unsanitised input to the underlying operating system?",o:["SQL injection","XSS","Command injection","LDAP injection"],a:2,e:"<strong>Command injection</strong>  --  never pass user-controlled input directly to OS command functions. Use parameterised APIs and strict input validation."},
{type:'identify',cat:'Injection Attacks',q:"Which defence BEST prevents SQL injection attacks?",o:["Output encoding","Parameterised queries and prepared statements","Content Security Policy","SameSite cookie attribute"],a:1,e:"<strong>Parameterised queries</strong> separate SQL code from data  --  user input is treated as a literal value, never as executable SQL. Output encoding prevents XSS; CSP is an XSS mitigation."},
{type:'identify',cat:'Injection Attacks',q:"Which defence BEST prevents cross-site scripting (XSS)?",o:["Parameterised queries","Anti-CSRF tokens","Output encoding and Content Security Policy","Input length validation only"],a:2,e:"<strong>Output encoding</strong> converts special characters to safe HTML entities. <strong>CSP</strong> restricts which scripts can execute. Both together provide strong XSS protection."},

// NETWORK ATTACKS --------------------------------------------
{type:'identify',cat:'Network Attacks',q:"Which type of attack overwhelms a target with traffic from many compromised systems?",o:["Man-in-the-middle","DDoS attack","Replay attack","ARP poisoning"],a:1,e:"<strong>DDoS</strong> (Distributed Denial of Service)  --  traffic from thousands of bots overwhelms the target. CDNs, rate limiting, and DDoS scrubbing centres absorb the traffic."},
{type:'identify',cat:'Network Attacks',q:"Which attack sends many TCP SYN packets without completing the three-way handshake?",o:["Ping of Death","Smurf attack","SYN flood","Fragmentation attack"],a:2,e:"<strong>SYN flood</strong>  --  exhausts the target's connection table by leaving many half-open connections. SYN cookies allow the server to handle requests without maintaining state."},
{type:'identify',cat:'Network Attacks',q:"Which attack spoofs the victim's IP in ICMP broadcast requests so all subnet hosts reply to the victim?",o:["Ping of Death","SYN flood","Smurf attack","Fragmentation attack"],a:2,e:"<strong>Smurf attack</strong>  --  amplifies traffic by using broadcast addresses. Disabled by turning off directed broadcasts on routers and filtering spoofed source IPs at the perimeter."},
{type:'identify',cat:'Network Attacks',q:"Which attack sends fake ARP replies to associate the attacker's MAC address with a legitimate IP?",o:["DNS poisoning","ARP poisoning","BGP hijacking","IP spoofing"],a:1,e:"<strong>ARP poisoning</strong>  --  enables MITM on the local network segment. Dynamic ARP Inspection (DAI) on managed switches validates ARP packets against a DHCP snooping table."},
{type:'identify',cat:'Network Attacks',q:"Which attack injects malicious DNS records into a resolver's cache to redirect users?",o:["ARP poisoning","BGP hijacking","DNS cache poisoning","Pharming"],a:2,e:"<strong>DNS cache poisoning</strong>  --  redirects all users of a poisoned resolver. DNSSEC digitally signs DNS responses so resolvers can verify authenticity."},
{type:'identify',cat:'Network Attacks',q:"Which attack captures a valid authentication message and retransmits it to gain unauthorised access?",o:["Pass-the-hash","Replay attack","Downgrade attack","Session hijacking"],a:1,e:"<strong>Replay attack</strong>  --  prevented by timestamps, nonces, and session tokens that expire. TLS session tokens include unique values to prevent replay."},
{type:'identify',cat:'Network Attacks',q:"Which attack forces a connection to use an older, weaker protocol or cipher suite?",o:["Replay attack","MITM attack","Downgrade attack","Padding oracle attack"],a:2,e:"<strong>Downgrade attack</strong>  --  forces negotiation to a weaker protocol (SSLv3, TLS 1.0). Prevented by disabling legacy protocols server-side and using strict TLS version enforcement."},
{type:'identify',cat:'Network Attacks',q:"Which attack secretly intercepts and potentially alters traffic between two communicating parties?",o:["DDoS","Replay attack","Man-in-the-middle","DNS hijacking"],a:2,e:"<strong>MITM</strong>  --  the attacker positions between two parties. TLS with certificate validation prevents eavesdropping; certificate pinning prevents rogue CA attacks."},
{type:'identify',cat:'Network Attacks',q:"Which of the following BEST describes BGP hijacking?",o:["Poisoning a DNS resolver's cache","Manipulating border gateway routing announcements to redirect internet traffic","Spoofing ARP replies on a local network","Intercepting wireless traffic via a rogue access point"],a:1,e:"<strong>BGP hijacking</strong>  --  manipulates routing protocol announcements to redirect internet traffic through the attacker's network, enabling interception at massive scale."},

// CREDENTIAL ATTACKS ----------------------------------------─
{type:'identify',cat:'Credential Attacks',q:"Which attack uses precomputed hash values to rapidly reverse hashed passwords?",o:["Brute force","Dictionary attack","Rainbow table attack","Pass-the-hash"],a:2,e:"<strong>Rainbow table attack</strong>  --  defeated entirely by salting passwords. A unique salt per password means identical passwords produce different hashes, invalidating precomputed tables."},
{type:'identify',cat:'Credential Attacks',q:"Which attack tries a small number of common passwords against many accounts to avoid lockout?",o:["Brute force","Password spraying","Dictionary attack","Credential stuffing"],a:1,e:"<strong>Password spraying</strong>  --  stays under per-account lockout thresholds by trying one password against thousands of accounts. MFA defeats it even when the password is correct."},
{type:'identify',cat:'Credential Attacks',q:"Which attack uses a captured NTLM hash to authenticate without knowing the plaintext password?",o:["Pass-the-ticket","Kerberoasting","Pass-the-hash","Golden ticket"],a:2,e:"<strong>Pass-the-hash</strong>  --  NTLM authentication accepts the hash itself, so the attacker never needs to crack it. Credential Guard isolates hashes; migrating to Kerberos eliminates NTLM exposure."},
{type:'identify',cat:'Credential Attacks',q:"Which attack requests Kerberos service tickets and cracks them offline to recover service account passwords?",o:["Pass-the-hash","Golden ticket","Kerberoasting","Silver ticket"],a:2,e:"<strong>Kerberoasting</strong>  --  any domain user can request a service ticket encrypted with the service account's hash. Use long random service account passwords or group managed service accounts."},
{type:'identify',cat:'Credential Attacks',q:"Which attack forges a Kerberos ticket-granting ticket using the krbtgt account hash for persistent domain access?",o:["Silver ticket","Kerberoasting","Pass-the-hash","Golden ticket"],a:3,e:"<strong>Golden ticket</strong>  --  forging a TGT with the krbtgt hash grants domain-wide, near-permanent access. Mitigated by resetting the krbtgt password twice and monitoring for anomalous ticket lifetimes."},
{type:'identify',cat:'Credential Attacks',q:"Which attack systematically tries every possible character combination until the correct password is found?",o:["Dictionary attack","Rainbow table","Password spraying","Brute force"],a:3,e:"<strong>Brute force</strong>  --  time depends on password length and complexity. Account lockout, MFA, and CAPTCHA mitigate online brute force. Salting and strong hashing mitigate offline attacks."},
{type:'identify',cat:'Credential Attacks',q:"Which defence MOST effectively defeats password spraying attacks?",o:["Strong password policy","Account lockout after 3 attempts","Multi-factor authentication","Password history enforcement"],a:2,e:"<strong>MFA</strong> defeats password spraying because even if the password is guessed, the attacker cannot satisfy the second factor. A strong policy reduces success rate but MFA eliminates it."},

// THREAT ACTORS ----------------------------------------------
{type:'identify',cat:'Threat Actors',q:"Which threat actor type is characterised by long dwell times, sophisticated TTPs, and government backing?",o:["Hacktivist","Script kiddie","Nation-state / APT","Insider threat"],a:2,e:"<strong>Nation-state/APT</strong>  --  Advanced Persistent Threats operate for months or years, prioritising stealth over speed. Average dwell time is 200+ days before detection."},
{type:'identify',cat:'Threat Actors',q:"Which threat actor is motivated by ideology and typically uses DDoS and website defacement?",o:["Nation-state","APT","Hacktivist","Script kiddie"],a:2,e:"<strong>Hacktivist</strong>  --  motivated by politics or social causes. Anonymous is the most well-known example. Tactics focus on disruption and visibility rather than data theft."},
{type:'identify',cat:'Threat Actors',q:"Which threat actor uses pre-built tools without deep technical knowledge, targeting easy vulnerabilities?",o:["APT","Insider threat","Nation-state","Script kiddie"],a:3,e:"<strong>Script kiddie</strong>  --  low skill, opportunistic. Targets unpatched, easy-to-exploit systems using existing exploit kits. Basic patching and hardening defeats most script kiddie attacks."},
{type:'identify',cat:'Threat Actors',q:"Which threat actor poses risk due to authorised access being misused, either maliciously or accidentally?",o:["APT","Script kiddie","Insider threat","Hacktivist"],a:2,e:"<strong>Insider threat</strong>  --  employees, contractors, or partners with legitimate access. Least privilege, user behaviour analytics (UEBA), and mandatory vacation help detect and limit insider threats."},
{type:'identify',cat:'Threat Actors',q:"Which of the following BEST describes an opportunistic threat actor?",o:["Nation-state targeting a specific government agency","A hacktivist group targeting a specific company","A script kiddie scanning for any unpatched system","An insider exfiltrating intellectual property"],a:2,e:"<strong>Opportunistic attackers</strong>  --  like script kiddies  --  do not target specific organisations. They scan broadly for easy vulnerabilities. Basic security hygiene eliminates most of their attack paths."},
{type:'identify',cat:'Threat Actors',q:"Which threat actor characteristic describes the level of technical skill and resources available?",o:["Motivation","Sophistication","Attribution","Dwell time"],a:1,e:"<strong>Sophistication</strong> refers to technical capability and resources. Nation-states have high sophistication; script kiddies have low. Sophistication determines which defences are effective."},

// POST-EXPLOITATION ------------------------------------------
{type:'identify',cat:'Post-Exploitation',q:"Which technique involves using built-in OS tools like PowerShell to perform malicious actions?",o:["Zero-day exploitation","Living off the land","Fileless malware delivery","Watering hole attack"],a:1,e:"<strong>Living off the land (LotL)</strong>  --  using legitimate tools (PowerShell, WMI, certutil, PsExec) avoids signature-based detection. Behavioural analytics and application whitelisting detect abnormal use."},
{type:'identify',cat:'Post-Exploitation',q:"Which activity describes an attacker moving from one compromised system to others on the internal network?",o:["Privilege escalation","Lateral movement","Persistence establishment","Data exfiltration"],a:1,e:"<strong>Lateral movement</strong>  --  using stolen credentials, exploits, or admin tools to access additional systems. Network segmentation and zero trust limit how far an attacker can move."},
{type:'identify',cat:'Post-Exploitation',q:"Which technique involves gaining higher access than originally granted by exploiting a vulnerability?",o:["Lateral movement","Pivoting","Privilege escalation","Persistence"],a:2,e:"<strong>Privilege escalation</strong>  --  vertical escalation moves from user to admin; horizontal escalation moves to another account at the same level. Least privilege limits the impact."},
{type:'identify',cat:'Post-Exploitation',q:"An attacker uses a compromised system to attack other hosts deeper in the network. This is called:",o:["Lateral movement","Pivoting","Privilege escalation","Persistence"],a:1,e:"<strong>Pivoting</strong>  --  using a compromised host as a launchpad to attack other internal systems not directly reachable from the internet. Network segmentation reduces pivot opportunities."},
{type:'identify',cat:'Post-Exploitation',q:"Which type of malware technique avoids writing files to disk to evade signature-based antivirus?",o:["Polymorphic malware","Fileless malware","Rootkit","Backdoor"],a:1,e:"<strong>Fileless malware</strong> runs entirely in memory, leaving no disk artifacts. Detected through behaviour-based EDR and memory scanning rather than file signatures."},
{type:'identify',cat:'Post-Exploitation',q:"Which of the following BEST describes the purpose of command and control (C2) infrastructure?",o:["To distribute malware via phishing emails","To allow attackers to remotely control compromised systems and exfiltrate data","To perform initial reconnaissance before an attack","To amplify DDoS attack traffic"],a:1,e:"<strong>C2 (Command and Control)</strong>  --  attackers communicate with compromised systems to issue commands, receive data, and update malware. HTTP/S-based C2 blends with legitimate traffic."},

// INDICATORS AND FRAMEWORKS ----------------------------------
{type:'identify',cat:'Indicators and Frameworks',q:"Which of the following BEST describes Indicators of Compromise (IOCs)?",o:["Evidence that an attack is currently in progress","Forensic artifacts indicating a system has already been breached","Proactive intelligence about future threats","A list of known threat actor groups"],a:1,e:"<strong>IOCs</strong> are evidence of past or completed compromise  --  unusual logins, known malware hashes, suspicious IPs. IOAs (Indicators of Attack) show an attack in progress. IOCs look backward."},
{type:'identify',cat:'Indicators and Frameworks',q:"Which framework catalogues adversary tactics and techniques based on real-world observations?",o:["NIST CSF","MITRE ATT&CK","ISO 27001","OWASP Top 10"],a:1,e:"<strong>MITRE ATT&CK</strong>  --  14 tactic categories from Reconnaissance to Impact, with hundreds of specific techniques. Used for threat hunting, detection engineering, and red team planning."},
{type:'identify',cat:'Indicators and Frameworks',q:"Which of the following is an example of a behavioural indicator of compromise?",o:["A known malware file hash found on disk","A system making regular outbound connections to a foreign IP on port 4444","An expired SSL certificate on a server","A failed login attempt from a user's usual workstation"],a:1,e:"<strong>Behavioural IOC</strong>  --  regular outbound C2 beaconing is a behavioural indicator. File hashes are artifact IOCs. Behavioural detection catches fileless malware that leaves no hash."},
{type:'identify',cat:'Indicators and Frameworks',q:"What are STIX and TAXII used for?",o:["Encrypting sensitive threat intelligence data","Standardising the format and transport protocol for sharing threat intelligence","Rating vulnerability severity","Documenting incident response procedures"],a:1,e:"<strong>STIX</strong> (format) and <strong>TAXII</strong> (transport) standardise threat intelligence sharing between organisations and automated systems. ISACs use them to distribute IOCs."},
{type:'identify',cat:'Indicators and Frameworks',q:"Which of the following BEST describes the purpose of an ISAC?",o:["A government agency that issues CVE identifiers","An information sharing community where organisations in the same sector share threat intelligence","A certification body for cybersecurity professionals","A vulnerability scanning platform"],a:1,e:"<strong>ISAC</strong> (Information Sharing and Analysis Center)  --  sector-specific groups (FS-ISAC for finance, H-ISAC for health) that share threat intelligence to help members defend against common adversaries."},
{type:'identify',cat:'Indicators and Frameworks',q:"What does threat hunting assume that differentiates it from passive monitoring?",o:["That all threats are detected by automated tools","That the environment may already be compromised  --  proactively searching for hidden threats","That known IOCs are sufficient for detection","That all indicators of compromise are known in advance"],a:1,e:"<strong>Threat hunting</strong> assumes compromise and proactively searches for threats that evaded automated detection. It complements SIEM and EDR by finding low-and-slow attacks."},
{type:'identify',cat:'Indicators and Frameworks',q:"Which of the following BEST describes the OWASP Top 10?",o:["A vulnerability scoring system","A list of the 10 most critical web application security risks","A framework for threat intelligence sharing","A standard for penetration testing methodology"],a:1,e:"<strong>OWASP Top 10</strong>  --  the most critical web application risks (injection, broken access control, XSS, etc.). Updated periodically based on real-world vulnerability data."},

// WIRELESS ATTACKS ------------------------------------------─
{type:'identify',cat:'Wireless Attacks',q:"Which wireless attack creates a rogue access point with the same SSID as a legitimate one?",o:["Deauthentication attack","Evil twin","IV attack","War driving"],a:1,e:"<strong>Evil twin</strong>  --  users connect to the attacker's AP thinking it is legitimate. Certificate warnings and VPN use can detect and mitigate this attack."},
{type:'identify',cat:'Wireless Attacks',q:"Which wireless attack sends forged frames to disconnect clients from their access point?",o:["Evil twin","IV attack","Deauthentication attack","Disassociation attack"],a:2,e:"<strong>Deauthentication attack</strong>  --  exploits that 802.11 management frames are unauthenticated in WPA2. WPA3 with Protected Management Frames (PMF) cryptographically authenticates these frames."},
{type:'identify',cat:'Wireless Attacks',q:"Which wireless encryption protocol is considered completely broken and should never be used?",o:["WPA2-Enterprise","WPA3-Personal","WEP","WPA2-Personal"],a:2,e:"<strong>WEP</strong>  --  Wired Equivalent Privacy is cryptographically broken. Its RC4 implementation reuses initialisation vectors, allowing key recovery with enough captured packets. Always use WPA3."},
{type:'identify',cat:'Wireless Attacks',q:"What is the PRIMARY security improvement WPA3 provides over WPA2?",o:["Faster encryption speeds","Simultaneous Authentication of Equals (SAE) preventing offline dictionary attacks","Longer encryption key lengths","Mandatory use of RADIUS authentication"],a:1,e:"<strong>SAE</strong> (Dragonfly handshake)  --  replaces PSK authentication in WPA3-Personal. Even if a password is captured, SAE prevents offline cracking because no information is reusable between sessions."},
{type:'identify',cat:'Wireless Attacks',q:"Which wireless attack method drives around scanning for open or weakly secured wireless networks?",o:["Evil twin","Deauthentication attack","War driving","Bluejacking"],a:2,e:"<strong>War driving</strong>  --  scanning for wireless networks from a vehicle. War chalking marks found networks. Tools like Kismet and WiFi Pineapple are commonly used."},

// SCENARIOS --------------------------------------------------
{type:'scenario',cat:'Scenario',scenario:"A web application accepts user input for a product search. The security team discovers that entering ' OR '1'='1 in the search field returns all records in the database.",q:"Which vulnerability and primary defence does this describe?",o:["XSS  --  use output encoding","SQL injection  --  use parameterised queries","CSRF  --  use anti-CSRF tokens","Command injection  --  use input sanitisation"],a:1,e:"<strong>SQL injection</strong>  --  the classic OR 1=1 bypass. Parameterised queries (prepared statements) are the definitive fix. The input is passed as a literal value, never interpreted as SQL."},
{type:'scenario',cat:'Scenario',scenario:"A security analyst notices a workstation is making outbound TCP connections to 185.220.101.45 on port 4444 every 60 seconds, even when the user is not logged in.",q:"Which attack technique does this BEST indicate?",o:["DDoS participation","Command and control (C2) beaconing","DNS tunnelling","Port scanning"],a:1,e:"<strong>C2 beaconing</strong>  --  regular, timed outbound connections to an external IP at an unusual port are a classic C2 indicator. The 60-second interval suggests an automated beacon, not user activity."},
{type:'scenario',cat:'Scenario',scenario:"A user reports that after visiting a news website, their browser was redirected to a fake Microsoft support page. No links were clicked  --  just visiting the site triggered it.",q:"Which attack technique BEST describes this?",o:["Phishing","Watering hole attack","Evil twin","DNS poisoning"],a:1,e:"<strong>Watering hole attack</strong>  --  the attacker compromised the news site knowing the target would visit it. No interaction required  --  visiting the page triggers the redirect or malicious script."},
{type:'scenario',cat:'Scenario',scenario:"A penetration tester gains domain user access, requests service tickets for all accounts with SPNs, and runs offline cracking against the captured ticket hashes.",q:"Which attack technique is the tester performing?",o:["Pass-the-hash","Golden ticket attack","Kerberoasting","Pass-the-ticket"],a:2,e:"<strong>Kerberoasting</strong>  --  any authenticated user can request service tickets. The TGS ticket is encrypted with the service account hash. Long random service account passwords make offline cracking infeasible."},
{type:'scenario',cat:'Scenario',scenario:"After a major data breach at a social media company, an attacker uses the leaked email/password pairs to attempt logins on banking websites. They succeed on accounts where users reused passwords.",q:"Which attack type is this?",o:["Password spraying","Brute force","Rainbow table attack","Credential stuffing"],a:3,e:"<strong>Credential stuffing</strong>  --  uses breach data from one site to attack others, exploiting password reuse. MFA defeats it; breached credential monitoring alerts affected users."},
{type:'scenario',cat:'Scenario',scenario:"A developer left the database error messages enabled in a production web application. An attacker submits various inputs and uses the detailed error messages to map the database schema.",q:"Which vulnerability category does this represent?",o:["Injection vulnerability","Misconfiguration  --  verbose error messages","Zero-day vulnerability","Buffer overflow"],a:1,e:"<strong>Misconfiguration</strong>  --  verbose error messages reveal internal architecture, table names, and query structures. Always disable detailed errors in production; use generic error pages."},
{type:'scenario',cat:'Scenario',scenario:"A security analyst reviewing SIEM logs spots multiple authentication failures across 500 different accounts from the same IP address, each account attempted only once with the password 'Summer2024!'",q:"Which attack type does this describe?",o:["Brute force attack","Credential stuffing","Password spraying","Dictionary attack"],a:2,e:"<strong>Password spraying</strong>  --  one common password tried across many accounts specifically to avoid per-account lockout policies. The single attempt per account and common password are the key indicators."},
{type:'scenario',cat:'Scenario',scenario:"A red team compromised a low-privilege workstation then used Mimikatz to extract cached credentials from LSASS memory, obtaining a domain administrator hash they used to access the domain controller.",q:"Which two techniques were combined in this attack chain?",o:["Kerberoasting followed by golden ticket","Credential dumping followed by pass-the-hash","Password spraying followed by privilege escalation","Brute force followed by lateral movement"],a:1,e:"<strong>Credential dumping (Mimikatz against LSASS) + Pass-the-Hash</strong>  --  the hash is extracted from memory then used directly for NTLM authentication. Credential Guard prevents LSASS memory dumps; disabling NTLM forces Kerberos use."},
{type:'scenario',cat:'Scenario',scenario:"An employee at a financial institution receives a call from someone claiming to be from IT support, saying their account shows suspicious activity and asking them to confirm their password to 'secure the account'.",q:"Which two attack techniques are being combined here?",o:["Smishing combined with pretexting","Vishing combined with pretexting","Phishing combined with impersonation","Spear phishing combined with BEC"],a:1,e:"<strong>Vishing</strong> (voice phishing via phone call) + <strong>Pretexting</strong> (fabricated IT support scenario)  --  the attacker creates urgency with a believable story. IT departments should never request passwords over the phone."},
{type:'scenario',cat:'Scenario',scenario:"A security team discovers that for the past 8 months, an attacker has been present on the network, silently collecting emails and documents without encrypting files or disrupting services.",q:"Which threat actor and campaign type does this BEST describe?",o:["Script kiddie using automated tools","Hacktivist conducting a protest campaign","Nation-state APT conducting long-term espionage","Insider threat stealing intellectual property"],a:2,e:"<strong>Nation-state APT</strong>  --  the hallmarks are long dwell time (8 months), stealth over disruption, intelligence gathering focus, and no destructive action. Average APT dwell time before detection exceeds 200 days."},
{type:'scenario',cat:'Scenario',scenario:"A vulnerability scanner returns a finding: CVE-2024-12345, CVSS 9.8, affecting the VPN gateway. The patch is available but requires a 4-hour maintenance window. Production traffic cannot stop.",q:"Which is the BEST immediate interim response?",o:["Accept the risk and patch at next scheduled window in 6 weeks","Deploy a WAF or IPS rule to block known exploit patterns as a compensating control","Ignore the finding  --  the perimeter firewall provides sufficient protection","Disable the VPN gateway immediately until patched"],a:1,e:"A <strong>virtual patch</strong> via IPS/WAF rule blocks known exploit patterns while the permanent patch is prepared. CVSS 9.8 is critical  --  a 6-week delay with no interim control is unacceptable. Disabling VPN may not be proportionate."},
];

var questions=[],qi=0,correct=0,wrong=0;
var timerInterval=null;
var catStats={};
CATS.forEach(c=>catStats[c]={c:0,t:0});

// HELPERS ----------------------------------------------------
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function buildQuestions(){
  var pool=shuffle(Q_BANK.slice());
  var result=[];
  for(var k=0;k<pool.length;k++){
    var q=pool[k];
    var idxs=[];
    for(var m=0;m<q.o.length;m++) idxs.push(m);
    var shuf=shuffle(idxs);
    var newO=[];
    for(var n=0;n<shuf.length;n++) newO.push(q.o[shuf[n]]);
    var nq={};
    for(var p in q) nq[p]=q[p];
    nq.o=newO;
    nq.a=shuf.indexOf(q.a);
    result.push(nq);
  }
  return result;
}

// STATS ------------------------------------------------------
function updateStats(){
  var total=correct+wrong;
  document.getElementById('s-prog').textContent=qi+'/'+questions.length;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-acc').textContent=total?Math.round(correct/total*100)+'%':' -- ';
  document.getElementById('prog-fill').style.width=Math.round(qi/questions.length*100)+'%';
}

// RENDER QUESTION --------------------------------------------
function renderQ(){
  if(qi>=questions.length){showResults();return;}
  var q=questions[qi];
  var letters=['A','B','C','D'];
  var catBadge=BADGE_MAP[q.cat]||'badge-vuln';
  var scenHTML=q.type==='scenario'&&q.scenario
    ?'<div class="scenario-box"><div class="scenario-lbl">Scenario</div><div class="scenario-text">'+q.scenario.replace(/\n/g,'<br>')+'</div></div>'
    :'';
  document.getElementById('q-area').innerHTML=
    '<div class="q-card">'+
      '<div class="q-meta">'+
        '<span class="q-badge '+catBadge+'">'+q.cat+'</span>'+
        '<span class="q-num">Q'+(qi+1)+' of 80</span>'+
      '</div>'+
      scenHTML+
      '<div class="q-text">'+q.q+'</div>'+
      '<div class="opts" id="opts">'+
        (function(){var _h='';for(var _i=0;_i<q.o.length;_i++){_h+='<button class="opt" id="opt-'+_i+'">'+'<span class="opt-letter">'+['A','B','C','D'][_i]+'</span>'+'<span class="opt-text">'+q.o[_i]+'</span>'+'</button>';}return _h;})()+
      '</div>'+
      '<div class="explanation" id="explanation">'+
        '<div class="exp-lbl">Explanation</div>'+
        '<div class="exp-text" id="exp-text"></div>'+
      '</div>'+
      '<button class="btn-next" id="btn-next">'+(qi===questions.length-1?'See results ->':'Next ->')+'</button>'+
    '</div>';
  for(var _j=0;_j<q.o.length;_j++){(function(_idx){var _b=document.getElementById('opt-'+_idx);if(_b) _b.onclick=function(){answer(_idx);};}(_j));}
}

// ANSWER ----------------------------------------------------─
function answer(idx){
  var q=questions[qi];
  var isCorrect=idx===q.a;
  if(isCorrect){correct++;if(catStats[q.cat])catStats[q.cat].c++;}else{wrong++;}
  if(!catStats[q.cat]) catStats[q.cat]={c:0,t:0};
  catStats[q.cat].t++;
  qi++;
  updateStats();
  for(var i=0;i<q.o.length;i++){
    var b=document.getElementById('opt-'+i);
    if(b) b.disabled=true;
  }
  var cb=document.getElementById('opt-'+idx);
  var rb=document.getElementById('opt-'+q.a);
  if(isCorrect){if(cb)cb.classList.add('correct');}
  else{if(cb)cb.classList.add('wrong');if(rb)rb.classList.add('reveal');}
  var et=document.getElementById('exp-text');
  var eb=document.getElementById('explanation');
  var nb=document.getElementById('btn-next');
  if(et) et.innerHTML=q.e;
  if(eb) eb.classList.add('show');
  if(nb){nb.style.display='block';nb.onclick=function(){nextQ();};}
  logToDashboard(2,'Threats & Vulnerabilities Trainer',Math.round(correct/qi*100));
}

function nextQ(){renderQ();}

// RESULTS ----------------------------------------------------
function showResults(){
  clearInterval(timerInterval);
  document.getElementById('q-area').style.display='none';
  var res=document.getElementById('results-area');
  res.style.display='block';
  var pct=Math.round(correct/questions.length*100);
  logToDashboard(2,'Threats & Vulnerabilities Trainer',pct);
  var passed=pct>=80;
  var msg=pct>=90?'Outstanding  --  exam-ready!':pct>=80?'Solid  --  above pass threshold.':pct>=65?'Getting there  --  keep reviewing.':'More study needed.';
  var ringColor=passed?'#00ff88':'#ff3d5a';
  var circ=339.3,offset=circ-(pct/100)*circ;
  var topCats=CATS.filter(c=>catStats[c].t>0).sort((a,b)=>(catStats[b].c/catStats[b].t)-(catStats[a].c/catStats[a].t));
  var bdHTML=topCats.slice(0,6).map(c=>{
    var s=catStats[c];var p=s.t?Math.round(s.c/s.t*100):0;
    var col=CAT_COLORS[c]||'var(--accent)';
    return '<div class="bd-card"><div class="bd-title" style="color:'+col+'">'+c+'</div>'+
           '<div class="bd-bar-bg"><div class="bd-bar-fill" style="width:0%;background:'+col+'" data-pct="'+p+'"></div></div>'+
           '<div class="bd-score" style="color:'+col+'">'+p+'%</div>'+
           '<div class="bd-detail">'+s.c+'/'+s.t+' correct</div></div>';
  }).join('');
  res.innerHTML=
    '<div class="results-wrap">'+
      '<div class="results-ring">'+
        '<svg width="140" height="140" viewBox="0 0 140 140">'+
          '<circle cx="70" cy="70" r="54" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>'+
          '<circle cx="70" cy="70" r="54" fill="none" stroke="'+ringColor+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" id="ring-anim"/>'+
        '</svg>'+
        '<div class="ring-score"><div class="ring-pct">'+pct+'%</div><div class="ring-lbl">score</div></div>'+
      '</div>'+
      '<div class="results-verdict" style="color:'+ringColor+'">'+(passed?'Passed [OK]':'Keep Studying')+'</div>'+
      '<div class="results-sub">'+correct+'/'+questions.length+' correct  --  '+msg+'</div>'+
      '<div class="breakdown">'+bdHTML+'</div>'+
      '<button class="btn-retake" onclick="retake()">Retake Quiz</button>'+
      '<button class="btn-retake" onclick="showRef()" style="border-color:var(--accent);color:var(--accent)">View Reference</button>'+
    '</div>';
  setTimeout(()=>{
    var ring=document.getElementById('ring-anim');
    if(ring){ring.style.transition='stroke-dashoffset 1.5s ease';ring.style.strokeDashoffset=offset;}
    document.querySelectorAll('.bd-bar-fill').forEach(el=>{
      el.style.transition='width 1s ease';el.style.width=el.dataset.pct+'%';
    });
  },100);
}

// RETAKE / TABS / REF ----------------------------------------
function retake(){
  document.getElementById('q-area').style.display='block';
  document.getElementById('results-area').style.display='none';
  questions=buildQuestions();
  qi=0;correct=0;wrong=0;
  CATS.forEach(c=>catStats[c]={c:0,t:0});
  updateStats();renderQ();
}

function showRef(){
  document.getElementById('view-quiz').style.display='none';
  document.getElementById('view-ref').style.display='block';
  document.getElementById('tab-quiz').classList.remove('active');
  document.getElementById('tab-ref').classList.add('active');
  buildRef();
}

function setTab(t){
  if(t==='ref'){
    document.getElementById('view-quiz').style.display='none';
    document.getElementById('view-ref').style.display='block';
    document.getElementById('tab-quiz').classList.remove('active');
    document.getElementById('tab-ref').classList.add('active');
    buildRef();
  } else {
    document.getElementById('view-ref').style.display='none';
    document.getElementById('view-quiz').style.display='block';
    document.getElementById('tab-quiz').classList.add('active');
    document.getElementById('tab-ref').classList.remove('active');
  }
}

function buildRef(){
  var chart=document.getElementById('acc-chart');
  chart.innerHTML='';
  CATS.forEach(c=>{
    var s=catStats[c];var pct=s.t?Math.round(s.c/s.t*100):0;
    var col=CAT_COLORS[c]||'var(--accent)';
    chart.innerHTML+='<div class="acc-row"><div class="acc-lbl">'+c+'</div><div class="acc-bg"><div class="acc-fill" style="width:'+(s.t?pct:0)+'%;background:'+col+'"></div></div><div class="acc-pct">'+(s.t?pct+'%':' -- ')+'</div></div>';
  });
  var cards=document.getElementById('ref-cards');
  cards.innerHTML='';
  TERMS.forEach(t=>{
    cards.innerHTML+='<div class="ref-card"><div class="ref-name">'+t.name+'</div><div class="ref-def">'+t.def+'</div><span class="ref-tag '+t.tag+'">'+t.tagLabel+'</span><div class="ref-key">'+t.key+'</div></div>';
  });
}

// BOOT ------------------------------------------------------─
questions=buildQuestions();
updateStats();
renderQ();

</script>
