  {term:'Quantitative Risk Analysis', d:'5', def:'A risk analysis method that uses numerical values and calculations (SLE, ALE, ARO) to express risk in financial terms, enabling direct cost-benefit comparison of controls.',hint:'Numbers and dollars  --  SLE, ALE, ARO',wrongDefs:['A risk analysis method using descriptive categories like High/Medium/Low','A method of testing controls by simulating real-world attack scenarios','A method of prioritizing vulnerabilities based on CVSS scores'],wrongTerms:['Qualitative Risk Analysis','Red Team Exercise','Vulnerability Prioritization']},
  {term:'Qualitative Risk Analysis', d:'5', def:'A risk analysis method that uses descriptive categories such as High, Medium, and Low to evaluate risk likelihood and impact without specific financial calculations.',hint:'High/Medium/Low ratings  --  no dollar amounts needed',wrongDefs:['A risk analysis method using financial calculations like SLE and ALE','A process of identifying all assets and assigning them monetary values','A method of scoring vulnerability severity on a 0-10 scale'],wrongTerms:['Quantitative Risk Analysis','Asset Valuation','CVSS']},
  // ── ADDITIONAL SY0-701 TERMS ───────────────────────────────────
  // Domain 1 additions
  {term:'Technical Debt', d:'1', def:'Accumulated security risk created by taking shortcuts or using outdated technologies, which must eventually be addressed  --  often at greater cost than addressing it immediately.',hint:'Shortcuts now = bigger problems later',wrongDefs:['The cost of purchasing and maintaining security tools and software licenses','A method of deferring software licensing payments over time','The financial liability created by a data breach or security incident'],wrongTerms:['Licensing Cost','Deferred Payment','Breach Liability']},
  {term:'Attack Surface', d:'1', def:'The total sum of different points where an attacker could try to enter or extract data from an environment  --  every exposed interface, service, or entry point.',hint:'Reduce it through hardening and segmentation',wrongDefs:['The geographic area covered by a wireless network signal','The number of users with administrative privileges on a system','The total bandwidth consumed by security monitoring tools'],wrongTerms:['Network Coverage','Privileged Accounts','Monitoring Overhead']},
  {term:'Threat Vector', d:'1', def:'The path or method an attacker uses to gain access to a system or network, such as email, web application, removable media, or supply chain.',hint:'How the attack gets in  --  email, USB, web',wrongDefs:['The level of damage an attack can cause to an organization','The probability that a specific threat will successfully exploit a vulnerability','A measurement of how quickly a threat can propagate through a network'],wrongTerms:['Impact','Likelihood','Propagation Rate']},
  {term:'Hardening', d:'1', def:'The process of securing a system by reducing its attack surface  --  disabling unnecessary services, closing unused ports, removing default accounts, and applying security configurations.',hint:'Reduce attack surface  --  disable what you don\'t need',wrongDefs:['The process of encrypting all data on a system before deployment','Patching known vulnerabilities to bring systems up to date','Monitoring a system for anomalous behavior after deployment'],wrongTerms:['Encryption','Patch Management','Monitoring']},
  {term:'Security Baseline', d:'1', def:'A defined minimum set of security configurations and controls that all systems in an organization must meet to be considered adequately secured.',hint:'Minimum security standard every system must meet',wrongDefs:['The maximum security configuration achievable on a given system','A list of all known vulnerabilities affecting an organization\'s systems','The average security posture of systems in the same industry'],wrongTerms:['Maximum Security Config','Vulnerability Register','Industry Benchmark']},
  {term:'Compensating Control', d:'1', def:'An alternative security control used when the primary control cannot be implemented, providing equivalent protection through a different mechanism.',hint:'Can\'t implement primary control? Use this instead',wrongDefs:['A control that detects security events after they occur','A control that prevents security incidents from occurring','A control that restores systems to normal after an incident'],wrongTerms:['Detective Control','Preventive Control','Corrective Control']},
  {term:'Preventive Control', d:'1', def:'A security control designed to stop a security incident from occurring in the first place.',hint:'Stops incidents before they happen  --  firewall, MFA',wrongDefs:['A control that identifies and records security events after they occur','A control that restores systems to a safe state after an incident','A control used when the primary control cannot be implemented'],wrongTerms:['Detective Control','Corrective Control','Compensating Control']},
  {term:'Detective Control', d:'1', def:'A security control that identifies and records security events or policy violations after they have occurred.',hint:'Finds incidents that already happened  --  IDS, audit logs, CCTV',wrongDefs:['A control that prevents security incidents from occurring','A control that recovers systems after a security incident','A control used as an alternative when the primary control fails'],wrongTerms:['Preventive Control','Corrective Control','Compensating Control']},
  {term:'Corrective Control', d:'1', def:'A security control that restores systems or processes to a normal state after a security incident has occurred.',hint:'Fixes damage after an incident  --  backups, patches',wrongDefs:['A control that stops security incidents from happening','A control that detects and records security events after they occur','A control used as a substitute when the primary control is unavailable'],wrongTerms:['Preventive Control','Detective Control','Compensating Control']},
  {term:'Tokenization', d:'1', def:'Replacing sensitive data with a non-sensitive placeholder (token) that has no exploitable value outside the system that generated it.',hint:'Credit card numbers replaced with tokens  --  PCI-DSS',wrongDefs:['Encrypting data using a symmetric key so it can be decrypted later','Converting data into an unreadable format using a one-way hash','Masking parts of data so only certain characters are visible'],wrongTerms:['Encryption','Hashing','Data Masking']},
  {term:'Steganography', d:'1', def:'The practice of hiding secret data within an ordinary, non-secret file or message to avoid detection.',hint:'Hidden message inside an image or audio file',wrongDefs:['Encrypting data so it cannot be read without the correct key','Compressing data to reduce file size before transmission','Hashing data to verify it has not been altered'],wrongTerms:['Encryption','Compression','Hashing']},
  {term:'Obfuscation', d:'1', def:'Making data or code intentionally difficult to understand or reverse-engineer, often used to protect intellectual property or hide malicious code.',hint:'Scramble it so it\'s hard to read or analyze',wrongDefs:['Encrypting data using a key so only authorized parties can read it','Replacing sensitive data with non-sensitive placeholder values','Hiding data inside another file to avoid detection'],wrongTerms:['Encryption','Tokenization','Steganography']},
  {term:'Key Escrow', d:'1', def:'A system where encryption keys are held by a trusted third party, allowing authorized recovery of encrypted data if the original key is lost.',hint:'Third party holds a copy of your key',wrongDefs:['A method of splitting a key so multiple parties must combine shares to reconstruct it','Encrypting a key with a second key for additional protection','Automatically rotating encryption keys on a scheduled basis'],wrongTerms:['Key Splitting','Key Wrapping','Key Rotation']},
  {term:'Federation', d:'1', def:'A system allowing users from one organization to authenticate and access resources in another organization using their home credentials, based on trust relationships.',hint:'Log in to partner systems with your own credentials',wrongDefs:['Using a single set of credentials to access all systems within one organization','Combining multiple authentication factors into a single login process','Storing user credentials in a centralized directory service'],wrongTerms:['SSO','MFA','Directory Service']},

  // Domain 2 additions
  {term:'Threat Intelligence', d:'2', def:'Analyzed information about current and emerging threats, threat actors, their tactics, techniques, and procedures (TTPs), used to improve defensive decisions.',hint:'Knowledge about who is attacking and how',wrongDefs:['Automated scanning of systems for known vulnerabilities','Real-time monitoring of network traffic for anomalous behavior','Proactive searching for threats that evaded automated detection tools'],wrongTerms:['Vulnerability Scanning','Network Monitoring','Threat Hunting']},
  {term:'Indicators of Attack', d:'2', def:'Evidence that an attack is actively in progress, as opposed to Indicators of Compromise which show a breach has already occurred.',hint:'IOA = attack in progress; IOC = already breached',wrongDefs:['Artifacts showing a system has already been successfully compromised','Signatures used by IDS systems to detect known attack patterns','Alerts generated by a SIEM based on correlated log events'],wrongTerms:['Indicators of Compromise','IDS Signatures','SIEM Alerts']},
  {term:'False Positive', d:'2', def:'A security alert that incorrectly identifies benign activity as malicious, wasting analyst time and potentially leading to alert fatigue.',hint:'Alarm fired  --  nothing was actually wrong',wrongDefs:['A security alert that correctly identifies real malicious activity','Failing to detect an actual attack that is in progress','An attack that successfully bypasses all security controls undetected'],wrongTerms:['True Positive','False Negative','Advanced Evasion']},
  {term:'False Negative', d:'2', def:'A failure of a security system to detect actual malicious activity, allowing a real threat to go undetected.',hint:'Real attack  --  no alarm fired',wrongDefs:['An alert that fires when no actual threat exists','An alert that correctly identifies malicious activity','A system that blocks all traffic until explicitly allowed'],wrongTerms:['False Positive','True Positive','Default Deny']},
  {term:'Pivot', d:'2', def:'A technique where an attacker uses an already-compromised system as a launching point to attack other systems within the network, enabling lateral movement.',hint:'Use one compromised host to reach others',wrongDefs:['Gaining elevated privileges on a system to access restricted resources','Covering tracks by deleting logs after a successful attack','Exfiltrating data by encoding it within legitimate-looking traffic'],wrongTerms:['Privilege Escalation','Log Tampering','Data Exfiltration']},
  {term:'Privilege Escalation', d:'2', def:'An attack where a user gains access to resources or permissions beyond what they were originally granted, either by exploiting a vulnerability or misconfiguration.',hint:'Standard user -> admin  --  vertical or horizontal',wrongDefs:['An attack using a compromised host to attack other internal systems','An attack intercepting communication between two parties','An attack encrypting files and demanding payment'],wrongTerms:['Pivoting','MITM','Ransomware']},
  {term:'Shadow IT', d:'2', def:'Unauthorized hardware, software, or cloud services used by employees without the knowledge or approval of the IT or security department.',hint:'Employees using Dropbox, personal email, unapproved apps',wrongDefs:['Malware that hides within legitimate software installed by IT staff','A network of compromised machines controlled by a threat actor','Unauthorized access by former employees using old credentials'],wrongTerms:['Trojan','Botnet','Stale Credentials']},
  {term:'Insider Threat', d:'2', def:'A security risk originating from individuals with authorized access  --  employees, contractors, or partners  --  who misuse their access either maliciously or unintentionally.',hint:'The threat from within  --  malicious or accidental',wrongDefs:['An attack launched by an external threat actor who gained unauthorized access','Malware installed by an attacker who exploited a remote vulnerability','A supply chain attack targeting software before it reaches the organization'],wrongTerms:['External Threat','Remote Exploit','Supply Chain Attack']},
  {term:'Supply Chain Attack', d:'2', def:'An attack that targets a vendor, supplier, or partner to compromise their software or hardware, which is then distributed to downstream customers.',hint:'SolarWinds  --  attack the supplier, reach the customer',wrongDefs:['An attack directly targeting an organization\'s production servers','Malware spread through malicious email attachments to employees','An attack exploiting vulnerabilities in an organization\'s web application'],wrongTerms:['Direct Attack','Phishing','Web Application Attack']},
  {term:'OSINT', d:'2', def:'Open Source Intelligence  --  information gathered from publicly available sources such as social media, job postings, public records, and websites, often used by attackers for reconnaissance.',hint:'LinkedIn, job postings, public records  --  free recon',wrongDefs:['Intelligence gathered from intercepting encrypted communications','Information collected from compromised systems during an attack','Data obtained from dark web forums and criminal marketplaces'],wrongTerms:['SIGINT','Post-Exploitation Data','Dark Web Intel']},

  // Domain 3 additions
  {term:'Air Gap', d:'3', def:'A physical security measure where a system or network is completely isolated from unsecured networks, with no wired or wireless connections to external systems.',hint:'Physically isolated  --  no network connection at all',wrongDefs:['A firewall rule blocking all traffic between two network segments','A VPN tunnel encrypting all traffic between two locations','A VLAN separating sensitive systems from general network traffic'],wrongTerms:['Firewall Rule','VPN','VLAN']},
  {term:'NAC', d:'3', def:'Network Access Control  --  a security solution that enforces policy compliance (OS patches, antivirus, configuration) on devices before granting them network access.',hint:'Health check before network admission',wrongDefs:['A system that monitors network traffic and alerts on anomalous patterns','A device that filters packets based on IP address and port rules','A system that encrypts all data transmitted across a network'],wrongTerms:['IDS','Firewall','Network Encryption']},
  {term:'Jump Server', d:'3', def:'A hardened, monitored intermediary host used to securely access systems in a separate, higher-security network zone, reducing direct exposure of sensitive systems.',hint:'Bastion host  --  one door into the secure zone',wrongDefs:['A server that automatically takes over when the primary server fails','A server that distributes incoming traffic across multiple backend servers','A server that caches frequently requested web content for faster delivery'],wrongTerms:['Failover Server','Load Balancer','Proxy Cache']},
  {term:'Data Masking', d:'3', def:'Replacing real sensitive data with realistic but fictional data, used in non-production environments like testing and development.',hint:'Real-looking fake data for dev and test environments',wrongDefs:['Encrypting data so only authorized parties can read the original','Replacing sensitive data with non-sensitive tokens with no data value','Hiding secret data inside an ordinary file to avoid detection'],wrongTerms:['Encryption','Tokenization','Steganography']},
  {term:'Geo-fencing', d:'3', def:'A security control that restricts or monitors access to systems based on the geographic location of the user or device.',hint:'Block logins from unexpected countries',wrongDefs:['A control that restricts access based on the time of day','A control that limits access based on the type of device used','A control that enforces access based on network subnet membership'],wrongTerms:['Time-based Access','Device-based Access','Network-based Access']},

  // Domain 4 additions
  {term:'MTTR', d:'4', def:'Mean Time to Repair/Respond  --  the average time taken to restore a system after failure or to respond to a detected security incident.',hint:'Lower MTTR = better security operations',wrongDefs:['The average time between system failures or security incidents','The average time elapsed before a security breach is detected','The maximum time a system is permitted to be offline before violating the SLA'],wrongTerms:['MTBF','MTTD','RTO']},
  {term:'MTTD', d:'4', def:'Mean Time to Detect  --  the average time that elapses between when a breach occurs and when it is discovered by the security team.',hint:'How long before you find out you\'re breached?',wrongDefs:['The average time taken to restore a system after a detected incident','The average time between failures or security incidents in a system','The maximum acceptable downtime after a disaster as defined in the BCP'],wrongTerms:['MTTR','MTBF','RTO']},
  {term:'Forensic Imaging', d:'4', def:'Creating a bit-for-bit copy of storage media to preserve digital evidence in its original state for investigation, without altering the source.',hint:'Exact copy  --  bit for bit  --  evidence preservation',wrongDefs:['Scanning a system for malware after a suspected infection','Restoring a system from a backup after it has been compromised','Capturing network traffic for analysis during an incident'],wrongTerms:['Malware Scan','System Restore','Packet Capture']},
  {term:'Write Blocker', d:'4', def:'A hardware or software tool used in digital forensics to prevent any data from being written to the evidence drive, preserving its integrity.',hint:'Prevents contamination of evidence during imaging',wrongDefs:['A tool used to encrypt drives before forensic analysis','Software that redacts sensitive information from forensic reports','A device that controls write permissions on shared network folders'],wrongTerms:['Drive Encryption Tool','Report Redaction Tool','Network Share Controller']},
  {term:'Security Posture', d:'4', def:'The overall cybersecurity strength of an organization, reflecting its ability to predict, prevent, detect, and respond to threats based on its people, processes, and technology.',hint:'Overall security strength of an organization',wrongDefs:['The specific configuration of a single firewall or security device','The number of security incidents an organization experiences per year','The compliance status of an organization with regulatory requirements'],wrongTerms:['Device Configuration','Incident Count','Compliance Status']},
  {term:'Continuous Monitoring', d:'4', def:'An ongoing process of collecting and analyzing security data across an organization\'s systems and networks to maintain awareness of the security posture and detect threats in real time.',hint:'Always-on visibility  --  not just periodic audits',wrongDefs:['Conducting quarterly vulnerability scans of production systems','Reviewing security logs manually on a weekly basis','Running annual penetration tests to assess security controls'],wrongTerms:['Quarterly Scanning','Weekly Log Review','Annual Pen Test']},

  // Domain 5 additions
  {term:'Due Diligence', d:'5', def:'The process of thoroughly investigating and verifying information before making a security decision, such as evaluating a vendor\'s security practices before signing a contract.',hint:'Research before you commit  --  vendor assessments',wrongDefs:['Implementing security controls after a risk has been identified and accepted','Maintaining security controls that have already been implemented','Taking legal action after a security incident causes financial harm'],wrongTerms:['Risk Mitigation','Due Care','Legal Remediation']},
  {term:'Due Care', d:'5', def:'The ongoing responsibility to maintain and operate security controls properly once they have been implemented, demonstrating that reasonable steps are being taken to protect assets.',hint:'Doing what a reasonable person would do  --  ongoing',wrongDefs:['The process of researching and verifying information before a security decision','Transferring responsibility for security to a third-party provider','Documenting a known risk without taking action to address it'],wrongTerms:['Due Diligence','Risk Transfer','Risk Acceptance']},
  {term:'Data Owner', d:'5', def:'The individual or role responsible for determining the classification, acceptable use, and access policies for a specific set of data.',hint:'Sets classification and access policy  --  usually business leader',wrongDefs:['The IT team member who implements and maintains data security controls','The auditor who verifies that data is handled according to policy','The user who regularly accesses and updates the data'],wrongTerms:['Data Custodian','Data Auditor','Data User']},
  {term:'Data Custodian', d:'5', def:'The individual or team (often IT) responsible for implementing and maintaining the security controls for data, as directed by the data owner.',hint:'IT implements what the data owner decides',wrongDefs:['The business leader who sets classification and access policies for data','The auditor who ensures data is handled according to regulatory requirements','The end user who creates and modifies the data day-to-day'],wrongTerms:['Data Owner','Data Auditor','Data User']},
  {term:'Privacy', d:'5', def:'The right of individuals to control how their personal information is collected, used, and shared, protected through laws like GDPR and HIPAA.',hint:'Individual control over personal data',wrongDefs:['Ensuring that data has not been altered by unauthorized parties','Preventing unauthorized parties from accessing organizational data','Ensuring that systems and data are available when needed'],wrongTerms:['Integrity','Confidentiality','Availability']},
  {term:'Threat Modeling', d:'5', def:'A structured process for identifying potential threats, vulnerabilities, and attack vectors in a system during the design phase, enabling proactive risk reduction before deployment.',hint:'Find threats during design  --  before you build',wrongDefs:['Scanning a deployed system for known vulnerabilities','Testing a live system by simulating real-world attacks','Monitoring a production system for indicators of compromise'],wrongTerms:['Vulnerability Scanning','Penetration Testing','Threat Hunting']},
  {term:'Security by Design', d:'5', def:'The principle of integrating security considerations into every stage of a system\'s development lifecycle rather than adding security as an afterthought.',hint:'Build security in from the start  --  not bolted on later',wrongDefs:['Adding security controls to an existing system after deployment','Purchasing security appliances to protect an already-deployed application','Conducting penetration tests after a system has gone live'],wrongTerms:['Retrofit Security','Perimeter Security','Post-deployment Testing']},
  {term:'Job Rotation', d:'5', def:'A security control that periodically moves employees between roles to prevent the buildup of excessive privileges, detect fraud, and reduce insider threat risk.',hint:'Rotate roles  --  detects fraud, limits privilege accumulation',wrongDefs:['Requiring two employees to jointly approve sensitive transactions','Granting users only the minimum permissions needed for their current role','Requiring employees to take mandatory leave to expose potential fraud'],wrongTerms:['Dual Control','Least Privilege','Mandatory Vacation']},
  {term:'Mandatory Vacation', d:'5', def:'A security policy requiring employees to take a minimum period of leave, during which their access is suspended, to detect ongoing fraud or policy violations.',hint:'Forces absence  --  exposes hidden fraud schemes',wrongDefs:['Rotating employees between different roles to prevent privilege abuse','Requiring two employees to jointly complete sensitive transactions','Granting users only the minimum access needed for their job function'],wrongTerms:['Job Rotation','Dual Control','Least Privilege']},
];

var catNames = {
  '1':'D1 . General Security','2':'D2 . Threats and Vuln',
  '3':'D3 . Architecture','4':'D4 . SecOps','5':'D5 . Governance'
};

var category = 'all';
var mode = 'def2term';

function pickMode() { return 'def2term'; }
var current = null;
var currentMode = 'term2def';
var answered = false;
var questionQueue = [];
var stats = { correct: 0, wrong: 0, streak: 0, total: 0 };
var weakList = [];

function saveWeak() { try { localStorage.setItem('sp_weak_definitions', JSON.stringify(weakList)); } catch(e) {} }
function loadWeak() { try { var v = localStorage.getItem('sp_weak_definitions'); return v ? JSON.parse(v) : []; } catch(e) { return []; } }
weakList = loadWeak();

function setCategory(cat, btn) {
  category = cat;
  questionQueue = [];
  var btns = document.querySelectorAll('.cat-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  if (btn) btn.classList.add('active');
  updatePoolCount();
  nextQuestion();
}


function pool() {
  var base = TERMS.filter(function(t) {
    if (category === 'all' || category === 'weak') return true;
    return String(t.d) === String(category);
  });
  if (category === 'weak') {
    return base.filter(function(t) { return weakList.indexOf(t.term) !== -1; });
  }
  return base;
}

function updatePoolCount() {
  var p = pool();
  var el = document.getElementById('pool-count');
  if (el) el.textContent = p.length + ' term' + (p.length !== 1 ? 's' : '') + ' in pool';
}

function clearWeak() {
  if (!confirm('Clear your weak spots list? This cannot be undone.')) return;
  weakList = [];
  saveWeak();
  updatePoolCount();
  if (category === 'weak') nextQuestion();
}

function shuffle(arr) { return arr.slice().sort(function() { return Math.random() - 0.5; }); }


function nextQuestion() {
  answered = false;
  document.getElementById('explanation').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-ask').style.display = 'none';

  var p = pool();
  if (!p.length) {
    document.getElementById('question-area').innerHTML = '<div style="font-family:var(--mono);font-size:12px;color:var(--text3);text-align:center;padding:24px">No terms in this category. Try another!</div>';
    document.getElementById('answers').innerHTML = '';
    return;
  }

  // Queue-based selection - exhaust all terms before repeating
  var poolKey = category + '_' + weakList.join(',');
  if (!questionQueue.length || questionQueue._key !== poolKey) {
    questionQueue = shuffle(p.slice());
    questionQueue._key = poolKey;
  }
  // Avoid showing same term back-to-back
  if (questionQueue.length > 1 && current && questionQueue[0].term === current.term) {
    questionQueue.push(questionQueue.shift());
  }
  current = questionQueue.shift();
  currentMode = pickMode();

  var domClass = 'd' + current.d;
  var domName = DOMAIN_NAMES[current.d] || 'Domain ' + current.d;
  var isWeak = weakList.indexOf(current.term) !== -1;
  var area = document.getElementById('question-area');
  area.innerHTML = '';

  if (currentMode === 'term2def') {
    var card = document.createElement('div');
    card.className = 'term-card';
    card.innerHTML = '<div class="term-prompt">What is the definition of this term?</div>' +
      '<div class="term-domain ' + domClass + '">' + domName + '</div>' +
      '<div class="term-word">' + current.term + (isWeak ? '<span class="badge-review">review</span>' : '') + '</div>' +
      (current.hint ? '<div class="term-hint">' + current.hint + '</div>' : '');
    area.appendChild(card);
    var opts = shuffle([current.def].concat(current.wrongDefs));
    buildAnswers(opts, current.def);
  } else {
    var card2 = document.createElement('div');
    card2.className = 'def-card';
    card2.innerHTML = '<div class="def-prompt">Which term matches this definition?</div>' +
      '<div class="def-text">"' + current.def + '"</div>' +
      '<div class="def-domain ' + domClass + '">' + domName + (isWeak ? ' <span class="badge-review">review</span>' : '') + '</div>';
    area.appendChild(card2);
    var opts2 = shuffle([current.term].concat(current.wrongTerms));
    buildAnswers(opts2, current.term);
  }
}

function buildAnswers(opts, correct) {
  var container = document.getElementById('answers');
  container.innerHTML = '';
  for (var i = 0; i < opts.length; i++) {
    (function(opt) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = opt;
      btn.onclick = function() {
        if (!answered) check(opt, btn, correct);
      };
      container.appendChild(btn);
    })(opts[i]);
  }
}

function check(selected, btn, correct) {
  if (answered) return;
  answered = true;
  var isCorrect = selected === correct;

  stats.total++;
  if (isCorrect) {
    stats.correct++;
    stats.streak++;
    saveWeak();
  } else {
    stats.wrong++;
    stats.streak = 0;
    if (current && weakList.indexOf(current.term) === -1) {
      weakList.push(current.term);
    }
    saveWeak();
  }

  document.getElementById('s-correct').textContent = stats.correct;
  document.getElementById('s-wrong').textContent = stats.wrong;
  document.getElementById('s-streak').textContent = stats.streak;
  var acc = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) + '%' : ' -- ';
  var pct = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) : 0;
  var accEl = document.getElementById('s-acc');
  if (accEl) accEl.textContent = acc;

  // Highlight answer buttons
  var btns = document.getElementById('answers').querySelectorAll('.answer-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    if (btns[i].textContent === correct) btns[i].classList.add('correct');
    else if (btns[i].textContent === selected && !isCorrect) btns[i].classList.add('wrong');
  }

  if (!isCorrect) {
    document.getElementById('exp-text').innerHTML = '<span class="spinner"></span> Loading explanation...';
    document.getElementById('explanation').style.display = 'block';
    fetchExplanation();
  }

  document.getElementById('btn-next').style.display = 'block';
  document.getElementById('btn-ask').style.display = 'block';
  updatePoolCount();
  if(stats.total > 0 && stats.total % 10 === 0) logToDashboard(parseInt(current.d)||0,'Definitions Trainer',pct);
}

async function fetchExplanation() {
  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `You are a Security+ SY0-701 exam tutor. In 2 plain-English sentences, explain the term "${current.term}" and why a student should remember it for the exam. Be concrete and give a real-world example if possible. No markdown, no preamble.`
        }]
      })
    });
    var data = await res.json();
    document.getElementById('exp-text').textContent = data.content.map(i => i.text || '').join('');
  } catch (e) {
    document.getElementById('exp-text').textContent = `${current.term}: ${current.def}`;
  }
}

function askClaude() {
  var q = encodeURIComponent(`Can you explain "${current.term}" in more depth with a real-world example, and give me a memory trick to remember it for the Security+ exam?`);
  window.open(`https://claude.ai/new?q=${q}`, '_blank');
}

updatePoolCount();
nextQuestion();
</script>
