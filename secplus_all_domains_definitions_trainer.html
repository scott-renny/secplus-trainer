<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security+ Definitions Trainer -- SY0-701</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14; --surface: #161a23; --surface2: #1e2330;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0; --text2: #8a90a2; --text3: #555c70;
    --accent: #4f9eff; --accent-dim: rgba(79,158,255,0.12);
    --green: #3dd68c; --green-dim: rgba(61,214,140,0.12);
    --red: #ff5f6d; --red-dim: rgba(255,95,109,0.12);
    --amber: #ffb547; --amber-dim: rgba(255,181,71,0.12);
    --purple: #a78bfa; --purple-dim: rgba(167,139,250,0.12);
    --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px 48px; }
  .container { max-width: 600px; margin: 0 auto; }
  header { margin-bottom: 28px; padding-top: 8px; }
  .logo { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 600; line-height: 1.2; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 13px; color: var(--text2); margin-top: 5px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 3px; font-family: var(--mono); }
  .stat-value { font-size: 22px; font-weight: 600; font-family: var(--mono); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.amber { color: var(--amber); }
  .stat-value.purple { color: var(--purple); }

  .progress-bar { height: 3px; background: var(--border); border-radius: 99px; margin-bottom: 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; width: 0%; }

  .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .control-group { flex: 1; min-width: 140px; }
  .control-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; display: block; }

  .cat-section { margin-bottom: 16px; }
  .categories { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-btn { padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-size: 12px; font-family: var(--mono); transition: all 0.15s; }
  .cat-btn:hover { background: var(--surface2); color: var(--text); }
  .cat-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .mode-btn { padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-size: 12px; font-family: var(--mono); transition: all 0.15s; }
  .mode-btn:hover { background: var(--surface2); color: var(--text); }
  .mode-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  /* TERM &rarr; DEFINITION card */
  .term-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; margin-bottom: 14px; position: relative; overflow: hidden; text-align: center; }
  .term-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(79,158,255,0.25), transparent); }
  .term-prompt { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
  .term-word { font-family: var(--mono); font-size: clamp(24px, 5vw, 38px); font-weight: 700; color: var(--text); letter-spacing: 0.03em; line-height: 1.2; margin-bottom: 10px; }
  .term-hint { font-size: 13px; color: var(--text3); font-style: italic; }
  .term-domain { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; border-radius: 4px; margin-bottom: 14px; }

  /* DEFINITION &rarr; TERM card */
  .def-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px 22px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .def-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(61,214,140,0.25), transparent); }
  .def-prompt { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--green); margin-bottom: 14px; }
  .def-text { font-size: 16px; line-height: 1.75; color: var(--text); font-style: italic; border-left: 3px solid var(--green); padding-left: 16px; }
  .def-domain { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; border-radius: 4px; margin-top: 14px; }

  .answers { margin-bottom: 14px; display:flex; flex-direction:column; gap:9px; }
  .answer-btn {
    display:flex; align-items:center; gap:12px;
    padding:13px 16px; border-radius:10px;
    border:1px solid var(--border2); background:var(--panel2);
    cursor:pointer; text-align:left; width:100%;
    font-family:'Segoe UI',sans-serif; font-size:14px; color:var(--text);
    line-height:1.5; transition:all .15s; touch-action:manipulation;
  }
  .answer-btn:hover:not(:disabled) { border-color:var(--border3); background:var(--panel3); }
  .answer-btn:disabled { cursor:default; }
  .answer-btn.correct { border-color:var(--green)!important; background:rgba(0,255,136,0.07)!important; color:var(--green)!important; }
  .answer-btn.wrong   { border-color:var(--red)!important;   background:rgba(255,61,90,0.07)!important;  color:var(--red)!important; }
  .ans-btn { width: 100%; text-align: left; padding: 13px 16px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-size: 14px; font-family: var(--sans); transition: all 0.15s; margin-bottom: 8px; line-height: 1.5; }
  .ans-btn:hover:not(:disabled) { border-color: var(--border2); color: var(--text); background: #252b3a; }
  .ans-btn.correct { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .ans-btn.wrong { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .ans-btn:disabled { cursor: default; }

  .explanation { display: none; background: var(--surface2); border: 1px solid var(--border2); border-left: 3px solid var(--amber); border-radius: 10px; padding: 13px 15px; font-size: 13px; line-height: 1.7; color: var(--text2); margin-bottom: 14px; }
  .exp-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }

  .actions { display: flex; gap: 8px; }
  .btn-next { flex: 1; padding: 12px; border-radius: 9px; border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; display: none; }
  .btn-next:hover { background: rgba(79,158,255,0.2); }
  .btn-ask { flex: 1; padding: 12px; border-radius: 9px; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; display: none; }
  .btn-ask:hover { background: var(--surface2); color: var(--text); }

  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border2); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge-review { background: var(--amber-dim); color: var(--amber); font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-left: 7px; vertical-align: middle; display: inline-block; }

  .counter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .pool-count { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  footer { margin-top: 36px; text-align: center; font-size: 11px; color: var(--text3); font-family: var(--mono); }

  .d1 { background: rgba(79,158,255,0.12); color: var(--accent); }
  .d2 { background: rgba(255,95,109,0.12); color: var(--red); }
  .d3 { background: rgba(167,139,250,0.12); color: var(--purple); }
  .d4 { background: rgba(61,214,140,0.12); color: var(--green); }
  .d5 { background: rgba(255,181,71,0.12); color: var(--amber); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">CompTIA Security+ &middot; SY0-701</div>
    <h1>Definitions <span>Trainer</span></h1>
    <p class="subtitle">180 terms across all 5 domains -- given a definition, name the term</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-label">Correct</div><div class="stat-value green" id="s-correct">0</div></div>
    <div class="stat"><div class="stat-label">Wrong</div><div class="stat-value red" id="s-wrong">0</div></div>
    <div class="stat"><div class="stat-label">Streak</div><div class="stat-value amber" id="s-streak">0</div></div>
    <div class="stat"><div class="stat-label">Accuracy</div><div class="stat-value purple" id="s-acc">--</div></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="cat-section">
    <div class="cat-section-label">Filter by domain</div>
    <div class="categories">
      <button class="cat-btn active" onclick="setCategory('all',this)">All</button>
      <button class="cat-btn" onclick="setCategory('1',this)">D1 -- General Security</button>
      <button class="cat-btn" onclick="setCategory('2',this)">D2 -- Threats + Vuln</button>
      <button class="cat-btn" onclick="setCategory('3',this)">D3 -- Architecture</button>
      <button class="cat-btn" onclick="setCategory('4',this)">D4 -- SecOps</button>
      <button class="cat-btn" onclick="setCategory('5',this)">D5 -- Governance</button>
      <button class="cat-btn" onclick="setCategory('weak',this)" id="weak-def-btn">&#9888; Weak Spots</button>
    </div>
  </div>

  <div class="counter-bar">
    <span class="pool-count" id="pool-count">180 terms in pool</span>
    <button id="clear-weak-btn" onclick="clearWeak()" style="display:none;background:transparent;border:1px solid var(--red);border-radius:5px;color:var(--red);font-family:var(--mono);font-size:10px;padding:3px 10px;cursor:pointer">Clear weak list</button>
  </div>

  <div id="question-area"></div>

  <div class="answers" id="answers"></div>

  <div class="explanation" id="explanation">
    <div class="exp-label">Why it matters</div>
    <div id="exp-text"></div>
  </div>

  <div class="actions">
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next &rarr;</button>
    <button class="btn-ask" id="btn-ask" onclick="askClaude()">Ask Claude &nearr;</button>
  </div>

  <footer>built for your security+ journey &middot; exam june 23</footer>
</div>

<script>
function logToDashboard(domain,type,score){
  try{
    var s=JSON.parse(localStorage.getItem('sp_sessions')||'[]');
    var now=new Date();
    s.push({domain,type,score,date:now.toLocaleDateString('en-CA',{month:'short',day:'numeric'}),ts:now.getTime()});
    localStorage.setItem('sp_sessions',JSON.stringify(s));
  }catch(e){}
}
const DOMAIN_NAMES = {
  '1':'General Security Concepts',
  '2':'Threats, Vulnerabilities and Mitigations',
  '3':'Security Architecture',
  '4':'Security Operations',
  '5':'Security Program Management and Oversight'
};

// Each entry: term, definition, domain, hint (optional), wrong answers (3 wrong defs for term2def, 3 wrong terms for def2term)
const TERMS = [
  // ── DOMAIN 1 — GENERAL SECURITY CONCEPTS ──────────────────────
  {term:'CIA Triad', d:'1', def:'The three core principles of information security: Confidentiality, Integrity, and Availability.',hint:'Foundation of all security decisions',wrongDefs:['Authentication, Authorization, and Accounting','Confidentiality, Identity, and Access','Control, Integrity, and Audit'],wrongTerms:['AAA','DAD Triad','Security Triangle']},
  {term:'Confidentiality', d:'1', def:'Ensuring that information is accessible only to those authorized to access it.',hint:'Prevents unauthorized disclosure',wrongDefs:['Ensuring data has not been altered by unauthorized parties','Ensuring systems are accessible when needed','Verifying the identity of users'],wrongTerms:['Integrity','Availability','Authentication']},
  {term:'Integrity', d:'1', def:'Ensuring that data has not been altered or tampered with by unauthorized parties.',hint:'Data is trustworthy and accurate',wrongDefs:['Ensuring information is accessible only to authorized users','Ensuring systems remain operational','Verifying the source of a message'],wrongTerms:['Confidentiality','Availability','Non-repudiation']},
  {term:'Availability', d:'1', def:'Ensuring that systems and data are accessible and operational when needed by authorized users.',hint:'Uptime and accessibility',wrongDefs:['Preventing unauthorized access to data','Ensuring data has not been tampered with','Verifying user identity before granting access'],wrongTerms:['Confidentiality','Integrity','Redundancy']},
  {term:'Non-repudiation', d:'1', def:'A security principle that prevents a party from denying they performed an action or sent a message.',hint:'You cannot deny what you did',wrongDefs:['Encrypting data so it cannot be read in transit','Ensuring systems remain available at all times','Requiring multiple authentication factors'],wrongTerms:['Authentication','Authorization','Integrity']},
  {term:'Authentication', d:'1', def:'The process of verifying the identity of a user, device, or system.',hint:'Proving you are who you claim to be',wrongDefs:['Determining what resources a user is permitted to access','Recording actions taken by users on a system','Ensuring data has not been altered'],wrongTerms:['Authorization','Accounting','Identification']},
  {term:'Authorization', d:'1', def:'The process of determining what resources or actions an authenticated user is permitted to access or perform.',hint:'What are you allowed to do?',wrongDefs:['Verifying the identity of a user or device','Recording system events for audit purposes','Encrypting data during transmission'],wrongTerms:['Authentication','Accounting','Access control']},
  {term:'Least Privilege', d:'1', def:'The principle that users, programs, and systems should be granted only the minimum access rights needed to perform their function.',hint:'Access only what you need',wrongDefs:['Granting all permissions to administrators by default','Sharing credentials between users to reduce overhead','Blocking all access unless explicitly approved by management'],wrongTerms:['Need to Know','Separation of Duties','Zero Trust']},
  {term:'Separation of Duties', d:'1', def:'Dividing critical tasks among multiple individuals so no single person can complete a sensitive process alone, preventing fraud and errors.',hint:'No single person controls the whole process',wrongDefs:['Granting users the minimum permissions needed','Using multiple authentication factors','Restricting access based on job role'],wrongTerms:['Least Privilege','Job Rotation','Dual Control']},
  {term:'Defense in Depth', d:'1', def:'A layered security strategy using multiple controls so that if one layer fails, others remain in place to protect assets.',hint:'Multiple overlapping layers of security',wrongDefs:['Using a single strong firewall to protect the network perimeter','Encrypting all data at rest and in transit','Backing up data to multiple locations'],wrongTerms:['Zero Trust','Hardening','Segmentation']},
  {term:'Zero Trust', d:'1', def:'A security model that assumes no user, device, or network segment is inherently trusted, requiring continuous verification of all access requests.',hint:'Never trust, always verify',wrongDefs:['A model that trusts all internal network traffic by default','A perimeter-based security strategy using firewalls','Blocking all external traffic until manually approved'],wrongTerms:['Defense in Depth','Least Privilege','Micro-perimeter']},
  {term:'Symmetric Encryption', d:'1', def:'A type of encryption where the same key is used for both encrypting and decrypting data.',hint:'One shared key  --  examples: AES, DES',wrongDefs:['Encryption using a public key to encrypt and a private key to decrypt','A hashing method that produces a fixed-length output','Encryption requiring two separate keys held by different parties'],wrongTerms:['Asymmetric Encryption','Public Key Cryptography','Hashing']},
  {term:'Asymmetric Encryption', d:'1', def:'Encryption using a key pair: a public key to encrypt and a mathematically related private key to decrypt.',hint:'Public/private key pair  --  examples: RSA, ECC',wrongDefs:['Encryption where the same key encrypts and decrypts data','A hashing algorithm producing a fixed-length digest','Encryption requiring both parties to share a secret key'],wrongTerms:['Symmetric Encryption','Hashing','Key Exchange']},
  {term:'Hashing', d:'1', def:'A one-way function that converts data of any size into a fixed-length digest, used to verify data integrity.',hint:'One-way, fixed length  --  SHA-256, MD5',wrongDefs:['Converting plaintext into ciphertext using a secret key','Encrypting data with a public key for secure transmission','Creating a reversible transformation of data for storage'],wrongTerms:['Encryption','Encoding','Salting']},
  {term:'Salting', d:'1', def:'Adding a random value to data (typically a password) before hashing to ensure identical inputs produce different hash outputs.',hint:'Defeats rainbow table attacks',wrongDefs:['Encrypting a password before storing it in a database','Adding a timestamp to a message to prevent replay attacks','Stretching a key by applying a hash function many times'],wrongTerms:['Key stretching','Pepper','Encoding']},
  {term:'Digital Signature', d:'1', def:'A cryptographic mechanism using a sender\'s private key to sign data, allowing recipients to verify authenticity and integrity.',hint:'Provides non-repudiation and integrity',wrongDefs:['A symmetric key used to encrypt email attachments','A one-time password generated by a hardware token','A certificate that identifies a web server to browsers'],wrongTerms:['Digital Certificate','HMAC','Public Key']},
  {term:'Digital Certificate', d:'1', def:'An electronic document issued by a Certificate Authority that binds a public key to an identity, used to establish trust.',hint:'Issued by a CA  --  part of PKI',wrongDefs:['A private key stored on a smart card for authentication','A one-way hash used to verify file integrity','A shared secret key used in symmetric encryption'],wrongTerms:['Public Key','Digital Signature','Token']},
  {term:'PKI', d:'1', def:'Public Key Infrastructure  --  the framework of roles, policies, hardware, and software used to create, manage, distribute, and revoke digital certificates.',hint:'The ecosystem that makes certificates work',wrongDefs:['A symmetric encryption standard used to protect data at rest','A network protocol for authenticating remote users','A database storing all password hashes in an organization'],wrongTerms:['CA Hierarchy','Key Management System','Directory Service']},
  {term:'Certificate Authority', d:'1', def:'A trusted third party that issues and signs digital certificates, verifying that a public key belongs to the stated identity.',hint:'The trust anchor of PKI',wrongDefs:['A server that stores private keys for users','A protocol that encrypts communication between a browser and server','A device that generates one-time passwords for MFA'],wrongTerms:['Registration Authority','Key Distribution Center','Trust Store']},
  {term:'Multi-Factor Authentication', d:'1', def:'Authentication requiring two or more different factor types: something you know, something you have, or something you are.',hint:'Password + token or biometric',wrongDefs:['Using a very long and complex password to protect accounts','Logging into multiple systems with a single set of credentials','Requiring two administrators to approve access to sensitive data'],wrongTerms:['Single Sign-On','Dual Control','Biometric Authentication']},
  {term:'RBAC', d:'1', def:'Role-Based Access Control  --  an access control model where permissions are assigned to roles, and users are assigned to roles based on job function.',hint:'Permissions follow the job, not the person',wrongDefs:['Access control where the resource owner decides who can access it','Access control enforced by the OS using security labels','Access control based on user attributes like location and department'],wrongTerms:['DAC','MAC','ABAC']},
  {term:'DAC', d:'1', def:'Discretionary Access Control  --  an access control model where the owner of a resource decides who is permitted to access it.',hint:'Owner controls access',wrongDefs:['Access control where permissions are assigned based on job role','Access control enforced by the OS using security classification labels','Access control based on environmental and user attributes'],wrongTerms:['RBAC','MAC','ABAC']},
  {term:'MAC', d:'1', def:'Mandatory Access Control  --  an access control model where the operating system enforces access based on security labels; users cannot override these.',hint:'OS enforces it  --  common in government systems',wrongDefs:['Access control where the resource owner sets permissions','Access control based on user roles and job functions','Access control that evaluates multiple attributes at runtime'],wrongTerms:['DAC','RBAC','ABAC']},
  {term:'Identification', d:'1', def:'The process of claiming an identity, such as providing a username, before authentication verifies that claim.',hint:'Who are you claiming to be?',wrongDefs:['Verifying that a claimed identity is genuine','Determining what actions an authenticated user may take','Recording actions performed by users for audit purposes'],wrongTerms:['Authentication','Authorization','Accounting']},

  // ── DOMAIN 2 — THREATS, VULNERABILITIES & MITIGATIONS ─────────
  {term:'Phishing', d:'2', def:'A social engineering attack using fraudulent emails that impersonate legitimate entities to trick recipients into revealing credentials or clicking malicious links.',hint:'Fraudulent email  --  most common attack vector',wrongDefs:['A voice-based attack where callers impersonate IT support','A text message attack used to steal credentials via mobile devices','An attack targeting specific high-value executives with tailored messages'],wrongTerms:['Vishing','Smishing','Whaling']},
  {term:'Spear Phishing', d:'2', def:'A targeted phishing attack directed at a specific individual or organization, using personalized information to appear more convincing.',hint:'Targeted phishing  --  uses personal details',wrongDefs:['A mass phishing campaign sent to thousands of random recipients','A phone-based social engineering attack impersonating IT support','An attack targeting C-suite executives with financial fraud schemes'],wrongTerms:['Whaling','Vishing','Phishing']},
  {term:'Whaling', d:'2', def:'A spear phishing attack specifically targeting high-level executives such as CEOs or CFOs, often involving financial fraud.',hint:'Big fish  --  executives are the target',wrongDefs:['A phishing attack sent to a broad audience without targeting','An SMS-based attack tricking users into revealing credentials','A physical tailgating attack to gain unauthorized building access'],wrongTerms:['Spear Phishing','Smishing','Tailgating']},
  {term:'Vishing', d:'2', def:'Voice phishing  --  a social engineering attack conducted over the phone or VoIP, where attackers impersonate legitimate entities to extract sensitive information.',hint:'Voice + phishing',wrongDefs:['Email-based social engineering impersonating a trusted sender','SMS-based attacks tricking users into clicking malicious links','An attack using fake Wi-Fi access points to intercept traffic'],wrongTerms:['Phishing','Smishing','Evil Twin']},
  {term:'Social Engineering', d:'2', def:'Psychological manipulation of people into performing actions or divulging confidential information, exploiting human behavior rather than technical vulnerabilities.',hint:'Hacking the human',wrongDefs:['Exploiting software bugs to gain unauthorized system access','Using brute force to guess passwords through automated tools','Intercepting network traffic to capture sensitive credentials'],wrongTerms:['Exploitation','Password Attack','Eavesdropping']},
  {term:'Ransomware', d:'2', def:'Malware that encrypts a victim\'s files and demands payment (usually cryptocurrency) in exchange for the decryption key.',hint:'WannaCry, CryptoLocker  --  pay or lose data',wrongDefs:['Malware that replicates itself across networks without user interaction','Malware that silently records keystrokes and sends them to an attacker','Software that displays unwanted advertisements to generate revenue'],wrongTerms:['Worm','Keylogger','Adware']},
  {term:'Worm', d:'2', def:'Self-replicating malware that spreads across networks automatically without requiring user interaction or a host program.',hint:'Self-spreads across networks  --  no user needed',wrongDefs:['Malware disguised as legitimate software that creates a backdoor','Malware that encrypts files and demands payment','Software that records keystrokes and exfiltrates them to attackers'],wrongTerms:['Trojan','Ransomware','Keylogger']},
  {term:'Trojan', d:'2', def:'Malware disguised as legitimate software that, once executed by the user, performs malicious actions such as creating backdoors.',hint:'Looks legit  --  hides malicious payload',wrongDefs:['Malware that self-replicates and spreads without user interaction','Malware that encrypts files and demands cryptocurrency payment','Malware that hides inside the OS to maintain privileged access'],wrongTerms:['Worm','Ransomware','Rootkit']},
  {term:'Rootkit', d:'2', def:'Malware that modifies the operating system to hide its presence and maintain persistent privileged access, making it very difficult to detect.',hint:'Hides in the OS  --  extremely difficult to detect',wrongDefs:['Malware that self-replicates across networks','Software that records user keystrokes and exfiltrates them','Malware that encrypts files and demands payment to restore them'],wrongTerms:['Worm','Keylogger','Ransomware']},
  {term:'Botnet', d:'2', def:'A network of compromised computers (bots) controlled by a threat actor, commonly used to launch DDoS attacks or send spam.',hint:'Army of infected machines',wrongDefs:['A decoy network designed to attract and study attackers','A network of redundant servers providing high availability','A system for monitoring and correlating security events'],wrongTerms:['Honeypot','Cluster','SIEM']},
  {term:'APT', d:'2', def:'Advanced Persistent Threat  --  a prolonged, stealthy cyberattack where the threat actor maintains long-term unauthorized access, typically to exfiltrate data.',hint:'Long-term, stealthy  --  often nation-state',wrongDefs:['A one-time attack designed to crash target systems immediately','An automated scanning tool that probes for open vulnerabilities','A brute-force campaign using automated password guessing'],wrongTerms:['DDoS','Vulnerability Scanner','Credential Stuffing']},
  {term:'SQL Injection', d:'2', def:'An attack that inserts malicious SQL code into an input field to manipulate a database, potentially exposing or modifying data.',hint:'Input -> database query manipulation',wrongDefs:['An attack injecting malicious scripts into web pages viewed by others','Intercepting data between a user and server to steal credentials','Overwhelming a server with requests until it becomes unavailable'],wrongTerms:['XSS','MITM','DoS']},
  {term:'Cross-Site Scripting', d:'2', def:'An attack where malicious scripts are injected into trusted web pages, executing in the browsers of other users to steal cookies or credentials.',hint:'XSS  --  injected script runs in victim\'s browser',wrongDefs:['Inserting malicious SQL to manipulate a database query','Forging requests that trick authenticated users into unwanted actions','Intercepting traffic between two communicating parties'],wrongTerms:['SQL Injection','CSRF','MITM']},
  {term:'CSRF', d:'2', def:'Cross-Site Request Forgery  --  an attack that tricks an authenticated user into unknowingly submitting a malicious request, exploiting their active session.',hint:'Forged request using victim\'s authenticated session',wrongDefs:['Injecting malicious scripts into web pages to steal user data','Intercepting and modifying communication between two parties','Overwhelming a target with traffic to deny legitimate access'],wrongTerms:['XSS','MITM','DDoS']},
  {term:'MITM', d:'2', def:'Man-in-the-Middle  --  an attack where the attacker secretly intercepts and potentially alters communication between two parties who believe they are communicating directly.',hint:'Attacker sits between sender and receiver',wrongDefs:['Flooding a target with traffic to make it unavailable','Injecting malicious SQL into a database query','Using fraudulent emails to trick users into revealing credentials'],wrongTerms:['DDoS','SQL Injection','Phishing']},
  {term:'DDoS', d:'2', def:'Distributed Denial of Service  --  an attack that uses multiple compromised systems to flood a target with traffic, exhausting resources and denying service to legitimate users.',hint:'Many sources, one target  --  uses a botnet',wrongDefs:['A single-source attack aimed at crashing one specific server','An attack that intercepts communication between two parties','Malware that encrypts files and demands cryptocurrency payment'],wrongTerms:['DoS','MITM','Ransomware']},
  {term:'Typosquatting', d:'2', def:'Registering domain names that are intentional misspellings or lookalikes of legitimate domains to capture users who make typographical errors.',hint:'g00gle.com  --  exploits typing mistakes',wrongDefs:['Hijacking an existing domain by exploiting DNS vulnerabilities','Creating a fake website that mimics a legitimate one to steal credentials','Intercepting DNS queries to redirect users to malicious sites'],wrongTerms:['Domain Hijacking','Credential Harvesting','DNS Poisoning']},
  {term:'Zero-Day', d:'2', def:'A vulnerability that is unknown to the software vendor and has no patch available, making it especially dangerous as defenders have no time to prepare.',hint:'No patch exists yet  --  zero days to defend',wrongDefs:['A vulnerability that was patched but not applied to systems','An exploit that only works on systems older than a specific version','A known bug that requires physical access to exploit'],wrongTerms:['Unpatched Vulnerability','Legacy Exploit','Insider Threat']},
  {term:'Buffer Overflow', d:'2', def:'A vulnerability where a program writes more data to a buffer than it can hold, overwriting adjacent memory and potentially allowing arbitrary code execution.',hint:'Overflow -> overwrite -> execute code',wrongDefs:['An attack inserting malicious SQL into a database query','A memory leak that gradually consumes all available RAM','Injecting malicious scripts into web pages to steal session tokens'],wrongTerms:['SQL Injection','Memory Leak','XSS']},
  {term:'Logic Bomb', d:'2', def:'Malicious code inserted into a system that remains dormant until triggered by a specific condition such as a date, time, or user event.',hint:'Dormant until triggered  --  often planted by insiders',wrongDefs:['Malware that immediately replicates across the network upon execution','An exploit targeting systems before the vendor releases a patch','Software that displays advertisements and tracks browsing behavior'],wrongTerms:['Worm','Zero-Day','Adware']},

  // ── DOMAIN 3 — SECURITY ARCHITECTURE ──────────────────────────
  {term:'DMZ', d:'3', def:'Demilitarized Zone  --  a network segment that acts as a buffer between the public internet and an organization\'s internal network, hosting public-facing servers.',hint:'Buffer zone  --  web servers, email gateways',wrongDefs:['A virtual network used to isolate IoT devices from corporate systems','A dedicated management network for security monitoring tools','A subnet used exclusively for backup and disaster recovery systems'],wrongTerms:['VLAN','Management Zone','Backup Network']},
  {term:'VLAN', d:'3', def:'Virtual Local Area Network  --  a logical network segmentation that isolates groups of devices without requiring physical separation.',hint:'Logical segmentation  --  no physical rewiring needed',wrongDefs:['A network zone hosting publicly accessible servers','A type of VPN used to encrypt traffic between branch offices','A network protocol used to detect and prevent intrusions'],wrongTerms:['DMZ','Site-to-Site VPN','IPS']},
  {term:'VPN', d:'3', def:'Virtual Private Network  --  a technology that creates an encrypted tunnel over a public network, allowing secure remote access or site-to-site connectivity.',hint:'Encrypted tunnel over the internet',wrongDefs:['A network segment isolating public-facing servers from internal systems','A logical network segmentation technique using software','A proxy server used to filter and inspect web traffic'],wrongTerms:['DMZ','VLAN','Proxy']},
  {term:'Microsegmentation', d:'3', def:'A security technique that creates fine-grained security zones around individual workloads or applications to limit lateral movement within a network.',hint:'Granular zones per workload  --  key Zero Trust component',wrongDefs:['Dividing a network into large functional zones like DMZ and LAN','Using VLANs to separate guest traffic from corporate traffic','Creating redundant network paths to ensure high availability'],wrongTerms:['Network Segmentation','VLAN Tagging','Redundancy']},
  {term:'IaaS', d:'3', def:'Infrastructure as a Service  --  a cloud model where the provider supplies virtualized hardware; the customer manages the OS, middleware, applications, and data.',hint:'Most customer control  --  you manage the OS',wrongDefs:['A cloud model where the provider manages everything including the application','A cloud model where the provider manages the OS and runtime environment','A serverless model where customers run individual functions without managing servers'],wrongTerms:['SaaS','PaaS','FaaS']},
  {term:'PaaS', d:'3', def:'Platform as a Service  --  a cloud model where the provider manages the OS and runtime; the customer manages applications and data.',hint:'Provider handles OS  --  you deploy apps',wrongDefs:['A cloud model where the provider manages everything including apps and data','A cloud model where the customer manages everything above the hardware','A cloud deployment where all infrastructure is owned by the customer'],wrongTerms:['SaaS','IaaS','Private Cloud']},
  {term:'SaaS', d:'3', def:'Software as a Service  --  a cloud model where the provider manages everything including the application; the customer only manages data and user access.',hint:'Least customer control  --  just use the app',wrongDefs:['A model where the customer manages the OS and applications','A model where the customer deploys and manages their own infrastructure','A model where the customer controls the runtime and middleware'],wrongTerms:['IaaS','PaaS','Hosted Infrastructure']},
  {term:'Shared Responsibility Model', d:'3', def:'A cloud security framework defining which security tasks are managed by the cloud provider and which are the customer\'s responsibility, varying by service model.',hint:'Provider + customer split  --  varies by IaaS/PaaS/SaaS',wrongDefs:['A policy requiring two administrators to approve all system changes','A backup strategy where both on-premises and cloud copies are maintained','A compliance framework requiring joint audits by vendor and customer'],wrongTerms:['Dual Control','Hybrid Backup','Joint Audit']},
  {term:'High Availability', d:'3', def:'A system design goal ensuring services remain operational with minimal downtime, typically achieved through redundancy and automatic failover.',hint:'Systems stay up  --  automatic failover',wrongDefs:['The ability to recover systems from a catastrophic failure within the RTO','Encrypting all data at rest to maintain confidentiality during failures','Backing up data to multiple geographic locations for disaster recovery'],wrongTerms:['Disaster Recovery','Data Encryption','Geo-Redundancy']},
  {term:'Honeypot', d:'3', def:'A decoy system intentionally made to appear vulnerable, designed to attract attackers and allow security teams to study their techniques.',hint:'Decoy to lure and study attackers',wrongDefs:['A security appliance that combines firewall, IDS, and antivirus capabilities','A monitoring tool that captures all network traffic for analysis','A redundant server that activates automatically when the primary fails'],wrongTerms:['UTM','Packet Analyzer','Failover Server']},
  {term:'Load Balancer', d:'3', def:'A device or software that distributes incoming network traffic across multiple servers to ensure no single server is overwhelmed, improving performance and availability.',hint:'Spreads traffic across servers',wrongDefs:['A device that filters network packets based on rules','A system that monitors servers and alerts on anomalous behavior','A hardware security module storing cryptographic keys'],wrongTerms:['Firewall','SIEM','HSM']},
  {term:'WAF', d:'3', def:'Web Application Firewall  --  a security control that filters and monitors HTTP/HTTPS traffic to and from a web application, protecting against attacks like XSS and SQL injection.',hint:'Filters web traffic  --  sits in front of web apps',wrongDefs:['A network firewall that controls traffic between network segments','A system that detects intrusions by monitoring network traffic patterns','A proxy server used to anonymize and filter outbound traffic'],wrongTerms:['NGFW','IDS','Proxy']},
  {term:'IaC', d:'3', def:'Infrastructure as Code  --  the practice of managing and provisioning infrastructure through machine-readable configuration files rather than manual processes.',hint:'Define infrastructure in code  --  enables version control',wrongDefs:['A cloud security framework defining shared responsibilities between provider and customer','A method of encrypting data before storing it in cloud infrastructure','A compliance standard for cloud service providers handling payment data'],wrongTerms:['Shared Responsibility Model','Cloud Encryption','PCI-DSS']},

  // ── DOMAIN 4 — SECURITY OPERATIONS ────────────────────────────
  {term:'SIEM', d:'4', def:'Security Information and Event Management  --  a platform that collects, aggregates, and correlates log data from across an environment to detect threats and support incident response.',hint:'Centralized log correlation and alerting',wrongDefs:['A tool that automatically responds to security incidents without human intervention','A network monitoring system that blocks detected threats in real time','A vulnerability scanner that identifies weaknesses in systems and applications'],wrongTerms:['SOAR','IPS','Vulnerability Scanner']},
  {term:'SOAR', d:'4', def:'Security Orchestration, Automation, and Response  --  a platform that automates repetitive security tasks and orchestrates incident response workflows to improve SOC efficiency.',hint:'Automates SOC workflows  --  works with SIEM',wrongDefs:['A centralized platform for collecting and correlating security logs','A network device that actively blocks detected intrusions','A tool for scanning systems and reporting known vulnerabilities'],wrongTerms:['SIEM','IPS','Vulnerability Scanner']},
  {term:'EDR', d:'4', def:'Endpoint Detection and Response  --  a security solution that continuously monitors endpoints for threats, records activity, and enables investigation and response.',hint:'Monitors endpoints continuously  --  records everything',wrongDefs:['A centralized log management and correlation platform','A tool that scans networks for open ports and vulnerabilities','A system that filters HTTP traffic to web applications'],wrongTerms:['SIEM','Network Scanner','WAF']},
  {term:'Threat Hunting', d:'4', def:'A proactive security practice where analysts actively search for threats that have evaded automated detection tools, assuming the environment may already be compromised.',hint:'Proactive  --  assumes you\'re already breached',wrongDefs:['Responding to alerts generated by a SIEM or IDS','Running automated scans to identify known vulnerabilities','Reviewing audit logs to confirm a system complies with policy'],wrongTerms:['Incident Response','Vulnerability Scanning','Compliance Audit']},
  {term:'Incident Response', d:'4', def:'A structured process for detecting, containing, eradicating, and recovering from security incidents, following the NIST lifecycle: Prepare, Identify, Contain, Eradicate, Recover, Lessons Learned.',hint:'NIST IR lifecycle  --  6 phases',wrongDefs:['Proactively searching for threats that evaded automated detection','Continuously monitoring endpoints for indicators of compromise','Scanning systems for known vulnerabilities before attackers can exploit them'],wrongTerms:['Threat Hunting','EDR','Vulnerability Management']},
  {term:'Chain of Custody', d:'4', def:'A chronological record documenting who collected, handled, transferred, and analyzed evidence, ensuring its integrity and admissibility in legal proceedings.',hint:'Critical for digital forensics  --  court admissibility',wrongDefs:['The documented process for approving changes to production systems','A log of all user authentication events on a network','A record of all patches applied to systems in chronological order'],wrongTerms:['Change Management Log','Authentication Log','Patch History']},
  {term:'Order of Volatility', d:'4', def:'A forensic principle dictating that evidence should be collected from most volatile (RAM, running processes) to least volatile (disk, logs, archives) to avoid data loss.',hint:'RAM first, then disk, then logs',wrongDefs:['A ranking of threat severity used to prioritize incident response actions','The order in which firewall rules are evaluated against network traffic','A sequence for patching systems based on criticality and exposure'],wrongTerms:['Threat Prioritization','Rule Order','Patch Priority']},
  {term:'IOC', d:'4', def:'Indicator of Compromise  --  evidence that a system or network may have been breached, such as unusual outbound connections, known malicious file hashes, or suspicious account creation.',hint:'Evidence a breach occurred  --  hash, IP, domain',wrongDefs:['A rule used by an IDS to detect known attack patterns','A metric measuring how long it takes to detect a security incident','A standard format for sharing threat intelligence between organizations'],wrongTerms:['IDS Signature','MTTD','STIX']},
  {term:'Penetration Testing', d:'4', def:'An authorized simulated attack against a system or network to identify and demonstrate real-world exploitable vulnerabilities, going beyond vulnerability scanning by attempting actual exploitation.',hint:'Authorized ethical hacking  --  finds what\'s actually exploitable',wrongDefs:['Scanning systems to identify known vulnerabilities without attempting exploitation','Monitoring network traffic for anomalous behavior and alerting on threats','Reviewing system configurations to verify compliance with security baselines'],wrongTerms:['Vulnerability Scanning','IDS','Configuration Review']},
  {term:'Vulnerability Scanning', d:'4', def:'An automated assessment that identifies known vulnerabilities, misconfigurations, and weaknesses in systems without attempting to exploit them.',hint:'Identifies vulnerabilities  --  does not exploit',wrongDefs:['An authorized attack that actively exploits vulnerabilities to assess risk','A proactive hunt for threats that evaded automated detection tools','A real-time monitoring system that blocks detected network threats'],wrongTerms:['Penetration Testing','Threat Hunting','IPS']},
  {term:'UEBA', d:'4', def:'User and Entity Behavior Analytics  --  a security technology that establishes baselines of normal behavior for users and systems, then alerts on anomalous deviations that may indicate compromise.',hint:'Behavioral baselines  --  detects insider threats',wrongDefs:['A centralized log collection and correlation platform for threat detection','A tool for automating repetitive incident response workflows','A system that continuously monitors endpoints for malicious activity'],wrongTerms:['SIEM','SOAR','EDR']},
  {term:'Sandboxing', d:'4', def:'Executing untrusted code or files in an isolated environment to safely observe behavior without risking the production system.',hint:'Isolated environment  --  safe malware analysis',wrongDefs:['Encrypting files before sending them to external parties','Blocking unknown applications from running on endpoints','Restoring systems from backup after a malware infection'],wrongTerms:['Encryption','Application Whitelisting','Recovery']},
  {term:'Tabletop Exercise', d:'4', def:'A discussion-based simulation where team members walk through their response to a hypothetical incident scenario, identifying gaps in plans and procedures without taking technical action.',hint:'Discussion-based  --  no actual systems involved',wrongDefs:['A hands-on test where backup systems are fully activated and tested','A technical simulation where the SOC responds to a live simulated attack','A vulnerability scan conducted during a scheduled maintenance window'],wrongTerms:['Failover Test','Red Team Exercise','Maintenance Scan']},
  {term:'DLP', d:'4', def:'Data Loss Prevention  --  a set of tools and policies that monitor, detect, and block the unauthorized transfer or exfiltration of sensitive data.',hint:'Prevents data from leaving unauthorized',wrongDefs:['A tool that encrypts data at rest to prevent unauthorized access','A system that monitors user behavior and alerts on anomalies','A network control that blocks malicious traffic at the perimeter'],wrongTerms:['Encryption','UEBA','Firewall']},

  // ── DOMAIN 5 — SECURITY PROGRAM MANAGEMENT & OVERSIGHT ────────
  {term:'Risk Assessment', d:'5', def:'The process of identifying, analyzing, and evaluating risks to determine their likelihood and potential impact, enabling informed prioritization of security controls.',hint:'Identify + analyze + prioritize risks',wrongDefs:['A technical audit verifying systems comply with security baselines','A test of backup and recovery procedures to validate RTO and RPO','An evaluation of vendor security practices and contractual obligations'],wrongTerms:['Compliance Audit','DR Test','Third-Party Review']},
  {term:'Risk Mitigation', d:'5', def:'Implementing controls and countermeasures to reduce the likelihood or impact of a risk to an acceptable level.',hint:'Reduce the risk  --  firewalls, patches, training',wrongDefs:['Acknowledging a risk and deciding not to address it','Purchasing insurance to offset the financial impact of a risk','Stopping a risky activity entirely to eliminate the associated risk'],wrongTerms:['Risk Acceptance','Risk Transfer','Risk Avoidance']},
  {term:'Risk Acceptance', d:'5', def:'A conscious decision to acknowledge a risk and take no further action to reduce it, typically because the cost of mitigation exceeds the potential impact.',hint:'Cost exceeds impact  --  document and live with it',wrongDefs:['Implementing controls to reduce the probability or impact of a risk','Purchasing cyber insurance to transfer the financial burden of a risk','Stopping an activity entirely to eliminate the associated risk'],wrongTerms:['Risk Mitigation','Risk Transfer','Risk Avoidance']},
  {term:'Risk Transfer', d:'5', def:'Shifting the financial consequences of a risk to a third party, typically through cyber insurance or contractual agreements.',hint:'Insurance = risk transfer',wrongDefs:['Implementing technical controls to reduce the likelihood of a risk','Documenting a known risk without taking any action to address it','Ceasing the activity that creates the risk to eliminate it entirely'],wrongTerms:['Risk Mitigation','Risk Acceptance','Risk Avoidance']},
  {term:'Risk Avoidance', d:'5', def:'Eliminating a risk entirely by choosing not to engage in the activity that creates it.',hint:'Don\'t do the risky thing at all',wrongDefs:['Accepting a risk because the cost of mitigation is too high','Transferring the financial impact of a risk through insurance','Reducing a risk by implementing security controls and countermeasures'],wrongTerms:['Risk Acceptance','Risk Transfer','Risk Mitigation']},
  {term:'BIA', d:'5', def:'Business Impact Analysis  --  a process that identifies critical business functions and determines the potential impact of their disruption, establishing RTO and RPO targets.',hint:'Identifies critical functions + sets RTO/RPO',wrongDefs:['A comprehensive review of all security controls in an organization','A financial audit of IT spending and security investments','A technical assessment of vulnerabilities in critical infrastructure'],wrongTerms:['Security Audit','IT Budget Review','Vulnerability Assessment']},
  {term:'RTO', d:'5', def:'Recovery Time Objective  --  the maximum acceptable duration that a system or process can be offline following a disruption before the impact becomes unacceptable.',hint:'How fast must we recover?',wrongDefs:['The maximum amount of data loss measured in time that is acceptable following a disruption','The minimum uptime percentage guaranteed in a service level agreement','The maximum time allowed to restore a specific backup file'],wrongTerms:['RPO','SLA Uptime','Backup Window']},
  {term:'RPO', d:'5', def:'Recovery Point Objective  --  the maximum acceptable amount of data loss measured in time; determines how frequently backups must be taken.',hint:'How much data can we afford to lose?',wrongDefs:['The maximum time a system can be offline before the impact is unacceptable','The time required to complete a full system backup','The point in the recovery process when normal operations resume'],wrongTerms:['RTO','Backup Duration','Recovery Milestone']},
  {term:'HIPAA', d:'5', def:'Health Insurance Portability and Accountability Act  --  a US law requiring healthcare organizations and their business associates to protect the privacy and security of Protected Health Information.',hint:'US healthcare data protection law  --  PHI',wrongDefs:['A European regulation protecting the personal data of EU residents','A US law requiring accurate financial reporting for publicly traded companies','A payment card industry standard protecting credit card transaction data'],wrongTerms:['GDPR','SOX','PCI-DSS']},
  {term:'GDPR', d:'5', def:'General Data Protection Regulation  --  a European Union regulation that protects the personal data and privacy of EU residents, applying to any organization processing EU resident data regardless of location.',hint:'EU data privacy law  --  affects global organizations',wrongDefs:['A US law protecting patient health information in healthcare settings','A global standard governing the security of payment card data','A US law requiring internal controls and accurate financial reporting'],wrongTerms:['HIPAA','PCI-DSS','SOX']},
  {term:'PCI-DSS', d:'5', def:'Payment Card Industry Data Security Standard  --  a set of security requirements for organizations that store, process, or transmit credit card data.',hint:'Credit card data security standard',wrongDefs:['A US law protecting patient health information in healthcare','A European regulation protecting personal data of EU residents','A US law requiring IT controls and accurate financial disclosures'],wrongTerms:['HIPAA','GDPR','SOX']},
  {term:'Data Classification', d:'5', def:'The process of categorizing data based on its sensitivity and value to determine appropriate handling, storage, and access controls.',hint:'Public / Internal / Confidential / Restricted',wrongDefs:['The process of encrypting data based on its location in the network','The process of tagging data with retention schedules for archival','The process of auditing user access rights to sensitive systems'],wrongTerms:['Data Encryption','Data Retention','Access Review']},
  {term:'Data Sovereignty', d:'5', def:'The principle that data is subject to the laws and regulations of the country in which it is stored or processed, regardless of where the data subject resides.',hint:'Where data is stored = which laws apply',wrongDefs:['The right of individuals to control how their personal data is used','The requirement that data must be encrypted before crossing national borders','The practice of storing data only in government-owned data centers'],wrongTerms:['Data Ownership','Data Encryption Mandate','Government Cloud']},
  {term:'Acceptable Use Policy', d:'5', def:'A policy document that defines the rules governing how employees may use organizational IT resources, systems, and networks.',hint:'Rules for using company IT resources',wrongDefs:['A policy defining how data is classified and handled based on sensitivity','A document outlining an organization\'s disaster recovery procedures','A contract between a company and a cloud provider governing service levels'],wrongTerms:['Data Classification Policy','DR Plan','SLA']},
  {term:'SLA', d:'5', def:'Service Level Agreement  --  a formal contract between a service provider and customer that defines performance expectations, uptime guarantees, and penalties for non-compliance.',hint:'Formal contract  --  defines uptime and penalties',wrongDefs:['A policy governing how employees use organizational IT resources','A document defining how data is classified and protected','An agreement between two organizations to share threat intelligence'],wrongTerms:['AUP','Data Policy','MOU']},
  {term:'MOU', d:'5', def:'Memorandum of Understanding  --  an informal agreement between two organizations establishing mutual expectations and responsibilities, often used before a formal contract is in place.',hint:'Informal agreement  --  not legally binding',wrongDefs:['A formal legally binding contract defining service performance expectations','A policy requiring employees to acknowledge security awareness training','An agreement that defines the security requirements for two connected systems'],wrongTerms:['SLA','Acceptable Use Policy','ISA']},
  {term:'Third-Party Risk Management', d:'5', def:'The process of identifying, assessing, and managing the security risks introduced by vendors, suppliers, and partners who have access to organizational systems or data.',hint:'Vendor risk  --  supply chain attacks like SolarWinds',wrongDefs:['Assessing the security posture of internal IT staff and contractors','Reviewing and approving security exceptions for internal applications','Managing the security of customer data on behalf of the organization'],wrongTerms:['Insider Threat Management','Security Exceptions','Data Stewardship']},
  {term:'Security Awareness Training', d:'5', def:'Educational programs designed to help employees recognize and respond appropriately to security threats, particularly social engineering attacks like phishing.',hint:'Most effective defense against phishing',wrongDefs:['Technical training for IT staff on configuring firewalls and IDS systems','A simulation exercise where the security team responds to a live attack','Certification training for security professionals pursuing CompTIA or CISSP'],wrongTerms:['Technical Training','Red Team Exercise','Certification Prep']},

  // ── ADDITIONAL TERMS FROM OFFICIAL SY0-701 OBJECTIVES ─────────
  // Domain 1
  {term:'Gap Analysis', d:'1', def:'An assessment comparing an organization\'s current security posture against a desired target state or compliance framework to identify what controls are missing.',hint:'Where are we vs. where we need to be?',wrongDefs:['A process of identifying and classifying all organizational data assets','A technique for analyzing network traffic to detect malicious patterns','A method of testing backup systems to verify recovery time objectives'],wrongTerms:['Asset Inventory','Traffic Analysis','DR Testing']},
  {term:'Deterrent Control', d:'1', def:'A security control that discourages potential attackers or violators from attempting an attack, such as warning signs, security cameras, or legal notices.',hint:'Warning signs and cameras  --  discourages bad behavior',wrongDefs:['A control that stops a security incident from occurring','A control that detects and records security events after they happen','A control that restores systems after an incident has occurred'],wrongTerms:['Preventive Control','Detective Control','Corrective Control']},
  {term:'Directive Control', d:'1', def:'A security control that instructs, guides, or mandates behavior through policies, procedures, and standards  --  for example, acceptable use policies and security training requirements.',hint:'Policies and procedures that tell people what to do',wrongDefs:['A control that physically prevents unauthorized access to a facility','A control that automatically blocks malicious network traffic','A control that detects policy violations through monitoring'],wrongTerms:['Physical Control','Technical Control','Detective Control']},
  {term:'Honeynet', d:'1', def:'A network of honeypots designed to simulate an entire network environment to attract and study attackers, providing richer intelligence than a single honeypot.',hint:'Multiple honeypots forming a fake network',wrongDefs:['A decoy system used to attract and study individual attackers','A network monitoring system that detects and blocks intrusions','A segmented network zone hosting public-facing servers'],wrongTerms:['Honeypot','IPS','DMZ']},
  {term:'Key Stretching', d:'1', def:'A technique that makes passwords harder to crack by applying a hash function many times (PBKDF2, bcrypt) to increase the computational effort required for brute-force attacks.',hint:'Makes weak passwords stronger  --  PBKDF2, bcrypt',wrongDefs:['Adding a random value to a password before hashing it','Replacing sensitive data with a non-sensitive placeholder value','Splitting an encryption key among multiple parties for security'],wrongTerms:['Salting','Tokenization','Key Splitting']},
  {term:'Blockchain', d:'1', def:'A distributed, tamper-evident ledger that records transactions in linked blocks, where each block contains a cryptographic hash of the previous block, making alteration detectable.',hint:'Distributed ledger  --  each block linked by hashes',wrongDefs:['A type of symmetric encryption algorithm used to protect data at rest','A network protocol that distributes traffic across multiple servers','A key management system for storing and rotating cryptographic keys'],wrongTerms:['AES','Load Balancing','KMS']},

  // Domain 2
  {term:'Pretexting', d:'2', def:'A social engineering technique where an attacker fabricates a believable scenario (pretext) to manipulate a target into providing information or performing an action.',hint:'Made-up story to gain trust  --  IT impersonation',wrongDefs:['Sending fraudulent emails impersonating a legitimate organization','Using physical force to gain unauthorized access to a facility','Creating fake Wi-Fi hotspots to intercept wireless traffic'],wrongTerms:['Phishing','Tailgating','Evil Twin']},
  {term:'Business Email Compromise', d:'2', def:'A sophisticated attack where cybercriminals impersonate a company executive or trusted partner via email to trick employees into transferring money or sensitive data.',hint:'Fake CEO email  --  wire this money now',wrongDefs:['An attack flooding a company email server to deny service','Sending mass phishing emails to company employees','Intercepting email traffic between two parties to read messages'],wrongTerms:['Email DoS','Phishing','Email Interception']},
  {term:'Impersonation', d:'2', def:'Pretending to be another person, organization, or system to gain unauthorized access or trust, a core technique used in social engineering attacks.',hint:'Pretending to be someone else  --  IT helpdesk, boss',wrongDefs:['Exploiting a software vulnerability to gain unauthorized access','Sending fraudulent emails to trick users into revealing credentials','Creating a fake website that mimics a legitimate one'],wrongTerms:['Exploitation','Phishing','Credential Harvesting']},
  {term:'Watering Hole Attack', d:'2', def:'An attack that compromises websites frequently visited by members of a target group, infecting visitors with malware when they browse the site.',hint:'Poison the well your targets drink from',wrongDefs:['Sending targeted phishing emails to specific individuals','Intercepting communication between two parties in real time','Creating a fake wireless access point to capture network traffic'],wrongTerms:['Spear Phishing','MITM','Evil Twin']},
  {term:'Race Condition', d:'2', def:'A vulnerability where the behavior of a system depends on the timing or sequence of events, and an attacker manipulates that timing to alter the outcome.',hint:'TOCTOU  --  check then use before it changes',wrongDefs:['A vulnerability where data overwrites adjacent memory locations','A vulnerability allowing attackers to inject malicious database queries','A vulnerability exposing systems because no patch has been released'],wrongTerms:['Buffer Overflow','SQL Injection','Zero-Day']},
  {term:'VM Escape', d:'2', def:'An attack where a malicious program running inside a virtual machine breaks out of its isolated environment and gains access to the host system or other VMs.',hint:'Breaking out of the VM to reach the hypervisor',wrongDefs:['An attack where malware is injected into a container environment','An attack exploiting misconfigured cloud storage permissions','An attack targeting virtual private network endpoints'],wrongTerms:['Container Escape','Cloud Misconfiguration','VPN Attack']},
  {term:'Password Spraying', d:'2', def:'An attack that tries a small number of commonly used passwords against a large number of accounts, avoiding lockout thresholds that trigger on too many attempts per account.',hint:'One password tried against many accounts  --  avoids lockout',wrongDefs:['Trying every possible password combination against one account','Using previously breached credentials to attempt logins across services','Computing hash values in advance to reverse password hashes quickly'],wrongTerms:['Brute Force','Credential Stuffing','Rainbow Table']},
  {term:'Downgrade Attack', d:'2', def:'An attack that forces a system to use an older, weaker version of a protocol or encryption algorithm, making it easier to compromise.',hint:'Forces weak old protocol  --  SSL vs TLS',wrongDefs:['An attack that intercepts communication between two parties','An attack that exploits two different inputs producing the same hash','An attack using pre-computed hash values to crack passwords'],wrongTerms:['MITM','Collision Attack','Rainbow Table']},
  {term:'Smishing', d:'2', def:'SMS phishing  --  a social engineering attack delivered via text message to trick recipients into clicking malicious links or revealing sensitive information.',hint:'SMS + phishing',wrongDefs:['Voice-based social engineering conducted over phone calls','Email-based phishing targeting a specific organization','Physical tailgating to gain unauthorized building access'],wrongTerms:['Vishing','Spear Phishing','Tailgating']},

  // Domain 3
  {term:'SASE', d:'3', def:'Secure Access Service Edge  --  a cloud-delivered security framework combining network security functions (CASB, FWaaS, ZTNA) with wide area networking capabilities.',hint:'Cloud-delivered security + networking  --  replaces VPN for remote access',wrongDefs:['A physical appliance combining firewall, IDS, and VPN capabilities','A network segmentation technique isolating sensitive systems','A cloud access security broker monitoring SaaS application usage'],wrongTerms:['UTM','VLAN','CASB']},
  {term:'ZTNA', d:'3', def:'Zero Trust Network Access  --  a security model that grants remote users access only to specific applications they need, based on identity and context, rather than full network access.',hint:'Replaces VPN  --  access only what you need, verified every time',wrongDefs:['A technology that encrypts all network traffic between two locations','A network design principle isolating sensitive systems in separate zones','A cloud security framework combining networking and security functions'],wrongTerms:['VPN','Network Segmentation','SASE']},
  {term:'Containerization', d:'3', def:'A lightweight virtualization method that packages an application and its dependencies into an isolated container, sharing the host OS kernel.',hint:'Docker  --  isolated app environments sharing the kernel',wrongDefs:['Creating a full virtual machine with its own operating system','Encrypting data before storing it in a cloud environment','Splitting application functionality across multiple microservices'],wrongTerms:['Virtual Machine','Cloud Encryption','Microservices']},
  {term:'BYOD', d:'3', def:'Bring Your Own Device  --  a policy allowing employees to use personal devices for work, introducing security challenges around data separation and device control.',hint:'Personal phone for work  --  MDM challenge',wrongDefs:['A policy where the company owns and manages all employee devices','A policy where employees choose from a list of company-approved devices','A policy prohibiting the use of personal devices for any work purposes'],wrongTerms:['COPE','CYOD','Device Prohibition']},
  {term:'MDM', d:'3', def:'Mobile Device Management  --  software that allows IT to remotely manage, monitor, configure, and enforce security policies on mobile devices.',hint:'Remote wipe, enforce encryption on mobile devices',wrongDefs:['Software that monitors and analyzes user behavior for anomalies','A platform that aggregates and correlates security logs from all systems','Software managing the patching and updating of endpoint operating systems'],wrongTerms:['UEBA','SIEM','Patch Management']},
  {term:'Hot Site', d:'3', def:'A fully operational backup data center with up-to-date data and systems that can take over operations almost immediately after a disaster.',hint:'Fully operational  --  fastest failover, most expensive',wrongDefs:['A backup site with hardware but no data, requiring hours to bring online','A backup site with only basic infrastructure, requiring days or weeks','A temporary workspace for employees during a disaster recovery event'],wrongTerms:['Warm Site','Cold Site','Alternate Workspace']},
  {term:'Cold Site', d:'3', def:'A backup facility with basic infrastructure (power, connectivity) but no pre-installed hardware or data, requiring the most time to become operational after a disaster.',hint:'Empty building  --  cheapest, slowest to recover',wrongDefs:['A fully operational backup site ready for immediate failover','A backup site with hardware installed but no current data loaded','A cloud-based recovery environment that scales on demand'],wrongTerms:['Hot Site','Warm Site','Cloud DR']},
  {term:'Data at Rest', d:'3', def:'Data stored on a device or storage medium, such as a hard drive, database, or backup tape, that is not actively being transmitted.',hint:'Stored data  --  protect with BitLocker, database encryption',wrongDefs:['Data actively being transmitted across a network','Data currently being processed or used by an application','Data that has been archived and is no longer actively used'],wrongTerms:['Data in Transit','Data in Use','Archived Data']},
  {term:'Data in Transit', d:'3', def:'Data actively moving across a network between systems, such as emails, web traffic, or file transfers, requiring protection during transmission.',hint:'Moving data  --  protect with TLS, VPN, HTTPS',wrongDefs:['Data stored on a device or storage medium at rest','Data currently being processed in RAM or CPU registers','Data that has been logically deleted but not yet overwritten'],wrongTerms:['Data at Rest','Data in Use','Residual Data']},
  {term:'Data in Use', d:'3', def:'Data actively being processed, accessed, or modified by an application or user, present in RAM, CPU registers, or caches.',hint:'Active in memory  --  hardest state to encrypt',wrongDefs:['Data stored on disk or a backup medium not currently being accessed','Data traveling across a network between two systems','Data that has been classified and archived for long-term retention'],wrongTerms:['Data at Rest','Data in Transit','Archived Data']},

  // Domain 4
  {term:'Legal Hold', d:'4', def:'A process requiring an organization to preserve all relevant electronically stored information when litigation is anticipated, preventing deletion or modification of potential evidence.',hint:'Suspend deletion  --  lawsuit incoming',wrongDefs:['A court order requiring immediate disclosure of all security logs','A backup strategy ensuring data is retained for regulatory compliance','A forensic process creating bit-for-bit copies of storage media'],wrongTerms:['E-Discovery Order','Retention Policy','Forensic Imaging']},
  {term:'E-Discovery', d:'4', def:'The process of identifying, collecting, and producing electronically stored information in response to a legal request or investigation.',hint:'Finding and producing digital evidence for legal proceedings',wrongDefs:['The process of creating forensic images of storage media for investigation','The practice of proactively hunting for threats in a network environment','The process of recovering deleted files after a security incident'],wrongTerms:['Forensic Imaging','Threat Hunting','Data Recovery']},
  {term:'Root Cause Analysis', d:'4', def:'A systematic process of identifying the underlying cause of a security incident or system failure to prevent recurrence, performed during the lessons-learned phase.',hint:'Why did this really happen?  --  performed after IR',wrongDefs:['The process of identifying all systems compromised during an attack','A technique for scanning systems to find exploitable vulnerabilities','The process of removing malware and patching systems after a breach'],wrongTerms:['Scope Analysis','Vulnerability Scanning','Eradication']},
  {term:'Playbook', d:'4', def:'A documented, step-by-step set of procedures for responding to a specific type of security incident, ensuring consistent and thorough responses under pressure.',hint:'Pre-written IR procedures  --  consistency under pressure',wrongDefs:['A tool that automates security responses without human intervention','A document listing all known threats and their associated indicators','A comprehensive policy document governing all security operations'],wrongTerms:['SOAR','Threat Intelligence Feed','Security Policy']},
  {term:'Bug Bounty', d:'4', def:'A program offering financial rewards to external security researchers who responsibly disclose vulnerabilities they discover in an organization\'s systems.',hint:'Pay researchers to find your bugs before attackers do',wrongDefs:['A program offering rewards for reporting insider threats within an organization','A financial penalty imposed on organizations that experience a data breach','A government incentive for companies to improve their cybersecurity posture'],wrongTerms:['Whistleblower Program','Breach Penalty','Cybersecurity Incentive']},
  {term:'CVSS', d:'4', def:'Common Vulnerability Scoring System  --  a standardized framework that rates vulnerability severity from 0 to 10 based on factors like exploitability and impact.',hint:'0-10 severity score  --  Critical=9+, High=7-8.9',wrongDefs:['A database of all publicly known vulnerabilities maintained by NIST','A standard format for sharing threat intelligence between organizations','A framework for categorizing vulnerabilities by their attack type'],wrongTerms:['NVD','STIX/TAXII','CVE']},
  {term:'CVE', d:'4', def:'Common Vulnerabilities and Exposures  --  a public list of standardized identifiers for known security vulnerabilities, each assigned a unique CVE ID.',hint:'CVE-2024-1234  --  unique ID for each known vulnerability',wrongDefs:['A scoring system rating vulnerability severity from 0 to 10','A framework for automating vulnerability management and compliance','A database tracking the status of patches for known vulnerabilities'],wrongTerms:['CVSS','SCAP','Patch Database']},
  {term:'Input Validation', d:'4', def:'A secure coding practice that verifies all user-supplied input meets expected format, type, and length before processing, preventing injection attacks.',hint:'Check all input before using it  --  prevents SQLi, XSS',wrongDefs:['Encrypting data before storing it in a database','Checking that output is formatted correctly before displaying it','Verifying that API responses match expected data schemas'],wrongTerms:['Data Encryption','Output Encoding','API Validation']},
  {term:'Code Signing', d:'4', def:'The process of digitally signing software using a certificate to prove the code came from a trusted source and has not been altered since signing.',hint:'Signed code proves it\'s from the real vendor',wrongDefs:['Encrypting source code to protect intellectual property','Reviewing code manually to find security vulnerabilities','Automatically testing code for bugs before deployment'],wrongTerms:['Code Encryption','Code Review','CI/CD Testing']},
  {term:'Static Code Analysis', d:'4', def:'Automated analysis of application source code without executing it, to identify security vulnerabilities and coding errors early in the development process.',hint:'Scan code without running it  --  finds bugs early',wrongDefs:['Testing a running application by sending it malformed inputs','Reviewing code manually by human security experts','Monitoring application behavior in a production environment for anomalies'],wrongTerms:['Dynamic Analysis / Fuzzing','Manual Code Review','Runtime Monitoring']},

  // Domain 5
  {term:'SLE', d:'5', def:'Single Loss Expectancy  --  the expected monetary loss from a single occurrence of a risk event, calculated as Asset Value x Exposure Factor.',hint:'SLE = Asset Value x Exposure Factor',wrongDefs:['The expected total annual loss from a risk event occurring over a year','The probability that a specific threat will occur within a given year','The maximum acceptable financial loss before a risk must be transferred'],wrongTerms:['ALE','ARO','Risk Threshold']},
  {term:'ALE', d:'5', def:'Annualized Loss Expectancy  --  the expected monetary loss per year from a specific risk, calculated as SLE x ARO (Annualized Rate of Occurrence).',hint:'ALE = SLE x ARO  --  annual expected loss',wrongDefs:['The expected loss from a single occurrence of a risk event','The frequency at which a threat is expected to occur in a given year','The total cost of implementing controls to mitigate a specific risk'],wrongTerms:['SLE','ARO','Control Cost']},
  {term:'ARO', d:'5', def:'Annualized Rate of Occurrence  --  the estimated frequency with which a threat is expected to occur within a one-year period.',hint:'How many times per year this risk is expected to happen',wrongDefs:['The monetary loss expected from a single occurrence of a risk event','The total annual financial exposure from a specific risk','The percentage of asset value likely to be lost in a single incident'],wrongTerms:['SLE','ALE','Exposure Factor']},
  {term:'Exposure Factor', d:'5', def:'The percentage of an asset\'s value expected to be lost in a single risk event, used in calculating Single Loss Expectancy.',hint:'EF x Asset Value = SLE',wrongDefs:['The frequency at which a threat is expected to occur annually','The total annual financial loss expected from a specific risk','The probability that a threat actor will successfully exploit a vulnerability'],wrongTerms:['ARO','ALE','Threat Probability']},
  {term:'Risk Register', d:'5', def:'A documented list of identified risks including their likelihood, impact, owners, and current mitigation status, used to track and manage organizational risk.',hint:'Living document tracking all identified risks',wrongDefs:['A database of all known vulnerabilities affecting organizational systems','A log of all security incidents experienced by an organization','A list of all security controls implemented by an organization'],wrongTerms:['Vulnerability Database','Incident Log','Control Register']},
  {term:'Risk Appetite', d:'5', def:'The total level of risk an organization is willing to accept in pursuit of its objectives, set by executive leadership and the board.',hint:'How much risk the organization is willing to tolerate overall',wrongDefs:['The specific risk level that triggers a mandatory escalation response','The process of evaluating and quantifying risks in an organization','The maximum risk an organization is permitted to accept by regulators'],wrongTerms:['Risk Threshold','Risk Assessment','Regulatory Limit']},
  {term:'BCP', d:'5', def:'Business Continuity Plan  --  a comprehensive plan ensuring that critical business functions can continue during and after a disruption or disaster.',hint:'Keeps the business running during disruptions',wrongDefs:['A plan specifically focused on restoring IT systems after a disaster','A plan for responding to and containing active security incidents','A plan for communicating with stakeholders during a crisis'],wrongTerms:['DRP','IRP','Crisis Communications Plan']},
  {term:'DRP', d:'5', def:'Disaster Recovery Plan  --  a documented, structured plan for restoring IT systems, data, and infrastructure following a disaster or major disruption.',hint:'IT recovery after a disaster  --  RTO and RPO targets',wrongDefs:['A plan for maintaining critical business functions during a disruption','A plan for responding to and containing active security incidents','A plan for onboarding new staff during a disaster recovery event'],wrongTerms:['BCP','IRP','Staffing Plan']},
  {term:'SDLC', d:'5', def:'Software Development Lifecycle  --  the structured process used to plan, design, develop, test, and maintain software, with security integrated at each phase.',hint:'Plan->Design->Develop->Test->Deploy->Maintain  --  security at each phase',wrongDefs:['A methodology for managing IT infrastructure changes in production','A process for onboarding and offboarding user accounts securely','A framework for managing and responding to security incidents'],wrongTerms:['Change Management','Identity Lifecycle','Incident Response']},
  {term:'Change Management', d:'5', def:'A formal process for controlling modifications to IT systems and configurations, requiring approval, testing, and documentation to minimize security risk.',hint:'Approval + testing + backout plan before any change',wrongDefs:['A process for managing user account provisioning and deprovisioning','A process for identifying and mitigating risks in an organization','A process for responding to and recovering from security incidents'],wrongTerms:['Identity Management','Risk Management','Incident Response']},
