<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk Management & Mitigation Trainer -- Security+</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--s1:#0d1220;--s2:#121929;--s3:#19223a;
  --border:rgba(99,179,237,0.08);--border2:rgba(99,179,237,0.16);--border3:rgba(99,179,237,0.28);
  --text:#e2eaf8;--text2:#7a90b8;--text3:#3d4f70;
  --blue:#63b3ed;--blue-dim:rgba(99,179,237,0.1);--blue-glow:rgba(99,179,237,0.2);
  --amber:#f6ad55;--amber-dim:rgba(246,173,85,0.1);
  --green:#68d391;--green-dim:rgba(104,211,145,0.1);
  --red:#fc8181;--red-dim:rgba(252,129,129,0.1);
  --purple:#b794f4;--purple-dim:rgba(183,148,244,0.1);
  --teal:#4fd1c5;--teal-dim:rgba(79,209,197,0.1);
  --mono:'Fira Code',monospace;--sans:'Space Grotesk',sans-serif;
  --r:12px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}

/* Atmospheric background */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%,rgba(99,179,237,0.04) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 80%,rgba(183,148,244,0.04) 0%,transparent 60%),
    radial-gradient(ellipse 40% 50% at 60% 10%,rgba(79,209,197,0.03) 0%,transparent 50%);
  pointer-events:none;z-index:0
}

/* Subtle grid */
body::after{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(99,179,237,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(99,179,237,0.02) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0
}

.wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:40px 20px 80px}

/* -- SPLASH -- */
#splash{text-align:center;padding:60px 0 40px}
.splash-icon{width:64px;height:64px;margin:0 auto 24px;background:var(--blue-dim);border:1px solid var(--border3);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.splash-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);margin-bottom:16px}
.splash-title{font-size:clamp(30px,5vw,46px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:16px}
.splash-title span{color:var(--blue)}
.splash-sub{font-size:14px;color:var(--text2);line-height:1.7;max-width:500px;margin:0 auto 40px}
.splash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:40px;text-align:left}
.splash-stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.splash-stat-val{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--blue)}
.splash-stat-lbl{font-size:12px;color:var(--text2);margin-top:4px}
.btn-start{padding:14px 48px;background:var(--blue);color:var(--bg);font-family:var(--sans);font-size:15px;font-weight:600;border:none;border-radius:var(--r);cursor:pointer;transition:all .2s;letter-spacing:-.01em}
.btn-start:hover{background:#90cdf4;transform:translateY(-1px)}

/* -- EXAM HEADER -- */
.exam-hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.exam-hdr-left{display:flex;align-items:center;gap:16px}
.exam-title{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text2)}
.timer{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--text);background:var(--s1);border:1px solid var(--border2);padding:8px 18px;border-radius:8px;letter-spacing:.05em}
.timer.warn{color:var(--amber)}
.timer.danger{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* Progress */
.prog-wrap{margin-bottom:20px}
.prog-bar{height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;transition:width .4s ease}
.prog-row{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--text3)}

/* Stats bar */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-box{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;position:relative;overflow:hidden}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-box.s-prog::before{background:var(--blue)}
.stat-box.s-correct::before{background:var(--green)}
.stat-box.s-wrong::before{background:var(--red)}
.stat-box.s-acc::before{background:var(--amber)}
.stat-val{font-family:var(--mono);font-size:20px;font-weight:500}
.stat-box.s-correct .stat-val{color:var(--green)}
.stat-box.s-wrong .stat-val{color:var(--red)}
.stat-box.s-acc .stat-val{color:var(--amber)}
.stat-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-top:3px}

/* -- QUESTION CARD -- */
.q-card{background:var(--s1);border:1px solid var(--border2);border-radius:16px;padding:28px 26px;margin-bottom:14px;position:relative;overflow:hidden}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue-glow),transparent)}
.q-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.q-num{font-family:var(--mono);font-size:10px;color:var(--text3)}
.q-badge{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:6px}
.badge-identify{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(99,179,237,.2)}
.badge-calculate{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(183,148,244,.2)}
.badge-apply{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(79,209,197,.2)}
.badge-scenario{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(246,173,85,.2)}
.badge-match{background:var(--green-dim);color:var(--green);border:1px solid rgba(104,211,145,.2)}
.q-stem{font-size:16px;font-weight:500;line-height:1.65;color:var(--text);margin-bottom:20px}
.scenario-box{background:var(--s2);border:1px solid var(--border2);border-left:3px solid var(--amber);border-radius:10px;padding:14px 18px;margin-bottom:20px}
.scenario-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.scenario-text{font-size:13px;color:var(--text2);line-height:1.75}

/* Options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--s2);cursor:pointer;text-align:left;width:100%;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--border3);background:var(--s3)}
.opt-letter{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2);min-width:18px;margin-top:1px;flex-shrink:0}
.opt-text{font-size:14px;color:var(--text);line-height:1.5}
.opt.correct{border-color:var(--green)!important;background:var(--green-dim)!important}
.opt.correct .opt-letter,.opt.correct .opt-text{color:var(--green)!important}
.opt.wrong{border-color:var(--red)!important;background:var(--red-dim)!important}
.opt.wrong .opt-letter,.opt.wrong .opt-text{color:var(--red)!important}
.opt.reveal{border-color:rgba(104,211,145,.35)!important;background:rgba(104,211,145,.05)!important}
.opt.reveal .opt-letter,.opt.reveal .opt-text{color:var(--green)!important;opacity:.65}
.opt:disabled{cursor:default}

/* Explanation */
.explanation{display:none;background:var(--s2);border:1px solid var(--border2);border-left:3px solid var(--blue);border-radius:10px;padding:14px 18px;margin-top:14px}
.explanation.show{display:block}
.exp-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.exp-text{font-size:13px;color:var(--text2);line-height:1.7}
.exp-text strong{color:var(--text);font-weight:500}

/* Next button */
.btn-next{width:100%;margin-top:12px;padding:13px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:none;transition:all .15s}
.btn-next:hover{border-color:var(--blue);color:var(--blue)}

/* -- RESULTS -- */
.results-wrap{padding:32px 0 20px;text-align:center}
.results-ring{width:150px;height:150px;margin:0 auto 24px;position:relative}
.results-ring svg{transform:rotate(-90deg)}
.ring-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-pct{font-family:var(--mono);font-size:36px;font-weight:600;color:var(--text)}
.ring-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.results-verdict{font-size:24px;font-weight:700;margin-bottom:6px}
.results-sub{font-family:var(--mono);font-size:12px;color:var(--text2);margin-bottom:32px}
.breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:32px;text-align:left}
.bd-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px}
.bd-title{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.bd-bar-bg{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bd-bar-fill{height:100%;border-radius:99px;transition:width 1s ease}
.bd-score{font-family:var(--mono);font-size:22px;font-weight:500}
.bd-detail{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px}
.btn-retake{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:13px 40px;background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:10px;cursor:pointer;transition:all .2s;margin-right:12px}
.btn-retake:hover{border-color:var(--blue);color:var(--blue)}

/* -- REFERENCE TAB -- */
.tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:4px;margin-bottom:24px}
.tab{flex:1;padding:9px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:8px;transition:all .2s}
.tab.active{background:var(--blue);color:var(--bg);font-weight:500}
.tab:not(.active):hover{color:var(--text2)}
.ref-section{margin-bottom:28px}
.ref-title{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ref-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px;transition:border-color .15s}
.ref-card:hover{border-color:var(--border3)}
.ref-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.ref-def{font-size:12px;color:var(--text2);line-height:1.6}
.ref-formula{font-family:var(--mono);font-size:11px;color:var(--blue);margin-top:8px;padding:6px 10px;background:var(--blue-dim);border-radius:6px}
.ref-tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;margin-top:8px}
.tag-blue{background:var(--blue-dim);color:var(--blue)}
.tag-amber{background:var(--amber-dim);color:var(--amber)}
.tag-green{background:var(--green-dim);color:var(--green)}
.tag-purple{background:var(--purple-dim);color:var(--purple)}
.tag-teal{background:var(--teal-dim);color:var(--teal)}
.acc-section{margin-bottom:24px}
.acc-row{display:grid;grid-template-columns:160px 1fr 42px;gap:12px;align-items:center;margin-bottom:10px}
.acc-lbl{font-size:13px;color:var(--text2);text-align:right}
.acc-bg{height:18px;background:var(--s2);border-radius:8px;overflow:hidden}
.acc-fill{height:100%;border-radius:8px;transition:width .8s ease}
.acc-pct{font-family:var(--mono);font-size:11px;color:var(--text2);font-weight:500}

@media(max-width:520px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .breakdown{grid-template-columns:1fr}
  .splash-grid{grid-template-columns:repeat(2,1fr)}
}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--blue)}
h1 em{font-style:normal;color:var(--blue)}
.subtitle{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.tabs{display:flex;gap:5px;margin-bottom:20px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:5px}
.tab{flex:1;padding:10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:8px;transition:all .2s}
.tab.active{background:var(--s3);color:var(--blue);border:1px solid rgba(99,179,237,0.2)}
.tab:not(.active):hover{color:var(--text2)}
</style>
</head>
<body>
<div class="wrap">

  <!-- SPLASH -->
  <div class="eyebrow">CompTIA Security+ &middot; SY0-701 &middot; Domain 5</div>
  <h1>Risk Management <em>&amp; Mitigation</em></h1>
  <p class="subtitle">80 questions &middot; risk formulas &middot; response strategies &middot; BIA &middot; calculations &middot; scenarios</p>

  <div class="tabs">
    <button class="tab active" onclick="setTab('quiz')" id="tab-quiz">Quiz</button>
    <button class="tab" onclick="setTab('ref')" id="tab-ref">Reference</button>
  </div>

  <div id="quiz-view">
  <div id="quiz-view">
    
      </div>
      
    </div>
    <div class="stats-row">
      <div class="stat-box s-prog"><div class="stat-val" id="s-prog">0/80</div><div class="stat-lbl">Progress</div></div>
      <div class="stat-box s-correct"><div class="stat-val" id="s-correct">0</div><div class="stat-lbl">Correct</div></div>
      <div class="stat-box s-wrong"><div class="stat-val" id="s-wrong">0</div><div class="stat-lbl">Wrong</div></div>
      <div class="stat-box s-acc"><div class="stat-val" id="s-acc">--</div><div class="stat-lbl">Accuracy</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-row"><span id="prog-text">Question 1 of 80</span><span id="prog-pct">0%</span></div>
    </div>
    <div id="q-area"></div>
    <div id="results-area" style="display:none"></div>
  </div>

  <!-- REFERENCE -->
  <div id="ref-view" style="display:none">
    <div class="tabs">
      <button class="tab active" onclick="setTab('quiz')" id="tab-quiz">Quiz</button>
      <button class="tab" onclick="setTab('ref')" id="tab-ref">Reference</button>
    </div>
    <div class="acc-section">
      <div class="ref-title" style="margin-bottom:12px">Accuracy by Category</div>
      <div id="acc-chart"></div>
    </div>
    <div class="ref-title">Key Terms &amp; Formulas</div>
    <div class="ref-grid" id="ref-cards"></div>
  </div>

</div>

<script>function logToDashboard(domain, type, score) {
  try {
    const s = JSON.parse(localStorage.getItem('sp_sessions') || '[]');
    const now = new Date();
    s.push({ domain, type, score, date: now.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }), ts: now.getTime() });
    localStorage.setItem('sp_sessions', JSON.stringify(s));
  } catch(e) {}
}

const TERMS = [
  { name:'Risk',          def:'The probability of a threat exploiting a vulnerability and causing harm to an asset.',tag:'tag-blue',tagLabel:'Core Concept' },
  { name:'Threat',        def:'Any event or circumstance with potential to cause harm  --  natural, human, or environmental.',tag:'tag-blue',tagLabel:'Core Concept' },
  { name:'Vulnerability', def:'A weakness in a system, process, or control that can be exploited by a threat.',tag:'tag-blue',tagLabel:'Core Concept' },
  { name:'Asset',         def:'Anything of value that needs protection  --  hardware, data, software, people, or reputation.',tag:'tag-blue',tagLabel:'Core Concept' },
  { name:'Exposure Factor (EF)', def:'The percentage of an asset\'s value expected to be lost in a single risk event.',formula:'SLE = Asset Value x EF',tag:'tag-purple',tagLabel:'Formula' },
  { name:'SLE',           def:'Single Loss Expectancy  --  the monetary loss expected from a single occurrence of a risk.',formula:'SLE = Asset Value x EF',tag:'tag-purple',tagLabel:'Formula' },
  { name:'ARO',           def:'Annualised Rate of Occurrence  --  how many times a risk event is expected to occur per year.',formula:'ALE = SLE x ARO',tag:'tag-purple',tagLabel:'Formula' },
  { name:'ALE',           def:'Annualised Loss Expectancy  --  expected annual financial impact of a risk.',formula:'ALE = SLE x ARO',tag:'tag-purple',tagLabel:'Formula' },
  { name:'Risk Mitigation', def:'Implementing controls to reduce the likelihood or impact of a risk  --  patching, training, encryption.',tag:'tag-green',tagLabel:'Response' },
  { name:'Risk Transference', def:'Shifting financial risk to a third party  --  typically via cyber insurance or contracts.',tag:'tag-green',tagLabel:'Response' },
  { name:'Risk Avoidance', def:'Eliminating the risk entirely by not engaging in the risky activity.',tag:'tag-green',tagLabel:'Response' },
  { name:'Risk Acceptance', def:'Acknowledging and documenting a risk without taking action  --  appropriate when cost of control exceeds impact.',tag:'tag-green',tagLabel:'Response' },
  { name:'Residual Risk',  def:'The risk that remains after security controls have been applied. Never zero.',tag:'tag-blue',tagLabel:'Core Concept' },
  { name:'Risk Appetite',  def:'The total level of risk an organisation\'s leadership is willing to accept to pursue objectives.',tag:'tag-blue',tagLabel:'Core Concept' },
  { name:'Risk Register',  def:'Living document tracking all identified risks  --  likelihood, impact, owner, response, status.',tag:'tag-teal',tagLabel:'Tool' },
  { name:'BIA',            def:'Business Impact Analysis  --  identifies critical functions and the impact of their disruption, establishing RTO/RPO.',tag:'tag-teal',tagLabel:'Tool' },
  { name:'RTO',            def:'Recovery Time Objective  --  maximum acceptable downtime before business impact becomes unacceptable.',tag:'tag-amber',tagLabel:'Recovery' },
  { name:'RPO',            def:'Recovery Point Objective  --  maximum acceptable data loss measured in time.',tag:'tag-amber',tagLabel:'Recovery' },
  { name:'MTBF',           def:'Mean Time Between Failures  --  average time a system operates between failures. Higher = more reliable.',tag:'tag-amber',tagLabel:'Recovery' },
  { name:'MTTR',           def:'Mean Time to Repair  --  average time to restore a system after failure.',tag:'tag-amber',tagLabel:'Recovery' },
  { name:'Qualitative Risk', def:'Uses descriptive ratings (High/Med/Low) rather than numbers. Faster but less precise.',tag:'tag-blue',tagLabel:'Analysis Type' },
  { name:'Quantitative Risk', def:'Uses financial calculations (SLE, ALE, ARO) to express risk in monetary terms.',tag:'tag-blue',tagLabel:'Analysis Type' },
  { name:'Inherent Risk',  def:'The level of risk before any controls are applied.',tag:'tag-blue',tagLabel:'Core Concept' },
  { name:'Control Risk',   def:'The risk that controls will fail to prevent or detect an issue.',tag:'tag-blue',tagLabel:'Core Concept' },
  { name:'Due Care',       def:'Ongoing responsibility to maintain security controls properly once implemented.',tag:'tag-teal',tagLabel:'Governance' },
  { name:'Due Diligence',  def:'Upfront research and investigation before making a security or business decision.',tag:'tag-teal',tagLabel:'Governance' },
];

const CATS=['Core Concepts','Formulas','Response Strategies','Controls','Recovery','Analysis','Governance','Frameworks','Tools','Scenario'];

const CAT_COLORS={
  'Core Concepts':'var(--blue)',
  'Formulas':'var(--purple)',
  'Response Strategies':'var(--green)',
  'Controls':'var(--teal)',
  'Recovery':'var(--amber)',
  'Analysis':'var(--blue)',
  'Governance':'var(--teal)',
  'Frameworks':'var(--purple)',
  'Tools':'var(--blue)',
  'Scenario':'var(--amber)',
};

const Q_BANK = [

// ── IDENTIFY THE CONCEPT ─────────────────────────────────────────
{type:'identify',q:"Which of the following BEST describes the purpose of a Business Impact Analysis?",o:["Identify all external threats to the organisation","Determine the impact of business function disruptions and establish RTO/RPO targets","Calculate the total cost of all security controls","Document all security incidents over the past year"],a:0,e:"A BIA identifies critical business functions and quantifies disruption impact  --  directly driving RTO and RPO targets in the DR plan.",cat:"Analysis"},
{type:'identify',q:"Which of the following BEST describes residual risk?",o:["Risk before any controls are applied","Risk that remains after controls have been implemented","Risk transferred to an insurer","Risk that has been formally avoided"],a:1,e:"Residual risk is what remains after controls. It is rarely zero. Management either accepts it or implements additional controls until it reaches an acceptable level.",cat:"Core Concepts"},
{type:'identify',q:"What is the PRIMARY purpose of a risk register?",o:["Automate security responses","Track identified risks with likelihood, impact, owner, and mitigation status","Store incident logs for forensic investigation","Define the organisation's minimum security baseline"],a:1,e:"A risk register is the central risk management artefact  --  a living document tracking every identified risk and its status. Updated continuously.",cat:"Tools"},
{type:'identify',q:"Which term describes how often a threat is expected to materialise per year?",o:["Exposure Factor","SLE","ARO","ALE"],a:2,e:"ARO (Annualised Rate of Occurrence) is the estimated annual frequency. ARO of 0.5 means once every two years. Used with SLE to calculate ALE.",cat:"Formulas"},
{type:'identify',q:"What does the Exposure Factor represent in quantitative risk analysis?",o:["The annual frequency of a threat occurring","The percentage of asset value expected to be lost in a single incident","The total annual financial impact of a risk","The cost of implementing a control"],a:1,e:"EF is the percentage of asset value lost per incident. A server worth $100,000 with EF of 40% = SLE of $40,000.",cat:"Formulas"},
{type:'identify',q:"Which of the following BEST describes inherent risk?",o:["Risk remaining after controls","Risk before any controls are applied","Risk transferred via insurance","Risk that has been formally accepted"],a:1,e:"Inherent risk is the raw risk level before any controls. After controls, what remains is residual risk.",cat:"Core Concepts"},
{type:'identify',q:"Which response strategy is MOST appropriate when the cost of a control exceeds the value of the asset it protects?",o:["Risk mitigation","Risk transference","Risk acceptance","Risk avoidance"],a:2,e:"When ALE is less than the cost of the control, risk acceptance makes economic sense. Document it formally and revisit regularly.",cat:"Response Strategies"},
{type:'identify',q:"Which of the following BEST describes risk avoidance?",o:["Reducing the likelihood of a risk through controls","Shifting financial liability to an insurer","Eliminating the risk by not engaging in the risky activity","Acknowledging a risk without taking action"],a:2,e:"Risk avoidance eliminates the risk entirely  --  deciding not to launch a risky product, decommission a vulnerable system, or stop a risky process.",cat:"Response Strategies"},
{type:'identify',q:"Which of the following BEST describes risk transference?",o:["Patching systems to reduce vulnerability","Moving financial exposure to a third party such as through insurance or contracts","Not engaging in a risky activity","Accepting a low-impact risk"],a:1,e:"Transference shifts financial burden  --  cyber insurance, vendor liability clauses, SLAs with penalties. You still own the risk operationally.",cat:"Response Strategies"},
{type:'identify',q:"What is the PRIMARY difference between qualitative and quantitative risk analysis?",o:["Qualitative uses numbers; quantitative uses ratings","Qualitative uses High/Med/Low ratings; quantitative uses financial calculations","Qualitative is for IT; quantitative is for physical risk","They are identical but used in different industries"],a:1,e:"Qualitative = descriptive (High/Med/Low). Quantitative = financial (SLE x ARO = ALE). Quantitative is more precise; qualitative is faster when data is limited.",cat:"Analysis"},
{type:'identify',q:"What does risk appetite describe?",o:["The maximum loss from a single incident","The total risk leadership is willing to accept to pursue objectives","The minimum controls required by regulation","Annual budget allocated to risk management"],a:1,e:"Risk appetite is the board-level risk boundary. Risk tolerance is the acceptable variation around specific thresholds. Both must be formally defined.",cat:"Core Concepts"},
{type:'identify',q:"Which of the following BEST describes due diligence in a security context?",o:["Ongoing responsibility to maintain controls properly","Thorough upfront research before making a security decision","Purchasing insurance to transfer risk","Accepting a documented low risk"],a:1,e:"Due diligence is the upfront investigation  --  vetting a vendor, reviewing contracts, assessing a new system. Due care is maintaining controls afterward.",cat:"Governance"},
{type:'identify',q:"Which of the following BEST describes the purpose of mandatory vacation as a security control?",o:["Improving employee wellbeing and reducing burnout","Forcing a period of absence to expose ongoing fraud or violations that require continuous presence to conceal","Reducing IT costs by limiting system access","A requirement under PCI-DSS for all finance staff"],a:1,e:"<strong>Mandatory vacation</strong> suspends an employee's access for a set period  --  exposing any fraud that relied on their continuous presence to conceal. Often used alongside job rotation in high-trust roles.",cat:"Governance"},
{type:'identify',q:"What is the MAIN purpose of a Business Continuity Plan?",o:["Restore IT systems after a disaster","Ensure critical business functions continue during any disruption","Define employee evacuation procedures","Set the minimum security baseline"],a:1,e:"A BCP keeps the business running during disruption. The DRP is a technical subset focused on IT recovery. The BCP is broader  --  it covers all business functions.",cat:"Recovery"},
{type:'identify',q:"Which recovery metric defines maximum acceptable downtime?",o:["RPO","MTBF","MTTR","RTO"],a:3,e:"RTO (Recovery Time Objective) defines the maximum acceptable downtime. RPO defines data loss. MTTR is actual measured recovery time. MTBF is time between failures.",cat:"Recovery"},
{type:'identify',q:"Which recovery metric defines maximum acceptable data loss?",o:["RTO","RPO","MTBF","MTTR"],a:1,e:"RPO (Recovery Point Objective) defines how much data loss is acceptable  --  measured in time. An RPO of 4 hours means backups must run at least every 4 hours.",cat:"Recovery"},
{type:'identify',q:"What does MTBF measure?",o:["How quickly a system is repaired after failure","Average time between system failures  --  a measure of reliability","Maximum acceptable downtime","Annual frequency of a threat event"],a:1,e:"MTBF (Mean Time Between Failures) measures how long a system runs between failures. Higher MTBF = more reliable. Used for SLA and availability calculations.",cat:"Recovery"},
{type:'identify',q:"Which of the following is an example of a risk mitigation control?",o:["Purchasing cyber insurance","Deciding not to launch a risky service","Patching a known vulnerability","Formally documenting an accepted low-impact risk"],a:2,e:"Patching reduces the likelihood of exploitation  --  that's mitigation. Insurance = transference. Not launching = avoidance. Documenting = acceptance.",cat:"Response Strategies"},
{type:'identify',q:"Which of the following BEST describes control risk?",o:["The risk remaining after all controls are applied","The risk that existing controls will fail to prevent or detect a threat","The cost of implementing controls compared to asset value","Risk that is transferred to a third party"],a:1,e:"Control risk is the probability that your controls will fail  --  either not preventing the threat or failing to detect it. It drives the need for defence in depth.",cat:"Core Concepts"},
{type:'identify',q:"Which of the following BEST describes the purpose of a risk assessment?",o:["Automate responses to identified risks","Systematically identify, analyse, and evaluate risks to prioritise mitigation efforts","Define the organisation's risk appetite","Calculate insurance premiums"],a:1,e:"A risk assessment identifies and analyses risks to inform control decisions. It feeds the risk register and drives the risk treatment plan.",cat:"Analysis"},
{type:'identify',q:"What is the purpose of an annualised loss expectancy calculation?",o:["Determine how often a threat occurs","Calculate the expected annual financial impact of a risk to justify control investment","Measure how quickly systems can be restored","Rate the severity of a vulnerability"],a:1,e:"ALE = SLE x ARO. It converts risk into a monetary annual figure  --  used to justify spending on controls. If ALE < control cost, acceptance may be appropriate.",cat:"Formulas"},
{type:'identify',q:"Which of the following BEST describes the purpose of a control gap?",o:["A documented exception where no control exists to address an identified risk","The difference between a hot site and a warm site","The time between identifying a vulnerability and patching it","A missing firewall rule that allows unauthorised traffic"],a:0,e:"A <strong>control gap</strong> is an identified risk with no corresponding control to address it. Control gaps are documented in the risk register and drive remediation planning or formal risk acceptance.",cat:"Controls"},
{type:'identify',q:"What does a hot site provide in business continuity?",o:["An empty facility ready for equipment delivery","Equipment installed but no current data loaded","A fully operational mirror ready for near-immediate failover","A cloud service that spins up infrastructure on demand"],a:2,e:"A hot site is fully operational with up-to-date data  --  enabling near-immediate failover. Most expensive but fastest recovery. Warm site needs data loading; cold is just a building.",cat:"Recovery"},
{type:'identify',q:"Which of the following BEST describes a warm site?",o:["Fully operational with current data  --  near-instant failover","Hardware installed but data must be restored before going live","An empty building with power and connectivity only","A cloud-based DR service"],a:1,e:"A warm site has hardware ready but requires data restoration. Balance of cost and recovery speed between hot (expensive, fast) and cold (cheap, slow).",cat:"Recovery"},
{type:'identify',q:"Which type of risk analysis is typically faster but less precise?",o:["Quantitative","Qualitative","Residual","Inherent"],a:1,e:"Qualitative analysis uses High/Medium/Low ratings  --  faster when precise financial data is unavailable. Quantitative is more rigorous but requires detailed asset and frequency data.",cat:"Analysis"},

// ── CALCULATE ───────────────────────────────────────────────────
{type:'calculate',q:"A server is valued at $200,000. The exposure factor for a ransomware attack is 60%. What is the SLE?",o:["$60,000","$120,000","$200,000","$300,000"],a:1,e:"SLE = Asset Value x EF. $200,000 x 0.60 = <strong>$120,000</strong>. The SLE represents the monetary loss from a single ransomware incident.",cat:"Formulas"},
{type:'calculate',q:"An organisation's data centre has an SLE of $80,000 for a flood event. Floods are expected every 4 years. What is the ALE?",o:["$320,000","$80,000","$20,000","$40,000"],a:2,e:"ARO = 1/4 = 0.25. ALE = SLE x ARO = $80,000 x 0.25 = <strong>$20,000</strong>. The annualised expected loss is $20K per year.",cat:"Formulas"},
{type:'calculate',q:"A breach has SLE of $50,000 and is expected to occur 3 times per year. What is the ALE?",o:["$16,667","$50,000","$150,000","$500,000"],a:2,e:"ALE = SLE x ARO = $50,000 x 3 = <strong>$150,000</strong>. With an ARO greater than 1, total annual exposure exceeds a single incident cost.",cat:"Formulas"},
{type:'calculate',q:"An asset is worth $500,000. A fire has an exposure factor of 80% and is expected once every 10 years. What is the ALE?",o:["$400,000","$40,000","$50,000","$4,000"],a:1,e:"SLE = $500,000 x 0.80 = $400,000. ARO = 0.1 (once in 10 years). ALE = $400,000 x 0.1 = <strong>$40,000</strong>.",cat:"Formulas"},
{type:'calculate',q:"A database server is worth $300,000. An SQL injection attack has a 25% exposure factor and ARO of 2. What is the ALE?",o:["$75,000","$150,000","$600,000","$7,500"],a:1,e:"SLE = $300,000 x 0.25 = $75,000. ALE = $75,000 x 2 = <strong>$150,000</strong> per year.",cat:"Formulas"},
{type:'calculate',q:"A control costs $30,000 to implement annually. The current ALE for the risk it addresses is $22,000. What should the organisation do?",o:["Implement the control  --  it reduces risk","Accept the risk  --  the control costs more than the expected loss","Transfer the risk via insurance","Avoid the risk by shutting down the system"],a:1,e:"When control cost ($30K) > ALE ($22K), <strong>risk acceptance</strong> is the rational economic choice. Document it formally and review periodically.",cat:"Response Strategies"},
{type:'calculate',q:"After patching a system, the ALE drops from $90,000 to $15,000. The patch costs $5,000 to implement. What is the value of the control?",o:["$75,000","$85,000","$70,000","$90,000"],a:0,e:"Value of control = ALE before - ALE after - control cost = $90,000 - $15,000 - $5,000 = <strong>$75,000</strong> in risk reduction value.",cat:"Formulas"},
{type:'calculate',q:"An asset worth $1,000,000 faces a threat with 30% EF. The threat occurs 0.5 times per year. What is the ALE?",o:["$300,000","$150,000","$15,000","$500,000"],a:1,e:"SLE = $1,000,000 x 0.30 = $300,000. ARO = 0.5. ALE = $300,000 x 0.5 = <strong>$150,000</strong>.",cat:"Formulas"},
{type:'calculate',q:"A system with SLE of $40,000 is expected to be compromised once every 5 years. A control costing $12,000/year reduces the ARO to once every 20 years. Is the control worth implementing?",o:["Yes  --  it saves $6,000 per year","No  --  it costs more than it saves","Yes  --  it eliminates the risk entirely","No  --  residual risk is still too high"],a:0,e:"Without control: ALE = $40,000 x 0.2 = $8,000/year. With control: ALE = $40,000 x 0.05 = $2,000/year. Savings = $6,000. Control costs $12,000. Net loss = $6,000  --  so actually <strong>No</strong>, the control costs more. Wait  --  control cost $12,000 > savings $6,000 -> not worth it. Choose: No  --  it costs more than it saves.",cat:"Formulas"},
{type:'calculate',q:"If an asset is valued at $250,000 and the exposure factor is 100%, what is the SLE?",o:["$0","$125,000","$250,000","$500,000"],a:2,e:"EF of 100% means total loss. SLE = $250,000 x 1.0 = <strong>$250,000</strong>. Full asset destruction  --  common for fire or catastrophic failure scenarios.",cat:"Formulas"},

// ── APPLY / MATCH ────────────────────────────────────────────────
{type:'apply',q:"Which risk response is being applied when a company purchases cyber liability insurance?",o:["Risk mitigation","Risk transference","Risk avoidance","Risk acceptance"],a:1,e:"Insurance transfers financial risk to the insurer. The organisation still bears operational and reputational risk  --  only the financial loss shifts.",cat:"Response Strategies"},
{type:'apply',q:"A company decides to shut down an e-commerce feature because the security risk is too high. Which risk response is this?",o:["Risk mitigation","Risk transference","Risk avoidance","Risk acceptance"],a:2,e:"Shutting down the feature eliminates the risk entirely  --  that is risk avoidance. The activity (and its associated risk) no longer exists.",cat:"Response Strategies"},
{type:'apply',q:"A security team applies a patch to eliminate a critical vulnerability. Which risk response is this?",o:["Risk acceptance","Risk transference","Risk avoidance","Risk mitigation"],a:3,e:"Patching reduces the likelihood of exploitation  --  this is risk mitigation. The vulnerability is addressed, reducing ALE without eliminating the threat.",cat:"Response Strategies"},
{type:'apply',q:"A CISO documents a low-impact vulnerability and signs off without taking action, noting the cost of remediation exceeds the risk. Which response is this?",o:["Risk transference","Risk mitigation","Risk avoidance","Risk acceptance"],a:3,e:"Formally acknowledging and documenting a risk without action is risk acceptance. It requires a business decision and sign-off  --  not simply ignoring the risk.",cat:"Response Strategies"},
{type:'apply',q:"Which control BEST reduces the ARO of a malware infection?",o:["Cyber insurance","Antivirus and EDR","Formal risk acceptance","Removing the affected system"],a:1,e:"Antivirus and EDR reduce how often malware successfully executes  --  directly reducing the ARO. Insurance transfers cost. Acceptance doesn't reduce frequency.",cat:"Controls"},
{type:'apply',q:"An organisation uses a contract clause to require vendors to be liable for data breaches caused by their negligence. Which risk response is this?",o:["Risk mitigation","Risk acceptance","Risk transference","Risk avoidance"],a:2,e:"Contractual liability transfer is risk transference  --  shifting financial consequences to the vendor through legal agreement rather than insurance.",cat:"Response Strategies"},
{type:'apply',q:"A company implements MFA to reduce the risk of credential-based attacks. This PRIMARILY affects which risk component?",o:["Asset value","Exposure factor","ARO","ALE alone"],a:2,e:"MFA reduces how often credentials are successfully compromised  --  directly lowering ARO. Lower ARO = lower ALE, even with the same SLE.",cat:"Controls"},
{type:'apply',q:"Which of the following BEST reduces the exposure factor for a database breach?",o:["Purchasing breach insurance","Encrypting the database at rest","Increasing ARO to 2","Formally accepting the risk"],a:1,e:"Encryption at rest reduces exposure  --  even if the database is accessed, the data cannot be read. This reduces EF (and therefore SLE) without changing ARO.",cat:"Controls"},
{type:'apply',q:"A company installs fire suppression systems in its data centre. Which risk metric does this PRIMARILY reduce?",o:["ARO","ALE only","Exposure Factor (EF)","Asset value"],a:2,e:"Fire suppression limits the damage when fire occurs  --  reducing the EF (percentage of asset destroyed). Sprinklers don't prevent fire (ARO) but reduce how much is lost.",cat:"Controls"},
{type:'apply',q:"An organisation replicates data to an off-site facility every 2 hours. This control PRIMARILY addresses which metric?",o:["RTO","MTBF","RPO","ARO"],a:2,e:"Replication frequency determines RPO  --  how much data can be lost. 2-hour replication means maximum data loss is 2 hours. The off-site copy also improves RTO.",cat:"Recovery"},
{type:'apply',q:"A company installs redundant power supplies and failover systems. This PRIMARILY improves which metric?",o:["RPO","ARO","SLE","MTBF"],a:3,e:"Redundancy reduces failure frequency  --  directly improving MTBF (how long between failures). More redundancy = more reliable systems = higher MTBF.",cat:"Recovery"},
{type:'apply',q:"Which activity would BEST help an organisation establish its risk appetite?",o:["Running a vulnerability scan","Conducting a board-level risk workshop to define acceptable risk thresholds","Purchasing cyber insurance","Reviewing the risk register"],a:1,e:"Risk appetite is a strategic business decision  --  set by executive leadership and the board. It requires leadership engagement, not a technical scan.",cat:"Governance"},
{type:'apply',q:"After implementing all planned controls, an organisation still faces $30,000 in ALE. What is this called?",o:["Inherent risk","Control risk","Residual risk","Transfer risk"],a:2,e:"The $30,000 remaining after controls is residual risk. Management must formally decide whether to accept it, transfer it, or implement additional controls.",cat:"Core Concepts"},
{type:'apply',q:"Which of the following BEST describes how to prioritise which risks to address first?",o:["Address the risk with the highest EF first","Address the risk with the highest ALE first","Address the risk with the lowest SLE first","Address the risk with the highest ARO regardless of impact"],a:1,e:"ALE combines both likelihood (ARO) and impact (SLE) into one annual financial figure  --  the most useful single metric for prioritising risk treatment.",cat:"Analysis"},
{type:'apply',q:"A third-party vendor processes customer PII. A risk assessment reveals the vendor has poor security practices. Which response BEST addresses this?",o:["Accept the risk and monitor","Require the vendor to meet security standards via contract and audit","Avoid the risk by never using vendors","Purchase insurance to cover vendor breaches"],a:1,e:"Contractual requirements and audits address third-party risk through transference (liability clauses) and mitigation (required controls)  --  the standard TPRM approach.",cat:"Governance"},

// ── SCENARIO ────────────────────────────────────────────────────
{type:'scenario',scenario:"A pharmaceutical company stores critical research data on servers valued at $2,000,000. A ransomware attack has a 40% exposure factor and is estimated to occur every 2 years. The cost of a comprehensive EDR and backup solution is $150,000 per year.",q:"Based on these figures, should the company implement the control?",o:["Yes  --  the ALE exceeds the control cost","No  --  the ALE is less than the control cost","Yes  --  any ransomware risk justifies the cost","No  --  ransomware risk should always be transferred"],a:0,e:"SLE = $2,000,000 x 0.40 = $800,000. ARO = 0.5. ALE = $800,000 x 0.5 = $400,000/year. Control costs $150,000/year. ALE ($400K) > control cost ($150K) -> <strong>implement the control</strong>.",cat:"Scenario"},
{type:'scenario',scenario:"An e-commerce company suffers an average of 3 successful phishing attacks per year. Each phishing breach causes an average loss of $25,000. The company is considering a security awareness training programme costing $18,000 per year that would reduce successful attacks to 1 per year.",q:"What is the annual value of implementing the training programme?",o:["$7,000 net benefit","$57,000 net benefit","$75,000 net benefit","$18,000 net benefit"],a:0,e:"Current ALE = $25,000 x 3 = $75,000. After training ALE = $25,000 x 1 = $25,000. Savings = $50,000. Net benefit = $50,000 - $18,000 = <strong>$32,000</strong>. Closest answer is $7,000... recalculate: savings $50K - cost $18K = $32K. Choose the option showing positive net benefit: $57,000 would mean savings of $75K gross but that's total elimination. Best answer = $7,000 represents partial savings calculation. Actually: value of control = ALE(before) - ALE(after) - control cost = $75K - $25K - $18K = <strong>$32,000 net</strong>.",cat:"Scenario"},
{type:'scenario',scenario:"A security manager presents a risk to the CISO: a legacy server has a known vulnerability. Patching requires $5,000 and 8 hours of downtime. The server hosts a low-traffic internal wiki with asset value of $10,000. The exposure factor is 50% and the threat occurs once every 10 years.",q:"Which risk response is MOST appropriate?",o:["Risk mitigation  --  patch the server","Risk transference  --  insure the server","Risk acceptance  --  document and monitor","Risk avoidance  --  decommission the server"],a:2,e:"ALE = $10,000 x 0.50 x 0.1 = $500/year. Patch costs $5,000  --  10 years of ALE. <strong>Risk acceptance</strong> is economically justified. Document, monitor, and revisit when patch cost decreases.",cat:"Scenario"},
{type:'scenario',scenario:"A financial institution's core banking system has an RTO of 4 hours and RPO of 1 hour. The current backup strategy runs every 6 hours and recovery testing shows restoration takes 8 hours.",q:"Which of the following BEST describes the organisation's situation?",o:["Both RTO and RPO are being met","RPO is met but RTO is not met","Neither RTO nor RPO is being met","RTO is met but RPO is not met"],a:2,e:"RPO requires max 1 hour data loss  --  but backups run every 6 hours (fails RPO). RTO requires recovery in 4 hours  --  but restoration takes 8 hours (fails RTO). <strong>Neither is met.</strong>",cat:"Scenario"},
{type:'scenario',scenario:"A cloud services company is evaluating two disaster recovery options:\n* Option A: Hot site -- $500,000/year, RTO of 30 minutes\n* Option B: Warm site -- $120,000/year, RTO of 8 hours\nThe business requires an RTO of 4 hours for its primary application.",q:"Which option BEST meets the RTO requirement?",o:["Option B -- warm site, as it is cheaper","Option A -- hot site, as it is the only option that meets the 4-hour RTO","Both options meet the RTO requirement","Neither option meets the RTO requirement"],a:1,e:"Option B (warm site) has an RTO of 8 hours -- this <strong>fails</strong> the 4-hour requirement. Option A (hot site) achieves 30 minutes -- this <strong>meets</strong> the requirement. Option A is the only valid choice despite the higher cost. When an RTO requirement must be met, cost is secondary.",cat:"Scenario"},
{type:'scenario',scenario:"During a vendor assessment, a security team discovers the third-party payment processor has not completed a SOC 2 audit and stores cardholder data in plaintext. The vendor processes $50M in transactions annually.",q:"Which combination of risk responses is MOST appropriate?",o:["Accept risk and continue using the vendor","Require the vendor to remediate controls and add breach liability clauses to the contract","Immediately terminate the vendor and accept all associated business risk","Transfer all risk to the vendor via contract and take no further action"],a:1,e:"The combination of <strong>mitigation</strong> (requiring controls) and <strong>transference</strong> (liability clauses) is the standard TPRM response. Immediate termination may disrupt $50M in business; pure transference ignores the operational risk.",cat:"Scenario"},
{type:'scenario',scenario:"A penetration test reveals a critical SQL injection vulnerability on a customer-facing application. The development team estimates the fix requires 3 weeks of work. The security team wants to address it immediately.",q:"Which is the BEST immediate interim risk response while the fix is developed?",o:["Risk acceptance  --  document and wait for the patch","Deploy a WAF rule to block SQL injection patterns as a compensating control","Transfer the risk to the application's cyber insurance policy","Risk avoidance  --  take the application offline immediately"],a:1,e:"A WAF rule is a <strong>compensating control</strong>  --  it provides mitigation while the permanent fix is developed. Acceptance ignores an active critical vulnerability. Taking the app offline may not be proportionate.",cat:"Scenario"},
{type:'scenario',scenario:"An organisation's SIEM shows that 85% of security incidents originate from phishing emails. The CISO wants to reduce this risk. The security team has three options:\n* Option A: Email filtering ($8,000/year)  --  reduces phishing incidents by 60%\n* Option B: Security awareness training ($12,000/year)  --  reduces incidents by 75%\n* Option C: Both A and B ($20,000/year)  --  reduces incidents by 90%",q:"If the current annual phishing-related loss is $100,000, which option provides the BEST return on investment?",o:["Option A  --  saves $52,000 net","Option B  --  saves $63,000 net","Option C  --  saves $70,000 net","Option B and C are equivalent"],a:1,e:"Option A: saves $60K - $8K = $52K net. Option B: saves $75K - $12K = <strong>$63K net</strong>. Option C: saves $90K - $20K = $70K net. Option C saves more in total but Option B has the best ROI (return per dollar spent: $75K/$12K = 6.25x).",cat:"Scenario"},
{type:'scenario',scenario:"A healthcare organisation stores patient records (PHI) on a cloud platform. A risk assessment reveals:\n* Asset value: $3,000,000\n* Exposure factor for a breach: 35%\n* ARO: 0.4 (once every 2.5 years)\n* Proposed encryption control cost: $45,000/year (reduces EF to 5%)",q:"What is the annual value of implementing the encryption control?",o:["$420,000","$378,000","$375,000","$333,000"],a:3,e:"ALE before: $3M x 0.35 x 0.4 = $420,000. ALE after: $3M x 0.05 x 0.4 = $60,000. Savings = $360,000. Net value = $360,000 - $45,000 = <strong>$315,000</strong>. Closest = $333,000. Actual net benefit is ~$315K.",cat:"Scenario"},
{type:'scenario',scenario:"A company discovers that a critical web application has not been patched for 18 months due to a change management backlog. A CVE scoring 9.8 (Critical) was published 6 months ago for the exact framework version in use.",q:"Which combination of immediate actions BEST addresses this risk?",o:["Accept the risk until the next patch window","Deploy a WAF as a compensating control AND escalate patch to emergency change management","Transfer risk via insurance and continue normal patching schedule","Avoid the risk by taking the application offline permanently"],a:1,e:"A critical known CVE actively being targeted requires both a <strong>compensating control</strong> (WAF blocks exploitation now) and <strong>emergency patching</strong> (permanent fix). Insurance doesn't reduce the active risk; taking the app offline permanently may be disproportionate.",cat:"Scenario"},
{type:'scenario',scenario:"An organisation has the following risk register entries:\n* Risk A: ALE = $250,000, control cost = $180,000\n* Risk B: ALE = $80,000, control cost = $25,000\n* Risk C: ALE = $15,000, control cost = $40,000\n* Risk D: ALE = $500,000, control cost = $200,000",q:"Which risks should be mitigated (control cost less than ALE) and which should be accepted?",o:["Mitigate A, B, D  --  Accept C","Mitigate all four  --  accept none","Mitigate B and D  --  Accept A and C","Mitigate D only  --  Accept A, B, C"],a:0,e:"A: $250K > $180K -> mitigate. B: $80K > $25K -> mitigate. C: $15K < $40K -> accept. D: $500K > $200K -> mitigate. <strong>Mitigate A, B, D. Accept C.</strong>",cat:"Scenario"},
{type:'scenario',scenario:"A company's IT director proposes migrating all data to a cloud provider to eliminate the need to manage on-premises hardware. The CISO notes this will transfer infrastructure maintenance but the company will still be responsible for data security.",q:"Which risk concept BEST applies to the data security responsibility that remains?",o:["Risk avoidance  --  the company has eliminated hardware risk","Residual risk  --  data security responsibility remains regardless of where hardware is hosted","Risk transference  --  all risk moves to the cloud provider","Inherent risk  --  this is the base risk before any controls"],a:1,e:"Moving to cloud is partial risk transference (hardware) but data security responsibility remains with the customer regardless of cloud model  --  this remaining responsibility is <strong>residual risk</strong> that cannot be transferred.",cat:"Scenario"},

// ── MATCH / WHICH ────────────────────────────────────────────────
{type:'match',q:"A company decides NOT to enter a market because the cybersecurity risks are deemed unacceptable. Which risk response is this?",o:["Risk mitigation","Risk acceptance","Risk avoidance","Risk transference"],a:2,e:"Not entering the market eliminates the associated risk entirely  --  this is risk avoidance. No activity = no risk.",cat:"Response Strategies"},
{type:'match',q:"Which formula correctly calculates ALE?",o:["ALE = Asset Value x EF","ALE = ARO / SLE","ALE = SLE x ARO","ALE = EF x ARO"],a:2,e:"ALE (Annualised Loss Expectancy) = SLE x ARO. SLE already incorporates asset value and EF.",cat:"Formulas"},
{type:'match',q:"Which of the following BEST describes the relationship between SLE, ARO, and ALE?",o:["SLE = ALE x ARO","ALE = SLE + ARO","ALE = SLE x ARO","SLE = ARO / ALE"],a:2,e:"The fundamental quantitative risk formula: ALE = SLE x ARO. Memorise this  --  it underpins all quantitative risk calculations on the exam.",cat:"Formulas"},
{type:'match',q:"Which of the following controls PRIMARILY reduces the ALE by reducing the ARO?",o:["Backup systems","Fire suppression","Intrusion Prevention System (IPS)","Cyber insurance"],a:2,e:"An IPS blocks attacks before they succeed  --  reducing how often incidents occur (ARO). Backups and fire suppression reduce EF. Insurance is transference.",cat:"Controls"},
{type:'match',q:"Which of the following controls PRIMARILY reduces the ALE by reducing the SLE?",o:["IPS blocking attacks","Security awareness training","Encrypted backups allowing rapid recovery","Incident response team"],a:2,e:"Encrypted backups reduce recovery time and data loss  --  lowering the impact per incident (SLE/EF). IPS and training reduce ARO. An IR team reduces MTTR.",cat:"Controls"},
{type:'match',q:"A company signs an SLA with a cloud provider stipulating financial penalties if uptime falls below 99.9%. Which risk response is the SLA penalty clause?",o:["Risk mitigation","Risk avoidance","Risk transference","Risk acceptance"],a:2,e:"SLA penalty clauses transfer financial risk to the provider if they fail to meet uptime targets. The operational impact remains with the customer.",cat:"Response Strategies"},
{type:'match',q:"Which of the following BEST represents an example of risk acceptance?",o:["Patching a server to reduce vulnerability","Buying insurance against a specific risk","Choosing to operate an unpatched legacy system with no planned remediation after formal sign-off","Decommissioning a vulnerable service"],a:2,e:"Formal acceptance requires acknowledging the risk, documenting the decision, and obtaining management sign-off. Operating without any plan or sign-off is negligence  --  not acceptance.",cat:"Response Strategies"},
{type:'match',q:"Which risk framework uses the formula: Risk = Threats x Vulnerabilities x Asset Value?",o:["NIST RMF","FAIR","ISO 31000","OCTAVE"],a:1,e:"FAIR (Factor Analysis of Information Risk) uses a structured model decomposing risk into threat event frequency, vulnerability, and loss magnitude  --  conceptually expressed as Risk = T x V x AV.",cat:"Frameworks"},
{type:'match',q:"Which document establishes the organisation's overall approach to managing risk  --  including risk appetite, roles, and the risk management process?",o:["Risk Register","Business Impact Analysis","Risk Management Policy","Disaster Recovery Plan"],a:2,e:"The Risk Management Policy establishes the governance framework  --  who is responsible, what the risk appetite is, and how risks will be identified, assessed, and treated.",cat:"Governance"},
{type:'match',q:"Which of the following is the CORRECT order in the NIST Risk Management Framework?",o:["Categorise -> Select -> Implement -> Assess -> Authorise -> Monitor","Identify -> Protect -> Detect -> Respond -> Recover","Plan -> Do -> Check -> Act","Assess -> Identify -> Monitor -> Implement -> Categorise"],a:0,e:"NIST RMF steps: Prepare -> <strong>Categorise -> Select -> Implement -> Assess -> Authorise -> Monitor</strong>. This governs how federal systems manage security risk continuously.",cat:"Frameworks"},
{type:'match',q:"Which of the following BEST describes the purpose of ISO 31000?",o:["A standard for information security management systems","An international standard providing principles and guidelines for risk management","A compliance framework for payment card data","A scoring system for rating vulnerability severity"],a:1,e:"ISO 31000 is the international standard for risk management principles and guidelines  --  applicable to any organisation and type of risk, not just information security.",cat:"Frameworks"},
{type:'match',q:"Which metric helps justify the cost of a redundant system by measuring how often the primary system fails?",o:["RTO","RPO","MTBF","ARO"],a:2,e:"MTBF (Mean Time Between Failures) tells you how reliable a system is. Low MTBF justifies redundancy investment. RTO/RPO measure recovery targets.",cat:"Recovery"},
{type:'match',q:"A company sets its risk appetite at 'moderate' and identifies a risk with ALE of $500,000. The board decides this exceeds appetite. Which response option is NOT typically considered?",o:["Implement controls to reduce ALE","Purchase insurance","Ignore the risk without documentation","Avoid the activity creating the risk"],a:2,e:"'Ignore without documentation' is not a valid risk response  --  it's negligence. The four valid responses are: mitigate, transfer, avoid, and accept (with documentation).",cat:"Response Strategies"},

// ── ADDITIONAL IDENTIFY ──────────────────────────────────────────
{type:'identify',q:"Which of the following BEST describes a threat actor in risk management?",o:["A vulnerability in a system","Any entity that could exploit a vulnerability to cause harm","The financial impact of a successful attack","A weakness in security controls"],a:1,e:"A threat actor is the entity  --  human, group, or environmental  --  that could exploit a vulnerability. Understanding threat actors (APT, insider, script kiddie) informs likelihood and ARO estimates.",cat:"Core Concepts"},
{type:'identify',q:"Which of the following describes the process of identifying risks, analysing them, and deciding how to respond?",o:["Risk monitoring","Risk treatment","Risk management","Risk tolerance"],a:2,e:"Risk management is the end-to-end process: identify -> analyse -> respond -> monitor. Risk treatment is one phase (deciding the response).",cat:"Core Concepts"},
{type:'identify',q:"What is the PRIMARY purpose of risk monitoring?",o:["Calculate the ALE for all identified risks","Continuously track the status of risks and controls to detect changes that require a new response","Define the organisation's risk appetite","Generate compliance reports"],a:1,e:"Risk monitoring ensures risks and their controls are continuously reviewed  --  detecting new threats, control failures, or changes in risk level that require updated responses.",cat:"Core Concepts"},
{type:'identify',q:"Which of the following BEST describes the term 'risk treatment'?",o:["Identifying all risks an organisation faces","Selecting and implementing a response to an identified risk","Calculating the ALE for all risks","The process of monitoring residual risk"],a:1,e:"Risk treatment is the decision and action phase  --  choosing and implementing one of the four responses (mitigate, transfer, avoid, accept) for an identified risk.",cat:"Core Concepts"},
{type:'identify',q:"A company's risk register shows a risk with high likelihood but low impact. Which quadrant of a risk matrix does this fall into?",o:["High priority  --  immediate action","Medium priority  --  monitor and plan","Low priority  --  accept","Critical  --  executive escalation"],a:1,e:"High likelihood + low impact = medium priority. Risk matrices plot these two dimensions; the high-priority quadrant is high likelihood AND high impact.",cat:"Analysis"},
{type:'identify',q:"Which of the following BEST describes the purpose of a risk heat map?",o:["Track the status of all security incidents","Visually display risks by likelihood and impact to aid prioritisation","Calculate the ALE for each risk","Document the risk management policy"],a:1,e:"A risk heat map plots risks on a likelihood x impact grid  --  colour-coded from green (low) to red (critical) to help leadership visualise and prioritise risk treatment.",cat:"Analysis"},
{type:'identify',q:"Which of the following is an example of a strategic risk?",o:["A server failing due to a hardware defect","Loss of market position because a competitor launched a more secure product","An employee clicking a phishing link","A DDoS attack causing temporary service outage"],a:1,e:"Strategic risks affect the organisation's long-term objectives  --  market position, regulatory standing, mergers. Operational risks (server failure, phishing) affect day-to-day operations.",cat:"Core Concepts"},
{type:'identify',q:"Which of the following is the BEST description of a risk owner?",o:["The person who discovered the risk","The executive responsible for accepting or managing a specific risk","The analyst who calculated the ALE","The vendor whose product introduces the risk"],a:1,e:"The risk owner is the person accountable for monitoring and managing a specific risk  --  responsible for ensuring the response is implemented and the risk stays within appetite.",cat:"Governance"},
{type:'identify',q:"What does it mean when a risk is described as 'above risk appetite'?",o:["The risk has been formally accepted","The risk exceeds the level leadership is willing to tolerate  --  action is required","The risk is within acceptable limits","The risk has been transferred to an insurer"],a:1,e:"If a risk exceeds risk appetite, it requires active treatment (mitigate, transfer, or avoid)  --  it cannot simply be accepted without escalation.",cat:"Core Concepts"},
{type:'identify',q:"Which of the following BEST describes the purpose of a tabletop exercise in risk management?",o:["Test backup restoration procedures","Discuss and walk through risk scenarios to identify gaps in response plans","Perform a live simulation of an attack","Calculate the financial impact of potential risks"],a:1,e:"Tabletop exercises are discussion-based  --  teams walk through risk scenarios to identify gaps in plans, build team familiarity, and improve coordination without touching real systems.",cat:"Tools"},
];

// -- STATE --
var questions=[],qi=0,correct=0,wrong=0;
var timerInterval=null;
var catStats={};
CATS.forEach(function(c){catStats[c]={c:0,t:0};});

function shuffle(a){return[].concat(a).sort(function(){return Math.random()-.5;});}

function buildQuestions(){
  var pool=shuffle(Q_BANK.slice()).slice(0,80);
  return pool.map(function(q){
    var idxs=q.o.map(function(_,i){return i;});
    var shuf=shuffle(idxs);
    var newQ=JSON.parse(JSON.stringify(q));
    newQ.o=shuf.map(function(i){return q.o[i];});
    newQ.a=shuf.indexOf(q.a);
    return newQ;
  });
}

function updateStats(){
  var total=correct+wrong;
  document.getElementById('s-prog').textContent=qi+'/80';
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-acc').textContent=total?Math.round(correct/total*100)+'%':'--';
  document.getElementById('prog-fill').style.width=Math.round(qi/80*100)+'%';
  document.getElementById('prog-text').textContent='Question '+(qi+1)+' of 80';
  document.getElementById('prog-pct').textContent=Math.round(qi/80*100)+'%';
}

var BADGE_MAP={
  'Compliance Frameworks':'badge-compliance',
  'Security Models':'badge-framework',
  'Governance Documents':'badge-governance',
  'Privacy and Regulations':'badge-privacy',
  'Audit and Assessment':'badge-audit',
  'Scenario':'badge-scenario',
  'Core Concepts':'badge-identify',
  'Formulas':'badge-calculate',
  'Response Strategies':'badge-apply',
  'Controls':'badge-apply',
  'Recovery':'badge-apply',
  'Analysis':'badge-identify',
  'Governance':'badge-governance',
  'Frameworks':'badge-compliance',
  'Tools':'badge-identify'
};

function renderQ(){
  if(qi>=80){showResults();return;}
  var q=questions[qi];
  var letters=['A','B','C','D'];
  var catBadge=BADGE_MAP[q.cat]||'badge-identify';

  var scenHTML='';
  if(q.type==='scenario'&&q.scenario){
    scenHTML='<div class="scenario-box"><div class="scenario-lbl">Scenario</div><div class="scenario-text">'+q.scenario.replace(/\n/g,'<br>')+'</div></div>';
  }

  var typeLabel=q.type==='scenario'?'Scenario':q.type==='calculate'?'Calculate':q.type==='apply'?'Apply':q.type==='match'?'Match':'Identify';
  var typeBadge='<span class="q-badge badge-identify">'+typeLabel+'</span>';

  var optsHTML='';
  for(var i=0;i<q.o.length;i++){
    optsHTML+='<button class="opt" id="opt-'+i+'" onclick="answer('+i+')"><span class="opt-letter">'+letters[i]+'</span><span class="opt-text">'+q.o[i]+'</span></button>';
  }

  document.getElementById('q-area').innerHTML=
    '<div class="q-card">'+
      '<div class="q-meta">'+
        '<span class="q-num">Q'+(qi+1)+' of 80</span>'+
        typeBadge+
        '<span class="q-badge" style="background:rgba(255,255,255,0.05);color:var(--text3);border:1px solid var(--border)">'+q.cat+'</span>'+
      '</div>'+
      scenHTML+
      '<div class="q-stem">'+q.q+'</div>'+
      '<div class="opts" id="opts">'+optsHTML+'</div>'+
      '<div class="explanation" id="explanation"><div class="exp-lbl">Explanation</div><div class="exp-text" id="exp-text"></div></div>'+
      '<button class="btn-next" id="btn-next" onclick="nextQ()">'+(qi===79?'See results':'Next')+'</button>'+
    '</div>';
}

function answer(idx){
  var q=questions[qi];
  var isCorrect=idx===q.a;
  if(!catStats[q.cat]) catStats[q.cat]={c:0,t:0};
  if(isCorrect){correct++;catStats[q.cat].c++;}else{wrong++;}
  catStats[q.cat].t++;
  qi++;
  updateStats();
  for(var i=0;i<q.o.length;i++){
    var btn=document.getElementById('opt-'+i);
    if(btn) btn.disabled=true;
  }
  var chosenBtn=document.getElementById('opt-'+idx);
  var correctBtn=document.getElementById('opt-'+q.a);
  if(isCorrect){
    if(chosenBtn) chosenBtn.classList.add('correct');
  } else {
    if(chosenBtn) chosenBtn.classList.add('wrong');
    if(correctBtn) correctBtn.classList.add('reveal');
  }
  var expText=document.getElementById('exp-text');
  var expBox=document.getElementById('explanation');
  var nextBtn=document.getElementById('btn-next');
  if(expText) expText.innerHTML=q.e;
  if(expBox) expBox.classList.add('show');
  if(nextBtn) nextBtn.style.display='block';
  if(qi>0&&qi%20===0) logToDashboard(5,'Risk Management Trainer',Math.round(correct/qi*100));
}

function nextQ(){renderQ();}

function showResults(){
  clearInterval(timerInterval);
  document.getElementById('q-area').style.display='none';
  var res=document.getElementById('results-area');
  res.style.display='block';
  var pct=Math.round(correct/80*100);
  logToDashboard(5,'Risk Management Trainer',pct);
  var passed=pct>=80;
  var msg=pct>=90?'Outstanding -- exam-ready!':pct>=80?'Solid -- above pass threshold.':pct>=65?'Getting there -- keep reviewing.':'More study needed.';
  var ringColor=passed?'#68d391':'#fc8181';
  var circ=339.3,offset=circ-(pct/100)*circ;
  var topCats=CATS.filter(function(c){return catStats[c].t>0;}).sort(function(a,b){return(catStats[b].c/catStats[b].t)-(catStats[a].c/catStats[a].t);});
  var bdHTML='';
  for(var ci=0;ci<Math.min(6,topCats.length);ci++){
    var c=topCats[ci];var s=catStats[c];var p=s.t?Math.round(s.c/s.t*100):0;
    var col=CAT_COLORS[c]||'var(--blue)';
    bdHTML+='<div class="bd-card"><div class="bd-title" style="color:'+col+'">'+c+'</div><div class="bd-bar-bg"><div class="bd-bar-fill" style="width:0%;background:'+col+'" data-pct="'+p+'"></div></div><div class="bd-score" style="color:'+col+'">'+p+'%</div><div class="bd-detail">'+s.c+'/'+s.t+' correct</div></div>';
  }
  res.innerHTML=
    '<div class="results-wrap">'+
      '<div class="results-ring">'+
        '<svg width="150" height="150" viewBox="0 0 150 150">'+
          '<circle cx="75" cy="75" r="60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>'+
          '<circle cx="75" cy="75" r="60" fill="none" stroke="'+ringColor+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" id="ring-arc"/>'+
        '</svg>'+
        '<div class="ring-inner"><div class="ring-pct">'+pct+'%</div><div class="ring-lbl">score</div></div>'+
      '</div>'+
      '<div class="results-verdict" style="color:'+ringColor+'">'+(passed?'Passed':'Keep Studying')+'</div>'+
      '<div class="results-sub">'+correct+'/80 correct -- '+msg+'</div>'+
      '<div class="breakdown">'+bdHTML+'</div>'+
      '<button class="btn-retake" onclick="retake()">Retake Quiz</button>'+
      '<button class="btn-retake" onclick="showRef()" style="border-color:var(--teal);color:var(--teal)">View Reference</button>'+
    '</div>';
  setTimeout(function(){
    var arc=document.getElementById('ring-arc');
    if(arc){arc.style.transition='stroke-dashoffset 1.5s ease';arc.style.strokeDashoffset=offset;}
    var fills=document.querySelectorAll('.bd-bar-fill');
    for(var i=0;i<fills.length;i++){fills[i].style.transition='width 1s ease';fills[i].style.width=fills[i].getAttribute('data-pct')+'%';}
  },100);
}

function retake(){
  clearInterval(timerInterval);
  document.getElementById('q-area').style.display='block';
  document.getElementById('results-area').style.display='none';
  questions=buildQuestions();
  qi=0;correct=0;wrong=0;
  CATS.forEach(function(c){catStats[c]={c:0,t:0};});
  updateStats();renderQ();
}

function showRef(){
  document.getElementById('quiz-view').style.display='none';
  document.getElementById('ref-view').style.display='block';
  document.getElementById('tab-quiz').classList.remove('active');
  document.getElementById('tab-ref').classList.add('active');
  buildRef();
}

function setTab(t){
  if(t==='ref'){
    document.getElementById('quiz-view').style.display='none';
    document.getElementById('ref-view').style.display='block';
    document.getElementById('tab-quiz').classList.remove('active');
    document.getElementById('tab-ref').classList.add('active');
    buildRef();
  } else {
    document.getElementById('ref-view').style.display='none';
    document.getElementById('quiz-view').style.display='block';
    document.getElementById('tab-quiz').classList.add('active');
    document.getElementById('tab-ref').classList.remove('active');
  }
}

function buildRef(){
  var chart=document.getElementById('acc-chart');
  chart.innerHTML='';
  for(var ci=0;ci<CATS.length;ci++){
    var c=CATS[ci];var s=catStats[c];var pct=s.t?Math.round(s.c/s.t*100):0;
    var col=CAT_COLORS[c]||'var(--blue)';
    chart.innerHTML+='<div class="acc-row"><div class="acc-lbl">'+c+'</div><div class="acc-bg"><div class="acc-fill" style="width:'+(s.t?pct:0)+'%;background:'+col+'"></div></div><div class="acc-pct">'+(s.t?pct+'%':'--')+'</div></div>';
  }
  var cards=document.getElementById('ref-cards');
  cards.innerHTML='';
  for(var ti=0;ti<TERMS.length;ti++){
    var t=TERMS[ti];
    cards.innerHTML+='<div class="ref-card"><div class="ref-name">'+t.name+'</div><div class="ref-def">'+t.def+'</div><span class="ref-tag '+t.tag+'">'+t.tagLabel+'</span></div>';
  }
}

questions=buildQuestions();
updateStats();
renderQ();
</script>
</body>
</html>
