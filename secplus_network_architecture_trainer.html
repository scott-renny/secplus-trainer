<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Architecture Trainer -- Security+</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080c;--panel:#0e1018;--panel2:#141720;--panel3:#1a1e29;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.18);
  --text:#e4e8f5;--text2:#6b7494;--text3:#3a4060;
  --accent:#00e5ff;--green:#00ff88;--red:#ff3d5a;--amber:#ffcc00;--purple:#bf87ff;--teal:#4fd1c5;
  --mono:'Courier New',monospace;
}
*{font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 0%,rgba(0,229,255,0.03) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(79,209,197,0.03) 0%,transparent 60%);pointer-events:none}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 20px 80px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--accent)}
h1{font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:8px}
h1 em{font-style:normal;color:var(--accent)}
.subtitle{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.tabs{display:flex;gap:5px;margin-bottom:20px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px}
.tab{flex:1;padding:10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:8px;transition:all .2s}
.tab.active{background:var(--panel3);color:var(--accent);border:1px solid rgba(0,229,255,0.2)}
.tab:not(.active):hover{color:var(--text2)}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.sb{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sb.s-prog::before{background:var(--accent)}
.sb.s-correct::before{background:var(--green)}
.sb.s-wrong::before{background:var(--red)}
.sb.s-acc::before{background:var(--amber)}
.sb-val{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1}
.sb.s-correct .sb-val{color:var(--green)}
.sb.s-wrong .sb-val{color:var(--red)}
.sb.s-acc .sb-val{color:var(--amber)}
.sb-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-top:4px}
.prog-wrap{height:3px;background:rgba(255,255,255,0.06);border-radius:99px;margin-bottom:20px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.q-card{background:var(--panel);border:1px solid var(--border2);border-radius:20px;padding:28px;margin-bottom:14px;position:relative;overflow:hidden}
.q-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3}
.q-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.q-badge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:5px}
.badge-network{background:rgba(0,229,255,0.1);color:var(--accent);border:1px solid rgba(0,229,255,0.2)}
.badge-cloud{background:rgba(79,209,197,0.1);color:var(--teal);border:1px solid rgba(79,209,197,0.2)}
.badge-wireless{background:rgba(191,135,255,0.1);color:var(--purple);border:1px solid rgba(191,135,255,0.2)}
.badge-infra{background:rgba(0,255,136,0.1);color:var(--green);border:1px solid rgba(0,255,136,0.2)}
.badge-protocols{background:rgba(255,204,0,0.1);color:var(--amber);border:1px solid rgba(255,204,0,0.2)}
.badge-scenario{background:rgba(255,204,0,0.1);color:var(--amber);border:1px solid rgba(255,204,0,0.2)}
.q-num{font-family:var(--mono);font-size:10px;color:var(--text3)}
.scenario-box{background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--amber);border-radius:10px;padding:13px 16px;margin-bottom:16px}
.scenario-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.scenario-text{font-size:13px;color:var(--text2);line-height:1.7;font-family:var(--mono)}
.q-text{font-size:15px;font-weight:500;line-height:1.65;color:var(--text);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--panel2);cursor:pointer;text-align:left;width:100%;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--border3);background:var(--panel3)}
.opt-letter{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2);min-width:18px;margin-top:1px;flex-shrink:0}
.opt-text{font-size:14px;color:var(--text);line-height:1.5}
.opt.correct{border-color:var(--green)!important;background:rgba(0,255,136,0.07)!important}
.opt.correct .opt-letter,.opt.correct .opt-text{color:var(--green)!important}
.opt.wrong{border-color:var(--red)!important;background:rgba(255,61,90,0.07)!important}
.opt.wrong .opt-letter,.opt.wrong .opt-text{color:var(--red)!important}
.opt.reveal{border-color:rgba(0,255,136,0.3)!important;background:rgba(0,255,136,0.04)!important}
.opt.reveal .opt-letter,.opt.reveal .opt-text{color:var(--green)!important;opacity:.6}
.opt:disabled{cursor:default}
.explanation{display:none;background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:10px;padding:13px 16px;margin-bottom:12px}
.explanation.show{display:block}
.exp-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.exp-text{font-size:13px;color:var(--text2);line-height:1.7}
.exp-text strong{color:var(--text);font-weight:600}
.btn-next{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:none;transition:all .15s}
.btn-next:hover{border-color:var(--accent);color:var(--accent)}
.results-wrap{text-align:center;padding:32px 0 20px}
.results-ring{width:140px;height:140px;margin:0 auto 20px;position:relative}
.results-ring svg{transform:rotate(-90deg)}
.ring-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-pct{font-family:var(--mono);font-size:32px;font-weight:600;color:var(--text)}
.ring-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.results-verdict{font-size:22px;font-weight:700;margin-bottom:6px}
.results-sub{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:28px}
.breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px;text-align:left}
.bd-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.bd-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.bd-bar-bg{height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bd-bar-fill{height:100%;border-radius:99px;transition:width 1s ease}
.bd-score{font-family:var(--mono);font-size:22px;font-weight:600}
.bd-detail{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px}
.btn-retake{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:12px 36px;background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:10px;cursor:pointer;transition:all .2s;margin-right:10px}
.btn-retake:hover{border-color:var(--accent);color:var(--accent)}
.ref-section-title{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ref-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;transition:border-color .15s}
.ref-card:hover{border-color:var(--border3)}
.ref-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.ref-def{font-size:12px;color:var(--text2);line-height:1.6}
.ref-tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;margin-top:8px}
.tag-accent{background:rgba(0,229,255,0.1);color:var(--accent)}
.tag-teal{background:rgba(79,209,197,0.1);color:var(--teal)}
.tag-purple{background:rgba(191,135,255,0.1);color:var(--purple)}
.tag-green{background:rgba(0,255,136,0.1);color:var(--green)}
.tag-amber{background:rgba(255,204,0,0.1);color:var(--amber)}
.ref-key{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:8px;border-top:1px solid var(--border);padding-top:6px}
.acc-row{display:grid;grid-template-columns:185px 1fr 42px;gap:10px;align-items:center;margin-bottom:10px}
.acc-lbl{font-size:13px;color:var(--text2);text-align:right}
.acc-bg{height:18px;background:var(--panel2);border-radius:8px;overflow:hidden}
.acc-fill{height:100%;border-radius:8px;transition:width .8s ease}
.acc-pct{font-family:var(--mono);font-size:11px;color:var(--text2);font-weight:500}
@media(max-width:500px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .breakdown{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">CompTIA Security+ &middot; SY0-701 &middot; Domain 3</div>
  <h1>Network <em>Architecture</em></h1>
  <p class="subtitle">80 questions &middot; network design &middot; segmentation &middot; cloud &middot; wireless &middot; protocols &middot; infrastructure hardening</p>

  <div class="tabs">
    <button class="tab active" onclick="setTab('quiz')" id="tab-quiz">Quiz</button>
    <button class="tab" onclick="setTab('ref')" id="tab-ref">Reference</button>
  </div>

  <div id="view-quiz">
    <div class="stats-bar">
      <div class="sb s-prog"><div class="sb-val" id="s-prog">0/80</div><div class="sb-lbl">Progress</div></div>
      <div class="sb s-correct"><div class="sb-val" id="s-correct">0</div><div class="sb-lbl">Correct</div></div>
      <div class="sb s-wrong"><div class="sb-val" id="s-wrong">0</div><div class="sb-lbl">Wrong</div></div>
      <div class="sb s-acc"><div class="sb-val" id="s-acc">--</div><div class="sb-lbl">Accuracy</div></div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div id="q-area"></div>
    <div id="results-area" style="display:none"></div>
  </div>

  <div id="view-ref" style="display:none">
    <div style="margin-bottom:24px">
      <div class="ref-section-title" style="margin-bottom:12px">Accuracy by Category</div>
      <div id="acc-chart"></div>
    </div>
    <div class="ref-section-title">Key Terms and Concepts</div>
    <div class="ref-grid" id="ref-cards"></div>
  </div>
</div>
<script>
function logToDashboard(domain,type,score){
  try{
    const s=JSON.parse(localStorage.getItem('sp_sessions')||'[]');
    const now=new Date();
    s.push({domain,type,score,date:now.toLocaleDateString('en-CA',{month:'short',day:'numeric'}),ts:now.getTime()});
    localStorage.setItem('sp_sessions',JSON.stringify(s));
  }catch(e){}
}

const TERMS=[
  {name:'DMZ',def:'Demilitarised Zone  --  a network segment between the internet and internal LAN hosting public-facing servers, limiting their access to internal systems.',tag:'tag-accent',tagLabel:'Network Zone',key:'Web, email, and DNS servers go here  --  not on the internal LAN'},
  {name:'VLAN',def:'Virtual Local Area Network  --  logical segmentation of a switch into isolated broadcast domains without physical separation.',tag:'tag-accent',tagLabel:'Segmentation',key:'Segments traffic on shared hardware  --  requires inter-VLAN routing to communicate'},
  {name:'Microsegmentation',def:'Granular security zones around individual workloads or applications, limiting lateral movement to the smallest possible blast radius.',tag:'tag-accent',tagLabel:'Segmentation',key:'Core Zero Trust architecture component  --  east-west traffic control'},
  {name:'NAT',def:'Network Address Translation  --  maps private internal IP addresses to a public IP for internet communication, conserving address space.',tag:'tag-accent',tagLabel:'Network',key:'Hides internal topology  --  not a security control, but reduces direct exposure'},
  {name:'PAT',def:'Port Address Translation  --  maps many private IPs to one public IP using different port numbers. Also called NAT overload.',tag:'tag-accent',tagLabel:'Network',key:'Many-to-one translation using port numbers to track sessions'},
  {name:'SDN',def:'Software-Defined Networking  --  separates the control plane (routing decisions) from the data plane (packet forwarding) for centralised programmable management.',tag:'tag-accent',tagLabel:'Network',key:'Control plane separated from data plane  --  enables programmatic network control'},
  {name:'SD-WAN',def:'Software-Defined Wide Area Network  --  uses software to manage WAN connections across multiple links (MPLS, broadband, LTE) with centralised policy.',tag:'tag-teal',tagLabel:'WAN',key:'Replaces expensive MPLS with flexible, policy-driven WAN management'},
  {name:'SASE',def:'Secure Access Service Edge  --  cloud-delivered framework combining network security (CASB, FWaaS, ZTNA) with WAN capabilities.',tag:'tag-teal',tagLabel:'Cloud Network',key:'Converges networking and security into unified cloud service'},
  {name:'IDS',def:'Intrusion Detection System  --  passively monitors network or host traffic, generating alerts when suspicious patterns are detected.',tag:'tag-accent',tagLabel:'Detection',key:'Passive  --  detects and alerts but does NOT block'},
  {name:'IPS',def:'Intrusion Prevention System  --  sits inline and actively blocks malicious traffic before it reaches its destination.',tag:'tag-accent',tagLabel:'Prevention',key:'Active and inline  --  blocks threats, adds latency'},
  {name:'NIDS',def:'Network-based IDS  --  monitors network traffic at a tap or span port. Sees all traffic on a segment but cannot see encrypted payloads.',tag:'tag-accent',tagLabel:'Detection',key:'Network-level  --  needs decryption to inspect HTTPS traffic'},
  {name:'HIDS',def:'Host-based IDS  --  runs on an individual endpoint, monitoring local processes, file changes, and system calls.',tag:'tag-green',tagLabel:'Detection',key:'Host-level  --  can see inside encrypted traffic after decryption'},
  {name:'Jump Server',def:'A hardened, monitored intermediary host (bastion host) used to access systems in high-security network zones.',tag:'tag-accent',tagLabel:'Access Control',key:'Single controlled entry point to sensitive segments  --  all access logged'},
  {name:'Proxy Server',def:'An intermediary that forwards requests on behalf of clients, filtering content, caching responses, and logging activity.',tag:'tag-accent',tagLabel:'Network',key:'Forward proxy: client to internet. Reverse proxy: internet to servers'},
  {name:'Honeypot',def:'A decoy system designed to attract attackers, observing their techniques without risking real assets.',tag:'tag-accent',tagLabel:'Deception',key:'Low-interaction: simulates; High-interaction: real OS with monitoring'},
  {name:'Honeynet',def:'A network of interconnected honeypots simulating a complete environment for richer attacker intelligence.',tag:'tag-accent',tagLabel:'Deception',key:'Observes lateral movement  --  more intelligence than single honeypot'},
  {name:'Air Gap',def:'A system completely isolated from all other networks  --  no wired or wireless connections to external systems.',tag:'tag-accent',tagLabel:'Isolation',key:'Maximum isolation  --  used for nuclear, election, and classified systems'},
  {name:'Out-of-Band Management',def:'Using a dedicated separate network path for device management traffic, isolating it from production traffic.',tag:'tag-green',tagLabel:'Management',key:'Management traffic never touches production network  --  more secure'},
  {name:'Screened Subnet',def:'Another name for DMZ  --  a subnet positioned between two firewalls to host public-facing services.',tag:'tag-accent',tagLabel:'Network Zone',key:'Dual-firewall architecture: internet firewall + internal firewall'},
  {name:'WPA3',def:'Wi-Fi Protected Access 3  --  current wireless security standard using SAE (Simultaneous Authentication of Equals) replacing PSK handshake.',tag:'tag-purple',tagLabel:'Wireless',key:'SAE prevents offline dictionary attacks  --  major WPA2 improvement'},
  {name:'802.1X',def:'IEEE standard for port-based network access control, requiring authentication before granting network access.',tag:'tag-purple',tagLabel:'Wireless/Wired',key:'Uses RADIUS for per-user authentication  --  enterprise standard'},
  {name:'RADIUS',def:'Remote Authentication Dial-In User Service  --  centralised AAA (Authentication, Authorisation, Accounting) server for network access.',tag:'tag-purple',tagLabel:'AAA',key:'Port 1812 auth/1813 accounting  --  UDP-based AAA protocol'},
  {name:'TACACS+',def:'Terminal Access Controller Access-Control System Plus  --  Cisco AAA protocol encrypting the entire payload, unlike RADIUS which only encrypts passwords.',tag:'tag-purple',tagLabel:'AAA',key:'Encrypts full payload; separates AAA functions; TCP port 49'},
  {name:'IPSec',def:'Internet Protocol Security  --  suite of protocols providing encryption, authentication, and integrity for IP packets.',tag:'tag-amber',tagLabel:'VPN Protocol',key:'AH: integrity only. ESP: encryption + integrity. IKE: key exchange'},
  {name:'SSL/TLS VPN',def:'VPN using TLS over TCP port 443, allowing clientless browser-based access or full tunnel mode through any firewall.',tag:'tag-amber',tagLabel:'VPN Protocol',key:'Works through firewalls on 443  --  no special client needed for clientless'},
  {name:'Split Tunneling',def:'VPN configuration where only traffic destined for the corporate network goes through the VPN tunnel; internet traffic goes direct.',tag:'tag-amber',tagLabel:'VPN',key:'Reduces VPN load but allows corporate device internet exposure'},
  {name:'VXLAN',def:'Virtual Extensible LAN  --  encapsulates Layer 2 frames in UDP packets to extend VLANs across Layer 3 networks.',tag:'tag-teal',tagLabel:'Virtualisation',key:'Used in cloud and data centre environments to scale beyond 4094 VLANs'},
  {name:'East-West Traffic',def:'Traffic flowing between servers or workloads within the same data centre or cloud environment (lateral traffic).',tag:'tag-teal',tagLabel:'Network Design',key:'Traditional firewalls only protect north-south  --  east-west requires microsegmentation'},
  {name:'North-South Traffic',def:'Traffic flowing between internal systems and external networks  --  entering or leaving the data centre perimeter.',tag:'tag-teal',tagLabel:'Network Design',key:'Traditional perimeter firewalls protect this  --  but east-west traffic bypasses them'},
  {name:'Infrastructure as Code',def:'Managing and provisioning infrastructure through version-controlled machine-readable configuration files rather than manual processes.',tag:'tag-teal',tagLabel:'Cloud',key:'Terraform, CloudFormation  --  enables repeatable, auditable deployments'},
];

const CATS=['Network Segmentation','Network Devices and Services','Cloud and Virtualisation','Wireless Security','VPN and Remote Access','Infrastructure Hardening','Scenario'];
const CAT_COLORS={
  'Network Segmentation':'var(--accent)',
  'Network Devices and Services':'var(--teal)',
  'Cloud and Virtualisation':'var(--teal)',
  'Wireless Security':'var(--purple)',
  'VPN and Remote Access':'var(--amber)',
  'Infrastructure Hardening':'var(--green)',
  'Scenario':'var(--amber)'
};
const BADGE_MAP={
  'Network Segmentation':'badge-network',
  'Network Devices and Services':'badge-network',
  'Cloud and Virtualisation':'badge-cloud',
  'Wireless Security':'badge-wireless',
  'VPN and Remote Access':'badge-protocols',
  'Infrastructure Hardening':'badge-infra',
  'Scenario':'badge-scenario'
};

const Q_BANK=[
// -- NETWORK SEGMENTATION --
{type:'identify',cat:'Network Segmentation',q:"Which network zone hosts public-facing servers between the internet and the internal LAN?",o:["Internal LAN","Management Zone","DMZ","Extranet"],a:2,e:"<strong>DMZ</strong> (Demilitarised Zone)  --  hosts web servers, email gateways, and DNS. Limits their direct access to the internal LAN. A dual-firewall architecture creates a screened subnet (another name for DMZ)."},
{type:'identify',cat:'Network Segmentation',q:"Which technology logically segments a physical switch into isolated broadcast domains?",o:["Subnetting","VLAN","NAT","ACL"],a:1,e:"<strong>VLAN</strong> (Virtual LAN)  --  creates logical segments on shared hardware. VLANs isolate broadcast traffic and require a router or Layer 3 switch for inter-VLAN communication."},
{type:'identify',cat:'Network Segmentation',q:"Which segmentation technique creates the smallest possible security zones around individual workloads?",o:["VLAN segmentation","Network segmentation","Microsegmentation","Air gapping"],a:2,e:"<strong>Microsegmentation</strong>  --  granular isolation around individual workloads or applications. Limits lateral movement to the absolute minimum. A core component of Zero Trust architecture."},
{type:'identify',cat:'Network Segmentation',q:"What is the PRIMARY security purpose of network segmentation?",o:["Improving network performance","Limiting lateral movement after a breach","Reducing hardware costs","Simplifying firewall rule management"],a:1,e:"<strong>Limiting lateral movement</strong>  --  if an attacker compromises one segment, segmentation prevents them from freely moving to other systems. The blast radius is contained."},
{type:'identify',cat:'Network Segmentation',q:"Which of the following BEST describes an extranet?",o:["A private network accessible only to internal staff","A controlled network extension allowing authorised external partners to access specific internal resources","A public-facing web server zone","An isolated management network"],a:1,e:"An <strong>extranet</strong> extends controlled access to authorised external parties  --  suppliers, partners, customers. Secured by authentication and access controls; more restricted than the internet but less restricted than the internal LAN."},
{type:'identify',cat:'Network Segmentation',q:"Which of the following BEST describes a screened subnet?",o:["A VLAN isolating IoT devices","A subnet between two firewalls hosting public-facing services  --  another name for the DMZ","A dedicated management network","A network segment with no internet access"],a:1,e:"<strong>Screened subnet</strong> is another term for the DMZ architecture. An outer firewall faces the internet; an inner firewall faces the LAN. Public servers sit between them in the screened subnet."},
{type:'identify',cat:'Network Segmentation',q:"Which of the following BEST describes east-west traffic in a data centre?",o:["Traffic entering the data centre from the internet","Traffic leaving the data centre to external users","Traffic between servers and workloads within the same environment","Traffic between the data centre and branch offices"],a:2,e:"<strong>East-west traffic</strong> is lateral  --  between workloads inside the data centre. Traditional perimeter firewalls only inspect north-south (in/out). Microsegmentation addresses east-west threats."},
{type:'identify',cat:'Network Segmentation',q:"Which type of network access control requires devices to prove compliance before being admitted to the network?",o:["ACL-based filtering","NAC (Network Access Control)","VLAN tagging","Port security"],a:1,e:"<strong>NAC</strong>  --  checks devices for OS patch level, AV status, and configuration compliance before granting access. Non-compliant devices are quarantined to a remediation VLAN."},
{type:'identify',cat:'Network Segmentation',q:"Which of the following BEST describes the purpose of a management network (out-of-band)?",o:["Carrying production user traffic","A dedicated separate network for managing device configurations, isolated from production traffic","A backup network path for failover","A VLAN dedicated to security monitoring tools"],a:1,e:"<strong>Out-of-band management</strong> uses a completely separate network path for managing routers, switches, and servers. Even if production is compromised, attackers cannot reach management interfaces."},
{type:'identify',cat:'Network Segmentation',q:"Which deception technology is placed inside the network to detect attackers who have already breached the perimeter?",o:["Firewall","Honeypot","IPS","Jump server"],a:1,e:"<strong>Honeypot</strong>  --  a decoy system on the internal network designed to look like a real asset. Any interaction with it indicates an attacker is present on the network. Low false-positive rate  --  legitimate users have no reason to touch it."},

// -- NETWORK DEVICES AND SERVICES --
{type:'identify',cat:'Network Devices and Services',q:"What is the PRIMARY difference between an IDS and an IPS?",o:["IDS is hardware; IPS is software","IDS is network-based; IPS is host-based","IDS detects and alerts passively; IPS actively blocks inline","IDS uses signatures; IPS uses behaviour only"],a:2,e:"<strong>IDS</strong> is passive  --  it monitors and alerts. <strong>IPS</strong> is active and inline  --  it blocks threats before they pass. IPS adds latency; placement inline in the traffic path is critical."},
{type:'identify',cat:'Network Devices and Services',q:"Which type of IDS monitors traffic at the network level using a tap or SPAN port?",o:["HIDS","NIDS","WIDS","CIDS"],a:1,e:"<strong>NIDS</strong> (Network IDS)  --  monitors raw network traffic. Cannot inspect encrypted payloads without decryption. Positioned at network chokepoints using TAP or SPAN ports."},
{type:'identify',cat:'Network Devices and Services',q:"Which type of IDS runs on an individual endpoint and monitors local processes and file changes?",o:["NIDS","WIDS","HIDS","CIDS"],a:2,e:"<strong>HIDS</strong> (Host IDS)  --  runs as an agent on the endpoint. Can see inside encrypted traffic after decryption and monitors file integrity, system calls, and process behaviour."},
{type:'identify',cat:'Network Devices and Services',q:"What is the PRIMARY purpose of a jump server (bastion host)?",o:["Distribute traffic across multiple web servers","Provide a hardened monitored intermediary for accessing high-security network zones","Store centralised authentication credentials","Filter web application traffic"],a:1,e:"<strong>Jump server</strong>  --  a single hardened, monitored access point to sensitive segments. All admin access goes through it, creating a complete audit trail. Also called a bastion host."},
{type:'identify',cat:'Network Devices and Services',q:"What is the difference between a forward proxy and a reverse proxy?",o:["They are identical in function","A forward proxy intercepts outbound client requests; a reverse proxy intercepts inbound requests on behalf of servers","A forward proxy encrypts traffic; a reverse proxy decrypts it","A forward proxy is for external users; a reverse proxy is for internal users"],a:1,e:"<strong>Forward proxy</strong>  --  sits between clients and the internet, filtering outbound traffic. <strong>Reverse proxy</strong>  --  sits in front of servers, intercepting inbound requests. WAFs are a type of reverse proxy."},
{type:'identify',cat:'Network Devices and Services',q:"Which network device operates at Layer 3 and makes forwarding decisions based on IP addresses?",o:["Hub","Switch","Router","Bridge"],a:2,e:"<strong>Router</strong>  --  operates at Layer 3, forwarding packets between networks based on IP addresses. Switches operate at Layer 2 (MAC addresses). Hubs broadcast to all ports."},
{type:'identify',cat:'Network Devices and Services',q:"What does NAT do?",o:["Encrypts traffic between internal and external networks","Maps private internal IP addresses to a public IP for internet communication","Filters malicious traffic at the network perimeter","Distributes traffic across multiple servers"],a:1,e:"<strong>NAT</strong> (Network Address Translation)  --  translates private RFC 1918 addresses to a routable public IP. Conserves address space and hides internal topology, though it is not a security control by itself."},
{type:'identify',cat:'Network Devices and Services',q:"Which network architecture model enables centralised policy control by decoupling network intelligence from hardware forwarding?",o:["Traditional three-tier architecture","Software-Defined Networking","Spine-leaf architecture","Software-Defined WAN"],a:1,e:"<strong>SDN</strong> separates the control plane (routing decisions, made by the controller) from the data plane (packet forwarding, done by switches). One controller programs all forwarding rules across the entire network dynamically."},
{type:'identify',cat:'Network Devices and Services',q:"What is the PRIMARY security function of egress filtering?",o:["Blocking inbound threats from the internet","Monitoring and controlling outbound traffic to prevent data exfiltration and C2 callbacks","Encrypting all outbound traffic using TLS","Restricting access to specific web categories"],a:1,e:"<strong>Egress filtering</strong>  --  controls what leaves the network. Prevents data exfiltration, blocks C2 callback traffic, and ensures only authorised traffic exits. Often overlooked compared to ingress filtering."},
{type:'identify',cat:'Network Devices and Services',q:"Which of the following BEST describes a content delivery network (CDN) from a security perspective?",o:["A WAF that filters web application traffic","A distributed network that absorbs DDoS traffic and reduces origin server exposure","A proxy that encrypts all traffic to the origin","A load balancer that distributes traffic across servers"],a:1,e:"<strong>CDN</strong>  --  distributes content globally and absorbs volumetric DDoS attacks. Origin servers are hidden behind the CDN. Many CDNs also offer integrated WAF and bot protection."},
{type:'identify',cat:'Network Devices and Services',q:"Which technology monitors and analyses network flow data to detect anomalies and lateral movement?",o:["SIEM","NTA (Network Traffic Analysis)","EDR","Vulnerability scanner"],a:1,e:"<strong>NTA</strong> (Network Traffic Analysis)  --  analyses NetFlow and packet data to detect anomalies, C2 beaconing, lateral movement, and data exfiltration by comparing against established baselines."},

// -- CLOUD AND VIRTUALISATION --
{type:'identify',cat:'Cloud and Virtualisation',q:"Which cloud deployment model is dedicated to a single organisation and can be on-premises or hosted?",o:["Public cloud","Hybrid cloud","Community cloud","Private cloud"],a:3,e:"<strong>Private cloud</strong>  --  dedicated infrastructure for one organisation. More control and isolation than public cloud. Can be on-premises (company-owned) or hosted by a provider."},
{type:'identify',cat:'Cloud and Virtualisation',q:"Which cloud deployment model combines private and public cloud resources?",o:["Community cloud","Public cloud","Hybrid cloud","Multi-cloud"],a:2,e:"<strong>Hybrid cloud</strong>  --  combines private and public cloud. Sensitive workloads stay in private; scalable/less sensitive in public. Requires secure connectivity between environments."},
{type:'identify',cat:'Cloud and Virtualisation',q:"In IaaS, what does the customer manage?",o:["Physical hardware only","The application and data only","The OS, applications, and data  --  the provider manages hardware","Everything including hardware"],a:2,e:"In <strong>IaaS</strong>  --  the provider owns physical infrastructure (compute, storage, networking). The customer manages OS, middleware, runtime, applications, and data. More control but more responsibility."},
{type:'identify',cat:'Cloud and Virtualisation',q:"In SaaS, what does the customer manage?",o:["The full stack","The OS and application","The application only","Only their data and who can access it"],a:3,e:"In <strong>SaaS</strong>  --  the provider manages everything. The customer is only responsible for their data and access controls (who can use the application). Examples: Microsoft 365, Salesforce, Google Workspace."},
{type:'identify',cat:'Cloud and Virtualisation',q:"Which cloud security tool monitors and controls data flowing between users and cloud applications?",o:["WAF","CASB","SIEM","IPS"],a:1,e:"<strong>CASB</strong> (Cloud Access Security Broker)  --  sits between users and cloud services. Provides visibility, compliance enforcement, data security, and threat protection for SaaS applications."},
{type:'identify',cat:'Cloud and Virtualisation',q:"What is the PRIMARY security concern with serverless computing?",o:["Higher infrastructure costs","Vendor lock-in","Shared responsibility boundaries are unclear and attack surface expands with function triggers","No encryption at rest"],a:2,e:"<strong>Serverless</strong>  --  the attack surface expands as functions are triggered by many event sources (APIs, queues, storage). Each trigger is a potential entry point. Misconfigured IAM permissions are a top risk."},
{type:'identify',cat:'Cloud and Virtualisation',q:"Which of the following BEST describes a container in a security context?",o:["A virtual machine with its own OS kernel","An isolated process and file system sharing the host OS kernel","A serverless function running in the cloud","A virtualised network switch"],a:1,e:"<strong>Container</strong>  --  shares the host OS kernel but isolates processes, file systems, and network namespaces. Faster and lighter than VMs but provides less isolation. Docker is the most common implementation."},
{type:'identify',cat:'Cloud and Virtualisation',q:"Which of the following represents the GREATEST security risk specific to multi-tenant cloud environments?",o:["Higher latency compared to on-premises","VM escape allowing a compromised VM to affect the hypervisor or other VMs","Lack of encryption at rest","Limited disaster recovery options"],a:1,e:"<strong>VM escape</strong>  --  exploiting hypervisor vulnerabilities to break out of a virtualised environment and access the host or neighbouring VMs. Critical in multi-tenant environments sharing physical hardware."},
{type:'identify',cat:'Cloud and Virtualisation',q:"What is the PRIMARY purpose of Infrastructure as Code (IaC) from a security perspective?",o:["Reducing infrastructure costs","Enabling version-controlled, repeatable, and auditable deployments that prevent configuration drift","Automating incident response","Monitoring cloud resources in real time"],a:1,e:"<strong>IaC</strong>  --  Terraform, CloudFormation  --  stores infrastructure definitions in version-controlled code. Prevents configuration drift, enables peer review of changes, and ensures environments are consistently hardened."},
{type:'identify',cat:'Cloud and Virtualisation',q:"Which of the following BEST describes a cloud security posture management (CSPM) tool?",o:["A WAF for cloud applications","Continuously scans cloud configurations for misconfigurations and compliance violations","A SIEM that collects cloud logs","A CASB that monitors user behaviour"],a:1,e:"<strong>CSPM</strong>  --  automatically scans cloud environments for misconfigurations (public S3 buckets, open security groups, overly permissive IAM roles) and maps findings to compliance frameworks."},
{type:'identify',cat:'Cloud and Virtualisation',q:"Which of the following BEST describes the concept of immutable infrastructure?",o:["Infrastructure that cannot be modified after deployment  --  replaced rather than patched","Infrastructure with read-only storage","Infrastructure with no network connectivity","Infrastructure managed entirely by the cloud provider"],a:0,e:"<strong>Immutable infrastructure</strong>  --  servers are never patched or modified. Instead, a new image is built and deployed. Eliminates configuration drift and ensures every deployment is in a known good state."},

// -- WIRELESS SECURITY --
{type:'identify',cat:'Wireless Security',q:"Which wireless security standard is currently considered the strongest?",o:["WEP","WPA","WPA2-Personal","WPA3-Enterprise"],a:3,e:"<strong>WPA3-Enterprise</strong>  --  combines the SAE handshake improvements with 802.1X/RADIUS per-user authentication. The strongest available wireless security standard for enterprise environments."},
{type:'identify',cat:'Wireless Security',q:"What does WPA3 SAE improve over WPA2 PSK?",o:["Longer encryption keys","Faster connection speeds","Prevention of offline dictionary attacks against captured handshakes","Mandatory certificate-based authentication"],a:2,e:"<strong>SAE</strong> (Simultaneous Authentication of Equals / Dragonfly)  --  even if an attacker captures the WPA3 handshake, they cannot perform offline dictionary attacks. Forward secrecy means past traffic remains secure even if the password is later compromised."},
{type:'identify',cat:'Wireless Security',q:"Which IEEE standard provides port-based network access control for both wired and wireless networks?",o:["802.11ac","802.1Q","802.1X","802.3af"],a:2,e:"<strong>802.1X</strong>  --  port-based NAC. Before a device is admitted, it must authenticate via a RADIUS server. Used for enterprise wireless (WPA2/WPA3-Enterprise) and wired networks."},
{type:'identify',cat:'Wireless Security',q:"What is the PRIMARY purpose of disabling SSID broadcast?",o:["Encrypting wireless traffic","Preventing unauthorized encryption attacks","Reducing casual discovery of the network  --  though determined attackers can still find it","Blocking deauthentication attacks"],a:2,e:"<strong>Disabling SSID broadcast</strong> hides the network name from casual scanning but is not true security  --  tools like Kismet detect hidden SSIDs from probe responses. It reduces the casual attack surface."},
{type:'identify',cat:'Wireless Security',q:"Which of the following provides the STRONGEST per-user authentication on a wireless network?",o:["WPA2-Personal with a complex PSK","MAC address filtering","WPA2/WPA3-Enterprise with 802.1X and RADIUS","Disabling SSID broadcast"],a:2,e:"<strong>WPA2/3-Enterprise + 802.1X + RADIUS</strong>  --  each user authenticates with individual credentials (certificate, EAP method). No shared password to compromise. MAC filtering and SSID hiding are trivially bypassed."},
{type:'identify',cat:'Wireless Security',q:"What is the recommended way to secure a guest wireless network in an enterprise?",o:["Use the same SSID as corporate with a different password","Place it on an isolated VLAN with no access to internal systems","Disable encryption for easier guest access","Use WEP for backward compatibility"],a:1,e:"<strong>Isolated VLAN</strong>  --  guest networks must be completely separated from corporate systems. Guests get internet access only. Even if a guest device is compromised, it cannot reach internal resources."},
{type:'identify',cat:'Wireless Security',q:"Which of the following BEST describes the purpose of Protected Management Frames (PMF)?",o:["Encrypts wireless data frames between client and AP","Cryptographically authenticates management frames to prevent deauthentication and disassociation attacks","Hides the SSID from passive scanning","Enforces minimum WPA3 authentication"],a:1,e:"<strong>PMF</strong> (802.11w)  --  management frames (deauth, disassociation) are unauthenticated in WPA2, enabling forced disconnection attacks. WPA3 mandates PMF, cryptographically signing these frames."},
{type:'identify',cat:'Wireless Security',q:"A company deploys wireless sensors across a factory floor. Which wireless security concern is MOST unique to this IoT environment?",o:["Lack of WPA3 support","Devices cannot be patched regularly and may run legacy protocols","Insufficient signal range","Users sharing Wi-Fi passwords"],a:1,e:"<strong>IoT devices</strong> often run firmware that cannot be updated, may only support WEP or WPA1, have hardcoded credentials, and cannot run security agents. Network isolation (separate VLAN, firewall rules) is the primary mitigation."},

// -- VPN AND REMOTE ACCESS --
{type:'identify',cat:'VPN and Remote Access',q:"Which VPN protocol uses UDP port 500 for key exchange and provides tunnel and transport modes?",o:["SSL/TLS VPN","L2TP","IPSec (IKE/ISAKMP)","PPTP"],a:2,e:"<strong>IPSec</strong> uses IKE (Internet Key Exchange) on UDP port 500 for establishing security associations. AH provides integrity only; ESP provides encryption and integrity."},
{type:'identify',cat:'VPN and Remote Access',q:"Which VPN type uses TLS over port 443 making it work through most firewalls?",o:["IPSec VPN","L2TP/IPSec","PPTP","SSL/TLS VPN"],a:3,e:"<strong>SSL/TLS VPN</strong>  --  uses HTTPS port 443, traversing most firewalls transparently. Clientless mode (browser-based) requires no client software. Full tunnel mode routes all traffic through the VPN."},
{type:'identify',cat:'VPN and Remote Access',q:"What is split tunneling in a VPN context?",o:["Encrypting only part of the VPN payload","Routing only corporate-bound traffic through the VPN while internet traffic goes direct","Using two separate VPN tunnels simultaneously","Dividing VPN bandwidth between users"],a:1,e:"<strong>Split tunneling</strong>  --  corporate traffic goes through the VPN; internet traffic goes directly to the internet. Reduces VPN load but means the corporate device browses the internet unprotected by corporate controls."},
{type:'identify',cat:'VPN and Remote Access',q:"Which VPN protocol is considered obsolete and insecure and should never be used?",o:["IPSec","SSL/TLS VPN","L2TP/IPSec","PPTP"],a:3,e:"<strong>PPTP</strong> (Point-to-Point Tunneling Protocol)  --  uses MS-CHAPv2 which is cryptographically broken. PPTP sessions can be cracked. Never use it. IPSec and SSL/TLS VPN are the current standards."},
{type:'identify',cat:'VPN and Remote Access',q:"What is the PRIMARY difference between a site-to-site VPN and a remote access VPN?",o:["They use different encryption algorithms","Site-to-site connects two entire networks; remote access connects an individual user to a network","Site-to-site requires a client; remote access does not","They are identical  --  just named differently"],a:1,e:"<strong>Site-to-site VPN</strong>  --  encrypted tunnel between two fixed networks (e.g., HQ to branch). Always-on. <strong>Remote access VPN</strong>  --  individual users dial in to the corporate network. On-demand."},
{type:'identify',cat:'VPN and Remote Access',q:"Which of the following BEST describes ZTNA compared to traditional VPN?",o:["ZTNA is slower but more secure than VPN","ZTNA provides broad network access like VPN but with better encryption","ZTNA grants access only to specific authorised applications based on identity rather than broad network access","ZTNA replaces encryption with identity verification only"],a:2,e:"<strong>ZTNA</strong> (Zero Trust Network Access)  --  replaces broad VPN network access with application-level access based on verified identity and device posture. Users can only reach the specific apps they are authorised for."},
{type:'identify',cat:'VPN and Remote Access',q:"Which AAA protocol encrypts the entire payload and is primarily used for device administration (routers, switches)?",o:["RADIUS","LDAP","TACACS+","Kerberos"],a:2,e:"<strong>TACACS+</strong>  --  Cisco's AAA protocol. Encrypts the full payload (unlike RADIUS which only encrypts the password). Separates authentication, authorisation, and accounting functions. TCP port 49."},
{type:'identify',cat:'VPN and Remote Access',q:"Which protocol provides centralised authentication for network access using UDP ports 1812 and 1813?",o:["TACACS+","LDAP","Kerberos","RADIUS"],a:3,e:"<strong>RADIUS</strong>  --  centralised AAA using UDP/1812 for authentication and UDP/1813 for accounting. Used with 802.1X for wireless and VPN authentication. Only encrypts the password field in packets."},

// -- INFRASTRUCTURE HARDENING --
{type:'identify',cat:'Infrastructure Hardening',q:"Which of the following BEST describes the purpose of system hardening?",o:["Encrypting all data on a system","Reducing the attack surface by disabling unnecessary services, closing unused ports, and removing default credentials","Patching known vulnerabilities only","Monitoring a system for anomalous behaviour"],a:1,e:"<strong>System hardening</strong>  --  reduces the attack surface. Close unused ports, disable unnecessary services, remove default accounts, apply secure configurations, enforce least privilege. CIS Benchmarks and DISA STIGs provide hardening guidance."},
{type:'identify',cat:'Infrastructure Hardening',q:"What is the purpose of a configuration baseline?",o:["The maximum security configuration achievable","The minimum acceptable security configuration that all systems must meet","A list of all known vulnerabilities","A document defining acceptable use of systems"],a:1,e:"<strong>Configuration baseline</strong>  --  the minimum security standard for a system type. All deployments start from the baseline. Drift from baseline indicates a misconfiguration or unauthorised change."},
{type:'identify',cat:'Infrastructure Hardening',q:"Which of the following BEST describes the concept of an attack surface in the context of hardening?",o:["The physical perimeter of the data centre","All exposed services, ports, and interfaces that a potential attacker could try to exploit","The number of admin accounts on a system","The network bandwidth available to an attacker"],a:1,e:"<strong>Attack surface</strong>  --  every exposed entry point: open ports, running services, user accounts, APIs, unpatched software. Hardening directly reduces the attack surface by eliminating unnecessary exposure."},
{type:'identify',cat:'Infrastructure Hardening',q:"What is the purpose of disabling default accounts and changing default credentials?",o:["Improving system performance","Preventing attackers from using well-known factory credentials to gain immediate access","Reducing licensing costs","Complying with encryption requirements"],a:1,e:"<strong>Default credentials</strong> (admin/admin, admin/password) are publicly known and the first thing attackers try. Disabling or renaming default accounts and changing all default passwords is a basic hardening step."},
{type:'identify',cat:'Infrastructure Hardening',q:"Which of the following BEST describes patch management?",o:["Rewriting application code to fix bugs","The systematic process of identifying, testing, and applying software updates to address vulnerabilities","Monitoring systems for unauthorised changes","Reviewing firewall rules for outdated entries"],a:1,e:"<strong>Patch management</strong>  --  identifies applicable patches, tests them in non-production, and deploys them on schedule. Critical patches may require emergency deployment outside the normal cycle."},
{type:'identify',cat:'Infrastructure Hardening',q:"What is the purpose of application whitelisting?",o:["Blocking known malicious applications by signature","Allowing only explicitly approved applications to execute  --  blocking everything else","Scanning applications for malware before installation","Encrypting application traffic"],a:1,e:"<strong>Application whitelisting</strong>  --  only explicitly approved applications can run. Extremely effective against malware but operationally demanding to maintain. The opposite of blacklisting (which blocks known bad)."},
{type:'identify',cat:'Infrastructure Hardening',q:"Which of the following BEST describes the purpose of file integrity monitoring (FIM)?",o:["Encrypting files to prevent unauthorised access","Detecting unauthorised changes to critical system files by comparing against a known good baseline","Backing up files to prevent data loss","Scanning files for malware signatures"],a:1,e:"<strong>FIM</strong>  --  monitors critical files (OS binaries, config files) against a cryptographic hash baseline. Any change triggers an alert. Detects both attacker activity and unauthorised configuration changes."},
{type:'identify',cat:'Infrastructure Hardening',q:"What is the PRIMARY purpose of network access control lists (ACLs)?",o:["Encrypt traffic between network segments","Filter traffic based on source/destination IP, port, and protocol  --  permitting or denying specific flows","Monitor traffic for malicious patterns","Authenticate users before granting network access"],a:1,e:"<strong>ACLs</strong>  --  stateless packet filters on routers and firewalls permitting or denying traffic based on source/destination IP, port, and protocol. Stateless (each packet evaluated independently) unlike stateful firewalls."},

// -- SCENARIOS --
{type:'scenario',cat:'Scenario',scenario:"A company's internal audit reveals that HR staff can access financial database servers directly over the network. The security team wants to ensure HR can only reach HR systems.",q:"Which control BEST addresses this risk?",o:["Deploying an IPS at the network perimeter","Implementing VLAN segmentation to separate HR and Finance network segments","Enabling full disk encryption on all servers","Requiring MFA for all database logins"],a:1,e:"<strong>VLAN segmentation</strong>  --  placing HR and Finance on separate VLANs with inter-VLAN routing controlled by firewall ACLs prevents HR hosts from directly reaching Finance servers. Principle of least privilege applied at the network level."},
{type:'scenario',cat:'Scenario',scenario:"A security architect is designing a network for a hospital. Patient records must be protected from internet-facing systems. Web portal servers need to be publicly accessible.",q:"Which architecture BEST meets these requirements?",o:["Place all servers on the internal LAN with firewall rules","Place web portal servers in a DMZ, patient record servers on an isolated internal segment","Use a single VLAN for all servers with strict ACLs","Deploy all servers in a public cloud with encryption at rest"],a:1,e:"<strong>DMZ for web servers + isolated internal segment for patient records</strong>  --  the classic tiered architecture. Web servers in the DMZ have no direct path to patient databases. Even if a web server is compromised, the attacker cannot reach the internal database segment."},
{type:'scenario',cat:'Scenario',scenario:"A penetration tester connects to the corporate Wi-Fi and discovers they can reach internal HR servers, the finance database, and the development environment from the guest network.",q:"Which security failure does this demonstrate?",o:["Weak wireless encryption","Missing IPS on the wireless segment","Failure to properly isolate the guest network from internal segments using VLANs","Lack of 802.1X authentication on the guest SSID"],a:2,e:"<strong>Guest network isolation failure</strong>  --  the guest network must be on a separate VLAN with firewall rules blocking all access to internal segments. Guests should reach the internet only. This is a fundamental network segmentation failure."},
{type:'scenario',cat:'Scenario',scenario:"An organisation's SOC detects a workstation making regular HTTPS connections to an external IP on port 443. The traffic volume is unusually low and consistent  --  2KB every 60 seconds.",q:"Which technique does this MOST likely indicate?",o:["Normal software update traffic","HTTP beaconing or C2 over HTTPS  --  low-and-slow command and control","A user streaming video","HTTPS certificate validation traffic"],a:1,e:"<strong>C2 beaconing over HTTPS</strong>  --  regular, timed, small outbound connections on port 443 (blending with HTTPS) is a classic C2 pattern. Egress filtering, TLS inspection, and NTA detect this even when traffic uses legitimate ports."},
{type:'scenario',cat:'Scenario',scenario:"Remote employees VPN into the corporate network. After connecting, a security audit shows they are also browsing social media and streaming video through their home ISP simultaneously.",q:"Which VPN configuration explains this and what is the security risk?",o:["Full tunnel VPN  --  risk is performance degradation","Split tunneling is enabled  --  corporate traffic uses VPN but internet traffic bypasses corporate controls","The VPN is not encrypting traffic properly","Users are connecting to multiple VPNs simultaneously"],a:1,e:"<strong>Split tunneling</strong>  --  only corporate-bound traffic goes through the VPN. Internet traffic bypasses corporate web filtering, DLP, and DNS security. A compromised home network could pivot to corporate resources through the VPN tunnel."},
{type:'scenario',cat:'Scenario',scenario:"A cloud engineer notices that an S3 bucket containing customer data is publicly accessible on the internet. No credentials are required to read the files.",q:"Which cloud security category does this represent?",o:["VM escape vulnerability","Data sovereignty violation","Cloud misconfiguration  --  exposed storage bucket","Insecure API endpoint"],a:2,e:"<strong>Cloud misconfiguration</strong>  --  publicly accessible storage buckets are the most common cause of cloud data breaches. CSPM tools automatically detect these. S3 Block Public Access and bucket policies should be enforced by default."},
{type:'scenario',cat:'Scenario',scenario:"A network engineer is asked to allow a vendor to remotely access a single internal server for maintenance without giving them broad VPN access to the entire corporate network.",q:"Which solution BEST meets this requirement?",o:["Issue the vendor a full VPN account","Deploy a jump server that the vendor accesses, then connects only to the specific server","Give the vendor temporary domain credentials","Configure split tunneling on the existing VPN"],a:1,e:"<strong>Jump server</strong>  --  the vendor connects to the bastion host, which has a specific rule allowing access only to the target server. The vendor never has direct network access. All activity is logged on the jump server."},
{type:'scenario',cat:'Scenario',scenario:"A company is migrating to cloud infrastructure. Their compliance team requires all infrastructure changes to be reviewed and approved before deployment, with a complete audit trail.",q:"Which practice BEST satisfies this requirement?",o:["Manual change management forms submitted by email","Infrastructure as Code with version-controlled repositories and peer review pull requests","Weekly configuration audits of cloud resources","Automated CSPM scanning after deployment"],a:1,e:"<strong>IaC with version control and PR review</strong>  --  every change is committed to git, reviewed by peers before merge, and the entire history is auditable. This satisfies change management and audit trail requirements simultaneously."},
{type:'scenario',cat:'Scenario',scenario:"A security team wants to observe how attackers behave after gaining initial access to the network, without risking real production systems.",q:"Which technology is BEST suited for this?",o:["A honeypot placed on the internal network","An IPS deployed inline at the perimeter","Egress filtering on the core switch","A SIEM collecting logs from all systems"],a:0,e:"<strong>Honeypot</strong>  --  a decoy system on the internal network attracts attackers who have already breached the perimeter, observing their lateral movement techniques, tools, and objectives without risking real assets."},
{type:'scenario',cat:'Scenario',scenario:"An organisation's firewall logs show thousands of inbound connection attempts from hundreds of different source IPs targeting TCP port 22 over 30 minutes.",q:"Which attack type does this indicate and what is the BEST immediate response?",o:["DDoS  --  block at the CDN","Brute force against SSH  --  restrict port 22 to known management IPs and consider moving SSH to a non-standard port","Port scan  --  deploy an IDS signature","Credential stuffing  --  enable MFA on SSH"],a:1,e:"<strong>SSH brute force</strong>  --  restricting SSH access to specific management IPs (via ACL or firewall rule) immediately stops the attack. Moving SSH to a non-standard port reduces automated scanning. Key-based auth eliminates password brute force entirely."},
{type:'scenario',cat:'Scenario',scenario:"A security architect is designing a zero trust network. Users need to access specific SaaS applications remotely. Traditional VPN is considered too broad.",q:"Which technology replaces VPN in a zero trust model?",o:["SD-WAN","ZTNA (Zero Trust Network Access)","CASB","SSL inspection proxy"],a:1,e:"<strong>ZTNA</strong>  --  grants access to specific authorised applications based on verified identity and device posture, not broad network access. Users can only reach what they are explicitly authorised for, regardless of location."},
];

let questions=[],qi=0,correct=0,wrong=0;
let catStats={};
CATS.forEach(c=>catStats[c]={c:0,t:0});

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function buildQuestions(){
  const pool=shuffle([...Q_BANK]).slice(0,80);
  return pool.map(q=>{
    const idxs=q.o.map((_,i)=>i);
    const shuf=shuffle(idxs);
    return{...q,o:shuf.map(i=>q.o[i]),a:shuf.indexOf(q.a)};
  });
}

function updateStats(){
  const total=correct+wrong;
  document.getElementById('s-prog').textContent=qi+'/80';
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-acc').textContent=total?Math.round(correct/total*100)+'%':' -- ';
  document.getElementById('prog-fill').style.width=Math.round(qi/80*100)+'%';
}

function renderQ(){
  if(qi>=80){showResults();return;}
  const q=questions[qi];
  const letters=['A','B','C','D'];
  const catBadge=BADGE_MAP[q.cat]||'badge-network';
  const scenHTML=q.type==='scenario'&&q.scenario
    ?'<div class="scenario-box"><div class="scenario-lbl">Scenario</div><div class="scenario-text">'+q.scenario+'</div></div>'
    :'';
  document.getElementById('q-area').innerHTML=
    '<div class="q-card">'+
      '<div class="q-meta">'+
        '<span class="q-badge '+catBadge+'">'+q.cat+'</span>'+
        '<span class="q-num">Q'+(qi+1)+' of 80</span>'+
      '</div>'+
      scenHTML+
      '<div class="q-text">'+q.q+'</div>'+
      '<div class="opts" id="opts">'+
        q.o.map((o,i)=>'<button class="opt" id="opt-'+i+'" onclick="answer('+i+')"><span class="opt-letter">'+letters[i]+'</span><span class="opt-text">'+o+'</span></button>').join('')+
      '</div>'+
      '<div class="explanation" id="explanation"><div class="exp-lbl">Explanation</div><div class="exp-text" id="exp-text"></div></div>'+
      '<button class="btn-next" id="btn-next" onclick="nextQ()">'+(qi===79?'See results ->':'Next ->')+'</button>'+
    '</div>';
}

function answer(idx){
  const q=questions[qi];
  const isCorrect=idx===q.a;
  if(isCorrect){correct++;catStats[q.cat].c++;}else wrong++;
  catStats[q.cat].t++;qi++;updateStats();
  q.o.forEach((_,i)=>document.getElementById('opt-'+i).disabled=true);
  const cb=document.getElementById('opt-'+idx);
  const rb=document.getElementById('opt-'+q.a);
  if(isCorrect){cb.classList.add('correct');}else{cb.classList.add('wrong');if(rb)rb.classList.add('reveal');}
  document.getElementById('exp-text').innerHTML=q.e;
  document.getElementById('explanation').classList.add('show');
  document.getElementById('btn-next').style.display='block';
  if(qi>0&&qi%20===0) logToDashboard(3,'Network Architecture Trainer',Math.round(correct/qi*100));
}

function nextQ(){renderQ();}

function showResults(){
  document.getElementById('q-area').style.display='none';
  const res=document.getElementById('results-area');
  res.style.display='block';
  const pct=Math.round(correct/80*100);
  logToDashboard(3,'Network Architecture Trainer',pct);
  const passed=pct>=80;
  const msg=pct>=90?'Outstanding  --  exam-ready!':pct>=80?'Solid  --  above pass threshold.':pct>=65?'Getting there  --  keep reviewing.':'More study needed.';
  const ringColor=passed?'#00ff88':'#ff3d5a';
  const circ=339.3,offset=circ-(pct/100)*circ;
  const topCats=CATS.filter(c=>catStats[c].t>0).sort((a,b)=>(catStats[b].c/catStats[b].t)-(catStats[a].c/catStats[a].t));
  const bdHTML=topCats.slice(0,6).map(c=>{
    const s=catStats[c];const p=s.t?Math.round(s.c/s.t*100):0;
    const col=CAT_COLORS[c]||'var(--accent)';
    return '<div class="bd-card"><div class="bd-title" style="color:'+col+'">'+c+'</div><div class="bd-bar-bg"><div class="bd-bar-fill" style="width:0%;background:'+col+'" data-pct="'+p+'"></div></div><div class="bd-score" style="color:'+col+'">'+p+'%</div><div class="bd-detail">'+s.c+'/'+s.t+' correct</div></div>';
  }).join('');
  res.innerHTML=
    '<div class="results-wrap">'+
      '<div class="results-ring"><svg width="140" height="140" viewBox="0 0 140 140">'+
        '<circle cx="70" cy="70" r="54" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>'+
        '<circle cx="70" cy="70" r="54" fill="none" stroke="'+ringColor+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" id="ring-anim"/>'+
      '</svg><div class="ring-score"><div class="ring-pct">'+pct+'%</div><div class="ring-lbl">score</div></div></div>'+
      '<div class="results-verdict" style="color:'+ringColor+'">'+(passed?'Passed [OK]':'Keep Studying')+'</div>'+
      '<div class="results-sub">'+correct+'/80 correct  --  '+msg+'</div>'+
      '<div class="breakdown">'+bdHTML+'</div>'+
      '<button class="btn-retake" onclick="retake()">Retake Quiz</button>'+
      '<button class="btn-retake" onclick="showRef()" style="border-color:var(--accent);color:var(--accent)">View Reference</button>'+
    '</div>';
  setTimeout(()=>{
    const ring=document.getElementById('ring-anim');
    if(ring){ring.style.transition='stroke-dashoffset 1.5s ease';ring.style.strokeDashoffset=offset;}
    document.querySelectorAll('.bd-bar-fill').forEach(el=>{el.style.transition='width 1s ease';el.style.width=el.dataset.pct+'%';});
  },100);
}

function retake(){
  document.getElementById('q-area').style.display='block';
  document.getElementById('results-area').style.display='none';
  questions=buildQuestions();
  qi=0;correct=0;wrong=0;
  CATS.forEach(c=>catStats[c]={c:0,t:0});
  updateStats();renderQ();
}

function showRef(){
  document.getElementById('view-quiz').style.display='none';
  document.getElementById('view-ref').style.display='block';
  document.getElementById('tab-quiz').classList.remove('active');
  document.getElementById('tab-ref').classList.add('active');
  buildRef();
}

function setTab(t){
  if(t==='ref'){
    document.getElementById('view-quiz').style.display='none';
    document.getElementById('view-ref').style.display='block';
    document.getElementById('tab-quiz').classList.remove('active');
    document.getElementById('tab-ref').classList.add('active');
    buildRef();
  } else {
    document.getElementById('view-ref').style.display='none';
    document.getElementById('view-quiz').style.display='block';
    document.getElementById('tab-quiz').classList.add('active');
    document.getElementById('tab-ref').classList.remove('active');
  }
}

function buildRef(){
  const chart=document.getElementById('acc-chart');chart.innerHTML='';
  CATS.forEach(c=>{
    const s=catStats[c];const pct=s.t?Math.round(s.c/s.t*100):0;
    const col=CAT_COLORS[c]||'var(--accent)';
    chart.innerHTML+='<div class="acc-row"><div class="acc-lbl">'+c+'</div><div class="acc-bg"><div class="acc-fill" style="width:'+(s.t?pct:0)+'%;background:'+col+'"></div></div><div class="acc-pct">'+(s.t?pct+'%':' -- ')+'</div></div>';
  });
  const cards=document.getElementById('ref-cards');cards.innerHTML='';
  TERMS.forEach(t=>{
    cards.innerHTML+='<div class="ref-card"><div class="ref-name">'+t.name+'</div><div class="ref-def">'+t.def+'</div><span class="ref-tag '+t.tag+'">'+t.tagLabel+'</span><div class="ref-key">'+t.key+'</div></div>';
  });
}

questions=buildQuestions();
updateStats();
renderQ();
</script>
</body>
</html>
